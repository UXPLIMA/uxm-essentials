# Ukrainian lines the proxy says itself. Keys are kebab-case and dot-separated; values are MiniMessage, and the
# theme's role tags (<bad>, <warn>, <muted>, <value>, <body>, <accent>, <good>, <dim>) read in the colours the backend
# ships. The command-control block of config.conf points at these with an @ value such as @proxy.command.unknown.

# A blocked or hidden command. The unknown and hidden lines read as though the command does not exist.
"proxy.command.unknown" = "<bad>Невідома команда. Введи /help, щоб побачити список команд.</bad>"
"proxy.command.hidden" = "<bad>Невідома команда. Введи /help, щоб побачити список команд.</bad>"
"proxy.command.no-permission" = "<bad>У тебе немає дозволу на цю команду.</bad>"

# The command-spam guard: the kick reason, the notice when a command was cancelled, and the nudge when it still ran.
"proxy.command.spam-kick" = "<bad>Ти надсилаєш команди надто швидко.</bad>"
"proxy.command.spam-blocked" = "<bad>Ти надсилаєш команди надто швидко. Повільніше, будь ласка.</bad>"
"proxy.command.spam-warn" = "<warn>Ти надсилаєш команди дуже швидко, повільніше, будь ласка.</warn>"
