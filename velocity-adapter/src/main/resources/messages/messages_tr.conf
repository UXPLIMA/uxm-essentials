# Turkish lines the proxy says itself. Keys are kebab-case and dot-separated; values are MiniMessage, and the
# theme's role tags (<bad>, <warn>, <muted>, <value>, <body>, <accent>, <good>, <dim>) read in the colours the backend
# ships. The command-control block of config.conf points at these with an @ value such as @proxy.command.unknown.

# A blocked or hidden command. The unknown and hidden lines are the game's own unknown-command reply, in the player's
# client language and its vanilla red, so a hidden command reads exactly as one that does not exist.
"proxy.command.unknown" = "<red><lang:command.unknown.command></red>"
"proxy.command.hidden" = "<red><lang:command.unknown.command></red>"
"proxy.command.no-permission" = "<bad>Bu komutu kullanma yetkin yok.</bad>"

# The command-spam guard: the kick reason, the notice when a command was cancelled, and the nudge when it still ran.
"proxy.command.spam-kick" = "<bad>Komutları çok hızlı gönderiyorsun.</bad>"
"proxy.command.spam-blocked" = "<bad>Komutları çok hızlı gönderiyorsun. Lütfen yavaşla.</bad>"
"proxy.command.spam-warn" = "<warn>Komutları hızlı gönderiyorsun, lütfen yavaşla.</warn>"
