# Polish lines the proxy says itself. Keys are kebab-case and dot-separated; values are MiniMessage, and the
# theme's role tags (<bad>, <warn>, <muted>, <value>, <body>, <accent>, <good>, <dim>) read in the colours the backend
# ships. The command-control block of config.conf points at these with an @ value such as @proxy.command.unknown.

# A blocked or hidden command. The unknown and hidden lines read as though the command does not exist.
"proxy.command.unknown" = "<bad>Nieznana komenda. Wpisz /help, aby zobaczyć listę komend.</bad>"
"proxy.command.hidden" = "<bad>Nieznana komenda. Wpisz /help, aby zobaczyć listę komend.</bad>"
"proxy.command.no-permission" = "<bad>Nie masz uprawnień do tej komendy.</bad>"

# The command-spam guard: the kick reason, the notice when a command was cancelled, and the nudge when it still ran.
"proxy.command.spam-kick" = "<bad>Wysyłasz komendy za szybko.</bad>"
"proxy.command.spam-blocked" = "<bad>Wysyłasz komendy za szybko. Zwolnij, proszę.</bad>"
"proxy.command.spam-warn" = "<warn>Wysyłasz komendy bardzo szybko, zwolnij, proszę.</warn>"
