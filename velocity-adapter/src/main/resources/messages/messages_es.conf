# Spanish lines the proxy says itself. Keys are kebab-case and dot-separated; values are MiniMessage, and the
# theme's role tags (<bad>, <warn>, <muted>, <value>, <body>, <accent>, <good>, <dim>) read in the colours the backend
# ships. The command-control block of config.conf points at these with an @ value such as @proxy.command.unknown.

# A blocked or hidden command. The unknown and hidden lines read as though the command does not exist.
"proxy.command.unknown" = "<bad>Comando desconocido. Escribe /help para ver la lista de comandos.</bad>"
"proxy.command.hidden" = "<bad>Comando desconocido. Escribe /help para ver la lista de comandos.</bad>"
"proxy.command.no-permission" = "<bad>No tienes permiso para usar ese comando.</bad>"

# The command-spam guard: the kick reason, the notice when a command was cancelled, and the nudge when it still ran.
"proxy.command.spam-kick" = "<bad>Estás enviando comandos demasiado rápido.</bad>"
"proxy.command.spam-blocked" = "<bad>Estás enviando comandos demasiado rápido. Ve más despacio.</bad>"
"proxy.command.spam-warn" = "<warn>Estás enviando comandos muy rápido, ve más despacio.</warn>"
