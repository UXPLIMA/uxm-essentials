# German lines the proxy says itself. Keys are kebab-case and dot-separated; values are MiniMessage, and the
# theme's role tags (<bad>, <warn>, <muted>, <value>, <body>, <accent>, <good>, <dim>) read in the colours the backend
# ships. The command-control block of config.conf points at these with an @ value such as @proxy.command.unknown.

# A blocked or hidden command. The unknown and hidden lines are the game's own unknown-command reply, in the player's
# client language and its vanilla red, so a hidden command reads exactly as one that does not exist.
"proxy.command.unknown" = "<red><lang:command.unknown.command></red>"
"proxy.command.hidden" = "<red><lang:command.unknown.command></red>"
"proxy.command.no-permission" = "<bad>Du hast keine Berechtigung für diesen Befehl.</bad>"

# The command-spam guard: the kick reason, the notice when a command was cancelled, and the nudge when it still ran.
"proxy.command.spam-kick" = "<bad>Du sendest Befehle zu schnell.</bad>"
"proxy.command.spam-blocked" = "<bad>Du sendest Befehle zu schnell. Bitte mach langsamer.</bad>"
"proxy.command.spam-warn" = "<warn>Du sendest Befehle sehr schnell, bitte mach langsamer.</warn>"

# A frozen player who tries to move to another server. The freeze holds on every server, so the proxy keeps them
# where they were frozen until a member of staff runs /unfreeze.
"proxy.freeze.switch-blocked" = "<bad>Du bist eingefroren und kannst den Server nicht wechseln.</bad>"
