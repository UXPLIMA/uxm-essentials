# Korean lines the proxy says itself. Keys are kebab-case and dot-separated; values are MiniMessage, and the
# theme's role tags (<bad>, <warn>, <muted>, <value>, <body>, <accent>, <good>, <dim>) read in the colours the backend
# ships. The command-control block of config.conf points at these with an @ value such as @proxy.command.unknown.

# A blocked or hidden command. The unknown and hidden lines read as though the command does not exist.
"proxy.command.unknown" = "<bad>알 수 없는 명령어입니다. /help 를 입력하면 명령어 목록을 볼 수 있습니다.</bad>"
"proxy.command.hidden" = "<bad>알 수 없는 명령어입니다. /help 를 입력하면 명령어 목록을 볼 수 있습니다.</bad>"
"proxy.command.no-permission" = "<bad>그 명령어를 사용할 권한이 없습니다.</bad>"

# The command-spam guard: the kick reason, the notice when a command was cancelled, and the nudge when it still ran.
"proxy.command.spam-kick" = "<bad>명령어를 너무 빨리 보내고 있습니다.</bad>"
"proxy.command.spam-blocked" = "<bad>명령어를 너무 빨리 보내고 있습니다. 천천히 해 주세요.</bad>"
"proxy.command.spam-warn" = "<warn>명령어를 빠르게 보내고 있습니다. 천천히 해 주세요.</warn>"
