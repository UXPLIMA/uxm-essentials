# uxmEssentials Velocity proxy configuration.
#
# The cross-server bus broker needs no configuration: it auto-detects the backends registered on this
# proxy. The command-control section below is the proxy-side command hider/gater, the PlHidePro
# equivalent for PROXY-NATIVE commands (/server, /glist, /send, /find and proxy plugins' commands). The
# backend commandcontrol module still gates backend commands; this section only touches the proxy layer.
#
# Permission nodes:
#   uxmessentials.commandcontrol.bypass            see and run every proxy command (full bypass)
#   uxmessentials.commandcontrol.viewproxycommands see the hidden proxy-native commands
#   uxmessentials.commandcontrol.spam.bypass       exempt from the proxy command-spam guard

command-control {
  # Master switch. Off by default so a network opts in explicitly.
  enabled = false

  # How the command lists below are read:
  #   blacklist: the listed commands are hidden/blocked, everything else is allowed
  #   whitelist: only the listed commands are allowed, everything else is hidden/blocked
  mode = blacklist

  plugin-hide {
    # Hide these proxy-native commands from players without uxmessentials.commandcontrol.viewproxycommands.
    # They are scrubbed from the client command tree (tab-complete + command list) and, when
    # deny-list-commands is on, blocked from executing so a hidden /server cannot be run at all.
    enabled = true
    hidden-commands = [ "server", "glist", "send", "find", "plugins", "pl", "velocity", "ver", "about", "bungee", "greporter" ]
    deny-list-commands = true
  }

  # Whitelist / blacklist command lists. "default" applies to a player whose group has no list of its
  # own; every other key names a permission group (resolved via LuckPerms-Velocity when installed, else
  # the default list applies to everyone).
  commands {
    default = []
    # example:
    # admin = [ "server", "send" ]
  }

  # Show a vanilla-style "unknown command" line on deny (true) rather than a "no permission" line
  # (false), so a hidden command reads as though it does not exist.
  use-unknown-command-message = true

  # Scrub disallowed / hidden commands from the client command list and tab-completion.
  tab-completion {
    enabled = true
  }

  # Block the namespace:command form (e.g. /velocity:glist) of any command whose bare form is denied.
  block-namespace-bypass = true

  # Command-spam protection on the proxy. On a breach: KICK (disconnect), BLOCK (deny the command and
  # warn), or WARN (let it run and nudge). Exempt with uxmessentials.commandcontrol.spam.bypass.
  command-spam {
    enabled = false
    max-per-window = 40
    window-seconds = 2
    action = block
  }

  # Plugin-channel hide. NOTE: this is NOT enforced at the proxy. Velocity's API does not expose the
  # client-facing channel-advertisement packets, so the list cannot be applied without a packet library
  # (out of scope, no NMS / PacketEvents). The setting is read and validated and a warning is logged when
  # it is switched on; use the backend commandcontrol module's plugin-channel-hide to strip channels per
  # backend. Kept here so the config shape matches the backend module.
  plugin-channel-hide {
    enabled = false
    allowed-channels = [ "minecraft:brand", "bungeecord:main", "velocity:main" ]
  }

  # Deny and spam messages (MiniMessage). Leave a value blank to send nothing for that case.
  messages {
    unknown-command = "<red>Unknown command. Type /help for a list of commands."
    no-permission = "<red>You do not have permission to use that command."
    plugin-hidden = "<red>Unknown command. Type /help for a list of commands."
    spam-kick = "<red>You are sending commands too quickly."
    spam-blocked = "<red>You are sending commands too quickly. Please slow down."
    spam-warn = "<yellow>You are sending commands quickly, please slow down."
  }
}
