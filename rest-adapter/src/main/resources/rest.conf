# uxmEssentials REST add-on.
#
# Off until you turn it on. When it is on it listens on one port and answers only requests that carry a token
# made in game with /uxmapi token create.
enabled = false

# Where to listen. The default is the loopback address, which is where this belongs: put a reverse proxy in
# front of it and let that terminate TLS. Set 0.0.0.0 only if you know what is between this port and the
# internet.
bind = "127.0.0.1"
port = 8123

# How many requests one token may make per minute. A token over the limit gets 429 until the minute rolls.
requests-per-minute = 120
