# UTF-8 and en-US so formatting is identical on every machine.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
# Off: Spotless formatter workers do not survive a configuration cache hit.
org.gradle.configuration-cache=false

projectVersion=0.0.1-SNAPSHOT
