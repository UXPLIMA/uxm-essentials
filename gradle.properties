# Build environment — pin UTF-8 + en-US locale so Spotless / Palantir formatting
# and any locale-sensitive task behave identically on every machine and on CI
# regardless of the host's default charset or locale.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US -Xmx2G

# Parallel + caching for a snappier multi-module build.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
