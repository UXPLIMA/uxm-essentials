name: Release

# A tag is the release. Pushing v0.5.2 builds that commit and publishes the four
# jars under it, so what people download is exactly what the tag points at. The
# same jars then go to the four Modrinth projects, so the store never trails the
# tag by a release the way 0.5.1 did.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v0.5.2)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # Read through env rather than straight from secrets so the store steps can ask whether they are set: the
      # secrets context is not available to a step's `if`. A repository without the tokens still cuts its GitHub
      # release, and a fork publishes nowhere.
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
    steps:
      - name: Check out uxmEssentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          path: uxmEssentials

      # settings.gradle.kts builds against a sibling ../uxmLib checkout as a composite
      # build, so the library is compiled from source here rather than pulled from a
      # publish step that would have to happen first.
      - name: Check out uxmLib
        uses: actions/checkout@v4
        with:
          repository: UXPLIMA/uxmLib
          path: uxmLib

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify
        working-directory: uxmEssentials
        run: ./gradlew check

      - name: Build the release jars
        working-directory: uxmEssentials
        run: >-
          ./gradlew
          :bukkit-adapter:shadowJar
          :velocity-adapter:shadowJar
          :discord-adapter:shadowJar
          :redis-adapter:shadowJar

      # Written once and read by both publishers, so the two stores show the same text. A tag that already has a
      # release keeps the notes it has: asking GitHub to generate them again on an update puts the existing body in
      # front of the freshly generated one, and re-running the workflow over a published tag says everything twice.
      - name: Prepare the release notes
        working-directory: uxmEssentials
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          notes="$(gh release view "$TAG" --json body --jq .body 2>/dev/null || true)"
          if [ -z "$notes" ]; then
            notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$TAG" --jq .body)"
          fi
          printf '%s\n' "$notes" > "${RUNNER_TEMP}/release-notes.md"
          cat "${RUNNER_TEMP}/release-notes.md"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: ${{ inputs.tag || github.ref_name }}
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          files: |
            uxmEssentials/bukkit-adapter/build/libs/uxmEssentials-*.jar
            uxmEssentials/velocity-adapter/build/libs/uxmEssentials-velocity-*.jar
            uxmEssentials/discord-adapter/build/libs/uxmEssentials-discord-*.jar
            uxmEssentials/redis-adapter/build/libs/uxmEssentials-redis-*.jar

      # The developer API artifacts go to a Maven repository that is just a branch of this repository, served over
      # raw.githubusercontent. Nothing has to be configured for that URL to work, which is the whole point: the
      # uxmLib coordinate was broken for two months because the build consumed the library through includeBuild and
      # never once resolved what had been published. Files are copied over the existing tree rather than replacing
      # it, so every earlier version stays resolvable.
      - name: Publish the API artifacts to the maven branch
        working-directory: uxmEssentials
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          ./gradlew publishAllPublicationsToLocalRepoRepository
          tmp="$(mktemp -d)"
          git init -q "$tmp"
          git -C "$tmp" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git -C "$tmp" fetch -q --depth 1 origin maven; then
            git -C "$tmp" checkout -q -B maven FETCH_HEAD
          else
            git -C "$tmp" checkout -q --orphan maven
          fi
          cp -r build/maven-repo/. "$tmp/"
          git -C "$tmp" add -A
          if git -C "$tmp" diff --cached --quiet; then
            echo "the maven branch already carries ${TAG#v}, leaving it alone"
          else
            git -C "$tmp" -c user.name='uxplima-ci' -c user.email='ci@uxplima.com' \
              commit -q -m "publish the developer api ${TAG#v}"
            git -C "$tmp" push -q origin maven
          fi

      # The same four jars onto the four Modrinth projects, straight through the v2 API. No publishing action sits
      # in between on purpose: they resolve the game versions against a list of their own, and this plugin targets
      # the 26.x line, which is exactly the kind of version such a list is last to learn.
      - name: Publish the jars to Modrinth
        if: env.MODRINTH_TOKEN != ''
        working-directory: uxmEssentials
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          changelog="$(cat "${RUNNER_TEMP}/release-notes.md")"
          if [ -z "$changelog" ]; then
            changelog="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          fi

          publish() {
            project="$1"
            label="$2"
            jar="$3"
            loaders="$4"
            # Modrinth accepts the same version number twice and lists it twice rather than refusing it, so a second
            # run over a tag that is already out has to be stopped here.
            if curl -sS "https://api.modrinth.com/v2/project/${project}/version" \
                 | jq -e --arg v "$version" 'any(.[]; .version_number == $v)' > /dev/null; then
              echo "modrinth project $project already has $version, leaving it alone"
              return
            fi
            payload="$(jq -n \
              --arg project "$project" \
              --arg name "$label $version" \
              --arg version "$version" \
              --arg changelog "$changelog" \
              --argjson loaders "$loaders" \
              '{
                 project_id: $project,
                 name: $name,
                 version_number: $version,
                 changelog: $changelog,
                 version_type: "alpha",
                 loaders: $loaders,
                 game_versions: ["26.1", "26.1.1", "26.1.2", "26.2"],
                 dependencies: [],
                 featured: true,
                 file_parts: ["file"],
                 primary_file: "file"
               }')"
            # The payload goes through a file rather than inline: curl reads `;` inside an -F value as the start of
            # a parameter, and release notes are full of them.
            printf '%s' "$payload" > "${RUNNER_TEMP}/modrinth-data.json"
            echo "publishing $(basename "$jar") to modrinth project $project"
            curl -sS --fail-with-body -X POST https://api.modrinth.com/v2/version \
              -H "Authorization: ${MODRINTH_TOKEN}" \
              -F "data=@${RUNNER_TEMP}/modrinth-data.json;type=application/json" \
              -F "file=@${jar}" \
              -o /dev/null
          }

          # The label is what the version is called on its own project page, where "uxmEssentials 0.5.2" on all four
          # would read as the same download listed four times.
          publish QVeOROXV "uxmEssentials" \
            "bukkit-adapter/build/libs/uxmEssentials-${version}.jar" '["paper","folia","purpur"]'
          publish giFPy916 "uxmEssentials Velocity" \
            "velocity-adapter/build/libs/uxmEssentials-velocity-${version}-all.jar" '["velocity"]'
          publish IpIrzRV9 "uxmEssentials Discord" \
            "discord-adapter/build/libs/uxmEssentials-discord-${version}.jar" '["paper","folia","purpur"]'
          publish DCyMsr3U "uxmEssentials Redis" \
            "redis-adapter/build/libs/uxmEssentials-redis-${version}.jar" '["paper","folia","purpur"]'

      # Every jar has its own Hangar project, the way it does on Modrinth: Hangar carries one file per platform per
      # version, so the four could never have shared one. The add-ons declare the main plugin as a hard dependency,
      # which is what they are, and the main project keeps LuckPerms and PlaceholderAPI optional the way
      # paper-plugin.yml has always described them.
      - name: Publish the jars to Hangar
        if: env.HANGAR_TOKEN != ''
        working-directory: uxmEssentials
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"

          # The key buys a JWT that lasts well under an hour, so it is fetched once here rather than carried around.
          jwt="$(curl -sS --fail-with-body -X POST \
            "https://hangar.papermc.io/api/v1/authenticate?apiKey=${HANGAR_TOKEN}" | jq -r .token)"

          MAIN_DEPS='[{"name":"LuckPerms","required":false,"externalUrl":"https://luckperms.net/"},
                      {"name":"PlaceholderAPI","required":false,"projectId":1289}]'
          ADDON_DEPS='[{"name":"uxmEssentials","required":true,"projectId":6381}]'

          publish() {
            slug="$1"
            platform="$2"
            platform_versions="$3"
            jar="$4"
            deps="$5"

            existing="$(curl -sS -o /dev/null -w '%{http_code}' \
              "https://hangar.papermc.io/api/v1/projects/${slug}/versions/${version}")"
            if [ "$existing" = "200" ]; then
              echo "hangar project $slug already has $version, leaving it alone"
              return
            fi

            jq -n \
              --arg version "$version" \
              --arg platform "$platform" \
              --argjson platformVersions "$platform_versions" \
              --argjson deps "$deps" \
              --rawfile description "${RUNNER_TEMP}/release-notes.md" \
              '{
                 version: $version,
                 channel: "Alpha",
                 description: $description,
                 files: [{platforms: [$platform]}],
                 platformDependencies: {($platform): $platformVersions},
                 pluginDependencies: {($platform): $deps}
               }' > "${RUNNER_TEMP}/hangar-data.json"

            echo "publishing $(basename "$jar") to hangar project $slug"
            curl -sS --fail-with-body -X POST \
              "https://hangar.papermc.io/api/v1/projects/${slug}/upload" \
              -H "Authorization: Bearer ${jwt}" \
              -F "versionUpload=@${RUNNER_TEMP}/hangar-data.json;type=application/json" \
              -F "files=@${jar}" \
              -o /dev/null
          }

          PAPER_VERSIONS='["26.1", "26.1.1", "26.1.2", "26.2"]'

          publish uxmEssentials PAPER "$PAPER_VERSIONS" \
            "bukkit-adapter/build/libs/uxmEssentials-${version}.jar" "$MAIN_DEPS"
          publish uxmEssentials-Velocity VELOCITY '["3.4"]' \
            "velocity-adapter/build/libs/uxmEssentials-velocity-${version}-all.jar" "$ADDON_DEPS"
          publish uxmEssentials-Discord PAPER "$PAPER_VERSIONS" \
            "discord-adapter/build/libs/uxmEssentials-discord-${version}.jar" "$ADDON_DEPS"
          publish uxmEssentials-Redis PAPER "$PAPER_VERSIONS" \
            "redis-adapter/build/libs/uxmEssentials-redis-${version}.jar" "$ADDON_DEPS"
