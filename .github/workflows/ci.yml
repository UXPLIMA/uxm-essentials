name: ci

on:
  # edited: a corrected title is checked again.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    uses: UXPLIMA/.github/.github/workflows/uxm-ci.yml@db6eaec17eb8ba4e5aff3c4f794edaacdfc5cf17 # main
    permissions:
      contents: read
    with:
      runner: '["ubuntu-latest"]'
      scopes: "api core command config menu storage message proxy integration build ci docs release"
      tools-ref: db6eaec17eb8ba4e5aff3c4f794edaacdfc5cf17
