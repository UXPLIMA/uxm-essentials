name: ci

on:
  # edited: a corrected title is checked again.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    uses: UXPLIMA/.github/.github/workflows/uxm-ci.yml@db6eaec17eb8ba4e5aff3c4f794edaacdfc5cf17 # main
    permissions:
      contents: read
    with:
      runner: '["ubuntu-latest"]'
      scopes: "api core command config menu storage message proxy integration build ci docs release"
      tools-ref: db6eaec17eb8ba4e5aff3c4f794edaacdfc5cf17

  # The repository tests run on SQLite in the build above. Here they run again on each network database the plugin
  # supports, in a service container Testcontainers starts on the hosted runner, one backend per job so the three run
  # side by side and a failure names its database. -Puxm.requireDocker makes a missing Docker fail the job instead of
  # skipping its tests.
  real-database:
    name: real-database (${{ matrix.backend }})
    if: (github.event_name != 'pull_request' || github.event.action != 'edited')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        backend: [mysql, mariadb, postgresql]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - env:
          BACKEND: ${{ matrix.backend }}
        run: ./gradlew ":persistence-adapter:${BACKEND}Test" -Puxm.requireDocker=true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-database-${{ matrix.backend }}
          path: persistence-adapter/build/reports/tests/
          retention-days: 7
