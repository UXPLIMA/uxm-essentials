name: real-database

# The repository tests run on SQLite in the ci build. Here they run again on each network database the plugin
# supports, in a container Testcontainers starts on the hosted runner, one backend per job so the three run side by
# side and a failure names its database. A workflow of its own, so editing a pull request's text (which re-runs ci for
# the title check) never cancels these runs.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: real-database-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: real-database (${{ matrix.backend }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        backend: [mysql, mariadb, postgresql]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      # -Puxm.requireDocker makes a missing Docker fail the job instead of skipping its tests.
      - env:
          BACKEND: ${{ matrix.backend }}
        run: ./gradlew ":persistence-adapter:${BACKEND}Test" -Puxm.requireDocker=true
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-database-${{ matrix.backend }}
          path: persistence-adapter/build/reports/tests/
          retention-days: 7
