# Text input — how every in-game text prompt captures a line from the player.
#
# Across the plugin, anywhere a menu asks you to type something (a home name, a warp password, a loan
# amount, a broadcast line) the text is captured one of two ways:
#
#   anvil — a small anvil GUI opens; you type into the rename field and click the result to submit.
#   chat  — the menu closes and you type your answer as your next chat message.
#
# The choice is per input point, not a single global switch. Set a global default below, then override
# any individual point under `modes`. Every point works in BOTH modes, so flipping one is always safe.

# The mode used by any input point that is not listed under `modes`. anvil or chat.
default-mode = anvil

# Cancel keywords. In chat mode, typing any of these (instead of an answer) aborts the prompt and
# reopens the menu you came from. In anvil mode, typing one into the field and submitting cancels too.
# Edit or extend this list freely — the first entry is the one shown in the chat "type X to cancel" hint.
cancel-keywords = ["cancel", "iptal"]

# Per-input-point overrides. Each key is one prompt in the plugin; set it to anvil or chat to override
# the default above for that single point. Every key here defaults to the global `default-mode` if you
# delete its line. The keys below are grouped by feature; the comment says what each one prompts for.
modes {
  # --- Homes ---
  "home.rename" = anvil          # rename a home from its action menu
  "home.invite-add" = anvil      # add a player (by name) to a home's invite list

  # --- Warps ---
  "warp.password" = chat         # set a warp's access password
  "warp.warmup" = chat           # set a warp's warmup override (seconds)
  "warp.cooldown" = chat         # set a warp's cooldown override (seconds)
  "warp.sound" = chat            # set a custom departure/arrival sound name
  "warp.particle" = chat         # set a custom departure/arrival particle name
  "warp.welcome" = chat          # add or edit a warp welcome message line

  # --- Player warps ---
  "playerwarp.create-name" = anvil   # create a new player warp at your location (its name)

  # --- Kits ---
  "kit.create-name" = chat       # create a new kit (its id)
  "kit.cooldown" = chat          # set a kit's cooldown (seconds)
  "kit.cost" = chat              # set a kit's purchase cost
  "kit.display-name" = chat      # set a kit's display-name override
  "kit.display-lore" = chat      # set a kit's display lore
  "kit.commands" = chat          # set a kit's on-claim commands
  "kit.category.create-name" = chat   # create a new kit category (its id)
  "kit.category.display-name" = chat  # set a category's display name
  "kit.category.display-lore" = chat  # set a category's display lore
  "kit.category.slot" = chat          # set a category's GUI slot index

  # --- Economy: admin (give/take/set) ---
  "eco.amount" = anvil           # the amount for a give/take/set/reset on one target
  "eco.bulk-amount" = anvil      # the amount for a bulk give-all to everyone online

  # --- Economy: banks ---
  "bank.create-name" = chat      # create a bank (its display name; the id is auto-assigned, currency via picker)
  "bank.deposit" = chat          # deposit an amount into a bank
  "bank.withdraw" = chat         # withdraw an amount from a bank
  "bank.member-add" = chat       # add a member (by name) to a bank

  # --- Economy: loans ---
  "loan.amount" = chat           # request a loan (its amount)
  "loan.installments" = chat     # request a loan (number of installments)
  "loan.repay-custom" = chat     # repay a custom amount toward a loan

  # --- Economy: currency exchange ---
  "exchange.amount" = chat       # exchange a custom amount between currencies

  # --- Moderation ---
  "moderation.jail-create" = anvil    # create a jail at your location (its name)
  "moderation.reason" = anvil         # the (optional) reason for a ban/mute confirmation
  "moderation.check-ban" = anvil      # the player name to check a ban for
  "moderation.check-mute" = anvil     # the player name to check a mute for

  # --- Messaging ---
  "messaging.ignore-add" = anvil      # add a player (by name) to your ignore list

  # --- Communication ---
  "communication.broadcast" = anvil   # type a one-line broadcast from the admin panel
  "communication.announce-create" = anvil   # create an announcement (its id)

  # --- Holograms ---
  "hologram.create-name" = anvil      # create a hologram at your feet (its name)

  # --- NPCs ---
  "npc.create-name" = anvil           # create an NPC at your feet (its name)

  # --- Shared entity-editor widgets (used by hologram/npc/announcement/playerwarp editors) ---
  # These cover every text/list/colour field reached through the shared editor framework. A text or
  # list field opens one prompt per value; the colour field's custom-hex button opens one too.
  "editor.text-field" = anvil         # any single-line text field in an entity editor
  "editor.list-entry" = anvil         # add or edit one line of a list field in an entity editor
  "editor.colour-hex" = anvil         # the custom hex colour entry in the shared colour picker

  # --- Shared pickers (used by moderation and other admin flows) ---
  "picker.player-name" = anvil        # the offline/hidden player-name entry in the shared player picker
  "picker.duration" = anvil           # the custom-span entry in the shared duration picker
}
