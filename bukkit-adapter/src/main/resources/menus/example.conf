# A starter custom menu. Open it in-game with: /menu open example
#
# This file demonstrates the generic vocabulary every menu can use without any feature wiring: the close / open /
# command / message actions, an inline MiniMessage name and lore, and the {player} placeholder. Copy it to
# menus/<your-name>.conf and edit it to build your own; the file name (without .conf) is the name you pass to
# /menu open. The names and lore here are written verbatim as MiniMessage — they are NOT translated through the
# message catalogs, so style them however you like.

title = "<dark_aqua>Example Menu"
rows = 3

items {
  # A plain information tile in the centre. No click block, so it does nothing when clicked.
  info {
    slot = 4
    material = PAPER
    name = "<aqua>Welcome, <white>{player}</white>!"
    lore = [
      "<gray>This is a sample custom menu.",
      "<gray>Edit menus/example.conf to change it."
    ]
  }

  # Runs /spawn as the clicking player, then closes the menu.
  spawn {
    slot = 11
    material = COMPASS
    name = "<green>Go to spawn"
    lore = ["<gray>Runs <white>/spawn</white> as you."]
    click {
      left = ["command:spawn", "close"]
    }
  }

  # Sends the clicker a chat message.
  greet {
    slot = 13
    material = OAK_SIGN
    name = "<yellow>Say hello"
    lore = ["<gray>Sends you a message."]
    click {
      left = ["message:<gold>Hello from a custom menu!"]
    }
  }

  # Re-opens this same menu (a no-op demonstration of the open action targeting a spec by name).
  reopen {
    slot = 15
    material = ENDER_PEARL
    name = "<light_purple>Reopen this menu"
    lore = ["<gray>Opens <white>example</white> again."]
    click {
      left = ["open:example"]
    }
  }

  # Closes the menu.
  close {
    slot = 22
    material = BARRIER
    name = "<red>Close"
    click {
      left = ["close"]
    }
  }
}
