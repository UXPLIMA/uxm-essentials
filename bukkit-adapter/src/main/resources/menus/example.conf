# A menu is a file, and this is the whole menu: its title, its size, and every tile in it.
#
# Open it in game with /menu open <name>, where <name> is this file's name without .conf.
# Copy the file to menus/<your-name>.conf to start one of your own.
#
# A tile is one block under items {}. It needs a slot and a material. Everything else is
# optional: name, lore, and a click {} block that says what each mouse button does.
#
# A name and a lore line are written verbatim as MiniMessage, and they are NOT translated
# through the message catalogs, so style them however you like. {player} becomes the name of
# the player who opened the menu.
#
# The in game editor writes this file. It writes back the menu it is holding, so it keeps
# this header and it does not keep a comment you wrote yourself, and it sorts the keys. Keep
# your own notes somewhere the editor does not rewrite.

# This example demonstrates the vocabulary every menu can use with no feature wiring: the
# close, open, command and message actions, an inline name and lore, and {player}. Open it
# with /menu open example.

title = "<dark_aqua>Example Menu"
rows = 3

items {
  # A plain information tile in the centre. No click block, so it does nothing when clicked.
  info {
    slot = 4
    material = PAPER
    name = "<aqua>Welcome, <white>{player}</white>!"
    lore = [
      "<gray>This is a sample custom menu.",
      "<gray>Edit menus/example.conf to change it."
    ]
  }

  # Runs /spawn as the clicking player, then closes the menu.
  spawn {
    slot = 11
    material = COMPASS
    name = "<green>Go to spawn"
    lore = ["<gray>Runs <white>/spawn</white> as you."]
    click {
      left = ["command:spawn", "close"]
    }
  }

  # Sends the clicker a chat message.
  greet {
    slot = 13
    material = OAK_SIGN
    name = "<yellow>Say hello"
    lore = ["<gray>Sends you a message."]
    click {
      left = ["message:<gold>Hello from a custom menu!"]
    }
  }

  # Re-opens this same menu (a no-op demonstration of the open action targeting a spec by name).
  reopen {
    slot = 15
    material = ENDER_PEARL
    name = "<light_purple>Reopen this menu"
    lore = ["<gray>Opens <white>example</white> again."]
    click {
      left = ["open:example"]
    }
  }

  # Closes the menu.
  close {
    slot = 22
    material = BARRIER
    name = "<red>Close"
    click {
      left = ["close"]
    }
  }
}
