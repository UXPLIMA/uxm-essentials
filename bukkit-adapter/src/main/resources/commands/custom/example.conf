# A starter custom command. Try it in-game with: /welcome  or  /welcome Steve
#
# Every file in this folder declares one command. The file name is the command's id (this one is "example"), which
# is what /customcmd info, /customcmd test and /customcmd reload take; the name inside the command { } block is the
# word players actually type. Copy this file to commands/custom/<your-id>.conf and edit it.
#
# The actions and requirements are the same vocabulary the menu engine speaks, so anything a menu button can do a
# command can do. Text is written verbatim as MiniMessage: it is NOT translated through the message catalogs, so
# style it however you like.

command {
  # The command word, without the slash. It must be a single lowercase word.
  name = "welcome"

  # Extra words that run the same command. An alias already claimed by another command is skipped with a warning.
  aliases = ["hello"]

  # Who may run it. Remove this line to let everyone run it. Nothing grants this node by default, so give it to the
  # groups you want before you rely on the command.
  permission = "uxmessentials.customcommand.example"

  # What a player without that permission sees. Remove it to fall back to the plugin's standard refusal.
  deny-message = "<red>You are not allowed to welcome people."

  # Whether the server console may run this too. Actions that need a player (a sound, a teleport) simply do nothing
  # for a console run, so leave this false for anything player-specific.
  console = true

  # The one-line description shown in /help and /customcmd list.
  description = "Greet a player"

  # The usage line Brigadier shows. Square brackets mark the optional argument declared below.
  usage = "/welcome [name]"

  # How long a player must wait between runs. "0s" (or leaving the line out) means no cooldown. Staff can be
  # exempted with uxmessentials.cooldown.bypass.customcommand.example.
  cooldown = "5s"

  # How long the player must stand still before the actions run. "0s" runs them immediately; anything longer is
  # cancelled if they move, which is what you want for a command that teleports or hands out a reward.
  warmup = "0s"

  # What running it costs, in the currency set in modules/customcommands/config.conf. Zero is free.
  cost = 0
}

# The arguments the command takes, in order. Each one becomes a real Brigadier argument with tab completion, and its
# value is readable inside the actions as %arg_<name>%. Types: string, rest (the whole remaining line), int, double,
# bool, material, world, online-player, player. An optional argument must come after every required one, and is the
# empty string when the player leaves it out.
arguments = [
  { name = "name", type = string, optional = true }
]

# Gates checked before anything runs. All of them must pass. Leave the block out for a command with no conditions.
requirements = ["permission:uxmessentials.customcommand.example"]

# What happens when a requirement above fails. Leave it out to fall back to the plugin's standard refusal.
requirement-deny = ["message:<red>You are not allowed to welcome people."]

# What the command does, in order. A "delay:<time>" token shifts every step after it, so the chain reads top to
# bottom without ever blocking the server.
actions = [
  "message:<green>Welcome message sent."
  "delay:1s"
  "broadcast:<gold>%player% <yellow>welcomes <gold>%arg_name%<yellow> to the server!"
  "sound:entity.player.levelup"
]

# The shortest possible definition is a rename of an existing command. Instead of an actions list, write:
#
#   alias = "/gamemode creative"
#
# and everything the player types after your command is passed through. A file may declare actions or alias, but
# never both.
