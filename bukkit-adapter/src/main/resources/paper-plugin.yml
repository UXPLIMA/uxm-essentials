  uxmessentials.entitycount.use:
    description: '/entitycount [radius] — tally nearby entities by type for lag diagnosis.'
    default: op
  uxmessentials.unlimited.use:
    description: '/unlimited — toggle unlimited placement of held blocks.'
    default: op
  # Time & weather aliases sub-feature group.
  uxmessentials.time.use:
    description: '/time <set|add> <value> — per-world time.'
    default: op
  uxmessentials.weather.use:
    description: '/weather <clear|rain|thunder> [duration].'
    default: op
  uxmessentials.time.alias:
    description: '/day / /night quick time aliases.'
    default: op
  uxmessentials.weather.alias:
    description: '/sun / /rain / /thunder quick weather aliases.'
    default: op
  # Admin-fun sub-feature group. Every verb here is audit-logged.
  uxmessentials.lightning.use:
    description: '/lightning (alias /smite) [player] — strike lightning (audit-logged).'
    default: op
  uxmessentials.fireball.use:
    description: '/fireball — launch a fireball (audit-logged).'
    default: op
  uxmessentials.kittycannon.use:
    description: '/kittycannon — launch an exploding cat (audit-logged).'
    default: op
  uxmessentials.antioch.use:
    description: '/antioch (alias /grenade) — throw a primed TNT grenade (audit-logged).'
    default: op
  uxmessentials.beezooka.use:
    description: '/beezooka (alias /beecannon) — launch an angry bee (audit-logged).'
    default: op
  uxmessentials.break.use:
    description: '/break — instantly break the block you are looking at (audit-logged).'
    default: op
  uxmessentials.tree.use:
    description: '/tree <type> — generate a tree of the given type where you are looking (audit-logged).'
    default: op
  uxmessentials.nuke.use:
    description: '/nuke [player] — rain lightning over an area (audit-logged).'
