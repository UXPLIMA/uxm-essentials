  uxmessentials.pwarp.use:
    description: '/pwarp <name> [owner] to teleport to your own or a player''s public warp.'
    default: true
  uxmessentials.pwarp.set:
    description: '/setpwarp <name> to create or move a player-owned warp at your location.'
    default: true
  uxmessentials.pwarp.delete:
    description: '/pwarp del <name> to remove one of your player warps.'
    default: true
  uxmessentials.pwarp.list:
    description: '/pwarps [player] to list your warps or a player''s public warps.'
    default: true
  uxmessentials.pwarp.public:
    description: '/pwarp visibility public|private <name> to toggle a player warp''s visibility.'
    default: true
  # Self-service edit / social verbs folded under /pwarp — each lets a player run the verb on a warp; ownership of
  # the target warp is still enforced by the warp authorization matrix inside the use case, not by these nodes.
  uxmessentials.pwarp.move:
    description: '/pwarp move <name> to re-anchor one of your player warps at your location.'
    default: true
  uxmessentials.pwarp.rename:
    description: '/pwarp rename <name> <newName> to rename one of your player warps.'
    default: true
  uxmessentials.pwarp.displayname:
    description: '/pwarp displayname <name> [text] to set or clear a player warp''s display name.'
    default: true
  uxmessentials.pwarp.description:
    description: '/pwarp description <name> [text] to set or clear a player warp''s description.'
    default: true
  uxmessentials.pwarp.icon:
    description: '/pwarp icon <name> [icon] to set or clear a player warp''s browse icon.'
    default: true
  uxmessentials.pwarp.category:
    description: '/pwarp category <name> [categoryId] to file a player warp under a browse category.'
    default: true
  uxmessentials.pwarp.access:
    description: '/pwarp access <name> <PUBLIC|PASSWORD|WHITELIST|PRIVATE> to set a player warp''s access axis.'
    default: true
  uxmessentials.pwarp.password:
    description: '/pwarp password <name> <password>|clear to set or clear a player warp''s password.'
    default: true
  uxmessentials.pwarp.price:
    description: '/pwarp price <name> <amount> [currency] to set a player warp''s entry price.'
    default: true
  uxmessentials.pwarp.info:
    description: '/pwarp info <name> to show a player warp''s owner, access, price, visits, and rating.'
    default: true
  uxmessentials.pwarp.favourite:
    description: '/pwarp favourite|unfavourite <name> to star or un-star a player warp.'
    default: true
  uxmessentials.pwarp.rate:
    description: '/pwarp rate <name> <1-5> to award a player warp a star rating.'
    default: true
  uxmessentials.pwarp.transfer:
    description: '/pwarp transfer <name> <player> to hand ownership of one of your warps to another player.'
    default: true
  uxmessentials.pwarp.sponsor:
    description: '/pwarp sponsor <name> [days] to buy a paid, time-limited pinned browse slot for one of your warps.'
    default: true
  uxmessentials.pwarp.withdraw:
    description: '/pwarp withdraw <name> to pay one of your warps'' accrued earnings out to its owner.'
    default: true
  # People-management verbs folded under /pwarp — each lets a player run the verb, and the warp authorization
  # matrix inside the use case still decides which warps they may manage by role, not these nodes. ban covers /pwarp
  # ban and /pwarp unban both.
  uxmessentials.pwarp.members:
    description: '/pwarp members <name> add|remove <player> to grant or revoke a co-owner or manager on one of your warps.'
    default: true
  uxmessentials.pwarp.ban:
    description: '/pwarp ban|unban <name> <player> to bar a player from one of your warps or lift that bar.'
    default: true
  uxmessentials.pwarp.whitelist:
    description: '/pwarp whitelist <name> add|remove <player> to manage a whitelist-access warp''s guest list.'
    default: true
  # Operator admin group — /pwarp admin restore|purge|setowner|reload acts on ANY warp by its surrogate id, so this
  # single node is the authorization and the verbs skip the per-warp role gate. purge is irreversible and
  # confirm-gated.
  uxmessentials.pwarp.admin:
    description: '/pwarp admin restore|purge|setowner|reload to manage any player''s warp by its id.'
    default: op
  # Player-warps management GUI — /pwarp with no arguments opens the list-and-editor panel, and the playerwarps
  # entry on the /uxmess gui hub gates on this node. A player without it still opens the GUI for their own warps;
  # holding it widens the list to every player's warps so an operator can manage all. Admin/manage tier.
  uxmessentials.pwarp.gui:
    description: 'Manage every player''s warps in the /pwarp GUI (a player without it edits only their own).'
    default: op
  uxmessentials.pwarp.bypass.ban:
    description: 'Enter a player warp you are banned from (skips the ban check on /pwarp).'
    default: op
  uxmessentials.pwarp.bypass.password:
    description: 'Enter a password-protected player warp without the password (skips the check on /pwarp).'
    default: op
  uxmessentials.pwarp.bypass.whitelist:
    description: 'Enter a whitelist-only player warp without being on the whitelist (skips the check on /pwarp).'
    default: op
  uxmessentials.pwarp.bypass.safety:
    description: 'Use a player warp whose destination is unsafe (skips the safe-landing check on /pwarp).'
    default: op
  uxmessentials.pwarp.bypass.cost:
    description: 'Use a priced player warp without paying its entry cost (skips the charge on /pwarp).'
    default: op
  # scoreboard context (docs/permissions.md "Scoreboard"). A per-player sidebar plus a tablist header/footer
  # rendered from operator MiniMessage content; the module ships disabled. uxmessentials.scoreboard.use is the
  # self-service toggle (default true) and uxmessentials.module.scoreboard is the reload/inspect tier.
  uxmessentials.module.scoreboard:
    description: 'Hot-reload / inspect the scoreboard module (per-player sidebar and tablist on uxmlib-hud).'
    default: op
  uxmessentials.scoreboard.use:
    description: '/scoreboard (alias /sb) to toggle whether you see the scoreboard display.'
    default: true
  uxmessentials.scoreboard.gui:
    description: '/scoreboard gui (and the scoreboard entry on the /uxmess gui hub) to open the per-player scoreboard settings panel — the show/hide toggle.'
    default: true
  # vote context (docs/permissions.md "Vote"). A Votifier-bridged vote-rewards and vote-party feature: an
  # incoming vote runs the configured per-vote rewards and advances a server-wide party counter that fires
  # party rewards for everyone once a threshold is reached (an offline voter's reward is queued and paid on
  # join). The vote-links and reward commands are config content, not permission nodes.
  # uxmessentials.module.vote is the reload/inspect tier.
  uxmessentials.module.vote:
    description: 'Hot-reload / inspect the vote module (Votifier vote rewards and vote party).'
    default: op
  uxmessentials.vote.use:
    description: '/vote to see the server''s vote links.'
    default: true
  uxmessentials.voteparty.use:
    description: '/voteparty to see progress towards the next vote party.'
    default: true
  uxmessentials.vote.testreward:
    description: '/vote testreward to simulate a vote for yourself and verify the configured rewards.'
    default: op
  uxmessentials.vote.top:
    description: '/vote top [period] to see the vote leaderboard for the given period.'
    default: true
  uxmessentials.vote.admin:
    description: '/vote admin givevote <player> [amount] and /vote admin reset <player> — inject or clear votes for any player.'
    default: op
  uxmessentials.voteparty.admin:
    description: '/voteparty force|set|add — force the party or adjust the party counter.'
    default: op
  # discordlink context (docs/permissions.md "Discord linking"). One self-service node gates every in-game
  # command — linking is opt-in and only ever acts on the caller's own account; the /link redemption itself runs
  # inside the optional Discord bridge jar. uxmessentials.module.discordlink is the reload/inspect tier.
  uxmessentials.discord.link:
    description: '/discordlink (issue a code), /discordlink status (show your binding), and /discordunlink (remove it) — all act only on your own account.'
    default: true
  uxmessentials.discord.gui:
    description: '/discordlink gui (and the discordlink entry on the /uxmess gui hub) to open the link-status panel — your binding, a generate-code button, and a confirm-gated unlink.'
    default: true
  # staff context (docs/permissions.md "Staff"). STAFF-MODE ONLY: the /staffmode toggle (item-loss-safe DB-backed
  # loadout swap + the VANISH/EXAMINE gadget hotbar) and staff chat. No sanctions here. The .chat node both gates
  # sending and identifies the staff-chat receive audience (configurable via modules/staff/config.conf).
  uxmessentials.staff.mode:
    description: '/staffmode [player] to flip into staff mode: your real loadout is saved and swapped for the gadget hotbar (and you vanish); leaving restores it. The EXAMINE gadget opens a player''s inventory.'
    default: op
  uxmessentials.staff.chat:
    description: '/staffchat (alias /sc) to send and receive lines on the staff-only chat channel.'
    default: op
  uxmessentials.staff.list:
    description: '/stafflist to open the online-staff GUI (vanish-aware) and click a head to teleport to that staff member.'
    default: op
  # npc context (docs/permissions.md "NPC"). Server-wide fake-player NPCs (no real entity; rendered to each
  # viewer with packets) behind the single /npc command (create / delete / list / movehere / skin / command /
  # lookatplayer), an operator surface gated as a whole by uxmessentials.npc.admin. Clicking an NPC runs its
  # bound command for everyone; uxmessentials.npc.use is reserved for a future per-NPC permission gate.
  # uxmessentials.module.npc is the reload/inspect tier.
  uxmessentials.module.npc:
    description: 'Hot-reload / inspect the npc module (server-wide fake-player NPCs behind /npc).'
    default: op
  uxmessentials.npc.admin:
    description: '/npc to create, delete, list, move, re-skin, and bind the click command of fake-player NPCs.'
    default: op
  uxmessentials.npc.use:
    description: 'Interact with (click) an NPC to run its bound command. Reserved for the interaction sub-phase.'
    default: true
  # NPC management GUI — /npc with no arguments opens the list-and-editor panel, and the npc entry on the
  # /uxmess gui hub gates on this node. Admin/manage tier, like the rest of the NPC surface.
  uxmessentials.npc.gui:
    description: '/npc (no args) opens the NPC management GUI.'
    default: op
  # custommenus context (docs/permissions.md "Custom Menus"). The operator surface over the menu engine behind
  # the single /menu command: /menu open <name> opens a loaded menu (default-everyone use tier), /menu list shows
  # them, and /menu reload re-reads the menus/ folder (admin tier). uxmessentials.module.custommenus is the
  # reload/inspect tier.
  uxmessentials.module.custommenus:
    description: 'Hot-reload / inspect the custommenus module (operator custom menus behind /menu).'
    default: op
  uxmessentials.menu.use:
    description: '/menu open <name> to open an operator custom menu, and /menu list to see the loaded menus.'
    default: true
  uxmessentials.menu.admin:
    description: '/menu reload to re-read the menus/ folder from disk.'
    default: op
  uxmessentials.menu.editor:
    description: '/menu editor (and the /uxmess gui hub entry) to create, duplicate, rename and delete custom menus in-game.'
    default: op
  # poses context (docs/permissions.md "Poses"). Built-in GSit-parity sitting and posing (/sit, player-sit, /lay,
  # /bellyflop, /spin, /crawl). Each pose verb is a self-service use node (default true). The module node is the
  # reload/inspect tier for the module as a whole. The cooldown tier uxmessentials.poses.cooldown.<seconds> is an
  # open value space (lowest matching wins, shared across all poses) and is intentionally not enumerated here; only
  # the base and bypass nodes are declared.
  uxmessentials.sit.use:
    description: '/sit and right-click-to-sit — sit down where you stand or on a sittable block.'
    default: true
  uxmessentials.lay.use:
    description: '/lay — lie down on your back where you stand.'
    default: true
  uxmessentials.bellyflop.use:
    description: '/bellyflop — flop onto your front where you stand.'
    default: true
  uxmessentials.spin.use:
    description: '/spin — sit and spin in place.'
    default: true
  uxmessentials.crawl.use:
    description: '/crawl — crawl through a one-block gap; run again to stand up.'
    default: true
  uxmessentials.playersit.use:
    description: 'Right-click another player to sit on them (the stacking pose), when player-sit is enabled.'
    default: true
  uxmessentials.poses.toggle:
    description: '/poses toggle — allow or refuse other players sitting on you.'
    default: true
  uxmessentials.poses.gui:
    description: '/poses (or /poses gui) — open your personal poses settings & status panel.'
    default: true
  uxmessentials.poses.cooldown.bypass:
    description: 'Skip the cooldown between starting poses.'
    default: op
  uxmessentials.module.poses:
    description: 'Hot-reload / inspect the poses module (built-in GSit-parity sitting and posing).'
    default: op
  # survival context (docs/permissions.md "Survival"). Opt-in gameplay mechanics, each an independently toggleable
  # sub-feature. Each mechanic carries a use node uxmessentials.survival.<mechanic> (whether it acts for the player);
  # the seven with a personal /command toggle also carry uxmessentials.survival.<mechanic>.toggle (whether the player
  # may switch it, from the command or the /survival panel). All are self-service (default true) — the mechanics ship
  # on and a player opts out. uxmessentials.survival.gui opens the /survival settings panel; the module node is the
  # reload/inspect tier for the context as a whole.
  uxmessentials.survival.treefeller:
    description: 'Tree-feller acts for you — break one log to fell the whole trunk.'
    default: true
  uxmessentials.survival.treefeller.toggle:
    description: '/treefeller — switch your personal tree-feller on or off.'
    default: true
  uxmessentials.survival.veinminer:
    description: 'Veinminer acts for you — break one block to mine the connected vein.'
    default: true
  uxmessentials.survival.veinminer.toggle:
    description: '/veinminer — switch your personal veinminer on or off.'
    default: true
  uxmessentials.survival.farmprotect:
    description: 'Farmland protection acts for you — you will not trample your crops.'
    default: true
  uxmessentials.survival.farmprotect.toggle:
    description: '/farmprotect — switch your personal farmland protection on or off.'
    default: true
  uxmessentials.survival.farmassist:
    description: 'Right-click a mature crop to harvest and replant it, spending one seed.'
    default: true
  uxmessentials.survival.autopickup:
    description: 'Auto-pickup acts for you — mined drops go straight to your inventory.'
    default: true
  uxmessentials.survival.autopickup.toggle:
    description: '/autopickup — switch your personal auto-pickup on or off.'
    default: true
  uxmessentials.survival.autosmelt:
    description: 'Auto-smelt acts for you — ores are smelted as you mine them.'
    default: true
  uxmessentials.survival.autosmelt.toggle:
    description: '/autosmelt — switch your personal auto-smelt on or off.'
    default: true
  uxmessentials.survival.autosell:
    description: 'Auto-sell acts for you — priced drops are sold for coin as you mine.'
    default: true
  uxmessentials.survival.autosell.toggle:
    description: '/autosell — switch your personal auto-sell on or off.'
    default: true
  uxmessentials.survival.autotool:
    description: 'Auto-tool acts for you — the best tool swaps to hand as you mine.'
    default: true
  uxmessentials.survival.autotool.toggle:
    description: '/autotool — switch your personal auto-tool on or off.'
    default: true
  uxmessentials.survival.gui:
    description: '/survival — open your personal survival mechanics settings panel.'
    default: true
  uxmessentials.module.survival:
    description: 'Hot-reload / inspect the survival module (opt-in gameplay mechanics).'
    default: op
  # Trade — secure player-to-player trading. /trade <player> requests a trade and /trade accept|deny answers one;
  # uxmessentials.trade.use gates the whole command (ships true so every player may trade), and
  # uxmessentials.module.trade is the reload/inspect tier for the context.
  uxmessentials.trade.use:
    description: '/trade — request a trade with another player and accept or deny requests.'
    default: true
  uxmessentials.module.trade:
    description: 'Hot-reload / inspect the trade module.'
    default: op
  # Security — account-security features (NOT a login system). Two-factor enrolment is the self-service surface: every
  # player may protect their own account, so uxmessentials.security.2fa and .pin ship true; .bypass exempts a holder
  # from the two-factor join verification and op-command re-auth checks; uxmessentials.module.security is the
  # reload/inspect tier.
  uxmessentials.security.2fa:
    description: '/2fa — set up, confirm or disable an authenticator second factor on your account.'
    default: true
  uxmessentials.security.pin:
    description: '/pin set — set a numeric PIN second factor on your account.'
    default: true
  uxmessentials.security.bypass:
    description: 'Exempt from the two-factor join verification and op-command re-auth checks.'
    default: op
  # IP/alt guard + ClientID (Phase 4). The two staff reads and the join-time notice are op-only.
  uxmessentials.security.alts:
    description: '/alts — list the accounts that share an IP with a player.'
    default: op
  uxmessentials.security.clientinfo:
    description: '/clientinfo — show the client brand a player reported.'
    default: op
  uxmessentials.security.alts.notify:
    description: 'Receive the staff notice when a join shares an IP with other accounts or reports a flagged client.'
    default: op
  uxmessentials.module.security:
    description: 'Hot-reload / inspect the security module (2FA, op-protection, IP/alt guard).'
    default: op
  # Command Control — PlHidePro / CommandWhitelist-parity gating of which commands a player may run and see. .bypass
  # exempts a holder from the whitelist/blacklist gate and the tab-completion / plugin-hide scrub (sees everything);
  # .viewplugins reveals the plugin-listing / help commands the plugin-hide otherwise removes and blocks. The module
  # reload/inspect tier is uxmessentials.module.commandcontrol.
  uxmessentials.commandcontrol.bypass:
    description: 'Exempt from the command whitelist/blacklist gate and the tab-completion / plugin-hide scrub.'
    default: op
  uxmessentials.commandcontrol.viewplugins:
    description: 'See the plugin-listing / help commands (/plugins, /pl, /help, ...) hidden by the plugin-hide feature.'
    default: op
  uxmessentials.module.commandcontrol:
    description: 'Hot-reload / inspect the commandcontrol module (command whitelist, tab-completion filter, plugin-hide).'
    default: op
  # villagers context (docs/permissions.md "Villagers"). Villager trade management plus protection and pickup. The
  # trade manager is a staff tool (.manager) — /villager manager opens the villager you look at and edits its trades
  # (buy/sell items and amounts, add/remove a trade, toggle the villager's disable flag). Click-to-trade (.trade) opens
  # a villager's trade window directly on right-click even where the vanilla gate would refuse it. Protect (.protect) —
  # /villager protect toggles a villager's saver mark (no death, no despawn). Bucket (.bucket) — sneak-pick a villager
  # up into a captured-villager item and place it back. Follow (.follow) — /villager follow makes the villager you look
  # at pathfind after you. Leash (.leash) — right-click a villager with a lead to leash it. All features ship off in
  # config; the module reload/inspect tier is uxmessentials.module.villagers.
  uxmessentials.villagers.manager:
    description: '/villager manager — open and edit the trades of the villager you are looking at.'
    default: op
  uxmessentials.villagers.trade:
    description: 'Open a villager''s trade window directly on right-click, when click-to-trade is enabled.'
    default: op
  uxmessentials.villagers.protect:
    description: '/villager protect — toggle whether the villager you are looking at is protected from death and despawn.'
    default: op
  uxmessentials.villagers.bucket:
    description: 'Sneak-right-click a villager to pick it up into a captured-villager item, and place it back later.'
    default: op
  uxmessentials.villagers.follow:
    description: '/villager follow — toggle whether the villager you are looking at pathfinds after you.'
    default: op
  uxmessentials.villagers.leash:
    description: 'Right-click a villager with a lead to leash it, when leashing is enabled.'
    default: op
  uxmessentials.module.villagers:
    description: 'Hot-reload / inspect the villagers module (villager trade management).'
    default: op

  # invrollback context (docs/permissions.md "Inventory Rollback"). Inventory snapshots are captured at key moments
  # (death, logout) and stored in the database (never PDC, so they survive a world rollback). Restore (.restore) —
  # /invrestore <player> opens the staff GUI listing that player's snapshots newest-first; selecting one previews its
  # contents and a restore overwrites the target's live inventory (the pre-restore inventory is itself snapshotted
  # first as a safety copy). Restore acts on a live inventory, so the target must be online. uxmessentials.module.
  # invrollback is the reload/inspect tier.
  uxmessentials.invrollback.restore:
    description: '/invrestore <player> — open the inventory-snapshot restore GUI for a player.'
    default: op
  uxmessentials.module.invrollback:
    description: 'Hot-reload / inspect the invrollback module (inventory snapshots and restore).'
    default: op

