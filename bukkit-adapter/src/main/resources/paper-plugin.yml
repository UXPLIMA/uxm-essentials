    default: op
  # communication context (docs/permissions.md "Communication"). The operator's broadcast surface:
  # connection-message policies, the rotating announcer, and the info pages. The per-page nodes
  # uxmessentials.communication.info.<name> (one per configured info page: /rules, /motd, /info, …) are an open
  # value space granted per page and are intentionally not enumerated here. Ships disabled by default.
  uxmessentials.module.communication:
    description: 'Hot-reload / inspect the communication module (connection messages, announcer, info pages).'
    default: op
  uxmessentials.communication.broadcasttoggle:
    description: '/broadcasttoggle to stop or resume receiving the rotating server announcements.'
    default: true
  uxmessentials.communication.broadcast:
    description: '/broadcast to send a one-off announcement to all online players.'
    default: op
  uxmessentials.communication.broadcastworld:
    description: '/broadcastworld (alias /bcw) to send a one-off announcement only to players in your world.'
    default: op
  uxmessentials.communication.me:
    description: '/me to broadcast a third-person action message to all online players.'
    default: true
  uxmessentials.communication.clearchat:
    description: '/clearchat (alias /chatclear) to flush the chat for online players.'
    default: op
  uxmessentials.communication.clearchat.exempt:
    description: 'Keep your chat scrollback when staff run /clearchat.'
    default: false
  uxmessentials.communication.togglechat:
    description: '/togglechat (alias /mutechat) to lock or unlock public chat for non-staff.'
    default: op
  uxmessentials.communication.chat.bypass:
    description: 'Keep chatting while public chat is locked by /togglechat.'
    default: op
  # holograms context (docs/permissions.md "Holograms"). The single /hologram command (with its
  # create / delete / list / addline / setline / removeline / movehere subcommands) is an operator surface,
  # gated as a whole by uxmessentials.hologram.use; uxmessentials.module.holograms is the reload/inspect tier.
  uxmessentials.module.holograms:
    description: 'Hot-reload / inspect the holograms module (native-Display holograms behind /hologram).'
    default: op
  uxmessentials.hologram.use:
    description: '/hologram to create, edit, move, list and delete native-Display holograms.'
    default: op
  # player-warps context (docs/permissions.md "Player Warps"). Player-owned warps keyed (owner, name): the
  # base nodes default true (self-service), the visibility toggle gates /pwarp public|private, and the
  # numbered quota node uxmessentials.pwarp.limit.<n> (optional <world> segment, highest <n> wins) is an open
  # value space granted per player and is intentionally not enumerated here. uxmessentials.module.playerwarps
  # is the reload/inspect tier.
  uxmessentials.module.playerwarps:
    description: 'Hot-reload / inspect the playerwarps module (player-owned warps behind /pwarp).'
    default: op
  uxmessentials.pwarp.use:
    description: '/pwarp <name> [owner] to teleport to your own or a player''s public warp.'
    default: true
  uxmessentials.pwarp.set:
    description: '/setpwarp <name> to create or move a player-owned warp at your location.'
    default: true
  uxmessentials.pwarp.delete:
    description: '/delpwarp <name> to remove one of your player warps.'
    default: true
  uxmessentials.pwarp.list:
    description: '/pwarps [player] to list your warps or a player''s public warps.'
    default: true
  uxmessentials.pwarp.public:
    description: '/pwarp public|private <name> to toggle a player warp''s visibility.'
    default: true
