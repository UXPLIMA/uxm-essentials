  uxmessentials.module.vaults:
    description: 'Hot-reload / inspect the vaults module (DB-persisted player vault storage).'
    default: op
  uxmessentials.vault.use:
    description: '/vault to open your default vault (or list them), and /vault <n> to open the Nth.'
