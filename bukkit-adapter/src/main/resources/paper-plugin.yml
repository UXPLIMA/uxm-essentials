  uxmessentials.nick.use:
    description: '/nick <name> | off to set or clear your display name.'
    default: true
  uxmessentials.nick.others:
    description: '/nick <player> <name> to set another player''s display name.'
    default: op
  uxmessentials.whois.use:
    description: '/whois <player> to view an online player''s account, identity and status.'
    default: op
  uxmessentials.gc.use:
    description: '/gc to show server health: TPS, uptime, memory and loaded chunks.'
    default: op
  uxmessentials.staff.use:
    description: '/staff to list online staff members.'
    default: op
  uxmessentials.staff.member:
    description: 'Marks a player as staff so they appear in /staff.'
    default: op
  uxmessentials.afk.kick.exempt:
    description: 'Never auto-kicked for being AFK past the configured timeout.'
    default: op
  uxmessentials.vanish.use:
    description: '/vanish to become invisible to other players; suppresses fake join/quit.'
    default: op
  uxmessentials.vanish.see:
    description: 'See other vanished players (staff-among-staff visibility) and target them with /tp.'
    default: op
  # Layered PremiumVanish-style see/use levels (optional): uxmessentials.vanish.use.level<N> vanishes at level N,
  # uxmessentials.vanish.see.level<N> sees vanished players up to level N. A viewer sees a vanished player iff their
  # see level >= the target's use level; plain .use/.see are level 1, op/wildcard resolve to a high default. The
  # numbered nodes are dynamic and never granted by default; declare them per rank in your permission plugin.
  uxmessentials.vanish.others:
    description: '/vanish <player> to toggle another player''s vanish.'
    default: op
  uxmessentials.vanish.list:
    description: '/vanish list to see the hidden players you are permitted to see (scoped to your see level).'
    default: op
  uxmessentials.vanish.silent:
    description: '/vanish -s to vanish or reappear without the fake join/quit broadcast.'
    default: op
  # Presence settings panel — /presencesettings opens a per-player panel toggling AFK (/afk) and vanish
  # (/vanish). Self-service for every player; the underlying vanish toggle still honours uxmessentials.vanish.use.
  uxmessentials.presencesettings.use:
    description: '/presencesettings opens your personal presence settings panel.'
    default: true
  # The presence entry on the /uxmess gui hub gates on this node so an admin can reach a settings panel for
  # inspection. Admin/manage tier; the player''s own panel is /presencesettings (uxmessentials.presencesettings.use).
  uxmessentials.presence.gui:
    description: 'Show the presence settings panel on the /uxmess gui hub.'
    default: op
  uxmessentials.vanish.persist:
    description: 'Remain vanished across a relog instead of reappearing on join.'
    default: op
  # moderation context (docs/permissions.md "Moderation"). Lightweight per-player mute / jail / tempban; every
  # action is audit-logged and permission-gated. A muted player cannot /msg (messaging gate) and a jailed
  # player cannot /home or /tpa (teleport gate). The exempt node is target-side immunity.
  uxmessentials.moderation.mute:
    description: '/mute <player> [duration] [reason] (/tempmute is the explicit duration alias); /mutehistory <player> reviews a player''s full mute/unmute history.'
    default: op
  uxmessentials.moderation.unmute:
    description: '/unmute <player>.'
    default: op
  uxmessentials.moderation.jail:
    description: '/jail <player> <jail> [duration] [reason]; /jails lists configured jails; /jailedplayers lists who is jailed; /setjail <name> defines a jail at your location; /jail del <name> removes a defined jail.'
    default: op
  uxmessentials.moderation.unjail:
    description: '/unjail <player>.'
    default: op
  uxmessentials.moderation.togglejail:
    description: '/togglejail <player> [jail] [reason] — release the target if jailed, otherwise jail them in the named jail (or the first configured jail).'
    default: op
  uxmessentials.moderation.tempban:
    description: '/tempban <player> <duration> [reason].'
    default: op
  uxmessentials.moderation.ban:
    description: '/ban <player> [reason] and /unban <player> — permanent UUID ban and its lift; /banhistory <player> reviews a player''s full ban/unban history.'
    default: op
  uxmessentials.moderation.banlist:
    description: '/banlist to review the players currently banned.'
    default: op
  uxmessentials.moderation.mutelist:
    description: '/mutelist to review the players currently muted.'
    default: op
  uxmessentials.moderation.history:
    description: '/history <player> — review a player''s full disciplinary record (ban/mute/warn/kick) newest-first.'
    default: op
  uxmessentials.moderation.staffhistory:
    description: '/staffhistory <staff> — review the sanctions a staff member has issued, newest-first.'
    default: op
  uxmessentials.moderation.staffrollback:
    description: '/staffrollback <staff> [limit] — revoke a staff member''s still-active sanctions (un-ban/un-mute/clear-warns the targets they sanctioned).'
    default: op
  uxmessentials.moderation.stats:
    description: '/modstats [staff] [days] — staff punishment analytics: a most-active-staff leaderboard or a single staff member''s breakdown, optionally over the last N days.'
    default: op
  uxmessentials.moderation.templates:
    description: '/punish <player> <template> — apply a configured punishment template (a preset reason + optional duration) as a ban or tempban.'
    default: op
  uxmessentials.moderation.check:
    description: '/checkban <player> and /checkmute <player> — report whether a player is currently banned or muted.'
    default: op
  uxmessentials.moderation.kick:
    description: '/kick <player> [reason]; /kickall [reason] to clear non-exempt players.'
    default: op
  uxmessentials.moderation.warn:
    description: '/warn <player> [reason], /tempwarn <player> <duration> [reason], /warns <player> and /unwarn <player> — issue (standing or timed), review and clear warning history.'
    default: op
  uxmessentials.moderation.sanction:
    description: '/sanction <player> — aggregated read-only punishment summary: current mute, jail, ban state and active warning count.'
    default: op
  uxmessentials.moderation.banip:
    description: '/banip <player|ip> [reason] / /unbanip <ip> — IP ban with stored-IP alt detection.'
    default: op
  uxmessentials.moderation.freeze:
    description: '/freeze <player> / /unfreeze <player> — pin a player in place pending review.'
    default: op
  uxmessentials.moderation.seen:
    description: '/seen, /seenip and /alts <player> — last-seen / last-IP lookup, surfaces alts.'
    default: op
  uxmessentials.moderation.commandspy:
    description: '/commandspy (/cspy) to watch the commands other players run.'
    default: op
  uxmessentials.moderation.lockdown:
    description: '/lockdown [on|off] — refuse every login except holders of the lockdown bypass; the flag survives restart.'
    default: op
  uxmessentials.moderation.lockdown.bypass:
    description: 'Join the server while it is locked down (/lockdown). Held by staff who must stay reachable during a lockdown.'
    default: op
  uxmessentials.moderation.sudo:
    description: '/sudo <player> <command> — run a command as another player.'
    default: op
  uxmessentials.moderation.exempt:
    description: 'Cannot be muted/jailed/tempbanned/kicked/warned/IP-banned/frozen by lower staff.'
    default: op
  # Moderation management GUI — /mod opens the active-punishments list (ban/mute/jail), each drilling into a
  # detail view to revoke (confirm-gated, through the existing unban/unmute/unjail use cases) and to inspect the
  # target's history; the moderation entry on the /uxmess gui hub gates on this node. Admin/manage tier.
  uxmessentials.moderation.gui:
    description: '/mod opens the moderation management GUI (active punishments + per-player history).'
    default: op
  uxmessentials.moderation.broadcast.receive:
    description: 'Receive the staff sanction broadcast — the one-line announcement a non-silent /ban /mute /kick /warn emits. The -s flag (or broadcast.silent-by-default) suppresses it. Duration tiers ride numbered nodes: uxmessentials.moderation.ban.maxduration.<seconds> and uxmessentials.moderation.mute.maxduration.<seconds> cap how long a ban/mute that holder may issue (highest held wins; no node = unlimited).'
    default: op
  # itemworld context (docs/permissions.md "Itemworld"). The largest module — the full item/world command
  # surface (~40 verbs) split into sub-feature groups, each independently disableable from itemworld.conf and
  # each command additionally disableable per-command (modules.itemworld.groups.<group>.enabled and
  # modules.itemworld.commands.<literal>.disabled). Every verb is permission-gated here; the abusable verbs
  # (bulk /give, /spawnmob, /spawner, the /kill /butcher /killall /remove entity-purge family, the /lightning
  # /fireball /kittycannon /antioch /beezooka /break /tree /nuke admin-fun verbs) are audit-logged. Inputs are validated at the
  # adapter boundary.
  # The reload/inspect tier for the module (and its sub-feature groups) is uxmessentials.module.itemworld.
  uxmessentials.module.itemworld:
    description: 'Hot-reload / inspect the itemworld module and its sub-feature groups.'
    default: op
  # /itemworld gui and the itemworld entry on the /uxmess gui hub gate on this node: the utilities launcher of
  # virtual workstations, time/weather actions, and cleanup sweeps. Each launcher button is additionally gated by
  # the permission of the command it stands in for, so a viewer only sees actions they may already run.
  uxmessentials.itemworld.gui:
    description: 'Open the itemworld utilities hub (/itemworld gui and on the /uxmess gui hub).'
    default: op
  # Item utilities sub-feature group.
  uxmessentials.give.use:
    description: '/give <player> <item> [amount] (alias /i) — give an item to a player; bulk gives are audited.'
    default: op
  # Per-type sub-gate for /give: after give.use passes, the resolved material must also be permitted under
  # uxmessentials.itemworld.give.<material> (e.g. uxmessentials.itemworld.give.diamond_sword). The wildcard parent and
  # every per-type node default true, so a give.use holder may give every item until an operator negates a specific
  # one — the per-item give model, opt-out rather than opt-in, so it is non-breaking.
  uxmessentials.itemworld.give.*:
    description: 'Give every item type with /give. Negate uxmessentials.itemworld.give.<material> to restrict one.'
    default: true
  uxmessentials.giveall.use:
    description: '/giveall <item> [amount] — give an item to every online player; bulk gives are audited per recipient.'
    default: op
  uxmessentials.item.use:
    description: '/item <item> [amount] — give an item to yourself.'
    default: op
  uxmessentials.itemname.use:
    description: '/itemname <name> — rename the held item.'
    default: op
  uxmessentials.itemlore.use:
    description: '/itemlore <set|add|clear> [text] — edit the held item''s lore.'
    default: op
  uxmessentials.itemworld.itemedit:
    description: '/itemedit <rename|resetname|lore|enchant|unenchant|flag|attribute|durability|repair|unbreakable|custommodeldata> — edit the held item''s name, lore and meta (item-edit.enabled).'
    default: op
  uxmessentials.itemflag.use:
    description: '/itemflag <flag> <on|off> — toggle an item meta flag.'
    default: op
  uxmessentials.skull.use:
    description: '/skull [player] — get a player-head skull.'
    default: op
  uxmessentials.firework.use:
    description: '/firework <color|clear|power> — style or power the held firework rocket.'
    default: op
  uxmessentials.potion.use:
    description: '/potion <effect> [duration] [amplifier] — add a potion effect to the held potion.'
    default: op
  uxmessentials.book.use:
    description: '/book — unlock a written book for editing.'
    default: op
  uxmessentials.more.use:
    description: '/more — fill the held stack to max (itemworld-owned; playerstate defers it).'
    default: op
  uxmessentials.itemamount.use:
    description: '/itemamount <amount> (/amount) — set the held stack amount, clamped to the give cap.'
    default: op
  uxmessentials.itemdamage.use:
    description: '/itemdamage <damage> (/durability) — set the held item''s durability damage.'
    default: op
  uxmessentials.enchant.use:
    description: '/enchant <enchant> [level] — enchant the held item (level clamped at the boundary).'
    default: op
  # Per-type sub-gate for /enchant: after enchant.use passes, the resolved enchantment must also be permitted under
