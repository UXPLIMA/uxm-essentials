name: uxmEssentials
version: '${version}'
main: com.uxplima.uxmessentials.bootstrap.UxmEssentialsPlugin
bootstrapper: com.uxplima.uxmessentials.bootstrap.UxmEssentialsBootstrap
loader: com.uxplima.uxmessentials.bootstrap.UxmEssentialsLoader
api-version: '1.21'
authors: ['UXPLIMA']
description: 'All-in-one essentials: homes, warps, teleport, DB-backed economy, kits, player-state, private messages + mail, presence, lightweight moderation, item/world utilities — organised as first-class hot-reloadable feature modules with an EssentialsX migration path.'
website: 'https://github.com/UXPLIMA/uxmEssentials'

# Folia: every scheduler call goes through the injected Scheduler port; the
# adapter routes to the right region/entity/global scheduler.
folia-supported: true

# Optional integrations — the plugin runs fully without any of them. LuckPerms
# backs the Permissions port (else the Bukkit-permission default impl, ADR 0005);
# Vault/Treasury are consumed/registered by the EconomyProvider adapters (ADR 0004).
dependencies:
  server:
    LuckPerms:
      load: BEFORE
      required: false
    Treasury:
      load: BEFORE
      required: false
    Vault:
      load: BEFORE
      required: false

# Permission nodes are declared here (the permissions source of truth, docs/permissions.md).
# The per-module tier uxmessentials.module.<name> and the numbered quota nodes are added with
# each feature module; this phase ships only the administration root's nodes.
permissions:
  uxmessentials.admin:
    description: 'Access to the /uxmess administration root.'
    default: op
  uxmessentials.admin.reload:
    description: 'Reload all modules via /uxmess reload.'
    default: op
  # teleport context (docs/permissions.md "Teleport"). Value-bearing tier nodes
  # (uxmessentials.tp.warmup.<seconds>, uxmessentials.tp.cooldown.<seconds>) are an open
  # space granted per instance and are intentionally not enumerated here.
  uxmessentials.tpa.use:
    description: '/tpa, /tpaccept, /tpdeny to request and resolve a teleport.'
    default: true
  uxmessentials.tpahere.use:
    description: '/tpahere to ask a player to come to you.'
    default: true
  uxmessentials.tpa.cancel:
    description: '/tpcancel / /tpacancel to withdraw your outgoing request.'
    default: true
  uxmessentials.tpa.toggle:
    description: '/tptoggle to refuse all incoming teleport requests.'
    default: true
  uxmessentials.tpa.block:
    description: '/tpblock / /tpunblock to block a player''s requests.'
    default: true
  uxmessentials.tpa.all:
    description: '/tpaall to request every online player to teleport to you.'
    default: op
  uxmessentials.back.use:
    description: '/back to return to your last captured location.'
    default: true
  uxmessentials.back.ondeath:
    description: 'Allow /back to return to a death location.'
    default: true
  uxmessentials.rtp.use:
    description: '/rtp random teleport from the pre-warmed safe-location queue.'
    default: true
  uxmessentials.spawn.use:
    description: '/spawn to teleport to the resolved server spawn.'
    default: true
  uxmessentials.spawn.named:
    description: '/spawn <name> to teleport to a named spawn.'
    default: true
  uxmessentials.spawn.set:
    description: '/setspawn to set the server spawn or a named spawn.'
    default: op
  uxmessentials.tp.use:
    description: '/tp and /tphere direct staff teleport.'
    default: op
  uxmessentials.tp.others:
    description: '/tpo and /tpohere to teleport overriding no-tp flags.'
    default: op
  uxmessentials.tp.position:
    description: '/tppos to teleport to raw coordinates.'
    default: op
  uxmessentials.tp.offline:
    description: '/tpoffline / /tpofflinehere to a player''s logout location.'
    default: op
  uxmessentials.tp.vertical:
    description: '/top, /bottom, /jump, /up vertical teleports.'
    default: op
  uxmessentials.tp.all:
    description: '/tpall to pull every online player to you.'
    default: op
  uxmessentials.tp.warmup.bypass:
    description: 'Start teleports with no warmup, immune to move-cancel.'
    default: op
  uxmessentials.tp.cooldown.bypass:
    description: 'Skip the shared teleport cooldown gate.'
    default: op
