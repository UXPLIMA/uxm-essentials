  uxmessentials.condense.use:
    description: '/condense (alias /compact) [all] — recipe-stack inventory items.'
    default: op
  uxmessentials.enderclear.use:
    description: '/enderclear (alias /clearec) [player] — clear an ender chest.'
    default: op
  # Powertool sub-feature group.
  uxmessentials.powertool.use:
    description: '/powertool <command> (alias /pt) — bind a command to the held item.'
    default: op
  uxmessentials.powertool.toggle:
    description: '/powertooltoggle — enable/disable your powertool bindings.'
    default: op
  # Mob & entity sub-feature group. The spawning and purge verbs are audit-logged.
  uxmessentials.spawnmob.use:
    description: '/spawnmob <type> [amount] — spawn mobs (audit-logged).'
    default: op
  # Per-type sub-gate for /spawnmob: after spawnmob.use passes, the resolved mob must also be permitted under
  # uxmessentials.itemworld.spawnmob.<mob> (e.g. uxmessentials.itemworld.spawnmob.zombie). The wildcard parent and
  # every per-type node default true, so a spawnmob.use holder may spawn every mob until an operator negates a specific
