  uxmessentials.communication.broadcasttoggle:
    description: '/broadcasttoggle to stop or resume receiving the rotating server announcements.'
    default: true
  uxmessentials.announce.admin:
    description: '/announce reload|list|preview|toggle to manage the rotating announcer.'
    default: op
  # Info pages auto-register a /<name> command (one node uxmessentials.communication.info.<name> per page). The
  # value space is open — a custom page an operator adds is op-only until its node is granted — so only the three
  # shipped public pages (/info, /rules, /motd) are enumerated here, defaulting to everyone.
  uxmessentials.communication.info.info:
    description: '/info to read the shipped welcome / quick-start info page.'
    default: true
  uxmessentials.communication.info.rules:
    description: '/rules to read the shipped server-rules info page.'
    default: true
  uxmessentials.communication.info.motd:
    description: '/motd to read the shipped message-of-the-day info page.'
    default: true
  uxmessentials.communication.broadcast:
    description: '/broadcast to send a one-off announcement to all online players.'
    default: op
  uxmessentials.communication.broadcastworld:
    description: '/broadcastworld (alias /bcw) to send a one-off announcement only to players in your world.'
    default: op
  uxmessentials.communication.me:
    description: '/me to broadcast a third-person action message to all online players.'
    default: true
  uxmessentials.communication.clearchat:
    description: '/clearchat (alias /chatclear) to flush the chat for online players.'
    default: op
  uxmessentials.communication.clearchat.exempt:
    description: 'Keep your chat scrollback when staff run /clearchat.'
