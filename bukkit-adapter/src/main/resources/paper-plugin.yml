name: uxmEssentials
version: '${version}'
main: com.uxplima.uxmessentials.bootstrap.UxmEssentialsPlugin
bootstrapper: com.uxplima.uxmessentials.bootstrap.UxmEssentialsBootstrap
loader: com.uxplima.uxmessentials.bootstrap.UxmEssentialsLoader
api-version: '1.21'
authors: ['UXPLIMA']
description: 'All-in-one essentials: homes, warps, teleport, DB-backed economy, kits, player-state, private messages + mail, presence, lightweight moderation, item/world utilities — organised as first-class hot-reloadable feature modules with an EssentialsX migration path.'
website: 'https://github.com/UXPLIMA/uxmEssentials'

# Folia: every scheduler call goes through the injected Scheduler port; the
# adapter routes to the right region/entity/global scheduler.
folia-supported: true

# Optional integrations — the plugin runs fully without any of them. LuckPerms
# backs the Permissions port (else the Bukkit-permission default impl, ADR 0005);
# Vault/Treasury are consumed/registered by the EconomyProvider adapters (ADR 0004).
dependencies:
  server:
    LuckPerms:
      load: BEFORE
      required: false
    Treasury:
      load: BEFORE
      required: false
    Vault:
      load: BEFORE
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false
    # NuVotifier/Votifier feeds the vote context; the vote listener is reached reflectively behind a
    # plugin-present guard, so the plugin runs fully without Votifier installed.
    Votifier:
      load: BEFORE
      required: false
    # Dynmap/squaremap back the map-marker integration. Loaded before us so the marker API is ready when
    # we render on enable; reached only past a plugin-present guard, so the plugin runs fully without either.
    dynmap:
      load: BEFORE
      required: false
    squaremap:
      load: BEFORE
      required: false
    # Land-claim plugins back the homes claim-policy integration (homes set/teleport respect claims). Loaded
    # before us so each provider's plugin-present guard sees them on enable; reached only past that guard
    # (typed providers compileOnly, the rest reflective), so the plugin runs fully without any of them.
    Lands:
      load: BEFORE
      required: false
    GriefPrevention:
      load: BEFORE
      required: false
    GriefDefender:
      load: BEFORE
      required: false
    ExcellentClaims:
      load: BEFORE
      required: false
    SimpleClaimSystem:
      load: BEFORE
      required: false
    RClaim:
      load: BEFORE
      required: false
    XClaim:
      load: BEFORE
      required: false
    Homestead:
      load: BEFORE
      required: false
    Towny:
      load: BEFORE
      required: false
    BentoBox:
      load: BEFORE
      required: false
    Residence:
      load: BEFORE
      required: false
    PlotSquared:
      load: BEFORE
      required: false
    SuperiorSkyblock2:
      load: BEFORE
      required: false
    # Menu-engine optional integrations — consumed behind the hooks SPI (shared.adapter.outbound.hooks). Each is
    # reached only past a plugin-present guard, so the menu engine (and the plugin as a whole) runs fully without
    # any of them; the no-op default carries no SDK type, so an absent one never loads an external class. Loaded
    # before us so their head/item registries are ready when a menu renders on enable.
    HeadDatabase:
      load: BEFORE
      required: false
    ItemsAdder:
      load: BEFORE
      required: false
    Oraxen:
      load: BEFORE
      required: false
    Nexo:
      load: BEFORE
      required: false
    MMOItems:
      load: BEFORE
      required: false
    # NBT-API backs the optional raw-NBT item meta (shared.adapter.outbound.hooks NbtApplier). Item meta is
    # built from native Paper data-components first; NBT-API is reached only for the few raw-NBT tags native
    # components cannot express, purely by reflection past a plugin-present guard — so the menu engine runs
    # fully without it and an absent NBT-API loads no class. Loaded before us so the guard sees it on enable.
    NBTAPI:
      load: BEFORE
      required: false
    # Currency back-ends the menu engine can target by spec (shared.adapter.outbound.currency). Vault is already
    # listed above; these three are reached purely by reflection past a plugin-present guard, so the menu engine
    # runs fully without any of them and an absent one loads no class. Loaded before us so the guard sees them on
    # enable. (Exp needs no plugin — it is native Paper experience.)
    PlayerPoints:
      load: BEFORE
      required: false
    CoinsEngine:
      load: BEFORE
      required: false
    zEssentials:
      load: BEFORE
      required: false
    # Integration condition back-ends the menu engine gates on (shared.adapter.inbound.gui.menu.vocab
    # IntegrationConditions). Both are reached purely by reflection past a plugin-present guard — job:<name> against
    # JobsReborn and worldguard-region:<id> against WorldGuard — so the menu engine runs fully without either and an
    # absent one loads no class. Loaded before us so the guard sees them on enable.
    Jobs:
      load: BEFORE
      required: false
    WorldGuard:
      load: BEFORE
      required: false
    # Floodgate backs the Bedrock-form integration (shared.adapter.inbound.gui.menu.bedrock BedrockDetector). The
    # detector binds to the Floodgate SDK only past a plugin-present guard, so the menu engine (and the plugin as a
    # whole) runs fully on a Java-only server — an absent Floodgate never loads an org.geysermc class. Loaded before
    # us so the guard sees it on enable; Cumulus's form classes ride along with Floodgate transitively.
    floodgate:
      load: BEFORE
      required: false

# Permission nodes are declared here (the permissions source of truth, docs/permissions.md).
# The per-module tier uxmessentials.module.<name> and the numbered quota nodes are added with
# each feature module; this phase ships only the administration root's nodes.
permissions:
  uxmessentials.admin:
    description: 'Access to the /uxmess administration root.'
    default: op
  uxmessentials.admin.reload:
    description: 'Reload all modules via /uxmess reload.'
    default: op
  uxmessentials.admin.backup:
    description: '/backup to snapshot the plugin data directory on demand.'
    default: op
  # Management-GUI hub — /uxmess gui opens the central panel listing each module's management GUI. The
  # per-module entries inside gate further on each module's own uxmessentials.<module>.gui node, added
  # with that module's GUI; this base node only gates opening the hub.
  uxmessentials.gui:
    description: '/uxmess gui to open the module management hub.'
    default: op
  # i18n self surface — the per-player /lang locale override (docs/13-i18n §7). Cross-cutting,
  # not owned by a feature context.
  uxmessentials.lang.use:
    description: '/lang to set or clear your personal language override.'
    default: true
  # Cross-cutting command discovery — /help lists the commands the sender can use. Per-line filtering
  # uses each command's own permission, so this base node only gates the listing itself.
  uxmessentials.help:
    description: '/help to list the commands you can use.'
    default: true
  # teleport context (docs/permissions.md "Teleport"). Value-bearing tier nodes
  # (uxmessentials.tp.warmup.<seconds>, uxmessentials.tp.cooldown.<seconds>) are an open
  # space granted per instance and are intentionally not enumerated here.
  uxmessentials.tpa.use:
    description: '/tpa, /tpaccept, /tpdeny to request and resolve a teleport.'
    default: true
  uxmessentials.tpahere.use:
    description: '/tpahere to ask a player to come to you.'
    default: true
  uxmessentials.tpa.cancel:
    description: '/tpcancel / /tpacancel to withdraw your outgoing request.'
    default: true
  uxmessentials.tpa.toggle:
    description: '/tptoggle to refuse all incoming teleport requests.'
    default: true
  uxmessentials.tpa.auto:
    description: '/tpauto to auto-accept incoming teleport requests.'
    default: true
  # Teleport settings panel — /tpsettings opens a per-player panel toggling the same accept-requests
  # (/tptoggle) and auto-accept (/tpauto) flags. Self-service for every player, like the commands it mirrors.
  uxmessentials.tpsettings.use:
    description: '/tpsettings opens your personal teleport settings panel.'
    default: true
  # The teleport entry on the /uxmess gui hub gates on this node so an admin can reach a settings panel for
  # inspection. Admin/manage tier; the player''s own panel is /tpsettings (uxmessentials.tpsettings.use).
  uxmessentials.teleport.gui:
    description: 'Show the teleport settings panel on the /uxmess gui hub.'
    default: op
  uxmessentials.tpa.block:
    description: '/tpblock / /tpunblock to block a player''s requests.'
    default: true
  uxmessentials.tpa.all:
    description: '/tpaall to request every online player to teleport to you.'
    default: op
  uxmessentials.back.use:
    description: '/back to return to your last captured location; /deathback (alias /dback) to return to your last death location.'
    default: true
  uxmessentials.back.ondeath:
    description: 'Allow /back and /deathback to return to a death location.'
    default: true
  uxmessentials.rtp.use:
    description: '/rtp random teleport from the pre-warmed safe-location queue.'
    default: true
  uxmessentials.rtp.biome:
    description: '/rtp biome <biome> to random teleport into a specific biome.'
    default: true
  uxmessentials.rtp.others:
    description: '/rtp <player> to force another online player to random teleport (staff).'
    default: op
  uxmessentials.rtp.gui:
    description: '/rtp gui to open the random-teleport world picker.'
    default: true
  uxmessentials.teleport.settpr:
    description: '/settpr <minRange> <maxRange> to set the /rtp search zone at runtime.'
    default: op
  uxmessentials.spawn.use:
    description: '/spawn to teleport to the resolved server spawn.'
    default: true
  uxmessentials.spawn.named:
    description: '/spawn <name> to teleport to a named spawn.'
    default: true
  uxmessentials.spawn.set:
    description: '/setspawn, /setmainspawn, /removespawn and /mirrorspawn to define and manage spawns.'
    default: op
  uxmessentials.tp.use:
    description: '/tp, /tphere, /goto, /bring and /tprandomplayer (/tprp) direct staff teleport.'
    default: op
  uxmessentials.tp.others:
    description: '/tpo and /tpohere to teleport overriding no-tp flags.'
    default: op
  uxmessentials.tp.position:
    description: '/tppos to teleport to raw coordinates.'
    default: op
  uxmessentials.tp.offline:
    description: '/tpoffline / /tpofflinehere to a player''s logout location.'
    default: op
  uxmessentials.tp.vertical:
    description: '/top, /bottom, /jump, /up, /down, /ascend, /descend, /thru vertical teleports.'
    default: op
  uxmessentials.tp.all:
    description: '/tpall to pull every online player to you.'
    default: op
  uxmessentials.tp.warmup.bypass:
    description: 'Start teleports with no warmup, immune to move-cancel.'
    default: op
  uxmessentials.tp.cooldown.bypass:
    description: 'Skip the shared teleport cooldown gate.'
    default: op
  # homes context (docs/permissions.md "Homes"). The numbered quota node
  # uxmessentials.home.limit.<n> (optional <world> segment) is an open value space granted per
  # instance and is intentionally not enumerated here.
  uxmessentials.home.use:
    description: '/home to open and manage your slot-based home grid.'
    default: true
  uxmessentials.home.icon:
    description: 'Pick a custom GUI icon for one of your homes from the grid.'
    default: true
  uxmessentials.home.admin:
    description: '/homeadmin to manage another player''s homes.'
    default: op
  uxmessentials.home.bypass.unsafe:
    description: 'Skip the unsafe-destination confirm when teleporting to a home via the GUI.'
    default: op
  uxmessentials.home.bypass.cost:
    description: 'Skip the per-action economy cost for home create, relocate, and teleport actions.'
    default: op
  uxmessentials.home.visit:
    description: '/visit to teleport to another player''s public home or one you were invited to.'
    default: true
  uxmessentials.home.invite:
    description: '/invite and /uninvite to grant or revoke another player''s access to one of your homes.'
    default: true
  # warps context (docs/permissions.md "Warps"). The per-warp gate uxmessentials.warp.use.<warp>
  # (optional <world> cooldown tiers, and the operator-granted per-warp nodes) is an open value space
  # granted per warp and is intentionally not enumerated here; only the base nodes are declared.
  uxmessentials.warp.use:
    description: '/warp <name> to teleport to a server warp.'
    default: true
  uxmessentials.warp.others:
    description: '/warp <name> <player> to send another player to a warp.'
    default: op
  uxmessentials.warp.list:
    description: '/warps to list the warps you may use.'
    default: true
  uxmessentials.warp.info:
    description: '/warpinfo <name> to show a warp''s owner, creation time and cost.'
    default: true
  uxmessentials.warp.set:
    description: '/setwarp <name> to create or move a server-wide warp.'
    default: op
  uxmessentials.warp.move:
    description: '/movewarp <name> to move an existing warp to your current location.'
    default: op
  uxmessentials.warp.delete:
    description: '/delwarp <name> to remove a warp.'
    default: op
  uxmessentials.warp.lock:
    description: '/warp lock <name> to lock or unlock a warp against use.'
    default: op
  uxmessentials.warp.password:
    description: '/warp password <name> to set or clear a warp''s access password.'
    default: op
  uxmessentials.warp.edit:
    description: '/warp editor <name> to open the warp editor (cost, gates, effects, welcome message, icon).'
    default: op
  uxmessentials.warp.sign.create:
    description: 'Create a [warp] sign that teleports players to a warp on click.'
    default: op
  uxmessentials.warp.sign.use:
    description: 'Use a [warp] sign to teleport to its warp.'
    default: true
  uxmessentials.warp.bypass.lock:
    description: 'Use a locked warp regardless of its lock state.'
    default: op
  uxmessentials.warp.bypass.password:
    description: 'Use a password-protected warp without entering its password.'
    default: op
  uxmessentials.warp.bypass.safety:
    description: 'Use a warp whose destination fails the safety check.'
    default: op
  # economy context (docs/permissions.md "Economy"). Balances are DB-backed and survive world
  # rollbacks; the native provider registers through the ServicesManager unless a foreign economy
  # (Treasury/Vault) is already present, in which case it defers (ADR 0004). The per-currency value
  # space lives in economy.conf, not as permission nodes.
  uxmessentials.economy.balance:
    description: '/balance [currency] to see your own balance.'
    default: true
  uxmessentials.economy.balance.others:
    description: '/balance <player> [currency] to view another player''s balance.'
    default: op
  uxmessentials.economy.pay:
    description: '/pay <player> <amount> [currency] and /payconfirm to transfer funds.'
    default: true
  uxmessentials.economy.pay.toggle:
    description: '/paytoggle to refuse all incoming /pay transfers.'
    default: true
  uxmessentials.economy.pay.confirm.bypass:
    description: 'Skip the /payconfirm prompt for transfers above the confirm threshold.'
    default: op
  uxmessentials.economy.payall:
    description: '/payall <amount> [currency] — pay every online player from your own wallet.'
    default: op
  uxmessentials.economy.baltop:
    description: '/baltop [currency] [page] to view the top balances.'
    default: true
  uxmessentials.economy.baltop.exempt:
    description: 'Marks the holder as hidden from every /baltop leaderboard.'
    default: false
  uxmessentials.economy.worth:
    description: '/worth [item] to report an item''s configured sell value.'
    default: true
  uxmessentials.economy.sell:
    description: '/sell [amount] to sell held items at their configured worth.'
    default: true
  uxmessentials.economy.setworth:
    description: '/setworth [item] <price>|clear to set or clear an item''s sell worth override.'
    default: op
  uxmessentials.economy.admin:
    description: 'Umbrella for eco-admin mutations (/eco give, take, set).'
    default: op
  uxmessentials.economy.admin.give:
    description: '/eco give <player> <amount> [currency] only.'
    default: op
  uxmessentials.economy.admin.take:
    description: '/eco take <player> <amount> [currency] only.'
    default: op
  uxmessentials.economy.admin.set:
    description: '/eco set <player> <amount> [currency] and /eco reset only.'
    default: op
  uxmessentials.economy.admin.bulk:
    description: '/eco giveall, /eco giverandom, /eco resetall server-wide bulk mutations.'
    default: op
  uxmessentials.economy.bypasscmdcost:
    description: 'Skip the configured per-command economy charge (command-costs in economy.conf).'
    default: op
  # The per-currency gate uxmessentials.economy.currency.<id> is an open value space: a currency
  # with permission-required=true in economy.conf is usable only by holders of its node. It is not
  # enumerated here because the id set is operator-defined.
  # kits context (docs/permissions.md "Kits"). The per-kit gate uxmessentials.kit.<id> and the cooldown
  # tier uxmessentials.kit.cooldown.<seconds> are an open value space granted per kit and are intentionally
  # not enumerated here; only the base nodes are declared. Per-kit permission gating is data-driven in each
  # kit's modules/kits/kits/<id>.conf file, and per-player claim/cooldown state lives in PDC.
  uxmessentials.kit.use:
    description: '/kit <name> to claim a kit and /kit list to list the kits you may claim.'
    default: true
  uxmessentials.kit.preview:
    description: '/kit show <name> to preview a kit''s contents without claiming it.'
    default: true
  uxmessentials.kit.cooldown.bypass:
    description: 'Skip kit cooldowns and re-claim one-time kits.'
    default: op
  uxmessentials.kit.others:
    description: '/kit <name> <player> to give a kit to another player.'
    default: op
  uxmessentials.kit.edit:
    description: '/kit create, /kit del, /kit editor to define, remove and edit kit contents.'
    default: op
  uxmessentials.kit.reset:
    description: '/kit reset <player> [kit] to clear a player''s claim/cooldown stamps.'
    default: op
  # ranks context (docs/permissions.md "Ranks"). Rankup tracks each player's rank with a DB-backed pointer of
  # our own; a rank's rankup actions may set a permission-plugin group, run any command, or nothing at all. The
  # ladder (ranks, order, cost, requirements, actions) is data-driven in modules/ranks/ranks.conf.
  uxmessentials.ranks.rankup:
    description: '/rankup to advance to the next rank when you meet its requirements.'
    default: true
  uxmessentials.ranks.prestige:
    description: '/prestige to reset to the first rank for a prestige level once you reach the top rank.'
    default: true
  uxmessentials.ranks.admin:
    description: '/ranks setrank <player> <rank> to set a player''s rank directly.'
    default: op
  uxmessentials.ranks.gui:
    description: '/ranks to open the ladder panel (config-gated; registered only when the GUI is enabled).'
    default: true
  # playerstate context (docs/permissions.md "Playerstate"). Toggle/effect verbs over an immutable
  # PlayerStateSnapshot reconciled on the owning region thread. Each verb has its own base node; the single
  # uxmessentials.playerstate.others node gates the [player] target form of every self/other command.
  # /repair, /repairall, /hat and /more are owned by the itemworld context and are declared there, not here.
  uxmessentials.god.use:
    description: '/god [player] to toggle damage immunity.'
    default: op
  uxmessentials.fly.use:
    description: '/fly [player] to toggle flight.'
    default: op
  uxmessentials.heal.use:
    description: '/heal [player] to restore health.'
    default: op
  uxmessentials.feed.use:
    description: '/feed [player] to restore hunger.'
    default: op
  uxmessentials.foodlevel.use:
    description: '/foodlevel <amount> [player] to set a player''s food level.'
    default: op
  uxmessentials.health.use:
    description: '/health <amount> [player] to set a player''s health.'
    default: op
  uxmessentials.gamemode.use:
    description: '/gamemode <mode> [player] and the /gmc /gms /gma /gmsp aliases.'
    default: op
  uxmessentials.speed.use:
    description: '/speed, /walkspeed and /flyspeed to set walk/fly speed.'
    default: op
  uxmessentials.extinguish.use:
    description: '/ext (/extinguish) [player] to put out a burning player.'
    default: op
  uxmessentials.clearinventory.use:
    description: '/clearinventory (/ci /clear) [player] to empty a player''s inventory.'
    default: op
  uxmessentials.clearinventory.confirmtoggle:
    description: '/clearinventoryconfirmtoggle (/citoggle) to require a confirmation before /clearinventory clears your own inventory.'
    default: true
  uxmessentials.invsee.use:
    description: '/invsee [player] to view a player''s inventory.'
    default: op
  uxmessentials.invsee.modify:
    description: 'Edit a player''s inventory through the /invsee menu (without this it is view-only).'
    default: op
  uxmessentials.endersee.use:
    description: '/endersee [player] to view a player''s ender chest.'
    default: op
  uxmessentials.suicide.use:
    description: '/suicide to kill yourself.'
    default: true
  uxmessentials.near.use:
    description: '/near [radius] to list nearby players.'
    default: op
  uxmessentials.nightvision.use:
    description: '/nightvision (/nv) to toggle a night-vision effect on yourself.'
    default: op
  uxmessentials.glow.use:
    description: '/glow to toggle a glowing outline on yourself.'
    default: op
  uxmessentials.ptime.use:
    description: '/ptime <value|reset> to set a per-player client-side time.'
    default: op
  uxmessentials.pweather.use:
    description: '/pweather <clear|rain|reset> to set a per-player client-side weather.'
    default: op
  uxmessentials.exp.use:
    description: '/exp (/xp) get|set|give|take|reset to read or change experience.'
    default: op
  uxmessentials.air.use:
    description: '/air <seconds> to set a player''s remaining air.'
    default: op
  uxmessentials.burn.use:
    description: '/burn <seconds> to set a player on fire.'
    default: op
  uxmessentials.ice.use:
    description: '/ice [player] [seconds] to freeze a player (inverse of /burn).'
    default: op
  uxmessentials.getpos.use:
    description: '/getpos (/coords /whereami) to show a player''s coordinates.'
    default: op
  uxmessentials.depth.use:
    description: '/depth to show your height relative to sea level.'
    default: true
  uxmessentials.biome.use:
    description: '/biome to show the biome you are standing in.'
    default: true
  uxmessentials.seed.use:
    description: '/seed to show the seed of the world you are standing in.'
    default: true
  uxmessentials.compass.use:
    description: '/compass to show the direction you are facing.'
    default: true
  uxmessentials.world.use:
    description: '/world to show the world you are standing in.'
    default: true
  uxmessentials.world.spawn:
    description: '/worlds spawn to teleport to a world''s spawn (subject to per-world access rules).'
    default: true
  uxmessentials.dimension.use:
    description: '/dimension to show the dimension you are standing in.'
    default: true
  uxmessentials.ping.use:
    description: '/ping to show a player''s round-trip latency.'
    default: true
  uxmessentials.playtime.use:
    description: '/playtime [player] to show a player''s playtime breakdown (active/afk, today/week/month/all-time).'
    default: op
  uxmessentials.playtime.reset:
    description: '/playtime reset [player] to wipe a player''s tracked playtime (resetting others also needs uxmessentials.playerstate.others).'
    default: op
  uxmessentials.rest.use:
    description: '/rest to reset a player''s time-since-rest so phantoms stop.'
    default: op
  uxmessentials.playerstate.others:
    description: 'Use any playerstate command with a [player] target other than yourself.'
    default: op
  # messaging context (docs/permissions.md "Messaging"). Direct PM + persistent mail only (no public
  # chat — out of charter). Delivery is ignore-aware, mute-gated (the moderation context gates outbound
  # messaging), and reply-TTL bounded; a vanished target is hidden from /msg resolution (presence context).
  uxmessentials.msg.use:
    description: '/msg <player> <text> to send a private message.'
    default: true
  uxmessentials.msg.reply:
    description: '/reply <text> to answer your last conversation (reply-TTL bounded).'
    default: true
  uxmessentials.msg.toggle:
    description: '/msgtoggle to refuse incoming /msg / /reply; /rtoggle to refuse only incoming /reply routing (mail still delivers).'
    default: true
  uxmessentials.msg.ignore:
    description: '/ignore <player> / /unignore <player> / /ignorelist to manage and view your own ignore list.'
    default: true
  uxmessentials.mail.use:
    description: '/mail read / /mail send <player> <text> / /mail clear (/mailclear) — persistent offline mail.'
    default: true
  uxmessentials.mail.sendall:
    description: '/mail sendall <text> to broadcast mail to every online player (staff).'
    default: op
  uxmessentials.helpop.use:
    description: '/helpop <text> to open a player-to-staff support request.'
    default: true
  uxmessentials.helpop.receive:
    description: 'Receive /helpop requests (staff side).'
    default: op
  uxmessentials.msg.color:
    description: 'Render MiniMessage tags in PM/mail bodies (default plain text).'
    default: op
  uxmessentials.msg.socialspy:
    description: '/socialspy to observe other players'' private messages (staff).'
    default: op
  uxmessentials.msg.bypass.ignore:
    description: 'Reach a player who has ignored you (staff).'
    default: op
  uxmessentials.msgsettings.use:
    description: '/msgsettings opens your personal messaging settings panel (accept-messages, social spy).'
    default: true
  uxmessentials.messaging.gui:
    description: 'See and open the messaging settings panel and mailbox on the /uxmess gui management hub.'
    default: op
  # presence context (docs/permissions.md "Presence"). AFK is auto (idle sweep) + manual (/afk); vanish is
  # staff-only and is honoured by /list, tab, messaging /msg resolution and teleport /tpa visibility through
  # the canSee graph the presence VisibilityApplier drives.
  uxmessentials.afk.use:
