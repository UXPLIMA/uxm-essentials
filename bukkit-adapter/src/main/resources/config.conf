# uxmEssentials — main configuration (globals + a map of where everything lives).
#
# Written on first run, never overwritten. Per-module settings live in modules/<module>/config.conf;
# this file holds only storage + locale. Apply changes with /uxmess reload <module> or a restart.
#
# Where things live:
#   storage / locale ........... this file
#   teleport, /rtp ............. modules/teleport/{config,rtp}.conf
#   homes ...................... modules/homes/config.conf
#   warps ..................... modules/warps/config.conf
#   economy, currencies ....... modules/economy/{config,currencies}.conf
#   kits ...................... modules/kits/config.conf
#   playerstate ............... modules/playerstate/config.conf
#   messaging ................. modules/messaging/config.conf
#   presence .................. modules/presence/config.conf
#   moderation ................ modules/moderation/config.conf
#   itemworld ................. modules/itemworld/config.conf
#   vaults .................... modules/vaults/config.conf
#   communication ............. modules/communication/config.conf
#   EssentialsX importer ...... modules/migration/config.conf
#   claim-plugin integration .. this file (the claims block)
#   player-facing text ........ messages/messages_<lang>.conf
#   command names / aliases ... commands/commands.conf

storage {
  backend = "sqlite"            # sqlite | mysql | postgres
  file = "uxmessentials.db"     # SQLite only: the database file name under this folder
  host = "localhost"
  port = 3306                   # default 3306 for mysql, 5432 for postgres
  database = "uxmessentials"
  username = "uxmessentials"
  password = ""
  read-pool-size = 8            # network backends only; SQLite is fixed single-writer
  connection-timeout-ms = 5000
}

messages {
  default-locale = "en"         # locale for players whose client locale has no catalog and who set none with /lang
}

# Cross-server sync. Off by default — a single-server install needs none of this and runs purely local.
# Enable it to keep homes, warps, economy, vaults and the rest in step across a network of backends.
network {
  enabled = false               # opt every backend into the shared bus
  server-id = "server-1"        # MUST be unique per backend; two backends sharing it corrupt sync routing
  bus-channel = "uxmessentials:bus_v1"   # plugin-messaging channel; must match the proxy broker — leave as-is
  heartbeat-seconds = 30        # how often this backend announces its presence; feeds the /uxmess doctor peer count
  transport = "velocity"        # how the bus is carried: velocity | redis | both
                                #   velocity = plugin messages through a Velocity proxy (no extra service)
                                #   redis    = Redis pub/sub, no proxy needed (every backend shares one Redis)
                                #   both     = fan out over both carriers for a mixed network

  # Redis connection for transport = redis | both. The single source of Redis config for the whole plugin.
  redis {
    host = "127.0.0.1"
    port = 6379
    password = ""               # leave empty to skip AUTH
    channel = "uxmessentials:bus"   # pub/sub channel every backend publishes to and subscribes on
    db = 0                      # logical database index
  }
}

# Native 1.21+ pause-menu server links. Each entry is either a built-in `type` or a custom `label`, plus a `url`.
# Built-in types: REPORT_BUG, COMMUNITY_GUIDELINES, SUPPORT, STATUS, FEEDBACK, COMMUNITY, WEBSITE, FORUMS, NEWS,
# ANNOUNCEMENTS. A malformed or empty entry is skipped with a warning. An empty list leaves the links untouched.
server-links = [
  # { type = "WEBSITE", url = "https://example.com" }
  # { label = "Discord", url = "https://discord.gg/xxxx" }
]

# Optional update checker. Off by default because it makes an outbound network call — opt in explicitly.
update-check {
  enabled = false                       # set true to check for newer releases
  source-url = "https://api.github.com/repos/UXPLIMA/uxmEssentials/releases/latest"  # JSON with a "tag_name"
  notify-ops-on-join = true             # show operators a notice on join when a newer version exists
  interval-hours = 12                   # re-check cadence; 0 = check once on enable only
}

# Land-claim integration. homes, teleport (/rtp) and poses respect the claims of whichever supported claim
# plugin is installed — uxmClaims, Lands, GriefPrevention, GriefDefender, ExcellentClaims, SimpleClaimSystem,
# RClaim, XClaim, Homestead, WorldGuard, Towny, BentoBox, Residence, PlotSquared, SuperiorSkyblock2. Every installed one is consulted at once; a
# present plugin is used unless you turn it off here. With none installed this does nothing and everything is
# allowed. WorldGuard counts land as claimed when a region you own or are a member of covers it — the world-wide
# __global__ region never counts, so wilderness stays free. Towny counts a town plot as claimed: you own a plot
# you personally own, or your town's communal plots if you are its mayor, and town residents count as trusted.
# BentoBox counts an island as claimed: you own the island you own, and island members count as trusted.
# Residence counts a residence as claimed: you own the residence whose owner name is yours, and anyone the
# residence grants the build flag counts as trusted. PlotSquared counts an owned plot as claimed: you own the
# plot you own, and anyone added to it counts as trusted. SuperiorSkyblock2 counts an island as claimed: you own
# the island you lead, and island members count as trusted.
claims {
  # Per-plugin switches. Each defaults on, so you only need a line to turn one OFF. Keys are the plugin names
  # lower-cased, e.g. lands, griefprevention, worldguard. Every supported provider is listed below so its key
  # is discoverable; uncomment a line to stop consulting that plugin.
  providers {
    # uxmClaims (our own claim plugin, detected without a load-order dependency):
    # uxmclaims = false
    # Region / claim-block plugins:
    # lands = false
    # griefprevention = false
    # griefdefender = false
    # excellentclaims = false
    # simpleclaimsystem = false
    # rclaim = false
    # xclaim = false
    # homestead = false
    # worldguard = false
    # towny = false
    # kingdoms = false            # KingdomsX (plugin name "Kingdoms")
    # huskclaims = false
    # husktowns = false
    # factions = false            # FactionsUUID or SaberFactions (both register as "Factions")
    # Island / plot plugins:
    # bentobox = false
    # residence = false
    # plotsquared = false
    # superiorskyblock = false
  }

  # How overlapping claims from several plugins are folded into one trust/ownership answer:
  #   any-land = trusted/owner if ANY covering claim says so (most permissive)
  #   all-land = trusted/owner only if EVERY covering claim says so (strictest)
  # A ban in any covering claim always wins regardless of this setting.
  combine = "any-land"
}

# Web-map markers for Dynmap, squaremap or BlueMap. Renders warps and spawns as live markers on whichever
# supported map plugin is installed; with none installed this does nothing. Markers refresh on enable/reload
# and update live as warps are set/removed.
map-markers {
  enabled = true
  warps  = true
  spawns = true
  homes  = false                 # privacy: per-player homes on a public map are opt-in (live-updates only)
  layer-name = "uxmEssentials"
  warp-icon = "portal"           # dynmap icon id / squaremap icon key (BlueMap addresses icons by asset URL,
                                 # so it renders its own default marker instead)
  spawn-icon = "world"
  home-icon = "house"
  tooltip = "<name>"             # marker label/tooltip template; <name> expands to the warp/spawn name
}
