# uxmEssentials — main configuration.
#
# This file is written on first run and never overwritten afterwards, so your edits survive restarts
# and upgrades. Every value below is the plugin's built-in default: leaving the file untouched keeps the
# default behaviour exactly. Delete a key to fall back to its default; delete the whole file to regenerate
# it. Apply changes in-game with /uxmess reload <module> (or restart). Player-facing text lives in
# config/messages/messages_<lang>.conf; the join/quit/announcer/rules content lives in communication.conf.

# --- Storage --------------------------------------------------------------------------------------------
# The default is an embedded SQLite file that needs no setup. Switch backend to "mysql" or "postgres" for a
# networked database (homes, warps, economy, vaults and moderation data are shared across servers that point
# at the same database). The host/port/database/username/password keys apply only to the network backends.
storage {
  backend = "sqlite"            # sqlite | mysql | postgres
  file = "uxmessentials.db"     # SQLite only: the database file name under this folder

  host = "localhost"
  port = 3306                   # default 3306 for mysql, 5432 for postgres
  database = "uxmessentials"
  username = "uxmessentials"
  password = ""

  read-pool-size = 8            # network backends only; SQLite is fixed single-writer
  connection-timeout-ms = 5000
}

# --- Localisation ---------------------------------------------------------------------------------------
messages {
  # Locale used for players whose client locale has no catalog and who have set none with /lang.
  default-locale = "en"
}

# --- Feature modules ------------------------------------------------------------------------------------
# Each block is a bounded context. enabled = false makes that module wire nothing: no commands, listeners,
# database tables or runtime state. The per-module settings beneath enabled are the tunables for that
# context; all are shown at their default value.
modules {

  teleport {
    enabled = true
    cooldown-start-phase = "teleport"   # when the cooldown clock starts: request | accept | teleport
    request-ttl-seconds = 60            # how long a /tpa request stays pending
    single-request-displace = true      # a new request replaces a pending one instead of queueing
    default-warmup = 3                  # seconds, when the player holds no uxmessentials.teleport.warmup.<n>
    default-cooldown = 5                # seconds, when the player holds no uxmessentials.teleport.cooldown.<n>
    teleport-to-center = true           # snap the destination to the block centre

    warmup {
      cancel-on-move = true
      cancel-on-rotate = false
      cancel-on-damage = false
      cancel-on-interact = false
      move-threshold = 0.0              # blocks of movement tolerated before a warmup cancels
    }

    back {
      on-death = true                   # /back may return to a death location
      ignored-causes = ["ender_pearl", "chorus_fruit"]   # causes that never overwrite the /back point
    }

    rtp {
      min-radius = 100                  # inner ring candidates must clear
      max-radius = 5000                 # outer search radius
      claim-aware = true                # avoid landing on claimed land
      queue-target-size = 10            # pre-validated locations kept ready per world
      queue-low-water = 5               # refill fires when the queue drops below this
      attempt-budget = 32               # candidate validations one refill cycle runs
      excluded-biomes = ["ocean", "deep_ocean", "river"]
      avoid-blocks = ["lava", "magma_block", "fire", "cactus"]
      # min-y = 0                       # uncomment to clamp the landing Y range (default: full world height)
      # max-y = 256
      # fallback-world.world_nether = "world"   # redirect /rtp out of a world that has no queue
    }

    # respawn.chain.<world> orders the spawn search on death, e.g.
    # respawn { chain { world_nether = ["world", "world_the_end"] } }
  }

  homes {
    enabled = true
    default-limit = 3                   # homes per player without a uxmessentials.home.limit.<n> node
  }

  warps {
    enabled = true
  }

  economy {
    enabled = true
    amount-format = "full"              # full (grouped digits) | compact (1.2k style)

    wallet {
      default-currency = "coins"        # id of the currency used when a command names none
      starting-balance = "0"            # fallback applied per currency below
      min-balance = "0"
      max-balance = "1000000000000"
    }

    # Define one block per currency. The default currency must appear here. A per-currency value falls back
    # to the matching wallet.* / pay.* value above when omitted.
    currencies {
      coins {
        symbol = "$"
        plural = "coins"
        format = "#,##0.00"             # Java DecimalFormat pattern
        precision = 2
        starting = "0"
        min-balance = "0"
        max-balance = "1000000000000"
        min-pay = "0.01"
        # confirm-threshold = "10000"   # prompt for confirmation at or above this amount
      }
    }

    pay {
      min-pay = "0.01"
      confirm-threshold = ""            # empty disables the /pay confirmation prompt
      confirm-timeout-ms = 30000        # how long a pending /pay confirmation stays valid
      toggle-default = true             # new players accept incoming payments by default
    }

    baltop {
      page-size = 10
      cache-ttl-ms = 60000              # how often the /baltop snapshot is refreshed
      snapshot-capacity = 100           # rows retained per currency snapshot
      exempt-permission = "uxmessentials.economy.baltop.exempt"
    }

    provider {
      register = true                   # register the native economy with Vault/Treasury via ServicesManager
      priority = "Normal"               # Lowest | Low | Normal | High | Highest
    }

    persistence {
      write-debounce-ms = 250           # coalesce rapid balance writes
      batch-flush-ms = 1000             # transaction-telemetry flush interval
    }
  }

  kits {
    enabled = true
    # Kit definitions live in kits.conf.
  }

  playerstate {
    enabled = true
    heal-remove-effects = false         # /heal also clears active potion effects
    rest-enabled = true                 # /rest resets phantom-spawn pressure
  }

  messaging {
    enabled = true
    reply-ttl-seconds = 300             # window in which /r still resolves to the last partner
    mail-retention-days = 30            # age at which the sweep deletes mail
    mail-sweep-minutes = 30             # how often the mail-expiry sweep runs
  }

  presence {
    enabled = true
    afk-idle-threshold-seconds = 300    # idle time before a player is auto-marked AFK
    afk-sweep-seconds = 15              # how often the auto-AFK sweep runs

    anti-afk {
      move-threshold-blocks = 0.0       # horizontal distance that counts as a MOVE rather than a ROTATE
      disable-pickup-while-afk = false  # cancel item pickups for AFK players
      sleep-ignores-afk = false         # exclude AFK/vanished players from the sleep percentage
      ignored-activity = []             # any of: move, rotate, chat, command, interact, fish
    }
  }

  moderation {
    enabled = true
    jails = []                          # names of defined jails, e.g. ["spawnjail"]
    jail-countdown = "online-only"      # online-only (counts only while online) | wall-clock
    muted-blocked-commands = ["me", "msg", "tell", "w", "whisper", "mail", "helpop", "r", "reply"]

    # Define each jail named in "jails" above, e.g.
    # jail {
    #   spawnjail {
    #     world = "world"
    #     x = 0.0
    #     y = 64.0
    #     z = 0.0
    #     countdown = "online-only"     # optional per-jail override of jail-countdown
    #   }
    # }
  }

  itemworld {
    enabled = true
    give-cap = 2304                     # max items handed out by /give or /item at once
    more-cap = 2304                     # max stack fill for /more (defaults to give-cap)
    max-enchant-level = 32767           # ceiling for /enchant
    spawnmob-cap = 64                   # max mobs per /spawnmob
    purge-max-radius = 256              # max radius for /butcher, /killall, /remove
    give-audit-threshold = 64           # audit-log /give above this amount

    # Sub-feature groups; disable a group to drop just its commands.
    groups {
      item-utils.enabled = true
      workstations.enabled = true
      cleanup.enabled = true
      powertool.enabled = true
      mob-entity.enabled = true
      time-weather.enabled = true
      admin-fun.enabled = true
    }

    # Audit-log toggles per sensitive command.
    audit {
      give = true
      spawnmob = true
      spawner = true
      kill = true
      butcher = true
      killall = true
      remove = true
      lightning = true
      fireball = true
      kittycannon = true
    }
  }

  vaults {
    enabled = true
    default-amount = 1                  # vaults per player without a uxmessentials.vault.amount.<n> node
    default-size = 6                    # rows per vault (1-6) without a uxmessentials.vault.size.<n> node
  }

  # The communication module (join/quit/death messages, announcer, /rules, /motd) ships disabled. Its
  # content lives in communication.conf; set enabled = true after editing that file to take it over.
  communication {
    enabled = false
  }

  # The EssentialsX importer is a one-shot admin tool, off until you run /uxmess import essentialsx.
  migration {
    enabled = false
  }
}
