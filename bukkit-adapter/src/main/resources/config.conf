# uxmEssentials — main configuration (globals + a map of where everything lives).
#
# Written on first run, never overwritten. Per-module settings live in modules/<module>/config.conf;
# this file holds only storage + locale. Apply changes with /uxmess reload <module> or a restart.
#
# Where things live:
#   storage / locale ........... this file
#   teleport, /rtp ............. modules/teleport/{config,rtp}.conf
#   homes ...................... modules/homes/config.conf
#   warps ..................... modules/warps/config.conf
#   economy, currencies ....... modules/economy/{config,currencies}.conf
#   kits ...................... modules/kits/config.conf
#   playerstate ............... modules/playerstate/config.conf
#   messaging ................. modules/messaging/config.conf
#   presence .................. modules/presence/config.conf
#   moderation ................ modules/moderation/config.conf
#   itemworld ................. modules/itemworld/config.conf
#   vaults .................... modules/vaults/config.conf
#   communication ............. modules/communication/config.conf
#   EssentialsX importer ...... modules/migration/config.conf
#   player-facing text ........ messages/messages_<lang>.conf
#   command names / aliases ... commands/commands.conf

storage {
  backend = "sqlite"            # sqlite | mysql | postgres
  file = "uxmessentials.db"     # SQLite only: the database file name under this folder
  host = "localhost"
  port = 3306                   # default 3306 for mysql, 5432 for postgres
  database = "uxmessentials"
  username = "uxmessentials"
  password = ""
  read-pool-size = 8            # network backends only; SQLite is fixed single-writer
  connection-timeout-ms = 5000
}

messages {
  default-locale = "en"         # locale for players whose client locale has no catalog and who set none with /lang
}

# Native 1.21+ pause-menu server links. Each entry is either a built-in `type` or a custom `label`, plus a `url`.
# Built-in types: REPORT_BUG, COMMUNITY_GUIDELINES, SUPPORT, STATUS, FEEDBACK, COMMUNITY, WEBSITE, FORUMS, NEWS,
# ANNOUNCEMENTS. A malformed or empty entry is skipped with a warning. An empty list leaves the links untouched.
server-links = [
  # { type = "WEBSITE", url = "https://example.com" }
  # { label = "Discord", url = "https://discord.gg/xxxx" }
]

# Optional update checker. Off by default because it makes an outbound network call — opt in explicitly.
update-check {
  enabled = false                       # set true to check for newer releases
  source-url = "https://api.github.com/repos/UXPLIMA/uxmEssentials/releases/latest"  # JSON with a "tag_name"
  notify-ops-on-join = true             # show operators a notice on join when a newer version exists
  interval-hours = 12                   # re-check cadence; 0 = check once on enable only
}

# Web-map markers for Dynmap / squaremap. Renders warps and spawns as live markers on whichever supported
# map plugin is installed; with neither installed this does nothing. Markers refresh on enable/reload and
# update live as warps are set/removed.
map-markers {
  enabled = true
  warps  = true
  spawns = true
  homes  = false                 # privacy: per-player homes on a public map are opt-in (live-updates only)
  layer-name = "uxmEssentials"
  warp-icon = "portal"           # dynmap icon id / squaremap icon key
  spawn-icon = "world"
  home-icon = "house"
  tooltip = "<name>"             # marker label/tooltip template; <name> expands to the warp/spawn name
}
