# Villagers — villager trade management. Phase 1 covers the trade-availability mechanics: never-locking trades,
# a restock timer that replaces the vanilla work-station cycle, immediate restock of a used trade, and a switch that
# refuses trading altogether.
#
# The module ships ENABLED but every feature below ships OFF, so a fresh install changes nothing about villagers until
# you turn a feature on. Turn the whole module off with enabled = false.
enabled = true

# Infinite trading: a villager's trades never lock out from use. On every trade the plugin resets the villager's
# recipe uses and stops the trade from counting toward its limit, so no trade ever greys out. A convenience that
# changes vanilla gameplay, so it ships off.
infinite-trading {
  enabled = false
}

# Restock timer: instead of relying on the vanilla work-station cycle, a scheduled sweep restocks a villager's trades
# once its last restock is older than interval-seconds. Only loaded villagers are swept. interval-seconds is clamped
# to at least one.
restock {
  enabled = false
  interval-seconds = 600
}

# Instant restock: the trade a player just used restocks immediately, with no cooldown. Composes with the restock
# timer — the used trade is available again at once regardless of the timer.
instant-restock {
  enabled = false
}

# Disable trades: with enabled = true, every villager refuses to open its trade GUI (the right-click is cancelled and
# the player is told). The Phase-2 trade manager can also disable an individual villager, which is honoured even while
# this global switch is off.
disable-trades {
  enabled = false
}
