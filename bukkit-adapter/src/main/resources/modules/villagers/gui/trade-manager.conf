# The /villager manager window: a villager's trades laid out one per row, for staff to edit.
#
# The chrome lives here: the backdrop, the arrow between the buy and sell columns, each row's remove button, the
# trading toggle and the help item, while the buy/sell stacks themselves are handed to the villagers code through
# the content {} region below, because those slots hold real stacks and the rules that stop an item being
# duplicated belong with the feature.
#
# The region's slot order is what maps a slot to a place in the trade set, so it is NOT free-form: the slots come in
# threes, one row per trade, in the order buy-A, buy-B, sell. Five threes is five editable trades; a villager with
# more keeps the rest untouched behind the window. Move the whole thing around if you like, but keep the triples in
# that order and keep the count a multiple of three.
title = "%villagers_manager_title%"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

content {
  "villagers:trades" {
    slots    = ["0-1", "3", "9-10", "12", "18-19", "21", "27-28", "30", "36-37", "39"]
    editable = true
  }
}

items {
  # The backdrop: everything the trades, the arrows, the remove buttons and the control row do not claim.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # Points from each row's buy pair to its sell slot. Decorative; clicking it does nothing.
  arrow {
    slots    = ["2", "11", "20", "29", "38"]
    material = ARROW
    name     = ""
    priority = 10
  }

  # One per trade: clears that trade's three item slots, dropping it when the window closes. There is one
  # villagers:remove-N action for each triple the region declares, numbered from 1 in region order, so a button
  # moved elsewhere in the window is renumbered here rather than guessed from where it sits.
  remove-1 {
    slot     = 8
    material = REDSTONE_BLOCK
    name     = "@villagers.manager.remove"
    priority = 10
    click { any = ["villagers:remove-1"] }
  }

  remove-2 {
    slot     = 17
    material = REDSTONE_BLOCK
    name     = "@villagers.manager.remove"
    priority = 10
    click { any = ["villagers:remove-2"] }
  }

  remove-3 {
    slot     = 26
    material = REDSTONE_BLOCK
    name     = "@villagers.manager.remove"
    priority = 10
    click { any = ["villagers:remove-3"] }
  }

  remove-4 {
    slot     = 35
    material = REDSTONE_BLOCK
    name     = "@villagers.manager.remove"
    priority = 10
    click { any = ["villagers:remove-4"] }
  }

  remove-5 {
    slot     = 44
    material = REDSTONE_BLOCK
    name     = "@villagers.manager.remove"
    priority = 10
    click { any = ["villagers:remove-5"] }
  }

  # The trading toggle, in its two states. Clicking either flips the villager's disable flag and redraws the button.
  trading-enabled {
    slot     = 45
    material = EMERALD
    name     = "@villagers.manager.trading-enabled"
    priority = 10
    view     = ["villagers:trading-enabled"]
    click { any = ["villagers:toggle-trading"] }
  }

  trading-disabled {
    slot     = 45
    material = BARRIER
    name     = "@villagers.manager.trading-disabled"
    priority = 20
    view     = ["villagers:trading-disabled"]
    click { any = ["villagers:toggle-trading"] }
  }

  help {
    slot     = 53
    material = BOOK
    name     = "@villagers.manager.help"
    priority = 10
  }
}
