# Survival — opt-in gameplay mechanics. Each mechanic is an independent switch, and the ones with a personal
# /command toggle default to on for every player. Auto-sell is the one exception: its personal toggle defaults OFF,
# so a player only auto-sells their drops once they run /autosell.
#
# The module ships ENABLED. Turn the whole feature off with enabled = false, or leave it on and switch individual
# mechanics off under their own blocks below.
enabled = true

# Tree-feller: break one log of a tree and the whole connected trunk of the same wood comes down with it, up to
# max-blocks. Players toggle it for themselves with /treefeller (default on).
tree-feller {
  enabled = true

  # Require an axe in hand to fell. With this off, breaking a log by any means fells the tree.
  require-axe = true

  # Drain the axe's durability as the tree comes down.
  durability-drain = true

  # Durability points spent per extra log felled (the log you broke by hand is not counted). 1 mirrors mining each
  # log normally; raise it to make felling wear the axe faster.
  durability-multiplier = 1

  # The most logs a single fell brings down, counting the one you broke. A safety cap so an enormous custom tree
  # cannot lag the server.
  max-blocks = 64

  # Food exhaustion added per extra log felled (0 disables the hunger cost). 0.0 by default so felling costs no more
  # hunger than mining the logs by hand would.
  hunger-cost = 0.0

  # Require the player to be sneaking to fell. This doubles as the "shift to fell" switch: with it on, a normal
  # break chops a single log and a shift-break fells the tree; with it off (the default) any log break fells.
  sneak-required = false

  # Replant a matching sapling at the base after felling, when the block below is soil. Nothing is replanted for a
  # species without a plantable sapling (the nether stems).
  replant-saplings = true
}

# Veinminer: break one of the listed blocks and the whole connected vein of that same material breaks with it, up to
# max-blocks. Players toggle it for themselves with /veinminer (default on).
veinminer {
  enabled = true

  # The blocks a vein-break triggers on. A break of any of these mines the connected run of the same block. Use the
  # Bukkit material names; unknown names are skipped with a warning at startup.
  blocks = [
    "COAL_ORE", "DEEPSLATE_COAL_ORE",
    "IRON_ORE", "DEEPSLATE_IRON_ORE",
    "COPPER_ORE", "DEEPSLATE_COPPER_ORE",
    "GOLD_ORE", "DEEPSLATE_GOLD_ORE",
    "REDSTONE_ORE", "DEEPSLATE_REDSTONE_ORE",
    "LAPIS_ORE", "DEEPSLATE_LAPIS_ORE",
    "DIAMOND_ORE", "DEEPSLATE_DIAMOND_ORE",
    "EMERALD_ORE", "DEEPSLATE_EMERALD_ORE",
    "NETHER_GOLD_ORE", "NETHER_QUARTZ_ORE",
    "ANCIENT_DEBRIS"
  ]

  # The most blocks a single vein-break mines, counting the one you broke. A safety cap for very large veins.
  max-blocks = 64

  # Drain the mining tool's durability as the vein breaks.
  tool-durability = true

  # Food exhaustion added per extra block mined (0 disables the hunger cost).
  hunger-cost = 0.0

  # Require the player to be sneaking to vein. The "shift to vein" switch: with it on (the default) a plain break
  # takes a single ore and a shift-break takes the vein; with it off any break of a listed block veins it.
  sneak-required = true
}

# Fast-leaf-decay: when a log is broken, the leaves it was holding up decay right away instead of lingering for
# vanilla's slow random-tick sweep. Only leaves that a standing trunk no longer supports come down, and
# player-placed (persistent) leaves are never touched.
leaf-decay {
  enabled = true

  # How far from the broken log to look for leaves to decay, as the half-width of a cube. Larger values clear a
  # bigger canopy but cost more to sweep; keep it modest.
  radius = 4

  # Ticks to wait after the log breaks before decaying the leaves (20 ticks = 1 second). A small delay lets the
  # cascade read as a gentle ripple rather than the whole canopy vanishing at once.
  delay-ticks = 4
}

# Farmland protection: a personal /farmprotect toggle (default on) that stops the player trampling farmland into
# dirt, whether by stepping on it or landing on it from a fall. Other players and mobs are unaffected.
farmprotect {
  enabled = true
}

# Farm-assist: right-click a fully grown crop to harvest its drops and replant it in one motion. Replanting spends
# one matching seed from your inventory (wheat seeds for wheat, a carrot for carrots, and so on); with no matching
# seed the crop is harvested but not replanted. Requires the uxmessentials.survival.farmassist permission.
farmassist {
  enabled = true

  # The crops farm-assist acts on. Only crops that grow through a block age and replant from a single seed item are
  # supported; unknown or seedless crops are skipped with a warning at startup.
  crops = [
    "WHEAT", "CARROTS", "POTATOES", "BEETROOTS", "NETHER_WART"
  ]
}

# Anvil-unlocker: lift vanilla's anvil caps so a costly combine is not rejected with "Too Expensive!". Purely a
# convenience tweak on the anvil screen — it has no per-player toggle and applies to every anvil while enabled.
anvilunlocker {
  enabled = true

  # Lift the "Too Expensive!" level ceiling (vanilla stops a survival combine once it costs 40 levels) so any
  # combine, however many prior-work levels it has stacked up, produces a result.
  remove-level-limit = true

  # Also zero the level price of the combine, so the unlocked repair is free rather than charging the full (and
  # possibly enormous) XP cost. Off by default, so an unlocked combine still costs its levels.
  remove-cost-limit = false
}

# One-player-sleep: skip the night as soon as enough of a world's players are sleeping, evaluated per world. AFK
# players (those the presence module marks sleep-ignored) and spectators neither count toward nor block the skip.
oneplayersleep {
  enabled = true

  # The percentage of eligible players that must be sleeping to skip the night, rounded up to a whole player. Only
  # used when required-count is 0.
  required-percent = 50

  # A fixed number of sleeping players that skips the night. When above 0 this takes precedence over required-percent
  # entirely — the default of 1 is the classic one-player sleep. Set to 0 to fall back to the percentage instead.
  required-count = 1
}

# Head-drop: a slain entity may drop its head. A player killed by another player drops their own head; mobs drop
# their vanilla head at a chance. Chances are percentages (0-100). Only mobs with a real Minecraft head item drop
# one: zombie, skeleton, wither skeleton, creeper, piglin, and the ender dragon.
headdrop {
  enabled = true

  # A player killed by another player drops their player head at full odds. PvE and environmental deaths never drop
  # a player head.
  player-head-on-pvp = true

  # The default chance a slain mob drops its head, as a percentage. 0 means mobs drop no heads unless a per-mob
  # override below raises their chance.
  mob-chance = 0.0

  # Per-mob chance overrides, keyed by Bukkit entity name. A mob listed here uses its own chance instead of
  # mob-chance; unknown names are skipped with a warning at startup. Example:
  #   mobs {
  #     WITHER_SKELETON = 100.0
  #     ZOMBIE = 25.0
  #   }
  mobs {
  }
}

# Auto-pickup: a broken block's drops go straight into your inventory instead of scattering on the ground; only when
# the inventory is full do the extras spill out. Players toggle it for themselves with /autopickup (default on),
# gated by uxmessentials.survival.autopickup.
autopickup {
  enabled = true

  # Grant the block's dropped experience straight to the player instead of spawning XP orbs on the ground. Off by
  # default, so mining still drops the usual orbs.
  transfer-xp = false
}

# Auto-smelt: a broken block's smeltable drop is turned into its furnace result as you mine, so an iron ore yields an
# ingot rather than raw iron. It runs before auto-pickup, so what lands in your inventory is already smelted. It ships
# OFF: it silently rewrites what mining gives every player who has not turned it off, which is a survival-economy
# decision an operator should make on purpose rather than inherit. Switch it on here, then players toggle it for
# themselves with /autosmelt (their personal toggle defaults on), gated by uxmessentials.survival.autosmelt.
autosmelt {
  enabled = false

  # The drop -> smelted-result map, keyed by the DROP material (raw iron, not the ore block) using Bukkit material
  # names. Delete an entry to stop smelting that drop; add your own to smelt more. Leaving the block empty keeps the
  # shipped defaults below.
  #
  # The shipped set is ores only. Adding the stone/sand/clay pairs below is a bigger change than it looks: smelting
  # COBBLESTONE to STONE takes cobblestone off the server entirely, so nobody can build with it or feed a stone
  # generator any more. Uncomment them only if that is what you want.
  smelt {
    RAW_IRON = IRON_INGOT
    RAW_GOLD = GOLD_INGOT
    RAW_COPPER = COPPER_INGOT
    ANCIENT_DEBRIS = NETHERITE_SCRAP
    # COBBLESTONE = STONE
    # COBBLED_DEEPSLATE = DEEPSLATE
    # SAND = GLASS
    # RED_SAND = GLASS
    # CLAY_BALL = BRICK
    # WET_SPONGE = SPONGE
    # KELP = DRIED_KELP
    # CHORUS_FRUIT = POPPED_CHORUS_FRUIT
  }
}

# Auto-sell: a broken block's priced drops are sold into the server economy as you mine and the coins credited to your
# wallet. It ships enabled with the small default price table below, but still does nothing unless the economy module
# is present, and each player must opt in with /autosell first (the personal toggle defaults OFF, so nobody's drops
# turn to coin until they switch it on). A drop with no listed price is never sold; it falls through to auto-pickup or
# the ground. Gated by uxmessentials.survival.autosell.
autosell {
  enabled = true

  # Per-item sell prices, keyed by the (post-smelt) drop material using Bukkit material names. The value is the price
  # for one item; a stack sells for that times its size. Edit, add, or remove entries to change what is sellable and
  # for how much. Emptying this block falls back to the same shipped defaults.
  prices {
    COAL = 2
    IRON_INGOT = 8
    COPPER_INGOT = 4
    GOLD_INGOT = 12
    REDSTONE = 1
    LAPIS_LAZULI = 2
    DIAMOND = 80
    EMERALD = 60
    QUARTZ = 3
    NETHERITE_SCRAP = 120
  }
}

# Auto-tool: as you start breaking a block, your held hotbar slot swaps to the strongest tool of the family that block
# needs: a pickaxe for stone, an axe for a log. It only ever swaps between hotbar slots you already carry. It ships OFF
# because moving a player's held item for them is intrusive enough to be an opt-in. Switch it on here, then players
# toggle it for themselves with /autotool (their personal toggle defaults on), gated by
# uxmessentials.survival.autotool.
autotool {
  enabled = false
}
