# Layout for the personal /survival settings panel. Geometry and materials only — every title, mechanic name, and
# value line lives in the message catalog (messages_<lang>.conf, keys under survival.gui.*), so translations stay in
# one place.
#
# One row of up to seven buttons, one per toggleable mechanic (tree-feller, veinminer, farmland protection, and the
# four auto-* mechanics). A mechanic the server has disabled, or the viewer lacks the .toggle permission for, is left
# out, so a viewer sees only the switches they may flip. The delete slot is unused — a settings panel never deletes.
rows = 3
property-slots = [10, 11, 12, 13, 14, 15, 16]
back-slot = 22
delete-slot = -1
back-icon = "ARROW"
delete-icon = "BARRIER"
filler = "BLACK_STAINED_GLASS_PANE"
