# Vanish — the single authority over vanish state and its visibility. /vanish makes a player invisible to everyone who
# cannot see vanished players (those lacking uxmessentials.vanish.see), and hides them from the tab list too. Messaging
# (/msg resolution), the nametag renderer, and staff mode all read this one vanish state, so there is never a second
# vanish flag to keep in sync.
#
# The module ships ENABLED. Turn it off with enabled = false, at which point the messaging and nametag vanish gates
# degrade to "no one is hidden" and staff-mode vanish becomes a no-op.
enabled = true

# What a vanished player experiences in the world. Each toggle is independent; all default to a sensible, safe value so
# a vanished admin moves unseen and untouched out of the box.

# Silence the open animation and sound when a vanished player opens a chest, shulker box, ender chest, or barrel — the
# lidded containers whose open would otherwise be broadcast to every nearby player and give the vanished player away.
silent-chests = true

# The default for whether a vanished player picks up items. It ships off so a vanished player does not silently vacuum
# drops; each player flips their own preference at runtime with /vanish pickup (the choice is remembered across relog).
pickup-items = false

# Grant permanent night vision while vanished, so a hidden staff member can see in the dark without a torch.
night-vision = true

# Allow flight while vanished. The allowance is restored to the player's game-mode default on reappear (creative and
# spectator keep flying; survival and adventure lose the granted allowance).
allow-flight = true

# Stop hunger draining while vanished. A deliberate eat still tops the food bar back up; only the drain is blocked.
no-hunger = true

# Make a vanished player invulnerable — cancel all incoming damage while they are hidden.
no-damage = true

# Stop mobs targeting a vanished player, and drop any target a mob already has on them, so nothing paths to or attacks
# a hidden player.
mob-target = true

# Connection illusions — sell the vanish so no viewer notices a player merely turned invisible.

# When a player vanishes, suppress their real quit line and broadcast a fake "left the game" instead; when they
# reappear, suppress the real join and broadcast a fake "joined the game". A vanished player who actually disconnects or
# reconnects also has their real connection line suppressed. The /vanish -s flag (uxmessentials.vanish.silent) skips the
# fake broadcast for a truly silent vanish.
fake-join-quit = true

# The fake lines, as MiniMessage. {player} is replaced with the player's name. These mirror the vanilla connection
# format so the illusion is seamless; change them to match your server's real join/quit style.
fake-quit-message = "<yellow>{player} left the game"
fake-join-message = "<yellow>{player} joined the game"

# The lines shown instead to viewers who CAN see the vanishing player (staff). Leave blank to send them nothing — the
# default — so staff simply watch the player wink out without a misleading "left the game".
fake-quit-message-staff = ""
fake-join-message-staff = ""

# Show a persistent "You are vanished" action bar to a vanished player, refreshed once a second so it never fades. Its
# text is the vanish.actionbar entry in your message catalog (per-locale). Turn off to hide the indicator entirely.
action-bar = true

# Let a player who holds uxmessentials.vanish.persist rejoin already vanished: on join they are re-hidden and their real
# join line is suppressed, so a staff member who relogs stays invisible instead of announcing themselves.
join-vanished = true

# Cross-server vanish. When on (and the network bus in network.conf is enabled), a player's vanish state syncs across
# every backend: someone vanished on survival-1 arrives already hidden on survival-2, and /vanish list shows the hidden
# players across the whole network (still scoped to the caller's see level). Needs a Velocity proxy or Redis bus; ships
# OFF, and is inert with no behavioural change to same-server vanish when the bus is absent.
cross-server = false

# Another plugin's vanish. SuperVanish and PremiumVanish hide a player from the world, but they cannot hide them from
# us: without this, a player they have hidden still appears in our tab list, still counts for /list, and can still be
# reached by /msg. Turn read-supervanish on (the default) and every one of our surfaces treats them as vanished too.
# Nothing is written back: our /vanish still owns our own state, and this never vanishes or reveals a player in the
# other plugin. Inert when neither plugin is installed.
#
# level is the vanish tier they are folded in at, which decides who still sees them: a viewer needs a see level of at
# least this to see them, so the default 1 means anyone with uxmessentials.vanish.see does, and nobody else. Raise it
# to hide them from your lower staff tiers as well.
foreign {
  read-supervanish = true
  level = 1
}
