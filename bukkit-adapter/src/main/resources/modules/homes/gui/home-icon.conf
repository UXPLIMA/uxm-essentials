# The home-icon picker (opened from a home's action menu), rendered through the menu engine. One icon per material
# in the configured palette, paged across the top five rows, with a reset button and the two nav arrows on the bottom
# row. The grid is the homes:icon-palette list source; each cell's material is the palette entry itself and its name
# resolves from the homes message catalog, filled with that material's name through the home_icon_name placeholder. A
# left click sets the home's icon to that material through homes:set-icon and returns to the action menu; the reset
# button clears the custom icon through homes:reset-icon. Every label resolves from the catalog, so no user-facing
# text lives here. The geometry mirrors the original fixed six-row picker: a palette grid across the top five rows and
# the reset/back/nav buttons on the bottom row.
title = "@home.icon.title"
rows = 6

items {
  # The palette grid, paginated across the top five rows. Each cell shows the palette material and its name; a left
  # click sets the home's icon to it through homes:set-icon.
  palette {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "homes:icon-palette"
      template {
        material = "%home_icon_name%"
        name     = "@home.icon.entry.name"
        click { left = ["homes:set-icon"] }
      }
    }
  }

  # Clear the custom icon and return to the action menu, exactly as the old reset button did. Pinned to the bottom row.
  reset {
    slot     = 45
    material = BARRIER
    name     = "@home.icon.reset.name"
    lore     = ["@home.icon.reset.lore"]
    priority = 10
    click { left = ["homes:reset-icon"] }
  }

  # Previous page.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@home.icon.prev"
    priority = 10
  }

  # Back to the home action menu.
  back {
    slot     = 49
    material = ARROW
    name     = "@home.icon.back"
    priority = 10
    click { left = ["homes:icon-back"] }
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@home.icon.next"
    priority = 10
  }
}
