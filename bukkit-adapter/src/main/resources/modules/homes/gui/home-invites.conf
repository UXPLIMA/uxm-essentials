# The invited-players list (opened from a home's action menu), rendered through the menu engine. One PLAYER_HEAD per
# player the owner has invited to this home, paged across the inner cells, with an add button, a back button, and the
# two nav arrows on the bottom row. The grid is the homes:invited-players list source; the invited_player placeholder
# fills each head's name and lore from the bound entry; when the home has no invites the source emits a single
# placeholder head so the picker shows the "no invited players" line exactly as the old view did. A left click on a
# head revokes that invite through the same UninviteFromHome use case /uninvite drives; the add button prompts for a
# name in chat and invites them; the back button returns to the home action menu. Every label resolves from the homes
# message catalog, so no user-facing text lives here. The geometry mirrors the original fixed six-row menu: an inner
# grid (rows two through five, edges clear) and the add/back/nav buttons on the bottom row.
title = "@home.invites.title"
rows = 6

items {
  # The grey-glass backdrop. Lowest priority, so the content grid and the buttons drawn below sit on top of it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The invited-player grid, paginated through the inner cells (the edge columns and bottom row stay clear). Each
  # cell shows a PLAYER_HEAD with the invited player's name; a left click revokes that invite through
  # homes:uninvite. The empty-list sentinel head carries no revoke action, so clicking it does nothing.
  invited {
    slots    = ["10-16", "19-25", "28-34"]
    priority = 5
    list {
      source = "homes:invited-players"
      template {
        material = PLAYER_HEAD
        name     = "%invited_player%"
        lore     = ["%invited_player_lore%"]
        click { left = ["homes:uninvite"] }
      }
    }
  }

  # Invite a new player by name: prompt for a name in chat (the shared text-input seam), exactly as the old add
  # button did. Pinned to the bottom row.
  add {
    slot     = 49
    material = LIME_DYE
    name     = "@home.invites.add.name"
    lore     = ["@home.invites.add.lore"]
    priority = 10
    click { left = ["homes:invite-add"] }
  }

  # Back to the home action menu.
  back {
    slot     = 45
    material = BARRIER
    name     = "@home.invites.back"
    priority = 10
    click { left = ["homes:invites-back"] }
  }

  # Previous page.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@home.invites.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@home.invites.next"
    priority = 10
  }
}
