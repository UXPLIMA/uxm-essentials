# Layout of the icon picker opened from a home's action menu. Titles and lore stay in the message catalog
# (messages_<lang>.conf); only the geometry, the navigation materials, and the offered icon palette live here.

# Menu height in rows (1..6). Six rows give 45 content cells above the reserved navigation row.
rows = 6

# Navigation row: reset (clear the custom icon), previous-page, back, and next-page.
reset-slot = 45
prev-slot = 48
back-slot = 49
next-slot = 50

# Navigation materials.
reset-material = "BARRIER"
nav-material = "ARROW"

# The materials offered as home icons. Each is a clickable cell; an unknown name is skipped at load time.
icons = [
  "RED_BED", "BLUE_BED", "GREEN_BED", "YELLOW_BED", "WHITE_BED", "BLACK_BED", "PURPLE_BED", "ORANGE_BED",
  "GRASS_BLOCK", "DIRT", "STONE", "COBBLESTONE", "OAK_LOG", "OAK_PLANKS", "BRICKS", "BOOKSHELF",
  "CRAFTING_TABLE", "FURNACE", "CHEST", "ENDER_CHEST", "ANVIL", "BEACON", "ENCHANTING_TABLE", "TORCH",
  "DIAMOND_BLOCK", "GOLD_BLOCK", "IRON_BLOCK", "EMERALD_BLOCK", "NETHERITE_BLOCK", "LAPIS_BLOCK",
  "DIAMOND_SWORD", "DIAMOND_PICKAXE", "BOW", "SHIELD", "COMPASS", "CLOCK", "MAP", "LANTERN",
  "OAK_SAPLING", "WHEAT", "CAMPFIRE", "CAKE"
]
