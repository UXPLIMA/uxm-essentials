# Layout of the /homes browse menu. Titles and lore stay in the message catalog (messages_<lang>.conf);
# only the geometry and the icons live here, so editing this file never touches a translation.

# Menu height in rows (1..6). Six rows give 45 content slots above the reserved nav row.
rows = 6

# Homes carry no item, so every home icon uses this single material.
fallback-icon = "RED_BED"

# Material of the previous/next page buttons.
nav-icon = "ARROW"

# Slots the previous- and next-page buttons sit in (bottom row of a six-row menu).
prev-slot = 48
next-slot = 50

# Slots the home icons fill. Leave empty to use every slot except the bottom row.
content-slots = []
