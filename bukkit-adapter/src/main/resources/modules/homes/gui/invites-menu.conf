# Layout of the invited-players menu opened from a home's action menu. Titles, lore, and player names stay in
# the message catalog (messages_<lang>.conf); only the geometry and icon materials live here.

# Menu height in rows (1..6). Six rows leave the bottom row for navigation below the content cells.
rows = 6

# Content cells the invited players are paged through (an inner 3x7 block, leaving a border).
content-slots = [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 28, 29, 30, 31, 32, 33, 34]

# Navigation row: back (return to the action menu), previous-page, invite-a-player, next-page.
back-slot = 45
prev-slot = 48
add-slot = 49
next-slot = 50

# Materials.
entry-material = "PLAYER_HEAD"
nav-material = "ARROW"
add-material = "LIME_DYE"
back-material = "BARRIER"

# Material the unused border cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"
