# Layout of the per-home action menu opened by clicking a filled slot in the /home grid. Titles and lore
# stay in the message catalog (messages_<lang>.conf); only the geometry and icon materials live here.

# Menu height in rows (1..6).
rows = 3

# Button slots.
info-slot = 4
rename-slot = 10
teleport-slot = 11
delete-slot = 13
relocate-slot = 15
change-icon-slot = 16
back-slot = 22

# Button materials.
info-material = "PAPER"
rename-material = "NAME_TAG"
teleport-material = "ENDER_PEARL"
delete-material = "BARRIER"
relocate-material = "COMPASS"
change-icon-material = "ITEM_FRAME"
back-material = "ARROW"

# Material the unused border cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"
