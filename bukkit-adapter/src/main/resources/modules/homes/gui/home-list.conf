# Layout of the /home slot grid. Titles and lore stay in the message catalog (messages_<lang>.conf);
# only the geometry and the icon materials live here, so editing this file never touches a translation.

# Menu height in rows (1..6).
rows = 3

# The grid cells home slots are drawn into, one home per cell, paged when the player has more homes than cells.
home-slots = [10, 11, 12, 13, 14, 15, 16]

# Material of a filled slot whose home has no custom icon set.
fallback-icon = "RED_BED"

# Material of an empty slot the player can click to create a home there.
empty-icon = "GRAY_BED"

# Material the unused border cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"

# Navigation row (bottom row of a 3-row menu): previous-page, page-info display, next-page.
prev-slot = 18
page-info-slot = 22
next-slot = 26
