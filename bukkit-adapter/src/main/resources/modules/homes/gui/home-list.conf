# The /home slot grid, rendered through the menu engine. One cell per addressable home slot the player could hold,
# from the first slot up to their resolved limit: a filled slot shows that home's icon (its custom material or the
# fallback bed) and opens the per-home action menu on click, while an empty-but-addressable slot shows the empty bed
# and creates a home there at the player's position on click. The filled and empty cells collapse into one list
# template over the home:slots source; the home_icon / home_cell_name / home_cell_lore placeholders branch on whether
# the bound cell carries a home. The page indicator fills from the engine's own %page% / %max_page%, so it reads the
# same page count the grid paginates across. Every label resolves from the homes message catalog, so no user-facing
# text lives here. The geometry mirrors the original fixed three-row grid: seven home cells across the middle row and
# the nav arrows plus the page indicator on the bottom row.
title = "@home.menu.title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the cells and nav drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The home grid, paginated across the seven middle cells. Each cell shows its slot's icon material and label; a
  # filled cell's left click opens the action menu through homes:open-slot, an empty cell's click creates a home there.
  slots {
    slots    = ["10-16"]
    priority = 5
    list {
      source = "home:slots"
      template {
        material = "%home_icon%"
        name     = "%home_cell_name%"
        lore     = ["%home_cell_lore%"]
        click { left = ["homes:open-slot"] }
      }
    }
  }

  # Page indicator, filled from the engine's current page and total page count.
  page-info {
    slot     = 22
    material = RED_BED
    name     = "@home.menu.page-info"
    priority = 10
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above; hidden on the first page.
  previous {
    slot     = 18
    type     = PREVIOUS
    material = ARROW
    name     = "@home.menu.prev"
    priority = 10
    view     = ["has-prev"]
  }

  # Next page; hidden on the last page.
  next {
    slot     = 26
    type     = NEXT
    material = ARROW
    name     = "@home.menu.next"
    priority = 10
    view     = ["has-next"]
  }
}
