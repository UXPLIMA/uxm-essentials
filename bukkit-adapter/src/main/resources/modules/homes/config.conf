# Homes: /home opens the slot-based GUI; /homeadmin manages another player's homes.
enabled = true
default-limit = 3                   # homes per player without a uxmessentials.home.limit.<n> node
limit-mode = "highest"              # how multiple uxmessentials.home.limit.<n> tiers combine: "highest" (max tier wins) or "stack" (sum tiers)
unlimited-max = 1000                # slot ceiling for an unlimited (-1) quota, so the grid stays bounded
date-format = "dd/MM/yyyy HH:mm"    # how a home's creation time renders in its GUI lore
disabled-worlds = []                # worlds where players cannot create/relocate homes
block-unsafe-sethome = true         # reject placing a home in an unsafe spot (air/lava/suffocating)
consider-midair-unsafe = true       # treat a spot with no solid ground just below as unsafe (anti-elytra)
midair-ground-depth = 5             # how many blocks below to look for solid ground when the above is on
confirm-delete = true               # show a yes/no confirm before deleting a home from the GUI
confirm-relocate = false            # show a yes/no confirm before relocating a home to the player's position
confirm-unsafe-teleport = true      # show a warning confirm when teleporting to a home at an unsafe location

# Economy integration. When an economy provider is wired and enabled = true, players are charged
# the configured amount for each action. Set a cost to 0 (or keep enabled = false) for free actions.
economy {
  enabled = false                 # charge players for home actions (requires an economy provider)
  create-cost = 0                 # charged when creating a new home slot
  relocate-cost = 0               # charged when relocating an existing home to a new position
  teleport-cost = 0               # charged each time a player teleports to a home
  currency = "default"            # currency id to charge in; "default" uses the server's primary currency
}

# Land-claim integration. When a supported claim plugin is installed these rules gate where homes may be placed and
# whether players keep access to them. Every installed provider is consulted at once; the supported set and the
# per-provider switches live in the root config.conf "claims" block.
claims {
  enabled = true                    # honour the active claim plugin; off ignores claims entirely
  require-claim = false             # a home may only be placed inside a claim the player trusts
  block-foreign-claims = true       # a home may not be placed inside another player's claim
  foreign-claim-chunk-distance = 0  # chunk radius to reject placement near a foreign claim; 0 disables
  check-teleport-access = true      # deny teleporting to a home the player is no longer trusted in
  # Note: GriefPrevention ADMIN claims (no owner) are treated as foreign; players cannot /sethome inside
  # them unless they have been explicitly build-trusted by an administrator.
}

# Homes on the other servers of a network. A home remembers the server it was set or relocated on, once the network
# block of config.conf is on and network.server-name is not the shipped "server-1" (a standalone server records no
# server, so its homes are not tied to a name it drops when it joins a network). With this on, a teleport to a home of
# another server (from the /home menu, /home visit or /home admin tp) sends the player there through the proxy: the
# jail, combat and cooldown checks run first, the teleport cost is taken only once they pass, and it comes back if the
# player is not moved. When the owner travels to their own home, the claim access check runs on arrival, and so does
# the unsafe spot check while confirm-unsafe-teleport is on: nobody can confirm on arrival, so an unsafe home refuses
# the player (refunded) unless they hold uxmessentials.home.bypass.unsafe. A respawn never crosses servers: a respawn
# at home uses the lowest-slot home of this server. It needs a proxy (BungeeCord or Velocity) in front, a shared
# database, network.server-name in config.conf set to the name the proxy gives this server, and the same setting on
# every server of the network. The refund is paid on the server the player reaches, so the economy module must be on
# there too, on every server a home hop can land on. Off, every home is used on this server as before, even one set
# on another. The timings are in the cross-server block of config.conf.
#
# A home from before servers were recorded is claimed, on start, by the server that has its world loaded; the log
# counts them under event=home_server_claim. Two servers running a copy of the same world folder share its uid.dat,
# so the one that starts first claims every home in it: give each copy its own uid.dat. A world loaded after the
# server has finished starting is claimed at the next restart. /home setserver <from> <to>
# (uxmessentials.home.setserver) moves every home recorded on one server to another: after renaming
# network.server-name, or to undo a wrong claim. Naming "unscoped" as the new server clears it, so the server that
# has each home's world claims it again at its next start.
cross-server {
  enabled = false
}
