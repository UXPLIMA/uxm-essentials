# Homes — /home opens the slot-based GUI; /homeadmin manages another player's homes.
enabled = true
default-limit = 3                   # homes per player without a uxmessentials.home.limit.<n> node
limit-mode = "highest"              # how multiple uxmessentials.home.limit.<n> tiers combine: "highest" (max tier wins) or "stack" (sum tiers)
unlimited-max = 1000                # slot ceiling for an unlimited (-1) quota, so the grid stays bounded
date-format = "dd/MM/yyyy HH:mm"    # how a home's creation time renders in its GUI lore
disabled-worlds = []                # worlds where players cannot create/relocate homes
block-unsafe-sethome = true         # reject placing a home in an unsafe spot (air/lava/suffocating)
consider-midair-unsafe = true       # treat a spot with no solid ground just below as unsafe (anti-elytra)
midair-ground-depth = 5             # how many blocks below to look for solid ground when the above is on
confirm-delete = true               # show a yes/no confirm before deleting a home from the GUI
confirm-relocate = false            # show a yes/no confirm before relocating a home to the player's position
confirm-unsafe-teleport = true      # show a warning confirm when teleporting to a home at an unsafe location

# Economy integration. When an economy provider is wired and enabled = true, players are charged
# the configured amount for each action. Set a cost to 0 (or keep enabled = false) for free actions.
economy {
  enabled = false                 # charge players for home actions (requires an economy provider)
  create-cost = 0                 # charged when creating a new home slot
  relocate-cost = 0               # charged when relocating an existing home to a new position
  teleport-cost = 0               # charged each time a player teleports to a home
  currency = "default"            # currency id to charge in; "default" uses the server's primary currency
}

# Land-claim integration. When a supported claim plugin (uxmClaims, Lands, or GriefPrevention) is
# installed these rules gate where homes may be placed and whether players keep access to them.
claims {
  enabled = true                    # honour the active claim plugin; off ignores claims entirely
  require-claim = false             # a home may only be placed inside a claim the player trusts
  block-foreign-claims = true       # a home may not be placed inside another player's claim
  foreign-claim-chunk-distance = 0  # chunk radius to reject placement near a foreign claim; 0 disables
  check-teleport-access = true      # deny teleporting to a home the player is no longer trusted in
  # Note: GriefPrevention ADMIN claims (no owner) are treated as foreign — players cannot /sethome inside
  # them unless they have been explicitly build-trusted by an administrator.
}
