# Nametags — a rich, per-wearer nametag floating above the player's head, rendered from the content below.
#
# This renders a viewer-restricted TextDisplay above each wearer (uxmLib's native-display hologram + a follow task that
# keeps it above the head), shown to nearby players but never to the wearer themselves. Everything under `nametag` /
# `formats` is MiniMessage rendered as written — these are NOT plugin strings and are not translated through
# messages_<lang>.conf. Lines may embed PlaceholderAPI placeholders (e.g. %player_name%, %vault_prefix%); without
# PlaceholderAPI installed those are left untouched. The token {player} is replaced with the wearer's name. The
# nametag is always-on for every eligible wearer when the module is enabled — there is no per-player toggle.
#
# The module ships DISABLED, and the default below is a single plain name format. Author the formats first, then set
# enabled = true.
#
# --- DEFERRED limitations (read before enabling) ---------------------------------------------------------------------
# * The custom nametag renders ABOVE the vanilla above-head name; the vanilla name is NOT hidden. Reliably hiding it
#   conflicts with the scoreboard module switching players onto per-player scoreboards (both want the name team), so
#   vanilla-name hiding is deferred until a shared scoreboard-team coordinator exists.
# * Every viewer sees the SAME text (one shared entity). Per-viewer DIFFERENT text and relational placeholders, and
#   per-viewer line-of-sight / through-wall hiding, are packet-only and deferred. Vanish hiding IS honoured (a
#   vanished wearer's nametag is hidden from anyone who cannot see them) and sneak hiding IS honoured (hide-from-all).
enabled = false

# How often every wearer's nametag is re-rendered, in server ticks (20 ticks = one second). Must be positive. This is
# the GLOBAL cadence; the per-tick re-selection is what makes a permission/world/gamemode/sneak/vanish change take
# effect.
refresh-ticks = 20

# --- Single-nametag shape (the default) ------------------------------------------------------------------------------
# One nametag for everyone. When a `formats { … }` block is present (see below) this block is ignored and the formats
# drive everything.
nametag {
  # The nametag lines, joined top to bottom with newlines into the single TextDisplay. An empty list means "no
  # nametag". {player} is replaced with the wearer's name; PlaceholderAPI placeholders are expanded per viewer.
  lines = [ "<white>{player}" ]

  # The text-display appearance. Every field is optional and falls back to the platform default; a bad value (an
  # unknown billboard, an unparseable colour) falls back tolerantly rather than blanking the nametag.
  appearance {
    # How the display faces the viewer: CENTER (always faces, recommended), FIXED, VERTICAL, or HORIZONTAL.
    billboard = "CENTER"
    # Uniform text scale (1.0 = vanilla size). Must be > 0.
    scale = 1.0
    # How far above the wearer's head the nametag floats, in blocks.
    y-offset = 0.3
    # Whether the text renders through blocks.
    see-through = false
    # Background panel colour as hex (#RRGGBB or #AARRGGBB); omit for the vanilla translucent background.
    # background-color = "#000000"
    # Background opacity 0..255 (folded into the background colour's alpha); needs a background-color to apply.
    # background-opacity = 64
    # Whether the text is drawn with a drop shadow.
    text-shadow = false
    # Glow outline colour as hex; omit for no glow.
    # glow-color = "#55FFFF"
    # Wrap width in pixels; omit for the default.
    # line-width = 200
    # Render-distance multiplier (also used as the block radius for the per-tick viewer cull); omit for the default.
    # view-range = 1.0
  }

  # The visibility rules.
  visibility {
    # A condition gating whether this wearer gets a nametag at all (see shared/display/ConditionParser for the
    # grammar). Blank = always show.
    show-when = ""
    # Hide the nametag from EVERYONE while the wearer is sneaking.
    hide-while-sneaking = false
    # Hide the nametag from viewers who cannot see the wearer (vanish). Honoured when the presence module is on; with
    # presence off nothing is hidden.
    respect-vanish = true
  }
}

# --- Multiple-format shape (recommended for groups) ------------------------------------------------------------------
# Each named format carries its own lines, appearance, and visibility. Each wearer is given the highest-priority format
# whose `condition` matches them; ties on priority are broken by the alphabetically-first format name. A format with no
# `lines` is dropped. Uncomment and author to enable.
#
# `condition`   — see shared/display/ConditionParser: "permission:<node>", "world:<name>", "gamemode:<mode>",
#                 "%papi% >= 10", "&&"/","/"||"/"!" combinators. Blank = always.
#
# formats {
#   staff {
#     condition = "permission:uxmessentials.staff"
#     priority = 10
#     lines = [ "<red><bold>[Staff]</bold></red>", "<white>{player}" ]
#     appearance {
#       billboard = "CENTER"
#       scale = 1.1
#       y-offset = 0.35
#       see-through = true
#       glow-color = "#FF5555"
#       text-shadow = true
#     }
#     visibility {
#       show-when = ""
#       hide-while-sneaking = false
#       respect-vanish = true
#     }
#   }
#   default {
#     condition = ""
#     priority = 0
#     lines = [ "<gray>{player}" ]
#     appearance { billboard = "CENTER", scale = 1.0, y-offset = 0.3 }
#     visibility { hide-while-sneaking = true }
#   }
# }

# --- Animated lines --------------------------------------------------------------------------------------------------
# Declare named animations in the top-level `animations { … }` block below, then reference one anywhere in a line as
# the token %anim_<name>%. The token is expanded to the animation's current frame BEFORE PlaceholderAPI and MiniMessage
# run, so a frame may itself carry colour tags or placeholders. The whole module shares one global animation clock that
# ticks once per render cadence (refresh-ticks above). A token naming an animation that does not exist is left verbatim
# so you can spot a typo. This is the same animation catalog the scoreboard and tablist use, so the three types match:
#   FRAMES   — cycle through `frames` one per `interval-ticks`.
#   SCROLL   — slide a `window`-wide marquee across the single source frame, wrapping through `separator`.
#   GRADIENT — sweep an animated multi-stop colour gradient across the single source frame over `steps` steps.
# An animation with an unknown `type`, no `frames`, or invalid params is skipped (logged once). `interval-ticks` is the
# step cadence for every type (minimum 1).
#
# Example (uncomment, then use the token in a line, e.g. lines = [ "<gray>%anim_rainbow%" ]):
# animations {
#   rainbow {
#     type = "GRADIENT"
#     frames = [ "{player}" ]
#     interval-ticks = 2
#     colors = [ "#FF0000", "#00FF00", "#0000FF" ]
#     steps = 30
#   }
# }
