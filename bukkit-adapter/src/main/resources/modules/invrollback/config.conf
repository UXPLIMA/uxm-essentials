# Inventory Rollback — snapshots a player's inventory at key moments (death, logout) so staff can restore a lost
# inventory later. Every snapshot is stored in the database, never to PDC, so it survives a world rollback — the
# authority is the stored row, not the live inventory. Staff open the restore GUI with /invrestore <player>
# (permission uxmessentials.invrollback.restore); this file governs when snapshots are taken and how many are kept.
#
# The module ships DISABLED: every death and logout writes a snapshot row, a cost worth paying only where staff
# actually restore inventories. Set enabled = true to start capturing.
enabled = false

# When to take a snapshot.
capture {
  on-death = true    # snapshot the inventory when a player dies (read before the items drop)
  on-logout = true   # snapshot the inventory when a player leaves the server
}

# Whether a snapshot also stores the player's ender chest alongside the main inventory, armor and offhand.
include-enderchest = true

# How long snapshots are kept, so the table stays bounded. After each capture the player's snapshots past
# max-per-player are pruned oldest-first; a scheduled hourly sweep removes any snapshot older than max-age-days
# (and trims any player left over the count cap after a reload). Set either limit to 0 to disable it.
retention {
  max-per-player = 10
  max-age-days = 30
}
