# The snapshot preview: a stored inventory snapshot shown read-only, with the controls that act on it.
#
# The chrome lives here — the backdrop, and where the details panel, the teleport, restore and export buttons sit
# and what they are made of — while the snapshot's own items are handed to the invrollback code through the
# content {} region below. That region is read-only: the window shows what was stored, and only the explicit
# buttons change anything, so a click on an item does nothing.
#
# The region's slot order is the snapshot's own: index 0..35 the main inventory, then armour and offhand as the
# snapshot recorded them. Move the region around the window if you like, but keep its 45 slots in that order or
# the preview will show the wrong item in the wrong place.
title = "%invrollback_preview_title%"
rows = 6

content {
  "invrollback:snapshot" {
    slots    = ["0-44"]
    editable = false
  }
}

items {
  # The backdrop behind the control row and any slot the snapshot did not fill.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  info {
    slot     = 45
    material = BOOK
    name     = "@invrollback.gui.info-name"
    lore     = ["%invrollback_info_lore%"]
    priority = 10
  }

  teleport {
    slot     = 47
    material = ENDER_PEARL
    name     = "@invrollback.gui.teleport-name"
    lore     = ["@invrollback.gui.teleport"]
    priority = 10
    click { any = ["invrollback:teleport"] }
  }

  restore {
    slot     = 49
    material = LIME_WOOL
    name     = "@invrollback.gui.restore-name"
    lore     = ["@invrollback.gui.restore"]
    priority = 10
    click { any = ["invrollback:restore"] }
  }

  export {
    slot     = 51
    material = SHULKER_BOX
    name     = "@invrollback.gui.export-name"
    lore     = ["@invrollback.gui.export"]
    priority = 10
    click { any = ["invrollback:export"] }
  }
}
