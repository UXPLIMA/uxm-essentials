# The active-punishments management list, rendered through the menu engine. A paginated grid of one icon per
# currently-active ban, mute, and jail; the management GUI's entry point (/mod with no args and the /uxmess gui
# hub entry). Each icon's material follows the punishment kind (a barrier for a ban, a book for a mute, iron bars
# for a jail) through the mod_active_icon placeholder, named and lored with the target, the kind, the issuer, the
# reason and the remaining time through the mod_active_* placeholders.
#
# The three active reads (bans / mutes / jails) are DB queries, and each target's display name resolves through the
# player lookup and each remaining string against the clock, so the open runs all of that off the tick thread and
# hands the fully-resolved rows in as the menu subject; the moderation:active list source only reads that subject,
# touching no port off-thread. There is no create button; punishments are issued by the existing /ban /mute /jail
# commands, not the management list. A left click opens that entry's bespoke detail/revoke screen through
# moderation:open-detail. Every label resolves from the moderation message catalog, so no user-facing text lives
# here. The geometry mirrors the original paginated list: a grid across the top five rows and the two nav arrows on
# the bottom row.
title = "@moderation.gui.list.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop on the bottom row only; the content grid above leaves empty cells empty, exactly as the
  # original paginated list did (it filled only the non-content slots).
  filler {
    slots    = ["45-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The active-punishments grid, paginated across the top five rows. Each cell shows the kind's icon material with the
  # player/kind/issuer/reason/remaining name and lore; a left click opens that entry's detail/revoke screen.
  punishments {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "moderation:active"
      template {
        material = "%mod_active_icon%"
        name     = "@moderation.gui.list.entry-name"
        lore     = ["@moderation.gui.list.entry-lore"]
        click { left = ["moderation:open-detail"] }
      }
    }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@moderation.gui.list.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@moderation.gui.list.next"
    priority = 10
  }
}
