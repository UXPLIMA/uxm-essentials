# Layout of the per-punishment detail/manage view (opened by clicking a punishment in the /mod list). Titles,
# labels and value lore stay in the message catalog (messages_<lang>.conf); only the geometry and the materials
# live here, so editing this file never touches a translation.

# Menu height in rows (1..6). Three rows fit the six detail buttons, a back button, and a revoke button.
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The i-th property button is drawn in the i-th slot below, and a click on that slot resolves back to it. The
# property order, set in code, is: target, type, issuer, reason, remaining, view-history.
property-slots = [10, 11, 12, 13, 14, 16]

# Slot the back button (returns to the active-punishments list) sits in.
back-slot = 22

# Slot the revoke button sits in (set to -1 to remove it). Revoking is confirm-gated; it lifts the punishment
# through the existing unban/unmute/unjail use case.
delete-slot = 26

# Materials for the back and revoke buttons, and the background filler.
back-icon = "ARROW"
delete-icon = "LAVA_BUCKET"
filler = "BLACK_STAINED_GLASS_PANE"
