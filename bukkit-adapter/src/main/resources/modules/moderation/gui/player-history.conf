# Layout of a player's disciplinary-history view (opened from the "view player history" button in a punishment's
# detail view). Titles and lore stay in the message catalog (messages_<lang>.conf); only the geometry and the
# icons live here, so editing this file never touches a translation. Each history row (ban/unban/mute/unmute/
# warn/kick, newest first) contributes one read-only icon, paged when there are more than fit.

# Menu height in rows (1..6). Six rows give 45 content slots above the reserved navigation row.
rows = 6

# Icon a history row falls back to. The renderer supplies a per-action material, so this is only a safety net.
fallback-icon = "PAPER"

# Material of the previous/next page buttons.
nav-icon = "ARROW"

# Slots the previous- and next-page buttons sit in (bottom row of a six-row menu).
prev-slot = 48
next-slot = 50

# Slots the history entries fill. Leave empty to use every slot except the bottom navigation row.
content-slots = []

# Material the unused border cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"

# The history view is read-only — no create button. A create-slot of -1 keeps it off.
create-slot = -1
create-icon = "LIME_DYE"
