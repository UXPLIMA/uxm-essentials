# The per-jail edit screen, rendered through the menu engine. A three-row panel reached by clicking a jail in the
# /jails manager: re-anchor the jail at the operator's current location, teleport to the jail, delete it, or go
# back to the jail list. The jail name and its resolved coordinates are handed in as the menu subject, so the
# re-anchor / teleport / delete buttons fill their lore from the mod_jail_edit_jail / mod_jail_edit_coords
# placeholders without the renderer touching a port.
#
# Re-anchor reads the operator's own location on their region thread before the audited SetJail use case; teleport
# closes first then reuses Sanctions.sendToJail; delete runs DelJail; back reopens the engine jail list. Every label
# resolves from the moderation catalog, so no user-facing text lives here. The geometry mirrors the original fixed
# three-row screen exactly: re-anchor at 11, teleport at 13, delete at 15, back at 18.
title = "@moderation.gui.jail.edit-title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the buttons drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # Re-anchor the jail at the operator's current location, read on their region thread before SetJail runs.
  anchor {
    slot     = 11
    material = COMPASS
    name     = "@moderation.gui.jail.edit-anchor"
    lore     = ["@moderation.gui.jail.edit-anchor-lore"]
    priority = 10
    click { left = ["moderation:jail-reanchor"] }
  }

  # Teleport the operator to the jail; the inverse of re-anchor. Closes first so a double-click cannot fire twice.
  goto {
    slot     = 13
    material = ENDER_PEARL
    name     = "@moderation.gui.jail.edit-goto"
    lore     = ["@moderation.gui.jail.edit-goto-lore"]
    priority = 10
    click { left = ["moderation:jail-goto"] }
  }

  # Delete the jail through the audited DelJail use case, then reopen the refreshed list.
  delete {
    slot     = 15
    material = LAVA_BUCKET
    name     = "@moderation.gui.jail.edit-delete"
    lore     = ["@moderation.gui.jail.edit-delete-lore"]
    priority = 10
    click { left = ["moderation:jail-delete"] }
  }

  # Back to the /jails manager list.
  back {
    slot     = 18
    material = ARROW
    name     = "@moderation.gui.jail.edit-back"
    priority = 10
    click { left = ["moderation:jail-back"] }
  }
}
