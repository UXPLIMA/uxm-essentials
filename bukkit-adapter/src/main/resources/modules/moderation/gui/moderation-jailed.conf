# The jailed-players release list, rendered through the menu engine. A paginated grid of one PLAYER_HEAD per
# currently-jailed player; the clickable twin of the /jailedplayers read-out, also reached from the /jail hub's
# [Jailed players] footer. Each head is named and lored with the target, the jail, the issuer, the reason and the
# remaining time through the mod_jailed_* placeholders.
#
# The active-jail read is a DB query and each name and remaining string resolves through the player lookup and the
# clock, so the open runs all of that off the tick thread and hands the fully-resolved rows in as the menu subject;
# the moderation:jailed list source only reads that subject. A left click releases that player through the audited
# Unjail use case and reopens the refreshed list through moderation:release. Every label resolves from the moderation
# message catalog, so no user-facing text lives here. The geometry mirrors the original paginated list: a grid across
# the top five rows and the two nav arrows on the bottom row.
title = "@moderation.gui.jail.jailed-title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop on the bottom row only; the content grid above leaves empty cells empty, exactly as the
  # original paginated list did (it filled only the non-content slots).
  filler {
    slots    = ["45-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The jailed-players grid, paginated across the top five rows. Each cell is a PLAYER_HEAD with the
  # player/jail/issuer/reason/remaining name and lore; a left click releases that player and reopens the list.
  jailed {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "moderation:jailed"
      template {
        material = PLAYER_HEAD
        name     = "@moderation.gui.jail.jailed-entry-name"
        lore     = ["@moderation.gui.jail.jailed-entry-lore"]
        click { left = ["moderation:release"] }
      }
    }
  }

  # What an empty jail looks like: one tile in the middle of the grid saying nobody is in there. The view gate
  # is the moderation:none-jailed condition the menu registers, so the slot goes back to the grid as soon as
  # somebody is jailed.
  empty {
    slot     = 22
    material = PAPER
    name     = "@moderation.gui.jail.jailed-empty-name"
    lore     = ["@moderation.gui.jail.jailed-empty-lore"]
    view     = ["moderation:none-jailed"]
    priority = 10
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@moderation.gui.jail.jailed-prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@moderation.gui.jail.jailed-next"
    priority = 10
  }
}
