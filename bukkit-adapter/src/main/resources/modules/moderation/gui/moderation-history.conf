# A target's read-only disciplinary history, rendered through the menu engine. A paginated grid of one icon per
# recorded sanction newest-first; the visual twin of the /history chat read-out, also reached from the punishment
# detail screen's history button. Each icon is the action's material (a barrier for a ban, a lime dye for an unban,
# and so on), named and lored with the action, the actor, the reason and the timestamp through the mod_history_*
# placeholders.
#
# The history is a DB read, so the open runs it off the tick thread and hands the already-read entries in as the
# menu subject; the moderation:history list source only reads that subject, touching no port off-thread. A click does
# nothing; an audit row is immutable. Every label resolves from the moderation message catalog, so no user-facing
# text lives here. The geometry mirrors the original paginated list: a grid across the top five rows and the two nav
# arrows on the bottom row.
title = "@moderation.gui.history.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop on the bottom row only; the content grid above leaves empty cells empty, exactly as the
  # original paginated list did (it filled only the non-content slots).
  filler {
    slots    = ["45-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The history grid, paginated across the top five rows. Each cell shows the action's icon material with the
  # action/actor/reason/timestamp name and lore. Read-only: no click action.
  history {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "moderation:history"
      template {
        material = "%mod_history_icon%"
        name     = "@moderation.gui.history.entry-name"
        lore     = ["@moderation.gui.history.entry-lore"]
      }
    }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@moderation.gui.history.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@moderation.gui.history.next"
    priority = 10
  }
}
