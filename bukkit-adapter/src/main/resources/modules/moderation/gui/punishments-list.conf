# Layout of the moderation active-punishments list (opened by /mod with no arguments and from the /uxmess gui
# hub). Titles and lore stay in the message catalog (messages_<lang>.conf); only the geometry and the icons
# live here, so editing this file never touches a translation. Each currently-active ban, mute, and jail
# contributes one clickable icon, paged when there are more than fit. Clicking an icon opens the per-punishment
# detail/manage view.

# Menu height in rows (1..6). Six rows give 45 content slots above the reserved navigation row.
rows = 6

# Icon a punishment falls back to in the list. The list renderer supplies a per-kind material (ban/mute/jail),
# so this is only used if that lookup ever degrades.
fallback-icon = "BARRIER"

# Material of the previous/next page buttons.
nav-icon = "ARROW"

# Slots the previous- and next-page buttons sit in (bottom row of a six-row menu).
prev-slot = 48
next-slot = 50

# Slots the punishment entries fill. Leave empty to use every slot except the bottom navigation row.
content-slots = []

# Material the unused border cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"

# This list has no create button — punishments are issued by the /ban, /mute and /jail commands, not the GUI.
# A create-slot of -1 keeps it off.
create-slot = -1
create-icon = "LIME_DYE"
