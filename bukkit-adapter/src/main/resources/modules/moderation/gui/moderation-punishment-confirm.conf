# The per-target punishment confirm screen, rendered through the menu engine. A three-row window shown once a
# target is chosen in the bare /ban /mute /tempban /tempmute /warn /banip GUI flow: the target's head, two confirm
# actions, apply (broadcast) and apply silently, an optional set-reason button that captures a free-text reason
# through the shared input seam, and a back button to the picker. One spec serves every sanction: the subject
# carries the action, so the title and the two confirm-button labels resolve through the subject-driven
# mod_confirm_*_key placeholders, and the apply / apply-silent clicks run the subject's executor with the right
# silent flag. /banip has no silent form, so its silent button is hidden by the moderation:confirm-silent-offered
# view condition.
#
# The reason is carried across the input round-trip by reopening the screen with the captured value in the
# subject, so the menu stays single-viewer and stateless between opens; the reason button's lore reads the
# subject-chosen mod_confirm_reason_lore_key (set vs none). Every label resolves from the moderation catalog, so
# no user-facing text lives here. The geometry mirrors the original fixed three-row screen exactly: the head at 4,
# apply at 10, silent at 12, reason at 14, back at 22.
title = "@%mod_confirm_title_key%"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the items drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The target's head. A read-only display; its name reads the subject's target through the mod_confirm_player
  # placeholder. A static spec item carries no per-open skull owner, so it renders as a generic PLAYER_HEAD.
  head {
    slot     = 4
    material = PLAYER_HEAD
    name     = "@moderation.gui.confirm.target-name"
    lore     = ["@moderation.gui.confirm.target-lore"]
    priority = 10
  }

  # Apply the sanction with the staff broadcast. The label/lore resolve to the verb's apply keys; a left click runs
  # the subject's executor with silent = false.
  apply {
    slot     = 10
    material = REDSTONE_BLOCK
    name     = "@%mod_confirm_apply_label_key%"
    lore     = ["@%mod_confirm_apply_lore_key%"]
    priority = 10
    click { left = ["moderation:punish-apply"] }
  }

  # Apply the sanction without the staff broadcast. Hidden for /banip (no silent form) by the silent-offered view
  # condition; a left click runs the subject's executor with silent = true.
  silent {
    slot     = 12
    material = BARRIER
    name     = "@%mod_confirm_silent_label_key%"
    lore     = ["@%mod_confirm_silent_lore_key%"]
    priority = 10
    view     = ["moderation:confirm-silent-offered"]
    click { left = ["moderation:punish-apply-silent"] }
  }

  # Capture a free-text reason through the shared input seam, then reopen this screen carrying it. The lore reads
  # the subject-chosen reason-set vs reason-none key.
  reason {
    slot     = 14
    material = WRITABLE_BOOK
    name     = "@moderation.gui.confirm.reason"
    lore     = ["@%mod_confirm_reason_lore_key%"]
    priority = 10
    click { left = ["moderation:set-reason"] }
  }

  # Back to the player picker.
  back {
    slot     = 22
    material = ARROW
    name     = "@moderation.gui.confirm.back"
    priority = 10
    click { left = ["moderation:punish-back"] }
  }
}
