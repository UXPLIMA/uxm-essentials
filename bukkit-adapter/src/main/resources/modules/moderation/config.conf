# Moderation — mutes, jails, bans, warns (audit-logged).
enabled = true
jails = []                          # names of defined jails, e.g. ["spawnjail"]
jail-countdown = "online-only"      # online-only (counts only while online) | wall-clock
muted-blocked-commands = ["me", "msg", "tell", "w", "whisper", "mail", "helpop", "r", "reply"]

# Warn escalation: when a player's running warning count reaches a listed rung, the matching sanction is
# applied automatically (attributed to the server, not the staff member who landed the warning). Each rung is
# "count:action[:duration]" — count is the warning total it fires on, action is one of
# mute/tempmute/kick/tempban/ban (case-insensitive), and duration (e.g. 1h, 1d) is required for the timed
# actions (tempmute, tempban) and omitted for the rest. A malformed rung is skipped with a log warning.
warnings {
  actions = ["3:tempmute:1h", "5:tempban:1d"]
}

# The staff broadcast: a non-silent sanction announces a one-line "<actor> banned <target>" to every online
# player holding uxmessentials.moderation.broadcast.receive plus the console. The -s flag on a sanction (e.g.
# /ban Player -s spamming) suppresses that broadcast for one command; silent-by-default makes -s the default
# for every sanction (the actor and target notices still go out either way).
broadcast {
  silent-by-default = false
}

# Duration tiers are permission-based, not config: grant uxmessentials.moderation.ban.maxduration.<seconds> or
# uxmessentials.moderation.mute.maxduration.<seconds> to cap how long a ban/mute that staff member may issue
# (highest node held wins; a request over the cap is shortened to it). No node = unlimited (the default).

# Define each jail named in "jails" above, e.g.
# jail {
#   spawnjail { world = "world", x = 0.0, y = 64.0, z = 0.0, countdown = "online-only" }
# }
#
# Jails defined in-game with /setjail are stored in the database and merge with the
# "jails" list above; /jail and /jails see both, and a stored jail's location wins
# over a same-named config entry. Remove a stored jail with /deljail; a config jail
# is removed by editing this file.
