# Communication: join/quit/death messages, announcer, /rules /motd /info. Ships enabled, inert by default.
#
# This file holds only the module switch. The OPERATOR CONTENT lives in three sibling files in this folder:
#   join-quit.conf   the join / quit / death message templates, first-join, and the death info page
#   announcer.conf   the rotating announcer lines and cadence
#   info-pages.conf  the /rules, /motd, /info page bodies
#
# Everything in those files is MiniMessage rendered as written; these are NOT plugin strings and are not
# translated through messages_<lang>.conf. The module ships ENABLED, but each content file ships inert (the channels
# keep the vanilla message, the announcer has no lines), so out of the box nothing changes; author a template in a
# content file and it takes effect with no further toggle. Set enabled = false to turn the module off entirely.
enabled = true
