# Communication — join/quit/death messages, announcer, /rules /motd /info. Ships disabled.
#
# This module holds OPERATOR CONTENT only: the join / quit / death message templates, the rotating
# announcer lines, and the /rules and /motd page bodies. Every value below is MiniMessage and is rendered
# as written — these are NOT plugin strings and are not translated through messages_<lang>.conf.
#
# The module ships DISABLED. Everything below is inert by default — every channel defers to the vanilla
# server message, the announcer has no lines, and no info pages are declared — so enabling the module with
# this file unchanged keeps the vanilla behaviour. Uncomment and edit a block to take it over.
#
# Placeholders available in connection templates:
#   {player}      the account name
#   {displayname} the player's display name (flattened to plain text)
#   {count}       the online player count
#   {world}       the player's world name
# Death templates also expose {message} (the vanilla death line as plain text).
enabled = false

# --- Join channel -----------------------------------------------------------------------------------
# mode: DEFAULT (keep vanilla) | DISABLE (hide it) | CUSTOM (render a template below)
# ordering: SEQUENTIAL (author order, wrapping) | RANDOM
join {
  mode = DEFAULT
  ordering = SEQUENTIAL
  templates = [
    # "<yellow>{player}</yellow> <gray>joined — <white>{count}</white> online."
  ]
}

# --- Quit channel -----------------------------------------------------------------------------------
quit {
  mode = DEFAULT
  ordering = SEQUENTIAL
  templates = [
    # "<yellow>{player}</yellow> <gray>left."
  ]
}

# --- Death channel ----------------------------------------------------------------------------------
death {
  mode = DEFAULT
  ordering = SEQUENTIAL
  templates = [
    # "<red>{player}</red> <gray>died: <white>{message}</white>"
  ]
}

# An optional one-off line broadcast only on a player's FIRST-EVER join. Leave blank to disable.
first-join = ""

# An optional info page (see info-pages below) shown to a player when they die. Leave blank to disable.
death-info-page = ""

# --- Announcer --------------------------------------------------------------------------------------
# A rotating broadcast on a timer. With no lines it never fires. min-players gates an empty server;
# ordering RANDOM never repeats the previous line back-to-back when more than one line is configured.
announcer {
  interval-seconds = 300
  min-players = 1
  ordering = RANDOM
  lines = [
    # "<gray>Tip: claim land with <white>/claim</white>."
    # "<gray>Vote daily at <white>/vote</white> for rewards."
  ]
}

# --- Info pages -------------------------------------------------------------------------------------
# Each entry auto-registers a command of the same name (/rules, /motd, /info, …) that prints the lines
# to the runner. The command is gated by uxmessentials.communication.info.<name>. Add or remove pages
# freely; an empty info-pages block registers no info commands.
info-pages {
  # rules = [
  #   "<gold><bold>Server rules</bold></gold>"
  #   "<gray>1. Be respectful.</gray>"
  #   "<gray>2. No griefing.</gray>"
  # ]
  # motd = [
  #   "<green>Welcome, {player}!</green>"
  # ]
}
