# Layout of the communication admin panel (opened by /communication gui, or /uxmess gui for an admin). Titles,
# labels and value lore stay in the message catalog (messages_<lang>.conf); only the geometry and the materials
# live here, so editing this file never touches a translation.

# Menu height in rows (1..6). Three rows hold the four buttons with a back button on the bottom row.
rows = 3

# The i-th button is drawn in the i-th slot below, and a click on that slot resolves back to it. The button
# order, set in code, is: chat-lock toggle (/togglechat), clear chat (/clearchat, confirm-gated), broadcast a
# message (/broadcast, anvil prompt), open the announcer list (/announce list, read-only).
property-slots = [10, 12, 14, 16]

# Slot the back button (closes the panel) sits in.
back-slot = 22

# This panel never deletes; leave the delete slot off (-1) so no delete button is drawn.
delete-slot = -1

# Materials for the back button, the (unused) delete button, and the background filler.
back-icon = "ARROW"
delete-icon = "BARRIER"
filler = "BLACK_STAINED_GLASS_PANE"
