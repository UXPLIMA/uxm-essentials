# Layout of the per-announcement editor; the property grid opened by clicking an announcement in the /announce
# editor list. One button per editable property (message, enabled, the five channel toggles, world target,
# permission target), drawn in property order into property-slots; a back button and a confirm-gated delete button.
# Every label and value stays in the message catalog (messages_<lang>.conf); only the geometry and icons live here.

# Menu height in rows (1..6). Three rows hold the nine properties plus the back/delete row.
rows = 3

# Slots the property buttons fill, in property order: message, enabled, chat, action-bar, title, subtitle, boss-bar,
# world target, permission target.
property-slots = [10, 11, 12, 13, 14, 15, 16, 19, 20]

# Slot the back button sits in (returns to the editor list).
back-slot = 22

# Slot the delete button sits in (confirm-gated). A -1 slot hides it (announcements are deletable, so it is shown).
delete-slot = 26

# Materials of the back, delete, and filler cells.
back-icon = "ARROW"
delete-icon = "BARRIER"
filler = "BLACK_STAINED_GLASS_PANE"
