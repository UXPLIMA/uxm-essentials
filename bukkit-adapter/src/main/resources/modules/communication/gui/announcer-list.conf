# Layout of the read-only announcer list (opened from the announcements button on the communication admin panel).
# It mirrors the /announce list surface: one page per configured announcement, paged when there are more than fit.
# Titles and lore stay in the message catalog (messages_<lang>.conf); only the geometry and the icons live here.

# Menu height in rows (1..6). Six rows give 45 content slots above the reserved navigation row.
rows = 6

# Icon an announcement falls back to in the list (the renderer supplies PAPER per entry anyway).
fallback-icon = "PAPER"

# Material of the previous/next page buttons.
nav-icon = "ARROW"

# Slots the previous- and next-page buttons sit in (bottom row of a six-row menu).
prev-slot = 48
next-slot = 50

# Slots the announcement pages fill. Leave empty to use every slot except the bottom navigation row.
content-slots = []

# Material the unused border cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"

# The announcer list is read-only — there is no create button (a -1 create-slot hides it).
create-slot = -1
create-icon = "LIME_DYE"
