# Layout of the /announce editor list — the paginated picker of the DB-backed store announcements, opened by bare
# /announce (and /announce editor). One page per configured announcement, with a create button; clicking an entry
# opens its property editor. Titles and lore stay in the message catalog (messages_<lang>.conf); only the geometry
# and the icons live here.

# Menu height in rows (1..6). Six rows give 45 content slots above the reserved navigation row.
rows = 6

# Icon an announcement falls back to (the renderer supplies PAPER when enabled, GRAY_DYE when disabled per entry).
fallback-icon = "PAPER"

# Material of the previous/next page buttons.
nav-icon = "ARROW"

# Slots the previous- and next-page buttons sit in (bottom row of a six-row menu).
prev-slot = 48
next-slot = 50

# Slots the announcement pages fill. Leave empty to use every slot except the bottom navigation row.
content-slots = []

# Material the unused border cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"

# The create button: its slot (bottom row, between the nav buttons) and material. A -1 slot hides it.
create-slot = 49
create-icon = "LIME_DYE"

# The settings button: its slot (bottom-right, clear of the nav buttons) and material. A -1 slot hides it.
action-slot = 53
action-icon = "COMPARATOR"
