# Communication: advancement notifications. Operator content; rendered as MiniMessage, never translated.
#
# Broadcasts a player earning an advancement with your own template instead of the vanilla chat line. Ships off:
# with enabled = false the vanilla line is left exactly as the server sends it, so turning the feature off changes
# nothing. When you enable it, the vanilla line is suppressed and replaced by the broadcast below so a player never
# sees the achievement twice.
#
# Filtering decides which advancements announce:
#   exclude-recipes    drop recipe-unlock advancements (minecraft:recipes/...), which are noisy and silent in vanilla
#   only-announceable  only advancements vanilla itself announces to chat (skips hidden/technical ones)
#   allow              when non-empty, ONLY these advancement keys announce (an allow-list overrides everything else)
#   deny               these advancement keys never announce (checked before the allow-list)
#
# A vanished player's advancement is suppressed entirely (no vanilla line, no broadcast). A
# player who ran /broadcasttoggle to opt out of broadcasts does not receive these notices either.
#
# Template placeholders: {player} the earner, {advancement} the namespaced key (e.g. minecraft:end/kill_dragon),
# {title} the advancement's title, {description} its description. PlaceholderAPI (%papi%) and MiniMessage are
# supported. channels can target CHAT, ACTION_BAR, TITLE, SUBTITLE, or BOSS_BAR. sound is an optional sound key.
advancements {
  enabled = false
  exclude-recipes = true
  only-announceable = true

  allow = []
  deny = []

  template = "<tag:'NEWS'> <value>{player}</value> <body>ʜᴀꜱ ᴍᴀᴅᴇ ᴛʜᴇ ᴀᴅᴠᴀɴᴄᴇᴍᴇɴᴛ</body> <good>[{title}]</good>"
  channels = [ "CHAT" ]
  sound = ""

  # Per-advancement template overrides, keyed by the namespaced advancement key. A key listed here uses its own
  # template instead of the global one above.
  per-advancement {
    # "minecraft:end/kill_dragon" = "<tag:'NEWS'> <value>{player}</value> <body>ʜᴀꜱ ꜱʟᴀɪɴ ᴛʜᴇ ᴇɴᴅᴇʀ ᴅʀᴀɢᴏɴ!</body>"
    # "minecraft:nether/all_potions" = "<tag:'NEWS'> <value>{player}</value> <body>ʙʀᴇᴡᴇᴅ ᴇᴠᴇʀʏ ᴘᴏᴛɪᴏɴ:</body> <good>[{title}]</good>"
  }
}
