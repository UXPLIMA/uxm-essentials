# Communication — rotating announcer. Operator content; rendered as MiniMessage, never translated.
#
# A rotating broadcast on a timer. With no announcements it never fires, so this file is inert by default and
# enabling the module with it unchanged keeps the server quiet. min-players gates an empty server; ordering RANDOM
# never repeats the previous announcement back-to-back when more than one rotates.
#
# Each announcement can target multiple channels (CHAT, ACTION_BAR, TITLE, SUBTITLE, BOSS_BAR), be gated by a
# per-viewer condition (permission / world / gamemode / a %papi% comparison), play a sound, and override the
# default interval with its own cadence. Lines support PlaceholderAPI (%papi%) and MiniMessage.
#
# Conditions (fail-safe — an unparseable condition hides the announcement rather than always showing it):
#   permission:uxmessentials.vip        only viewers with the node
#   world:nether                        only viewers in that world
#   gamemode:survival                   only viewers in that gamemode
#   %vault_eco_balance% >= 1000         a numeric/string comparison over a placeholder
#   permission:uxmessentials.vip && world:hub   combine with && (all) or || (any), negate with !
announcer {
  default-interval-seconds = 300
  min-players = 1
  ordering = RANDOM

  # Title/boss-bar timing for the TITLE/SUBTITLE/BOSS_BAR channels (defaults shown).
  display {
    title { fade-in-ms = 500, stay-ms = 2000, fade-out-ms = 500 }
    boss-bar { color = PURPLE, overlay = PROGRESS, seconds = 4 }
  }

  announcements = [
    # A simple chat tip.
    # { id = "claim", channels = [ "CHAT" ], lines = [ "<gray>Tip: claim land with <white>/claim</white>." ] }

    # A title + sound announcement.
    # {
    #   id = "vote"
    #   channels = [ "TITLE", "SUBTITLE" ]
    #   lines = [ "<gold>Vote for rewards", "<gray>Run <white>/vote</white>" ]
    #   sound = "entity.player.levelup"
    # }

    # A permission-gated announcement on its own cadence (every 10 minutes), only for VIPs.
    # {
    #   id = "vip"
    #   channels = [ "ACTION_BAR" ]
    #   lines = [ "<aqua>Thanks for supporting the server, %player_name%!" ]
    #   condition = "permission:uxmessentials.vip"
    #   interval-seconds = 600
    # }
  ]
}

# Back-compat: the legacy flat form still works — a top-level `lines` list (with the old `interval-seconds` key)
# is read as one unconditional CHAT announcement named "default":
#
# announcer {
#   interval-seconds = 300
#   min-players = 1
#   ordering = RANDOM
#   lines = [ "<gray>Tip one", "<gray>Tip two" ]
# }
