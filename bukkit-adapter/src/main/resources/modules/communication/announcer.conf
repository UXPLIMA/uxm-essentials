# Communication — rotating announcer. Operator content; rendered as MiniMessage, never translated.
#
# A rotating broadcast on a timer. With no lines it never fires, so this file is inert by default and enabling
# the module with it unchanged keeps the server quiet. min-players gates an empty server; ordering RANDOM never
# repeats the previous line back-to-back when more than one line is configured.
announcer {
  interval-seconds = 300
  min-players = 1
  ordering = RANDOM
  lines = [
    # "<gray>Tip: claim land with <white>/claim</white>."
    # "<gray>Vote daily at <white>/vote</white> for rewards."
  ]
}
