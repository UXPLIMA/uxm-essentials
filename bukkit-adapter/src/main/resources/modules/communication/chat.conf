# Communication: public chat format. Operator content (MiniMessage), NOT a translated plugin string.
#
# When enabled, every public chat line is rendered through the `format` below instead of the vanilla
# "Name: message". The format is MiniMessage; these placeholders are filled per speaker before it is parsed:
#   <prefix>        the speaker's LuckPerms chat prefix (empty when unset / LuckPerms absent)
#   <suffix>        the speaker's LuckPerms chat suffix
#   <display_name>  the speaker's display name component (carries name-hover / name-click below)
#   <name>          the speaker's plain account name
#   <world>         the world the speaker is in
#   <message>       what the speaker typed
#
# The shipped default format is deliberately near-vanilla, so turning this on changes nothing surprising until
# you author your own. Set enabled = false to leave chat entirely to the server.
chat {
  enabled = true
  format = "<prefix><display_name><suffix><gray>:</gray> <message>"

  # Optional per-rank overrides. Each key is a LuckPerms primary group; its value is a MiniMessage format that
  # replaces `format` for a speaker in that group. Matched case-insensitively.
  group-formats {
    # admin = "<red>[Admin] <prefix><display_name><suffix><gray>:</gray> <message>"
  }

  # When true, a speaker who holds uxmessentials.communication.chat.format may write MiniMessage in their own
  # message (colours, gradients, …). Left false, a player's message is always inserted as plain text, so tags
  # they type show up literally.
  allow-player-format = false

  # Optional decoration for the <display_name> span. Blank = none. name-click supports {name}.
  name-hover = ""
  name-click = ""
}
