# Communication: info pages (data-driven text commands). Operator content; rendered as MiniMessage, never translated.
#
# Each entry below auto-registers a command of the same name (/info, /rules, /motd, …) that prints the lines to the
# runner; no code change, no restart-with-a-new-build: drop a new entry here and reload to get a new command. Add a
# /discord, /vote-info, /staff, anything: the entry name becomes the command literal. Each command is gated by
# uxmessentials.communication.info.<name>; the three shipped below default to everyone, a custom page you add is
# op-only until you grant its node.
#
# A page is paginated: long bodies are read with /<name> [page]. An entry is either a bare list of lines (default
# page size) or a section with `lines = [ ... ]` and an optional `page-size = N`. The {player} token is replaced with
# the runner's name, and %papi% placeholders resolve when PlaceholderAPI is installed.

# Show the `motd` page to a player when they join. On by default so a fresh server greets joining players with the
# message of the day below; the same body /motd shows, so edit `motd` to change both. Set false to send nothing on
# join (the /motd command still works). Only the motd shows here; the normal join broadcast (join-quit.conf) is
# independent and fires regardless.
motd-on-join = true

info-pages {
  info = [
    "<h:'Welcome to the server'> <value>{player}</value>!"
    "<body>ᴜꜱᴇꜰᴜʟ ᴄᴏᴍᴍᴀɴᴅꜱ:</body>"
    "<cta>/rules</cta> <muted>·</muted> <body>ʀᴇᴀᴅ ᴛʜᴇ ꜱᴇʀᴠᴇʀ ʀᴜʟᴇꜱ.</body>"
    "<cta>/motd</cta> <muted>·</muted> <body>ꜱᴇᴇ ᴛʜᴇ ᴍᴇꜱꜱᴀɢᴇ ᴏꜰ ᴛʜᴇ ᴅᴀʏ.</body>"
    "<cta>/spawn</cta> <muted>·</muted> <body>ʀᴇᴛᴜʀɴ ᴛᴏ ꜱᴘᴀᴡɴ.</body>"
    "<cta>/home</cta> <muted>·</muted> <body>ᴛᴇʟᴇᴘᴏʀᴛ ᴛᴏ ʏᴏᴜʀ ʜᴏᴍᴇ.</body>"
  ]
  rules = [
    "<h:'Server rules'>"
    "<muted>1.</muted> <body>ʙᴇ ʀᴇꜱᴘᴇᴄᴛꜰᴜʟ ᴛᴏ ᴏᴛʜᴇʀ ᴘʟᴀʏᴇʀꜱ ᴀɴᴅ ꜱᴛᴀꜰꜰ.</body>"
    "<muted>2.</muted> <body>ɴᴏ ɢʀɪᴇꜰɪɴɢ, ꜱᴛᴇᴀʟɪɴɢ, ᴏʀ ᴄʜᴇᴀᴛɪɴɢ.</body>"
    "<muted>3.</muted> <body>ᴋᴇᴇᴘ ᴄʜᴀᴛ ꜰʀɪᴇɴᴅʟʏ, ɴᴏ ꜱᴘᴀᴍ ᴏʀ ʜᴀʀᴀꜱꜱᴍᴇɴᴛ.</body>"
    "<muted>4.</muted> <body>ʜᴀᴠᴇ ꜰᴜɴ ᴀɴᴅ ʜᴇʟᴘ ᴏᴛʜᴇʀꜱ ᴡʜᴇɴ ʏᴏᴜ ᴄᴀɴ.</body>"
  ]
  motd = [
    "<h:'Welcome to the server'>"
    "<good>ɢʟᴀᴅ ᴛᴏ ʜᴀᴠᴇ ʏᴏᴜ ʜᴇʀᴇ,</good> <value>{player}</value>!"
    "<body>ᴛʏᴘᴇ <cta>/info</cta> ꜰᴏʀ ᴀ ǫᴜɪᴄᴋ ꜱᴛᴀʀᴛ, ᴏʀ <cta>/rules</cta> ᴛᴏ ʀᴇᴀᴅ ᴛʜᴇ ʀᴜʟᴇꜱ.</body>"
    "<body>ꜱᴇᴛ ʏᴏᴜʀ ʜᴏᴍᴇ ᴡɪᴛʜ <cta>/sethome</cta> ᴀɴᴅ ʀᴇᴛᴜʀɴ ᴀɴʏ ᴛɪᴍᴇ ᴡɪᴛʜ <cta>/home</cta>.</body>"
    "<muted>ʜᴀᴠᴇ ꜰᴜɴ, ᴀɴᴅ ʙᴇ ᴋɪɴᴅ ᴛᴏ ᴏᴛʜᴇʀ ᴘʟᴀʏᴇʀꜱ.</muted>"
  ]
}
