# Communication — info pages (data-driven text commands). Operator content; rendered as MiniMessage, never translated.
#
# Each entry below auto-registers a command of the same name (/info, /rules, /motd, …) that prints the lines to the
# runner — no code change, no restart-with-a-new-build: drop a new entry here and reload to get a new command. Add a
# /discord, /vote-info, /staff, anything: the entry name becomes the command literal. Each command is gated by
# uxmessentials.communication.info.<name>; the three shipped below default to everyone, a custom page you add is
# op-only until you grant its node.
#
# A page is paginated: long bodies are read with /<name> [page]. An entry is either a bare list of lines (default
# page size) or a section with `lines = [ ... ]` and an optional `page-size = N`. The {player} token is replaced with
# the runner's name, and %papi% placeholders resolve when PlaceholderAPI is installed.
info-pages {
  info = [
    "<#4aa3ff><bold>Welcome to the server, {player}!</bold></#4aa3ff>"
    "<#aeb8c4>Useful commands:</#aeb8c4>"
    "<#7cc7ff>/rules</#7cc7ff> <#aeb8c4>— read the server rules.</#aeb8c4>"
    "<#7cc7ff>/motd</#7cc7ff> <#aeb8c4>— see the message of the day.</#aeb8c4>"
    "<#7cc7ff>/spawn</#7cc7ff> <#aeb8c4>— return to spawn.</#aeb8c4>"
    "<#7cc7ff>/home</#7cc7ff> <#aeb8c4>— teleport to your home.</#aeb8c4>"
  ]
  rules = [
    "<#ffd166><bold>Server rules</bold></#ffd166>"
    "<#aeb8c4>1. Be respectful to other players and staff.</#aeb8c4>"
    "<#aeb8c4>2. No griefing, stealing, or cheating.</#aeb8c4>"
    "<#aeb8c4>3. Keep chat friendly — no spam or harassment.</#aeb8c4>"
    "<#aeb8c4>4. Have fun and help others when you can.</#aeb8c4>"
  ]
  motd = [
    "<#57e389>Welcome back, {player}!</#57e389>"
    "<#aeb8c4>Type <#7cc7ff>/info</#7cc7ff> for a quick start, or <#7cc7ff>/rules</#7cc7ff> to read the rules.</#aeb8c4>"
  ]
}
