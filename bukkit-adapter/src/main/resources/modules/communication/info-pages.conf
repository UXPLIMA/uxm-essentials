# Communication: info pages (data-driven text commands). Operator content, rendered as MiniMessage. A line written
# as @key reads a message catalogue entry in the reader's language (see modules/scoreboard/config.conf for the form).
#
# Each entry below auto-registers a command of the same name (/info, /rules, /motd, …) that prints the lines to the
# runner; no code change, no restart-with-a-new-build: drop a new entry here and reload to get a new command. Add a
# /discord, /vote-info, /staff, anything: the entry name becomes the command literal. Each command is gated by
# uxmessentials.communication.info.<name>; the three shipped below default to everyone, a custom page you add is
# op-only until you grant its node.
#
# A page is paginated: long bodies are read with /<name> [page]. An entry is either a bare list of lines (default
# page size) or a section with `lines = [ ... ]` and an optional `page-size = N`. The {player} token is replaced with
# the runner's name, and %papi% placeholders resolve when PlaceholderAPI is installed. A line that opens with
# <center> is drawn in the middle of the chat, measured as it draws, which suits a title and a line of dashes.

# Show the `motd` page to a player when they join. On by default so a fresh server greets joining players with the
# message of the day below; the same body /motd shows, so edit `motd` to change both. Set false to send nothing on
# join (the /motd command still works). Only the motd shows here; the normal join broadcast (join-quit.conf) is
# independent and fires regardless.
motd-on-join = true

# The pages, one entry each. The entry name is the command, so a name another command already uses clashes with it;
# pick a word of your own. The shipped lines are @content.* references, so every player reads them in their own
# language: change the words in messages/messages_<lang>.conf, or replace a reference with a line of your own.
info-pages {
  info = [
    "@content.info.welcome"
    "@content.info.commands"
    "@content.info.rules"
    "@content.info.motd"
    "@content.info.spawn"
    "@content.info.home"
  ]
  rules = [
    "@content.rules.title"
    "@content.rules.respect"
    "@content.rules.fair-play"
    "@content.rules.chat"
    "@content.rules.fun"
  ]
  motd = [
    "@content.motd.title"
    "@content.motd.greeting"
    "@content.motd.start"
    "@content.motd.homes"
    "@content.motd.farewell"
  ]
}
