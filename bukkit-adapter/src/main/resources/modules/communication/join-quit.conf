# Communication: connection messages. Operator content; rendered as MiniMessage, never translated.
#
# Everything here is inert by default; every channel defers to the vanilla server message, so enabling the
# module with this file unchanged keeps the vanilla behaviour. Uncomment and edit a block to take it over.
#
# Placeholders available in connection templates:
#   {player}      the account name
#   {displayname} the player's display name (flattened to plain text)
#   {count}       the online player count
#   {world}       the player's world name
# Death templates also expose:
#   {message}       the vanilla death line as plain text
#   {killer}        the killer's name when a player dealt the blow (empty otherwise)
#   {killer_weapon} the killer's held item; its custom name if renamed, else a readable material (empty otherwise)
#   {cause}         the classified death cause as a lowercase key (fall, pvp, lava, …)

# --- Join channel -----------------------------------------------------------------------------------
# mode: DEFAULT (keep vanilla) | DISABLE (hide it) | CUSTOM (render a template below)
# ordering: SEQUENTIAL (author order, wrapping) | RANDOM
#
# The join block is the DEFAULT policy; it greets every player whose LuckPerms primary group has no entry under
# `groups` below. A `groups` map lets one rank read differently: each key is a permission group (matched
# case-insensitively) and its value a list of templates chosen with the block's `ordering`. A group with no entry
# simply uses the default templates.
join {
  mode = DEFAULT
  ordering = SEQUENTIAL
  templates = [
    # "<yellow>{player}</yellow> <gray>joined; <white>{count}</white> online."
  ]
  groups {
    # admin = [ "<red><bold>{player}</bold></red> <gray>joined." ]
    # vip = [ "<gold>★ {player}</gold> <gray>joined; <white>{count}</white> online." ]
  }
}

# --- Quit channel -----------------------------------------------------------------------------------
quit {
  mode = DEFAULT
  ordering = SEQUENTIAL
  templates = [
    # "<yellow>{player}</yellow> <gray>left."
  ]
}

# --- Death channel ----------------------------------------------------------------------------------
# The death block is the DEFAULT policy; it applies to every death whose cause has no entry under `causes`
# below. A `causes` map lets one cause read differently: each key is a damage cause and its value a list of
# templates chosen with the block's `ordering`. Recognised cause keys include PVP (a player killer),
# MOB (a creature), PROJECTILE, FALL, LAVA, FIRE, DROWNING, EXPLOSION, VOID, LIGHTNING, MAGIC, WITHER,
# FALLING_BLOCK, THORNS, DRAGON_BREATH, FLY_INTO_WALL, HOT_FLOOR, CONTACT, FREEZE, SONIC_BOOM (full list
# in DeathCause). An unknown key is ignored, and an unlisted cause simply uses the default templates.
death {
  mode = DEFAULT
  ordering = SEQUENTIAL
  templates = [
    # "<red>{player}</red> <gray>died: <white>{message}</white>"
  ]
  causes {
    # PVP = [ "<red>{player}</red> <gray>was slain by <red>{killer}</red> <gray>using <white>{killer_weapon}</white>" ]
    # FALL = [ "<gray>{player} <white>fell from a high place" ]
    # MOB = [ "<gray>{player} <white>was cut down by a monster" ]
  }
}

# A welcome broadcast only on a player's FIRST-EVER join, replacing the ordinary join line for that one join.
# Same shape as a channel: mode DEFAULT (no welcome) | CUSTOM (render a template). Leave it DEFAULT to disable.
# The legacy single-string form `first-join = "<welcome {player}!>"` still works.
first-join {
  mode = DEFAULT
  ordering = SEQUENTIAL
  templates = [
    # "<gold>Welcome <white>{player}</white> to the server! Player #<white>{count}</white>.</gold>"
  ]
}

# A personal MOTD sent ONLY to the joining player (never broadcast), after the join line. Lines are MiniMessage and
# are PlaceholderAPI-expanded when PlaceholderAPI is installed. Leave the list empty to disable; when empty the
# legacy `motd` info page (info-pages.conf, gated by motd-on-join) is used instead.
motd = [
  # "<gray>Welcome back, <white>{player}</white>!"
  # "<gray>Type <yellow>/help</yellow> for commands."
]

# An optional info page (see info-pages.conf) shown to a player when they die. Leave blank to disable.
death-info-page = ""
