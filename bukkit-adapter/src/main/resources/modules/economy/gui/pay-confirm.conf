# Layout of the /pay confirmation menu (shown when a payment exceeds the confirm threshold). Titles, button
# labels, and lore stay in the message catalog (messages_<lang>.conf); only the geometry and the icons live
# here, so editing this file never touches a translation.

# Menu height in rows (1..6). One row is the confirm/recipient/value/cancel strip.
rows = 1

# Background filler for any slot a button does not occupy.
filler-material = "GRAY_STAINED_GLASS_PANE"

# Anchor slot of each element. The confirm block fills three slots from its anchor, the cancel block four.
slots {
  confirm = 0
  recipient = 3
  value = 4
  cancel = 5
}

# Icon material of each element.
materials {
  confirm = "GREEN_STAINED_GLASS_PANE"
  recipient = "PLAYER_HEAD"
  value = "PAPER"
  cancel = "RED_STAINED_GLASS_PANE"
}
