# Layout of the /exchange currency-swapper menu. Titles, button labels, and lore stay in the message catalog
# (messages_<lang>.conf); only the geometry and the icons live here, so editing this file never touches a
# translation.

# Menu height in rows (1..6).
rows = 3

# Background filler for any slot a button does not occupy.
filler-material = "GRAY_STAINED_GLASS_PANE"

# Slot of each element. The source/target icons use the per-currency icon-material from currencies.conf, so
# only their slots live here, not their materials.
slots {
  source = 11
  info = 13
  target = 15
  close = 22
}

# Icon material of each element. The info button switches to the no-rate material when no rate is configured
# between the two currencies.
materials {
  info = "SUNFLOWER"
  no-rate = "BARRIER"
  close = "BARRIER"
}
