# The bare-/eco admin hub, rendered through the menu engine. A three-row panel with three entries; [Manage a
# player] opens the shared player picker and routes the picked target to the per-player manage screen,
# [Server-wide] opens the bulk give-all / reset-all screen, and [Transaction history] opens the global
# transaction log; plus a close button. The raw /eco give|take|set|reset … subcommands are untouched; this
# hub is only the bare-root opener.
#
# The hub carries the viewer reference as its subject, so the picker and the bulk/history opens reach the live
# viewer without the renderer touching a port. Every label resolves from the economy catalog, so no user-facing
# text lives here. The geometry mirrors the original fixed three-row hub exactly.
title = "@eco.admin-gui.title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the entries drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # Manage a single player: open the shared player picker, then route the picked target to the per-player manage
  # screen, exactly as the old hub did.
  manage {
    slot     = 11
    material = PLAYER_HEAD
    name     = "@eco.admin-gui.manage-name"
    lore     = ["@eco.admin-gui.manage-lore"]
    priority = 10
    click { left = ["economy:admin-manage"] }
  }

  # Open the server-wide give-all / reset-all screen, exactly as the old hub did.
  bulk {
    slot     = 13
    material = BEACON
    name     = "@eco.admin-gui.bulk-name"
    lore     = ["@eco.admin-gui.bulk-lore"]
    priority = 10
    click { left = ["economy:admin-bulk"] }
  }

  # Open the global transaction-history log, exactly as the old hub did.
  history {
    slot     = 15
    material = BOOK
    name     = "@eco.admin-gui.history-name"
    lore     = ["@eco.admin-gui.history-lore"]
    priority = 10
    click { left = ["economy:admin-history"] }
  }

  # Close the panel.
  close {
    slot     = 22
    material = BARRIER
    name     = "@eco.admin-gui.close"
    priority = 10
    click { left = ["close"] }
  }
}
