# The /loan dashboard, rendered through the menu engine. A three-row panel: the viewer's credit profile (a
# sunflower with the credit score, the interest rate at that score, and the per-currency loan limit), a strip of
# the viewer's active loans (one book per loan), a request-a-new-loan button, and a close button.
#
# The credit profile and the active loans are read off the tick thread when the panel opens and handed in as the
# menu subject, so the profile display and the loan strip fill from the loan_* placeholders without the renderer
# touching a port. Each loan in the strip is multi-gesture, all routed through the one economy:loan-entry action
# which branches on the click: left pays an installment, right pays the loan off, and a shift-click prompts for a
# custom amount through the shared input seam. Every label resolves from the economy catalog, so no user-facing
# text lives here. The geometry mirrors the original fixed three-row dashboard exactly.
title = "@loan.gui-title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the profile, the loan strip, and the buttons drawn below sit on
  # top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The viewer's credit profile. A read-only display; its name and lore read the subject through the
  # loan_profile_name and loan_profile_lore placeholders (score, interest at that score, and the per-currency
  # limit), so the render touches no port.
  profile {
    slot     = 4
    material = SUNFLOWER
    name     = "%loan_profile_name%"
    lore     = ["%loan_profile_lore%"]
    priority = 10
  }

  # The active-loan strip across the middle row's slots 10..16 (capped, exactly as the old dashboard was). Each
  # entry is a book whose name and lore read the bound loan through the loan_entry_* placeholders; every gesture
  # routes through the one economy:loan-entry action, which branches on the click; left pays an installment, right
  # pays the loan off, and a shift-click prompts for a custom amount through the input seam.
  loans {
    slots    = ["10-16"]
    priority = 5
    list {
      source = "economy:loan-list"
      template {
        material = "%loan_entry_icon%"
        name     = "%loan_entry_name%"
        lore     = ["%loan_entry_lore%"]
        click {
          left        = ["economy:loan-entry"]
          right       = ["economy:loan-entry"]
          shift_left  = ["economy:loan-entry"]
          shift_right = ["economy:loan-entry"]
        }
      }
    }
  }

  # Request a new loan: pick a currency through the shared engine picker, then prompt for an amount and an
  # installment count through the input seam, exactly as the old request button did.
  request {
    slot     = 20
    material = EMERALD_BLOCK
    name     = "@loan.gui-request-name"
    lore     = ["@loan.gui-request-lore", "", "@loan.gui-request-hint"]
    priority = 10
    click { left = ["economy:loan-request"] }
  }

  # Close the panel.
  close {
    slot     = 22
    material = BARRIER
    name     = "@loan.gui-close"
    priority = 10
    click { left = ["close"] }
  }
}
