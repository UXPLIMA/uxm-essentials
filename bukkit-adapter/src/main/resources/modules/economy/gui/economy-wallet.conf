# The personal wallet dashboard (/wallet [currency], and the economy entry on the /uxmess gui hub), rendered
# through the menu engine. A three-row panel showing the viewer's balance for one currency: a virtual-balance
# display, a physical-banknotes tally, a button into the engine transaction-history list, and a close button.
# The balance and the banknote tally are read off the tick thread when the panel opens and handed in as the menu
# subject, so the two display items fill their value lines from the wallet_balance / wallet_banknotes
# placeholders without the renderer touching a port. Every label resolves from the economy catalog, so no
# user-facing text lives here. The geometry mirrors the original fixed three-row dashboard exactly.
title = "@wallet.gui-title"
rows = 3

items {
  # The grey-glass backdrop. Lowest priority, so the items drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The virtual balance for the opened currency. A read-only display; its value line reads the subject's balance
  # through the wallet_balance placeholder.
  balance {
    slot     = 11
    material = GOLD_INGOT
    name     = "@wallet.gui-balance-name"
    lore     = ["@wallet.gui-balance-lore"]
    priority = 10
  }

  # The physical banknotes the viewer is carrying, tallied at open time. A read-only display; its value line reads
  # the subject's banknote total through the wallet_banknotes placeholder.
  banknotes {
    slot     = 13
    material = PAPER
    name     = "@wallet.gui-banknotes-name"
    lore     = ["@wallet.gui-banknotes-lore"]
    priority = 10
  }

  # Open the read-only transaction-history list (the engine economy-transactions menu), exactly as the old history
  # button did.
  history {
    slot     = 15
    material = BOOK
    name     = "@wallet.gui-history-name"
    lore     = ["@wallet.gui-history-lore"]
    priority = 10
    click { left = ["economy:open-history"] }
  }

  # Close the panel.
  close {
    slot     = 22
    material = BARRIER
    name     = "@baltop.gui-close"
    priority = 10
    click { left = ["close"] }
  }
}
