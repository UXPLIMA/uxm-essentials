# Layout of the /loan dashboard menu. Titles, button labels, and lore stay in the message catalog
# (messages_<lang>.conf); only the geometry and the icons live here, so editing this file never touches a
# translation.

# Menu height in rows (1..6).
rows = 3

# Background filler for any slot a button does not occupy.
filler-material = "GRAY_STAINED_GLASS_PANE"

# Slot of each element. Active loans flow from loan-first-slot to loan-last-slot (one per loan).
slots {
  profile = 4
  loan-first = 10
  loan-last = 16
  request = 20
  close = 22
}

# Icon material of each element. The profile and per-loan icons use fixed materials in code (a sunflower and a
# book), so only the request and close icons are configurable here.
materials {
  request = "EMERALD_BLOCK"
  close = "BARRIER"
}
