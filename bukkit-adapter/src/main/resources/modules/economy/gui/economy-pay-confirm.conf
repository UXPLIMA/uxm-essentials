# The /pay confirmation strip, rendered through the menu engine. A one-row window shown when a /pay exceeds the
# currency's confirmation threshold: a confirm block, the recipient head, the value, and a cancel block. The
# pending payment (the recipient and the amount) is handed in as the menu subject, so the confirm/recipient/value
# items fill their lines from the payconfirm_target / payconfirm_amount placeholders. A left click on the confirm
# block runs the payer's staged transfer through the same Pay use case /payconfirm uses; a left click on the
# cancel block aborts and closes. Every label resolves from the economy catalog, so no user-facing text lives
# here. The geometry mirrors the original fixed one-row strip exactly.
#
# The recipient icon renders as a generic PLAYER_HEAD rather than the recipient's skin: a static spec item carries
# no per-open skull owner (only a list template paints owned heads), and the head is purely cosmetic; the name
# still names the recipient. The confirm and cancel blocks span three and four slots from their anchors, as the
# original strip did.
title = "@pay.confirm-gui-title"
rows = 1

items {
  # The grey-glass backdrop. Lowest priority, so the buttons drawn below sit on top of it.
  filler {
    slots    = ["0-8"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The confirm block, spanning the first three slots. A left click runs the staged transfer.
  confirm {
    slots    = ["0-2"]
    material = GREEN_STAINED_GLASS_PANE
    name     = "@pay.confirm-gui-confirm-name"
    lore     = [
      "@pay.confirm-gui-confirm-lore-hint",
      "@pay.confirm-gui-confirm-lore-target",
      "@pay.confirm-gui-confirm-lore-amount"
    ]
    priority = 10
    click { left = ["economy:pay-confirm"] }
  }

  # The recipient head. A read-only display; its name reads the subject's target through the payconfirm_target
  # placeholder.
  recipient {
    slot     = 3
    material = PLAYER_HEAD
    name     = "@pay.confirm-gui-recipient-name"
    priority = 10
  }

  # The value being transferred. A read-only display; its name reads the subject's amount through the
  # payconfirm_amount placeholder.
  value {
    slot     = 4
    material = PAPER
    name     = "@pay.confirm-gui-value-name"
    lore     = ["@pay.confirm-gui-value-lore"]
    priority = 10
  }

  # The cancel block, spanning the last four slots. A left click aborts and closes.
  cancel {
    slots    = ["5-8"]
    material = RED_STAINED_GLASS_PANE
    name     = "@pay.confirm-gui-cancel-name"
    lore     = ["@pay.confirm-gui-cancel-lore"]
    priority = 10
    click { left = ["economy:pay-cancel"] }
  }
}
