# The per-bank actions panel, rendered through the menu engine. A three-row panel reached by clicking a bank in the
# /bank list: deposit (capture an amount through the shared input seam, credited from the viewer's wallet), withdraw
# (capture an amount, paid back to the wallet), members (the engine bank-members grid), logs (the engine
# transaction-history list scoped to this bank) and back (the engine bank list). The bank the panel acts on is
# handed in as the menu subject, so the title fills its {bank_actions_name} token without the renderer touching a
# port; the buttons resolve their labels from the economy catalog.
#
# The deposit/withdraw amount entry rides the shared anvil seam, then the bank use case runs off the tick thread,
# exactly as the old view did. Members, logs and back open the already-migrated engine menus through the bank
# navigation router. Every label resolves from the economy catalog, so no user-facing text lives here. The geometry
# mirrors the original fixed three-row screen exactly: deposit@10, withdraw@12, members@14, logs@16, back@22 over a
# grey-glass backdrop.
title = "@bank.actions-gui-title"
rows = 3

items {
  # The grey-glass backdrop. Lowest priority, so the buttons drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # Deposit: capture an amount through the input seam, then credit the bank from the viewer's wallet.
  deposit {
    slot     = 10
    material = GOLD_INGOT
    name     = "@bank.actions-gui-deposit-name"
    lore     = ["@bank.actions-gui-deposit-lore", "", "@bank.actions-gui-deposit-hint"]
    priority = 10
    click { left = ["economy:bank-deposit"] }
  }

  # Withdraw: capture an amount, then pay it back from the bank into the viewer's wallet.
  withdraw {
    slot     = 12
    material = IRON_INGOT
    name     = "@bank.actions-gui-withdraw-name"
    lore     = ["@bank.actions-gui-withdraw-lore", "", "@bank.actions-gui-withdraw-hint"]
    priority = 10
    click { left = ["economy:bank-deposit-withdraw"] }
  }

  # Members: open the engine bank-members grid for this bank through the navigation router.
  members {
    slot     = 14
    material = PLAYER_HEAD
    name     = "@bank.actions-gui-members-name"
    lore     = ["@bank.actions-gui-members-lore", "", "@bank.actions-gui-members-hint"]
    priority = 10
    click { left = ["economy:bank-members"] }
  }

  # Logs: open the engine transaction-history list scoped to this bank.
  logs {
    slot     = 16
    material = BOOK
    name     = "@bank.actions-gui-logs-name"
    lore     = ["@bank.actions-gui-logs-lore", "", "@bank.actions-gui-logs-hint"]
    priority = 10
    click { left = ["economy:bank-logs"] }
  }

  # Back to the engine bank list.
  back {
    slot     = 22
    material = BARRIER
    name     = "@bank.actions-gui-back"
    priority = 10
    click { left = ["economy:bank-actions-back"] }
  }
}
