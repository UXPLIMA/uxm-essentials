# The /bank list menu, rendered through the menu engine. A paginated grid of one chest per shared bank the viewer
# belongs to; the clickable twin of the bare /bank read-out. Each chest is named and lored with the bank's name,
# id, balance, creator and member count through the bank_* placeholders, and a left click opens that bank's bespoke
# actions hub. The bottom row carries a create button and the two page arrows.
#
# The bank list is a repository read with no Bukkit call, but each bank is resolved per id, so the open runs the
# read off the tick thread and hands the already-read banks in as the menu subject; the economy:banks list source
# only reads that subject. A left click opens the still-bespoke bank-actions panel through economy:open-bank; the
# create button opens the still-bespoke currency picker through economy:create-bank, exactly as the old button did.
# Every label resolves from the economy message catalog, so no user-facing text lives here. The geometry mirrors the
# original list exactly: a grid across the top five rows, the prev/next arrows at the corners of the bottom row, the
# create button in its centre, and grey-glass fillers between them.
title = "@bank.list-gui-title"
rows = 6

items {
  # The grey-glass backdrop on the bottom row's gaps only; the content grid above leaves empty cells empty, exactly
  # as the original list did (it filled only the non-content, non-button slots).
  filler {
    slots    = ["46-48", "50-52"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The bank grid, paginated across the top five rows. Each cell is a CHEST with the name/balance/creator/members
  # name and lore; a left click opens that bank's bespoke actions hub through economy:open-bank.
  banks {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "economy:banks"
      template {
        material = CHEST
        name     = "@bank.list-gui-icon-name"
        lore     = [
          "@bank.list-gui-icon-balance",
          "@bank.list-gui-icon-creator",
          "@bank.list-gui-icon-members",
          "",
          "@bank.list-gui-icon-hint"
        ]
        click { left = ["economy:open-bank"] }
      }
    }
  }

  # Previous page. Pinned to the bottom-left corner, exactly where the original list placed it.
  previous {
    slot     = 45
    type     = PREVIOUS
    material = ARROW
    name     = "@bank.list-gui-prev"
    priority = 10
  }

  # Create a new shared bank: open the bespoke currency picker, exactly as the old create button did. Centred on the
  # bottom row, the EMERALD_BLOCK the original list used.
  create {
    slot     = 49
    material = EMERALD_BLOCK
    name     = "@bank.list-gui-create"
    lore     = ["@bank.list-gui-create-lore"]
    priority = 10
    click { left = ["economy:create-bank"] }
  }

  # Next page. Pinned to the bottom-right corner.
  next {
    slot     = 53
    type     = NEXT
    material = ARROW
    name     = "@bank.list-gui-next"
    priority = 10
  }
}
