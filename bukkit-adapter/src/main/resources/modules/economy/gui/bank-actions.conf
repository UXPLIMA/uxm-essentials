# Layout of the per-bank actions menu (deposit, withdraw, members, logs, back). Titles, button labels, and
# lore stay in the message catalog (messages_<lang>.conf); only the geometry and the icons live here, so
# editing this file never touches a translation.

# Menu height in rows (1..6).
rows = 3

# Background filler for any slot a button does not occupy.
filler-material = "GRAY_STAINED_GLASS_PANE"

# Slot of each element.
slots {
  deposit = 10
  withdraw = 12
  members = 14
  logs = 16
  back = 22
}

# Icon material of each element.
materials {
  deposit = "GOLD_INGOT"
  withdraw = "IRON_INGOT"
  members = "PLAYER_HEAD"
  logs = "BOOK"
  back = "BARRIER"
}
