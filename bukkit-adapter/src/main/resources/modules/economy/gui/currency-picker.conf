# The currency picker, shared by the /eco admin screens and the loan request flow. It grids one icon per configured
# currency and hands the clicked one back to the screen that opened it.
#
# The icons are the economy:currency-picker list source, and each currency's icon material, name and lore come from
# the currency definition itself through the currency_picker_* placeholders. The currency the caller marked active
# glints, which is what the %currency_picker_active% token on the glow field drives; its lore carries the extra
# "active" line.
#
# The geometry mirrors the original picker: the grid over slots 0..44, previous at 48 and next at 50.
title = "@eco.admin-gui.currency-picker-title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the grid and the arrows draw on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    decor    = { hide-tooltip = true }
    priority = 0
  }

  # One icon per configured currency. A left click hands it to the screen that opened the picker.
  currencies {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "economy:currency-picker"
      template {
        material = "%currency_picker_icon%"
        name     = "%currency_picker_name%"
        lore     = ["%currency_picker_lore%"]
        decor { glow = "%currency_picker_active%" }
        click { left = ["economy:currency-pick"] }
      }
    }
  }

  # Previous page, directly left of the centre of the bottom row.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@eco.admin-gui.currency-picker-previous"
    priority = 10
  }

  # Next page, directly right of the centre of the bottom row.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@eco.admin-gui.currency-picker-next"
    priority = 10
  }
}
