# The read-only transaction-history list, rendered through the menu engine. A paginated grid of one icon per ledger
# row — a player's history, the global log, or a bank's logs, the three reads the original view served from one
# layout. Each icon's material follows the row's kind (a gold block for an admin mutation, lime wool for a credit,
# red wool for a debit, paper otherwise) through the history_icon placeholder, and the name and lore resolve from the
# economy catalog, filled with the type, id, date, counterparties, amount and reason through the history_* tokens.
# The title resolves to the global/player/bank line through the subject-driven history_title_key, so one spec serves
# all three entry points.
#
# The history is a DB read, so each open runs the flush and the bounded query off the tick thread and hands the
# already-read rows in as the menu subject; the economy:transactions list source only reads that subject, touching no
# port off-thread. A click does nothing — a ledger row is immutable. Every label resolves from the economy catalog,
# so no user-facing text lives here. The geometry mirrors the original paginated list: a grid across the top five
# rows, the prev/next arrows and the close button on the bottom row, with grey-glass fillers between them.
title = "@%history_title_key%"
rows = 6

items {
  # The grey-glass backdrop on the bottom row's gaps only; the content grid above leaves empty cells empty, exactly
  # as the original paginated list did (it filled only the non-content, non-button slots).
  filler {
    slots    = ["45-47", "51-53"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The history grid, paginated across the top five rows. Each cell shows the row's kind-coloured icon with the
  # type name and the id/date/from/to/amount/reason lore. Read-only: no click action.
  history {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "economy:transactions"
      template {
        material = "%history_icon%"
        name     = "@%history_type_key%"
        lore     = [
          "@eco.history.gui-lore-id",
          "@eco.history.gui-lore-date",
          "@eco.history.gui-lore-from",
          "@eco.history.gui-lore-to",
          "@eco.history.gui-lore-amount",
          "@eco.history.gui-lore-reason"
        ]
      }
    }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above and of the close button.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@eco.history.gui-prev"
    priority = 10
  }

  # Close the menu. Centred on the bottom row, the BARRIER the original list used.
  close {
    slot     = 49
    material = BARRIER
    name     = "@eco.history.gui-close"
    priority = 10
    click { left = ["close"] }
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@eco.history.gui-next"
    priority = 10
  }
}
