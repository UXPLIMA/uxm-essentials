# Layout of the /wallet menu. Titles, button labels, and lore stay in the message catalog
# (messages_<lang>.conf); only the geometry and the icons live here, so editing this file never touches a
# translation.

# Menu height in rows (1..6).
rows = 3

# Background filler for any slot a button does not occupy.
filler-material = "GRAY_STAINED_GLASS_PANE"

# Slot of each element.
slots {
  balance = 11
  banknotes = 13
  history = 15
  close = 22
}

# Icon material of each element.
materials {
  balance = "GOLD_INGOT"
  banknotes = "PAPER"
  history = "BOOK"
  close = "BARRIER"
}
