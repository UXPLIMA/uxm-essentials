# The top-balances leaderboard, rendered through the menu engine. A paginated grid of one skull per ranked owner
# newest-richest-first; the menu twin of the /baltop chat read-out. Each skull is named and lored with the rank, the
# player and the formatted balance through the baltop_* placeholders, and the title names the currency it ranks
# through the subject-driven {baltop_currency} argument, so /baltop coins reads differently from /baltop gems.
#
# The ranked rows come from the per-currency baltop snapshot cache (a lock-free, Bukkit-free read), so the
# economy:baltop list source resolves them straight off the tick thread for the currency the menu carries as its
# subject; it touches no port that needs the region thread. A click does nothing; the leaderboard is read-only.
# Every label resolves from the economy message catalog, so no user-facing text lives here. The geometry mirrors the
# original leaderboard exactly: a grid across the top five rows, the prev/next arrows either side of the
# centre of the bottom row, and grey-glass fillers around them.
title = "@baltop.gui-title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop on the bottom row's gaps only; the content grid above leaves empty cells empty, exactly
  # as the original leaderboard did (it filled only the non-content, non-button slots).
  filler {
    slots    = ["45-53"]
    material = GRAY_STAINED_GLASS_PANE
    decor    = { hide-tooltip = true }
    priority = 0
  }

  # The leaderboard grid, paginated across the top five rows. Each cell is a PLAYER_HEAD with the rank/player/balance
  # name and lore; the skull owner follows the row through the baltop_player token the renderer resolves. Read-only:
  # no click action.
  entries {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "economy:baltop"
      template {
        material = PLAYER_HEAD
        name     = "@baltop.gui-entry-name"
        lore     = ["@baltop.gui-entry-lore"]
      }
    }
  }

  # Previous page, directly left of the centre of the bottom row.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@baltop.gui-previous"
    priority = 10
  }

  # Next page, directly right of the centre of the bottom row.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@baltop.gui-next"
    priority = 10
  }
}
