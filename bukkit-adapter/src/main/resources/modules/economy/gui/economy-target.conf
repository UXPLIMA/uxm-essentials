# The per-player eco-admin manage screen, rendered through the menu engine. A five-row panel for one target
# player reached after a target is picked from the bare-/eco hub: the target's head with their balance per
# currency, the Give / Take / Set / Reset action buttons, a [History] link into the transaction-history list, and
# a [Currency] item, when more than one currency is configured, that opens the shared paginated picker to switch
# the active currency the four actions apply to. Give / Take / Set capture an amount through the shared input seam
# then run the matching EcoAdmin op with Money.of(active, amount); Reset is confirm-gated before zeroing the
# balance.
#
# The target's balances are read off the tick thread when the panel opens and handed in as the menu subject, so the
# head's balance lines and every button's active-currency line fill from the eco_target / eco_currency placeholders
# without the renderer touching a port. Every label resolves from the economy catalog, so no user-facing text lives
# here. The geometry mirrors the original fixed five-row screen exactly.
title = "@eco.admin-gui.target-title"
rows = 5
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the items drawn below sit on top of it.
  filler {
    slots    = ["0-44"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The target's head, named with the target and lored with one balance line per configured currency. A read-only
  # display; its lines read the subject through the eco_target name and the eco_target_balances multi-line block.
  head {
    slot     = 4
    material = PLAYER_HEAD
    name     = "@eco.admin-gui.target-head-name"
    lore     = ["%eco_target_balances%"]
    priority = 10
  }

  # Credit the target: capture an amount through the input seam, then run EcoAdmin.give for the active currency.
  give {
    slot     = 19
    material = EMERALD
    name     = "@eco.admin-gui.give-name"
    lore     = ["@eco.admin-gui.give-lore"]
    priority = 10
    click { left = ["economy:target-give"] }
  }

  # Debit the target: capture an amount, then run EcoAdmin.take for the active currency.
  take {
    slot     = 21
    material = REDSTONE
    name     = "@eco.admin-gui.take-name"
    lore     = ["@eco.admin-gui.take-lore"]
    priority = 10
    click { left = ["economy:target-take"] }
  }

  # Set the target's balance exactly: capture an amount, then run EcoAdmin.set for the active currency.
  set {
    slot     = 23
    material = COMPARATOR
    name     = "@eco.admin-gui.set-name"
    lore     = ["@eco.admin-gui.set-lore"]
    priority = 10
    click { left = ["economy:target-set"] }
  }

  # Reset the target's balance to its starting figure. Confirm-gated through the engine confirm dialog before the
  # zeroing op runs.
  reset {
    slot     = 25
    material = TNT
    name     = "@eco.admin-gui.reset-name"
    lore     = ["@eco.admin-gui.reset-lore"]
    priority = 10
    click { left = ["economy:target-reset"] }
  }

  # Open the read-only transaction-history list for this target, exactly as the old history button did.
  history {
    slot     = 31
    material = BOOK
    name     = "@eco.admin-gui.target-history-name"
    lore     = ["@eco.admin-gui.target-history-lore"]
    priority = 10
    click { left = ["economy:target-history"] }
  }

  # Switch the active currency through the shared paginated picker, then re-open this screen with it active. Shown
  # only when more than one currency is configured, exactly as the old inline selector was.
  select_currency {
    slot     = 38
    material = SUNFLOWER
    name     = "@eco.admin-gui.select-currency-name"
    lore     = ["@eco.admin-gui.select-currency-lore"]
    priority = 10
    view     = ["economy:multi-currency"]
    click { left = ["economy:target-select-currency"] }
  }

  # Back to the bare-/eco admin hub.
  back {
    slot     = 40
    material = ARROW
    name     = "@eco.admin-gui.back"
    priority = 10
    click { left = ["economy:target-back"] }
  }
}
