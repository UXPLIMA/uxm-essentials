# The server-wide eco-admin screen, rendered through the menu engine. A three-row panel reached from the bare-/eco
# hub's [Server-wide] button: Give to All (an amount captured through the shared input seam, credited to every
# online wallet) and Reset All (confirm-gated, zeroing every online balance), plus a [Currency] item between them,
# when more than one currency is configured, that opens the shared paginated picker to switch the active currency.
# Both ops run on the currently-online roster, the same scope the /eco giveall|resetall commands use.
#
# The screen carries only the active currency as its subject, so each button's active-currency line fills from the
# eco_currency placeholder without the renderer touching a port; the roster is enumerated on the global region
# thread when an op fires, never at render time. Every label resolves from the economy catalog, so no user-facing
# text lives here. The geometry mirrors the original fixed three-row screen exactly.
title = "@eco.admin-gui.bulk-title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the buttons drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # Credit every online wallet: capture an amount through the input seam, then run EcoAdmin.giveAll for the active
  # currency over the online roster.
  giveall {
    slot     = 11
    material = EMERALD_BLOCK
    name     = "@eco.admin-gui.giveall-name"
    lore     = ["@eco.admin-gui.giveall-lore"]
    priority = 10
    click { left = ["economy:bulk-giveall"] }
  }

  # Switch the active currency through the shared paginated picker, then re-open this screen with it active. Shown
  # only when more than one currency is configured, exactly as the old inline selector was.
  select_currency {
    slot     = 13
    material = SUNFLOWER
    name     = "@eco.admin-gui.select-currency-name"
    lore     = ["@eco.admin-gui.select-currency-lore"]
    priority = 10
    view     = ["economy:multi-currency"]
    click { left = ["economy:bulk-select-currency"] }
  }

  # Reset every online balance to its starting figure. Confirm-gated through the engine confirm dialog before the
  # zeroing op runs over the online roster.
  resetall {
    slot     = 15
    material = TNT
    name     = "@eco.admin-gui.resetall-name"
    lore     = ["@eco.admin-gui.resetall-lore"]
    priority = 10
    click { left = ["economy:bulk-resetall"] }
  }

  # Back to the bare-/eco admin hub.
  back {
    slot     = 22
    material = ARROW
    name     = "@eco.admin-gui.back"
    priority = 10
    click { left = ["economy:bulk-back"] }
  }
}
