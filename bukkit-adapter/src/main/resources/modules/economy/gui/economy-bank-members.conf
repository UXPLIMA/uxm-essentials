# The bank members menu, rendered through the menu engine. A paginated grid of one player head per member of a
# shared bank; the clickable twin of the bank-actions hub's [Members] button. Each head is named and lored with the
# member's name, their role, and the right-click-to-remove hint through the bank_member* placeholders, and the title
# names the bank through the subject-driven bank_members_title argument. The bottom row carries the back button, an
# add-member button (shown only to a member who may add), and the two page arrows.
#
# The open re-fetches the bank fresh and resolves its members off the tick thread (all repository/domain reads, no
# Bukkit call) and hands the fresh bank in as the menu subject; the economy:bank-members list source only reads that
# subject's members. A right click on a head removes that member through economy:remove-member and reopens the
# refreshed list; the add button opens a name prompt through economy:add-member; the back button returns to the
# bespoke bank-actions hub through economy:bank-back. The add button's economy:can-add-member view condition mirrors
# the old menu, which drew it only for a member who may add. Every label resolves from the economy catalog, so no
# user-facing text lives here. The geometry mirrors the original list: a grid across the top five rows, the prev/next
# arrows at the corners of the bottom row, and the back/add buttons between them.
title = "@bank.members-gui-title"
rows = 6

items {
  # The grey-glass backdrop on the bottom row's gaps only; the content grid above leaves empty cells empty, exactly
  # as the original list did (it filled only the non-content, non-button slots).
  filler {
    slots    = ["46", "48", "50-52"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The members grid, paginated across the top five rows. Each cell is a PLAYER_HEAD with the member name and the
  # role/remove-hint lore; a right click removes that member and reopens the refreshed list.
  members {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "economy:bank-members"
      template {
        material = PLAYER_HEAD
        name     = "@bank.members-gui-member-name"
        lore     = [
          "@bank.members-gui-member-role",
          "",
          "@bank.members-gui-member-remove-hint"
        ]
        click { right = ["economy:remove-member"] }
      }
    }
  }

  # Previous page. Pinned to the bottom-left corner, exactly where the original list placed it.
  previous {
    slot     = 45
    type     = PREVIOUS
    material = ARROW
    name     = "@bank.members-gui-prev"
    priority = 10
  }

  # Go back to the bespoke bank-actions hub, exactly as the old back button did.
  back {
    slot     = 47
    material = BARRIER
    name     = "@bank.members-gui-back"
    priority = 10
    click { left = ["economy:bank-back"] }
  }

  # Add a member: open the bespoke name prompt, exactly as the old add button did. Shown only to a member who may
  # add, mirroring the old menu's per-viewer visibility through the economy:can-add-member condition.
  add {
    slot     = 49
    material = EMERALD_BLOCK
    name     = "@bank.members-gui-add"
    lore     = ["@bank.members-gui-add-lore"]
    priority = 10
    view     = ["economy:can-add-member"]
    click { left = ["economy:add-member"] }
  }

  # Next page. Pinned to the bottom-right corner.
  next {
    slot     = 53
    type     = NEXT
    material = ARROW
    name     = "@bank.members-gui-next"
    priority = 10
  }
}
