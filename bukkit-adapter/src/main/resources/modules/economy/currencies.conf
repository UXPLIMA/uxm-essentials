# One block per currency. The default currency (wallet.default-currency) must appear here.
coins {
  symbol = "⛂"
  plural = "coins"
  format = "#,##0.00"             # Java DecimalFormat pattern
  precision = 2
  starting = "100"
  min-balance = "0"
  max-balance = "1000000000000"
  min-pay = "0.1"
}

gems {
  symbol = "✦"
  plural = "gems"
  format = "#,##0"
  precision = 0
  starting = "0"
  min-balance = "0"
  max-balance = "1000000"
  min-pay = "1"
  physical = true
  denominations {
    emerald {
      value = "1"
      material = "EMERALD"
      display-name = "&aEmerald"
    }
    emerald_block {
      value = "9"
      material = "EMERALD_BLOCK"
      display-name = "&aEmerald Block"
    }
  }
}

tokens {
  symbol = "✪"
  plural = "tokens"
  format = "#,##0"
  precision = 0
  starting = "0"
  min-balance = "0"
  max-balance = "10000000"
  min-pay = "1"
  physical = true
  denominations {
    nugget {
      value = "1"
      material = "GOLD_NUGGET"
      display-name = "&6Gold Nugget"
    }
    ingot {
      value = "9"
      material = "GOLD_INGOT"
      display-name = "&6Gold Ingot"
    }
  }
}
