# One block per currency. The default currency (wallet.default-currency) must appear here.
#
# Capability flags (per currency, all optional; the defaults below leave behaviour unchanged):
#   transfer-allowed     true: may move between players via /pay and /payall
#   exchange-allowed     true: may take part in /exchange conversions
#   leaderboard-enabled  true: appears in /baltop
#   permission-required  false; when true, using it needs uxmessentials.economy.currency.<id>
# Set these to ship a premium currency: e.g. transfer-allowed=false, exchange-allowed=false,
# leaderboard-enabled=false, permission-required=true makes a donor-only currency nobody can trade or top.
#
#   backend  "native": where this currency's balances actually live.
#
# Leave it out and the currency lives in this plugin's own ledger, the only backend that can promise two
# simultaneous debits never both succeed past zero. Point it at a foreign economy and the balances live there
# instead; this plugin stops being the authority for that currency:
#
#   points { backend = "playerpoints", precision = 0, symbol = "pt" }
#   gold   { backend = "coinsengine:gold" }
#   xp     { backend = "exp", precision = 0 }          # cannot be paid to an offline player
#   crowns { backend = "placeholder:crowns" }          # define the block in config.conf first
#
# Two consequences worth knowing before you do it. /baltop is empty for a foreign-backed currency, because no
# foreign economy lets us enumerate accounts. And /exchange, banks and loans switch off entirely; they write
# this plugin's wallet table directly, so a currency they do not own would have money invented for it. The
# server log names the currency that turned them off.
coins {
  symbol = "⛂"
  plural = "coins"
  format = "#,##0.00"             # Java DecimalFormat pattern
  precision = 2
  starting = "100"
  min-balance = "0"
  max-balance = "1000000000000"
  min-pay = "0.1"
  icon-material = "GOLD_INGOT"    # Icon shown for this currency in the /wallet, /exchange, and /loan menus
  transfer-allowed = true
  exchange-allowed = true
  leaderboard-enabled = true
  permission-required = false
}

gems {
  symbol = "✦"
  plural = "gems"
  format = "#,##0"
  precision = 0
  starting = "0"
  min-balance = "0"
  max-balance = "1000000"
  min-pay = "1"
  icon-material = "EMERALD"
  physical = true
  denominations {
    emerald {
      value = "1"
      material = "EMERALD"
      display-name = "<money>ᴇᴍᴇʀᴀʟᴅ</money>"
    }
    emerald_block {
      value = "9"
      material = "EMERALD_BLOCK"
      display-name = "<money>ᴇᴍᴇʀᴀʟᴅ ʙʟᴏᴄᴋ</money>"
    }
  }
}

tokens {
  symbol = "✪"
  plural = "tokens"
  format = "#,##0"
  precision = 0
  starting = "0"
  min-balance = "0"
  max-balance = "10000000"
  min-pay = "1"
  icon-material = "AMETHYST_SHARD"
  physical = true
  denominations {
    nugget {
      value = "1"
      material = "GOLD_NUGGET"
      display-name = "<money>ɢᴏʟᴅ ɴᴜɢɢᴇᴛ</money>"
    }
    ingot {
      value = "9"
      material = "GOLD_INGOT"
      display-name = "<money>ɢᴏʟᴅ ɪɴɢᴏᴛ</money>"
    }
  }
}
