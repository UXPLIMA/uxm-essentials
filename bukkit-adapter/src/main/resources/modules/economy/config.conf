# Economy — balances, /pay, /baltop, provider registration. Currency definitions live in currencies.conf.
enabled = true
amount-format = "full"              # full (grouped digits) | compact (1.2k style)

wallet {
  default-currency = "coins"        # id of the currency used when a command names none
  starting-balance = "0"
  min-balance = "0"
  max-balance = "1000000000000"
  gui-enabled = true                # whether to enable the visual /wallet GUI
}

gui {
  timezone = "UTC"                  # zone id transaction-history timestamps render in (e.g. Europe/Istanbul); UTC keeps every server in a network consistent
}

banknotes {
  enabled = true                    # whether to enable physical banknote items (/withdraw and /deposit)
}

bank {
  enabled = true                    # whether to enable bank accounts (/bank)

  # Periodic interest minted into each bank, tiered by balance so a bigger bank earns a better rate.
  interest {
    enabled = false                 # off by default
    interval-hours = 24             # how often interest is paid
    tiers = [                       # "minBalance:ratePercent" — the highest qualifying tier applies
      "0:0.5",                      # 0.5% at any balance
      "1000000:1.0"                 # 1.0% once the bank holds 1,000,000+
    ]
  }
}

loans {
  enabled = true                    # whether to enable loan & debt system (/loan)
  limit-multiplier = "1000"         # max principal = credit-score * this
  interest-max = "0.22"             # interest rate at the lowest credit score
  interest-span = "0.20"            # how far the rate drops from interest-max to the highest score
  installment-cycle-hours = 24      # hours between installments (auto-repayment due interval)
  score-on-time-manual = 25         # credit-score gain for a manual on-time payment
  score-on-time-auto = 10           # credit-score gain for a successful automatic repayment
  score-missed = -50                # credit-score penalty for a missed automatic repayment
  score-floor = 100                 # lowest a credit score can fall to
  score-ceiling = 1000              # highest a credit score can rise to
}

pay {
  min-pay = "0.01"
  confirm-threshold = ""            # empty disables the /pay confirmation prompt
  confirm-timeout-ms = 30000        # how long a pending /pay confirmation stays valid
  toggle-default = true             # new players accept incoming payments by default

  # A cut taken out of every /pay — an inflation sink. The receiver is credited the remainder.
  tax {
    enabled = false                 # off by default; turn on to tax payments
    percent = "0"                   # percent of the amount taken (e.g. "5" = 5%)
    flat = "0"                      # a flat cut added on top, in the currency's units
    sink = "void"                   # "void" destroys the tax, or "account:<uuid>" routes it to a holding wallet
    bypass-permission = "uxmessentials.economy.tax.bypass"   # holders pay no tax
  }
}

baltop {
  page-size = 10
  cache-ttl-ms = 60000              # how often the /baltop snapshot is refreshed
  snapshot-capacity = 100           # rows retained per currency snapshot
  exempt-permission = "uxmessentials.economy.baltop.exempt"
  exclude-banned = false            # drop banned players from the leaderboard
  min-balance = "0"                 # hide rows below this balance (0 = show everyone)
}

provider {
  register = true                   # register the native economy with Vault/Treasury via ServicesManager
  priority = "Normal"               # Lowest | Low | Normal | High | Highest
}

# Currency backends. A currency's `backend` key names one of these; omit it and the currency lives in the
# plugin's own ledger, which is the only backend able to guarantee that two simultaneous debits cannot both
# succeed past zero. A foreign backend cannot make that promise, so scheduled charges against one — player-warp
# rent, for instance — are refused unless `allow-nonatomic-recurring` is turned on in economy/config.conf.
#
# The placeholder backend is the escape hatch for an economy nobody wrote a bridge for: its balance is read from a
# PlaceholderAPI placeholder (which must resolve to a bare number) and its credit/debit are console commands you
# configure. A console command has no return value, so this backend cannot see whether its take command succeeded —
# it checks the balance is sufficient, dispatches the take, and trusts it. That is why it can never hold a currency
# used for recurring charges without the operator's explicit opt-in.
backends {
  # coinsengine { gold {} }         # one block per CoinsEngine currency you want to expose
  # zessentials { tokens {} }
  # placeholder {
  #   crowns {
  #     balance-placeholder = "%myeconomy_balance%"
  #     give-command        = "myeco give %player% %amount%"   # %price% also accepted
  #     take-command        = "myeco take %player% %amount%"
  #     works-offline       = false
  #     integral            = false   # default: amounts keep their decimals (50.75 stays 50.75, like Vault). Set true
  #                                   # only for a token economy that counts whole units — then every amount is rounded
  #                                   # HALF_UP to a whole number before it reaches your give/take command.
  #   }
  # }
}

# A backend that cannot guard its take (anything but the built-in ledger) may double-charge a scheduled sweep,
# because a debit that reports failure might in fact have succeeded. A player clicking "buy" sees a wrong charge
# and complains; a nightly sweep cannot. So a module that bills on a timer refuses a foreign-backed currency at
# startup, naming it, unless you set this to true and accept the risk.
#
# No shipped module bills on a timer yet — salary and bank interest pay out rather than charge, and loans are
# already limited to the built-in ledger. This setting starts having an effect when player-warp rent lands.
allow-nonatomic-recurring = false

persistence {
  write-debounce-ms = 250           # coalesce rapid balance writes
  batch-flush-ms = 1000             # transaction-telemetry flush interval
}

# Per-item sell values for /worth and /sell. An entry is "MATERIAL:unit-price" (paid in the
# default currency) or "MATERIAL:unit-price:currencyId" to pay out in another configured currency,
# e.g. "DIAMOND:50:gems" sells diamonds for gems. An unknown currency id falls back to the default
# and is logged as a warning on load. A conservative starter set so /sell works out of the box; tune
# or extend with /setworth <item> <price> [currency] in-game. Materials match Bukkit names
# (case-insensitive); an unlisted item is simply not sellable.
worth {
  enabled = true
  # When EconomyShopGUI is installed, an item with no /setworth override and no price in the list below
  # falls back to the shop's own sell price, so a priced shop does not have to be priced twice. Your own
  # prices always win, and with the plugin absent this setting does nothing.
  economyshopgui-fallback = true
  items = [
    "COBBLESTONE:0.05",
    "STONE:0.1",
    "DIRT:0.02",
    "OAK_LOG:0.5",
    "WHEAT:0.1",
    "CARROT:0.1",
    "POTATO:0.1",
    "BEEF:0.4",
    "PORKCHOP:0.4",
    "CHICKEN:0.3",
    "COAL:1",
    "CHARCOAL:1",
    "RAW_IRON:3",
    "IRON_INGOT:5",
    "RAW_COPPER:1.5",
    "COPPER_INGOT:2.5",
    "RAW_GOLD:6",
    "GOLD_INGOT:10",
    "REDSTONE:1.5",
    "LAPIS_LAZULI:2",
    "QUARTZ:1.5",
    "DIAMOND:50",
    "EMERALD:40",
    "NETHERITE_SCRAP:120",
    "NETHERITE_INGOT:500"
  ]
}

# Charge players to execute configured commands. Format is "COMMAND:cost" (without slash, case-insensitive).
# Bypass with permission node: uxmessentials.economy.bypasscmdcost
command-costs-enabled = true
command-costs = [
  "heal:5.0",
  "feed:3.0"
]

# Exchange rates between different currencies.
# Format: "SOURCE_CURRENCY:TARGET_CURRENCY:RATE:FEE_PERCENT"
exchange {
  enabled = true
  rates = [
    "coins:gems:0.01:0.05",   # 100 coins = 1 gem, 5% fee
    "gems:coins:100.0:0.02",  # 1 gem = 100 coins, 2% fee
    "coins:tokens:0.05:0.0",  # 20 coins = 1 token, no fee
    "tokens:coins:20.0:0.01", # 1 token = 20 coins, 1% fee
    "tokens:gems:0.2:0.05",   # 5 tokens = 1 gem, 5% fee
    "gems:tokens:5.0:0.02"    # 1 gem = 5 tokens, 2% fee
  ]
}

# Salary settings for active players
salary {
  enabled = false
  interval-seconds = 3600
  default-amount = 100
}

# Algorithmic fraud detection
fraud-detection {
  enabled = false
  webhook-url = ""
  single-limit = "1000000"
  velocity-seconds = 60
  velocity-limit = "5000000"
}





# Periodic data maintenance: trim old transaction telemetry and purge long-inactive players' wallets.
# Destructive only when dry-run = false — a two-step opt-in (enable, then disarm dry-run).
maintenance {
  enabled = false                  # master switch; off means no maintenance runs at all
  dry-run = true                   # true = only log what WOULD be removed; set false to actually delete
  run-interval-hours = 24          # how often the task runs
  prune-transactions-days = 90     # delete transaction telemetry older than this many days
  purge-inactive-days = 90         # purge wallets of players unseen this long (never those with a loan/bank/score tie)
}

# A reward credited the first time a player joins each cooldown window — a cheap retention nudge.
daily-reward {
  enabled = false                  # off by default
  amount = "100"                   # how much to credit per claim
  currency = ""                    # currency id, or blank for the default currency
  cooldown-hours = 24              # minimum gap between claims
}

# A plain-text, grep-able audit of every balance change (economy/operations.log), separate from the DB telemetry.
logs {
  file-enabled = false             # write the human-readable operations.log
}
