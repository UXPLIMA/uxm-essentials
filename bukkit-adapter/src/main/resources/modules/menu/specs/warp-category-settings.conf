# The per-category settings panel, rendered through the menu engine. A three-row property panel for one warp
# category reached from the category manager: labeled buttons for the category's display name, material, lore,
# sorting slot, and parent category, a delete button, and a back button to the manager. The display-name / lore /
# slot buttons capture a value through the shared input seam; the material button copies the item in the operator's
# main hand; the parent button opens the engine parent-category selector. Each mutation saves the edited category
# and re-opens this panel with the new subject, so the operator sees the result.
#
# The edited category is handed in as the menu subject, so the title and every current-value line fill from the
# warp_cat_set_* placeholders without the renderer touching a port. Every label resolves from the warps catalog, so
# no user-facing text lives here. The geometry mirrors the original fixed three-row screen exactly: name 10,
# material 12, lore 14, slot 16, parent 18, delete 22, back 26.
title = "@warp.editor.category.settings.title"
rows = 3

items {
  # The grey-glass backdrop the old window drew. Lowest priority, so the buttons below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # Set the category's display name: capture a line through the input seam, then save it and re-open.
  display_name {
    slot     = 10
    material = NAME_TAG
    name     = "@warp.editor.category.settings.display-name.name"
    lore = [
      "@warp.editor.category.settings.display-name.current"
      ""
      "@warp.editor.category.settings.display-name.prompt"
    ]
    priority = 10
    click { left = ["warps:cat-set-name"] }
  }

  # Set the category's icon material to the item in the operator's main hand. The button itself shows the category's
  # configured material so an operator sees the icon they set, the BOOK fallback when it is unset or unknown.
  display_material {
    slot     = 12
    material = "%warp_cat_set_material%"
    name     = "@warp.editor.category.settings.display-material.name"
    lore = [
      "@warp.editor.category.settings.display-material.current"
      ""
      "@warp.editor.category.settings.display-material.prompt"
    ]
    priority = 10
    click { left = ["warps:cat-set-material"] }
  }

  # Edit the category's display lore: capture pipe-separated lines through the input seam, then save and re-open.
  display_lore {
    slot     = 14
    material = BOOK
    name     = "@warp.editor.category.settings.display-lore.name"
    lore = [
      "@warp.editor.category.settings.display-lore.current"
      ""
      "@warp.editor.category.settings.display-lore.prompt"
    ]
    priority = 10
    click { left = ["warps:cat-set-lore"] }
  }

  # Set the category's sorting slot (its index in the browse menu): capture a number, then save and re-open.
  slot {
    slot     = 16
    material = COMPARATOR
    name     = "@warp.editor.category.settings.slot.name"
    lore = [
      "@warp.editor.category.settings.slot.current"
      ""
      "@warp.editor.category.settings.slot.prompt"
    ]
    priority = 10
    click { left = ["warps:cat-set-slot"] }
  }

  # Set the category's parent: open the engine parent-category selector, then save the pick and re-open this panel.
  parent {
    slot     = 18
    material = BOOKSHELF
    name     = "@warp.editor.category.settings.parent.name"
    lore = [
      "@warp.editor.category.settings.parent.current"
      ""
      "@warp.editor.category.settings.parent.prompt"
    ]
    priority = 10
    click { left = ["warps:cat-set-parent"] }
  }

  # Delete the category through the repository, then return to the manager.
  delete {
    slot     = 22
    material = REDSTONE_BLOCK
    name     = "@warp.editor.category.settings.delete.name"
    lore = [
      "@warp.editor.category.settings.delete.lore"
      ""
      "@warp.editor.category.settings.delete.warning"
    ]
    priority = 10
    click { left = ["warps:cat-set-delete"] }
  }

  # Back to the category manager.
  back {
    slot     = 26
    material = ARROW
    name     = "@warp.editor.selector.back"
    priority = 10
    click { left = ["warps:cat-set-back"] }
  }
}
