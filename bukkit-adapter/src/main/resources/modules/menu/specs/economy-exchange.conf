# The currency exchange dashboard, rendered through the menu engine. A three-row panel reached from /exchange: a
# source-currency icon (slot 11), a target-currency icon (slot 15), a convert button (slot 13) and a close button
# (slot 22). The source and target the panel acts on, and the viewer's balance in each, are handed in as the menu
# subject when the panel opens, so the icons fill their per-currency material and their name/balance lines from the
# exchange_* placeholders without the renderer touching a port.
#
# Clicking the source or target opens the shared paginated currency picker; choosing a currency re-opens this panel
# with that side switched, exactly as the old cycling did but through the engine picker the eco-admin screens use.
# The convert button captures an amount through the shared input seam, then runs the exchange use case. When no rate
# is configured between the two currencies the convert button is replaced in place by a no-rate marker — two items
# share slot 13, each gated by a mutually-exclusive view condition, so exactly one renders. Every label resolves from
# the economy catalog, so no user-facing text lives here. The geometry mirrors the original fixed three-row screen
# exactly.
title = "@eco.exchange.gui-title"
rows = 3

items {
  # The grey-glass backdrop. Lowest priority, so the items drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The source currency: its icon material is the per-currency icon (the operator-configured icon-material, paper by
  # default) resolved through the subject. A click opens the shared picker to change the source.
  source {
    slot     = 11
    material = "%exchange_source_material%"
    name     = "@eco.exchange.gui-source-name"
    lore     = ["@eco.exchange.gui-source-lore"]
    priority = 10
    click { left = ["economy:exchange-source"] }
  }

  # The convert button, shown only when a rate is configured between source and target. Captures an amount through
  # the input seam, then runs the exchange use case.
  convert {
    slot     = 13
    material = SUNFLOWER
    name     = "@eco.exchange.gui-info-name"
    lore     = ["@eco.exchange.gui-info-lore"]
    priority = 10
    view     = ["economy:exchange-has-rate"]
    click { left = ["economy:exchange-convert"] }
  }

  # The no-rate marker, shown in the convert slot only when no rate is configured between source and target. A click
  # does nothing, exactly as the old no-rate icon did.
  no_rate {
    slot     = 13
    material = BARRIER
    name     = "@eco.exchange.gui-no-rate-name"
    lore     = ["@eco.exchange.gui-no-rate-lore"]
    priority = 10
    view     = ["economy:exchange-no-rate"]
  }

  # The target currency: its icon material is the per-currency icon resolved through the subject. A click opens the
  # shared picker to change the target.
  target {
    slot     = 15
    material = "%exchange_target_material%"
    name     = "@eco.exchange.gui-target-name"
    lore     = ["@eco.exchange.gui-target-lore"]
    priority = 10
    click { left = ["economy:exchange-target"] }
  }

  # Close the panel.
  close {
    slot     = 22
    material = BARRIER
    name     = "@baltop.gui-close"
    priority = 10
    click { left = ["close"] }
  }
}
