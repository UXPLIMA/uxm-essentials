# The read-only announcer list (opened from the announcements button on the communication admin panel),
# rendered through the menu engine. It mirrors the /announce list surface: one PAPER icon per configured
# announcement, paged when there are more than fit, with the two nav arrows on the bottom row. The grid is the
# communication:announcements list source — the announcement_id / announcement_lines / announcement_channels
# placeholders fill the entry name and lore from each bound announcement. Every label resolves from the
# communication message catalog, so no user-facing text lives here. The list is read-only: a click on an entry
# does nothing, exactly as the original announcer view showed (the announcer is config-driven, with no per-entry
# action the use case exposes).
title = "@communication.gui.announcer.title"
rows = 6

items {
  # The grey-glass backdrop. Lowest priority, so the content grid and the nav buttons sit on top of it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The announcement grid, paginated across the top five rows (the bottom row is reserved for navigation). Each
  # cell shows a PAPER icon with the announcement's id and a lines/channels summary. The list is read-only, so no
  # click action is bound.
  announcements {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "communication:announcements"
      template {
        material = PAPER
        name     = "@communication.gui.announcer.entry-name"
        lore     = ["@communication.gui.announcer.entry-lore"]
      }
    }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@communication.gui.announcer.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@communication.gui.announcer.next"
    priority = 10
  }
}
