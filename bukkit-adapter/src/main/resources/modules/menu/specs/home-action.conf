# The per-home action menu (opened by clicking a home in the /home grid), rendered through the menu engine. A fixed
# three-row panel of buttons for one home, carried as the menu's subject: a read-only info display and buttons to
# teleport, delete, relocate-here, rename, change icon, toggle public/private visibility, manage invited players, and
# go back to the grid. The title and the info label/lore fill from that home through the home_* placeholders, so the
# window names the home it is about. Each button routes through the same homes use case the old view drove; delete and
# relocate may open a yes/no confirm first, and teleport may warn on an unsafe destination — those decisions live in
# the bindings, not here. The change-icon button is gated behind uxmessentials.home.icon, and the visibility cell is
# two items, one shown when the home is public and one when it is private, so the right material and label appear.
# Every label resolves from the homes message catalog, so no user-facing text lives here. The geometry mirrors the
# original fixed three-row action menu.
title = "@home.action.title"
rows = 3

items {
  # The grey-glass backdrop. Lowest priority, so the buttons drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # Read-only home info: name and coordinates filled from the subject home through the home_* placeholders.
  info {
    slot     = 4
    material = PAPER
    name     = "@home.action.info.name"
    lore     = ["@home.action.info.lore"]
    priority = 10
  }

  # Rename the home through the shared text-input seam, exactly as the old rename button did.
  rename {
    slot     = 10
    material = NAME_TAG
    name     = "@home.action.rename.name"
    lore     = ["@home.action.rename.lore"]
    priority = 10
    click { left = ["homes:rename"] }
  }

  # Teleport to the home (may warn on an unsafe destination, the binding decides).
  teleport {
    slot     = 11
    material = ENDER_PEARL
    name     = "@home.action.teleport.name"
    lore     = ["@home.action.teleport.lore"]
    priority = 10
    click { left = ["homes:teleport"] }
  }

  # Delete the home (may open a confirm dialog first, the binding decides).
  delete {
    slot     = 13
    material = BARRIER
    name     = "@home.action.delete.name"
    lore     = ["@home.action.delete.lore"]
    priority = 10
    click { left = ["homes:delete"] }
  }

  # Re-anchor the home to the player's current position (may open a confirm dialog first, the binding decides).
  relocate {
    slot     = 15
    material = COMPASS
    name     = "@home.action.relocate.name"
    lore     = ["@home.action.relocate.lore"]
    priority = 10
    click { left = ["homes:relocate"] }
  }

  # Change the home icon — shown only with uxmessentials.home.icon, exactly as the old gated button.
  change-icon {
    slot     = 16
    material = ITEM_FRAME
    name     = "@home.action.icon.name"
    lore     = ["@home.action.icon.lore"]
    priority = 10
    view     = ["perm:uxmessentials.home.icon"]
    click { left = ["homes:open-icons"] }
  }

  # Visibility cell, shown when the home is public: a green dye that turns it private on click.
  visibility-public {
    slot     = 19
    material = LIME_DYE
    name     = "@home.action.visibility.public.name"
    lore     = ["@home.action.visibility.public.lore"]
    priority = 10
    view     = ["homes:home-public"]
    click { left = ["homes:toggle-visibility"] }
  }

  # Visibility cell, shown when the home is private: a grey dye that turns it public on click.
  visibility-private {
    slot     = 19
    material = GRAY_DYE
    name     = "@home.action.visibility.private.name"
    lore     = ["@home.action.visibility.private.lore"]
    priority = 10
    view     = ["homes:home-private"]
    click { left = ["homes:toggle-visibility"] }
  }

  # Manage the home's invited players (opens the invited-players list).
  invites {
    slot     = 25
    material = PLAYER_HEAD
    name     = "@home.action.invites.name"
    lore     = ["@home.action.invites.lore"]
    priority = 10
    click { left = ["homes:open-invites"] }
  }

  # Back to the /home grid.
  back {
    slot     = 22
    material = ARROW
    name     = "@home.action.back.name"
    priority = 10
    click { left = ["homes:action-back"] }
  }
}
