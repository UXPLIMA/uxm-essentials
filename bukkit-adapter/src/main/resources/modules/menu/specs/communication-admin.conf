# The communication admin panel (/communication gui, and the communication entry on the /uxmess gui hub),
# rendered through the menu engine. Four buttons over a three-row chest, each wired to the same surface the
# communication commands use: the chat-lock toggle flips the live ChatLock /togglechat flips, clearchat runs the
# /clearchat fan-out behind a confirm, broadcast captures a line through the shared text-input seam and sends it
# like /broadcast, and the announcer button opens the read-only announcer list (the /announce list surface).
# Every label resolves from the communication message catalog, so no user-facing text lives here. The geometry
# mirrors the original panel: buttons at slots 10/12/14/16 with a back button on the bottom row.
title = "@communication.gui.panel.title"
rows = 3

items {
  # The grey-glass backdrop. Lowest priority, so the buttons drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The global chat-lock toggle. A left click flips the live ChatLock the /togglechat command flips; the value
  # lore re-renders the locked/unlocked state on the same window after the flip (update = true), exactly as the
  # original toggle redrew itself.
  chat-lock {
    slot     = 10
    material = IRON_DOOR
    name     = "@communication.gui.chat-lock"
    lore     = ["%communication_lock_state%"]
    priority = 10
    update   = true
    click { left = ["communication:chat-lock"] }
  }

  # Clear chat for everyone, confirm-gated (the /clearchat fan-out).
  clearchat {
    slot     = 12
    material = LAVA_BUCKET
    name     = "@communication.gui.clearchat"
    lore     = ["@communication.gui.panel.action-hint"]
    priority = 10
    click { left = ["communication:clearchat"] }
  }

  # Broadcast a message: capture a line in chat through the shared text-input seam and send it like /broadcast.
  broadcast {
    slot     = 14
    material = BELL
    name     = "@communication.gui.broadcast"
    lore     = ["@communication.gui.panel.action-hint"]
    priority = 10
    click { left = ["communication:broadcast"] }
  }

  # Open the read-only announcer list (the /announce list surface).
  announcer {
    slot     = 16
    material = WRITABLE_BOOK
    name     = "@communication.gui.announcer"
    lore     = ["@communication.gui.panel.action-hint"]
    priority = 10
    click { left = ["communication:open-announcer"] }
  }

  # Back: close the panel.
  back {
    slot     = 22
    material = ARROW
    name     = "@communication.gui.panel.back"
    priority = 10
    click { left = ["communication:close"] }
  }
}
