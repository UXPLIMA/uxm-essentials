# The /entitycount empty-state title, rendered through the menu engine. A one-row window shown when the scan found
# no entities: just the empty-state title over a glass backdrop, the visual twin of the /entitycount no-entities
# reply. Every label resolves from the itemworld message catalog, so no user-facing text lives here. The geometry
# mirrors the original fixed empty-state sub-menu: a single row of glass filler.
title = "@itemworld.entitycount.gui.empty-title"
rows = 1

items {
  # The grey-glass backdrop filling the single row.
  filler {
    slots    = ["0-8"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }
}
