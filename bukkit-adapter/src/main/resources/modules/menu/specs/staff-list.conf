# /stafflist, rendered through the menu engine. A paginated grid of player heads — every online staff member (a
# holder of uxmessentials.staff.member) the looker can see (a vanished staffer they may not see is hidden) — and
# clicking a head teleports the looker onto that staff member as an admin teleport. The GUI counterpart to the
# presence context's text /staff roster, agreeing on who is staff via the same uxmessentials.staff.member marker.
#
# The roster is read from the online players on the global region thread (iterating the online list off it is
# illegal on Folia), so /stafflist computes the visible staff list there and hands it in as the menu subject; the
# staff:players list source only reads that subject, touching no Bukkit API. An empty roster is handled at the open
# site — it sends the staff.list.empty line rather than opening an empty window. The staff_player_name placeholder
# fills each head's label, and a left click teleports through staff:teleport-to. The title resolves from the staff
# message catalog, so no user-facing text lives here. The geometry mirrors the original fixed six-row picker: the
# heads fill the top five rows in order and the bottom row is empty (the old picker placed no navigation buttons).
title = "@staff.list.title"
rows = 6

items {
  # The staff-head grid, paginated across the top five rows. Each cell is a PLAYER_HEAD named with the staff
  # member's name; a left click teleports the looker onto that staff member through staff:teleport-to.
  players {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "staff:players"
      template {
        material = PLAYER_HEAD
        name     = "%staff_player_name%"
        click { left = ["staff:teleport-to"] }
      }
    }
  }
}
