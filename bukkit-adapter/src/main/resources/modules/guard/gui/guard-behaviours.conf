# The behaviours of one region: every behaviour the guard knows, with its value here. A left click asks for a
# value in chat, a right click clears it.
title = "@guard.gui.behaviours.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.6 1.2"]

items {
  # The grey frame. Lowest priority, so everything below draws on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    decor    = { hide-tooltip = true }
    priority = 0
  }

  behaviours {
    slots    = ["10-16", "19-25", "28-34", "37-43"]
    priority = 5
    list {
      source = "guard:behaviours"
      template {
        material = "%guard_behaviour_icon%"
        name     = "@guard.gui.behaviours.entry-name"
        lore     = ["@guard.gui.behaviours.entry-lore"]
        click {
          left = [
            { do = "input:guard.behaviour", prompt = "@guard.gui.behaviours.prompt" },
            "guard-behaviour-set:%input%"
          ]
          right = ["guard:behaviour-clear"]
        }
      }
    }
  }

  # Previous page, directly left of the centre of the bottom row.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@guard.gui.prev"
    priority = 10
  }

  # Next page, directly right of the centre of the bottom row.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@guard.gui.next"
    priority = 10
  }

  # Back, a feather in the centre of the bottom row.
  back {
    slot     = 49
    material = FEATHER
    name     = "@guard.gui.back"
    priority = 10
    click { left = ["guard:behaviours-back"] }
  }
}
