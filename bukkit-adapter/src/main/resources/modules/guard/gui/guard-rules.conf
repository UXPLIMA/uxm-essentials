# The rule editor: the actions at one level of the action tree with their state for the chosen target. A left
# click moves a rule from unset to allow to deny and back to unset; a right click opens the sub-actions. The
# target button picks who the rules are for: a left click steps through everyone, nonmember and the roles, a right
# click lets you type any target (perm:<node> or cond:<condition> too).
title = "@guard.gui.rules.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.6 1.2"]

items {
  # The grey frame. Lowest priority, so everything below draws on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    decor    = { hide-tooltip = true }
    priority = 0
  }

  actions {
    slots    = ["10-16", "19-25", "28-34", "37-43"]
    priority = 5
    list {
      source = "guard:actions"
      template {
        material = "%guard_action_icon%"
        name     = "@guard.gui.rules.entry-name"
        lore     = ["@guard.gui.rules.entry-lore"]
        click { left = ["guard:rule-cycle"], right = ["guard:rule-open"] }
      }
    }
  }

  target {
    slot     = 46
    material = NAME_TAG
    name     = "@guard.gui.rules.target-name"
    lore     = ["@guard.gui.rules.target-lore"]
    priority = 10
    click {
      left  = ["guard:rules-target-next"]
      right = [
        { do = "input:guard.rules-target", prompt = "@guard.gui.rules.target-prompt" },
        "guard-rules-target:%input%"
      ]
    }
  }

  # Previous page, directly left of the centre of the bottom row.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@guard.gui.prev"
    priority = 10
  }

  # Next page, directly right of the centre of the bottom row.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@guard.gui.next"
    priority = 10
  }

  # Back, a feather in the centre of the bottom row.
  back {
    slot     = 49
    material = FEATHER
    name     = "@guard.gui.back"
    priority = 10
    click { left = ["guard:rules-back"] }
  }
}
