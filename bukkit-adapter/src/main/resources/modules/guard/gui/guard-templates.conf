# The templates from modules/guard/config.conf. A left click links the region to a template; the region's own
# rules and behaviours still win over it. The clear button unlinks it.
title = "@guard.gui.templates.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.6 1.2"]

items {
  # The grey frame. Lowest priority, so everything below draws on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    decor    = { hide-tooltip = true }
    priority = 0
  }

  templates {
    slots    = ["10-16", "19-25", "28-34", "37-43"]
    priority = 5
    list {
      source = "guard:templates"
      template {
        material = "%guard_template_icon%"
        name     = "@guard.gui.templates.entry-name"
        lore     = ["@guard.gui.templates.entry-lore"]
        click { left = ["guard:template-apply"] }
      }
    }
  }

  clear {
    slot     = 46
    material = BARRIER
    name     = "@guard.gui.templates.clear-name"
    lore     = ["@guard.gui.templates.clear-lore"]
    priority = 10
    click { left = ["guard:template-clear"] }
  }

  # Previous page, directly left of the centre of the bottom row.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@guard.gui.prev"
    priority = 10
  }

  # Next page, directly right of the centre of the bottom row.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@guard.gui.next"
    priority = 10
  }

  # Back, a feather in the centre of the bottom row.
  back {
    slot     = 49
    material = FEATHER
    name     = "@guard.gui.back"
    priority = 10
    click { left = ["guard:templates-back"] }
  }
}
