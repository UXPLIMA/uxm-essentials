# The roles of one region: every player with a role. A left click moves the player to the next role, a right
# click takes the role away, the add button asks for a name and makes that player a member. Region owners and
# managers reach this window for their own region and may hand out member and guest only.
title = "@guard.gui.roles.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.6 1.2"]

items {
  # The grey frame. Lowest priority, so everything below draws on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    decor    = { hide-tooltip = true }
    priority = 0
  }

  roles {
    slots    = ["10-16", "19-25", "28-34", "37-43"]
    priority = 5
    list {
      source = "guard:roles"
      template {
        material = PLAYER_HEAD
        name     = "@guard.gui.roles.entry-name"
        lore     = ["@guard.gui.roles.entry-lore"]
        click { left = ["guard:role-next"], right = ["guard:role-remove"] }
      }
    }
  }

  add {
    slot     = 46
    material = LIME_DYE
    name     = "@guard.gui.roles.add-name"
    lore     = ["@guard.gui.roles.add-lore"]
    priority = 10
    click {
      left = [
        { do = "input:guard.role-add", prompt = "@guard.gui.roles.add-prompt" },
        "guard-role-add:%input%"
      ]
    }
  }

  # Previous page, directly left of the centre of the bottom row.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@guard.gui.prev"
    priority = 10
  }

  # Next page, directly right of the centre of the bottom row.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@guard.gui.next"
    priority = 10
  }

  # Back, a feather in the centre of the bottom row.
  back {
    slot     = 49
    material = FEATHER
    name     = "@guard.gui.back"
    priority = 10
    click { left = ["guard:roles-back"] }
  }
}
