# One region: its rules, roles, behaviours, templates, history and the regions inside it, plus borders, priority,
# tags, the lock and removal. Each tile shows the current value in its lore.
title = "@guard.gui.region.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.6 1.2"]

items {
  # The grey frame. Lowest priority, so everything below draws on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    decor    = { hide-tooltip = true }
    priority = 0
  }

  rules {
    slot     = 20
    material = WRITABLE_BOOK
    name     = "@guard.gui.region.rules-name"
    lore     = ["@guard.gui.region.rules-lore"]
    priority = 10
    click { left = ["guard:hub-rules"] }
  }
  roles {
    slot     = 21
    material = PLAYER_HEAD
    name     = "@guard.gui.region.roles-name"
    lore     = ["@guard.gui.region.roles-lore"]
    priority = 10
    click { left = ["guard:hub-roles"] }
  }
  behaviours {
    slot     = 22
    material = COMPARATOR
    name     = "@guard.gui.region.behaviours-name"
    lore     = ["@guard.gui.region.behaviours-lore"]
    priority = 10
    click { left = ["guard:hub-behaviours"] }
  }
  templates {
    slot     = 23
    material = BOOKSHELF
    name     = "@guard.gui.region.templates-name"
    lore     = ["@guard.gui.region.templates-lore"]
    priority = 10
    click { left = ["guard:hub-templates"] }
  }
  history {
    slot     = 24
    material = CLOCK
    name     = "@guard.gui.region.history-name"
    lore     = ["@guard.gui.region.history-lore"]
    priority = 10
    click { left = ["guard:hub-history"] }
  }
  children {
    slot     = 29
    material = CHEST
    name     = "@guard.gui.region.children-name"
    lore     = ["@guard.gui.region.children-lore"]
    priority = 10
    click { left = ["guard:hub-children"] }
  }
  show {
    slot     = 30
    material = SPYGLASS
    name     = "@guard.gui.region.show-name"
    lore     = ["@guard.gui.region.show-lore"]
    priority = 10
    click { left = ["guard:hub-show"] }
  }
  priority {
    slot     = 31
    material = HOPPER
    name     = "@guard.gui.region.priority-name"
    lore     = ["@guard.gui.region.priority-lore"]
    priority = 10
    click {
      left = [
        { do = "input:guard.priority", prompt = "@guard.gui.region.priority-prompt" },
        "guard-hub-priority:%input%"
      ]
    }
  }
  tags {
    slot     = 32
    material = NAME_TAG
    name     = "@guard.gui.region.tags-name"
    lore     = ["@guard.gui.region.tags-lore"]
    priority = 10
    click {
      left = [
        { do = "input:guard.tag-add", prompt = "@guard.gui.region.tags-prompt" },
        "guard-hub-tag-add:%input%"
      ]
      right = [
        { do = "input:guard.tag-remove", prompt = "@guard.gui.region.tags-prompt" },
        "guard-hub-tag-remove:%input%"
      ]
    }
  }
  lock {
    slot     = 33
    material = "%guard_hub_locked%"
    name     = "@guard.gui.region.lock-name"
    lore     = ["@guard.gui.region.lock-lore"]
    priority = 10
    click { left = ["guard:hub-lock"] }
  }
  remove {
    slot     = 40
    material = TNT
    name     = "@guard.gui.region.remove-name"
    lore     = ["@guard.gui.region.remove-lore"]
    priority = 10
    click { left = ["guard:hub-remove"] }
  }

  # Back, a feather in the centre of the bottom row.
  back {
    slot     = 49
    material = FEATHER
    name     = "@guard.gui.back"
    priority = 10
    click { left = ["guard:hub-back"] }
  }
}
