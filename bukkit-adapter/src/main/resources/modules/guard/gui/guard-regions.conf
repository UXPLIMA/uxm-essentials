# The guard region list (/guard menu): every region of the world you stand in, highest priority first. A left
# click opens the region, a right click draws its borders for you. Words come from the message catalog
# (guard.gui.*); the window, the frame and where things sit are yours to change.
title = "@guard.gui.regions.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.6 1.2"]

items {
  # The grey frame. Lowest priority, so everything below draws on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    decor    = { hide-tooltip = true }
    priority = 0
  }

  regions {
    slots    = ["10-16", "19-25", "28-34", "37-43"]
    priority = 5
    list {
      source = "guard:regions"
      template {
        material = "%guard_region_icon%"
        name     = "@guard.gui.regions.entry-name"
        lore     = ["@guard.gui.regions.entry-lore"]
        click { left = ["guard:regions-open"], right = ["guard:regions-show"] }
      }
    }
  }

  # Previous page, directly left of the centre of the bottom row.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@guard.gui.prev"
    priority = 10
  }

  # Next page, directly right of the centre of the bottom row.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@guard.gui.next"
    priority = 10
  }
}
