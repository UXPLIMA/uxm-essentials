# Guard: region protection. Regions decide who may do what where (break, place, use, damage, items, movement and
# what nature does), and carry behaviours (fly, game mode, messages, healing, commands) for the players inside.
# Regions are made with /guard (Turkish /bolge) or the menus and stored in the database; this file holds the
# settings, the templates and the per-world defaults.
#
# Rule lines read  <action> <target> <allow|deny>
#   action  a dotted id from /guard actions, such as break, use.door, item.use.ender-pearl or world.fire.spread.
#           A rule on a parent (use) covers every child (use.door, use.container ...) that has no rule of its own.
#   target  everyone | nonmember | role:<owner|manager|member|guest|extra role> | perm:<node> | cond:<condition>
#           The condition uses the same syntax as menu requirements, for example cond:%player_level% >= 10.
# Behaviour lines read  <key> = <value>, for example fly = deny or message.enter = <green>welcome
#
# Inside one region the most specific target decides (roles and nonmember, then perm and cond, then everyone) and
# deny wins between rules of the same kind. Between regions the higher priority decides, then the inner region.
enabled = true

# Which regions this server loads. Every server always loads its own regions; a shared set is loaded by every
# server that lists it, so a lobby network can share one spawn. New regions are made on this server unless a set
# is named here or with /guard scope.
network {
  shared-sets = []
  new-region-scope = "server"   # "server" or "set:<name>"
  # Without Redis, servers notice each other's edits by polling the database this often.
  poll-seconds = 10
}

# What a player sees when an action is refused.
deny-message {
  channel = "actionbar"   # actionbar or chat
  cooldown-ms = 1500      # at most one message per player in this time
}

# /guard bypass reminds the player every this many seconds that their bypass is on.
bypass {
  reminder-seconds = 30
}

# /guard show draws region borders for the player who asked; nobody else sees them.
display {
  mode = "lines"   # lines (glowing block displays) or particles
  seconds = 20
  range = 64
}

# On Folia a teleport can skip the move event; the guard catches it on this period instead.
movement {
  check-ticks = 10
}

# Staff with uxmessentials.guard.notify are told when one player is refused this many times within the window.
alerts {
  enabled = true
  threshold = 8
  window-seconds = 20
  cooldown-seconds = 60
  discord = true   # also post to the Discord bridge when it is on
}

# Keep every refused action in the database for /guard log. Off by default: a busy server writes many rows.
log {
  enabled = false
  keep-days = 14
}

# A copy of every region is written to plugins/uxmEssentials/guard/backups on start and before an import.
backups {
  keep = 10
}

# Roles beyond owner, manager, member and guest. Give them rules with role:<name>.
roles {
  extra = []
}

# Also register /rg as a short alias of /guard. Off by default so WorldGuard keeps /rg when both are installed.
commands {
  rg-alias = false
}

# uxmSimpleClaims refuses a claim inside a guard region or closer to one than this many blocks.
claims {
  guard-distance = 16
}

# Templates: ready rule sets. /guard template <region> <name> links a region to one; the region's own rules and
# behaviours win over the template's, and editing a template here and reloading updates every linked region.
templates {
  spawn {
    rules = [
      "break everyone deny"
      "place everyone deny"
      "use everyone deny"
      "use.door everyone allow"
      "use.gate everyone allow"
      "use.button everyone allow"
      "use.pressure-plate everyone allow"
      "interact everyone deny"
      "damage everyone deny"
      "item.drop everyone deny"
      "item.use.ender-pearl everyone deny"
      "item.use.bucket everyone deny"
      "item.use.lighter everyone deny"
      "hanging everyone deny"
      "vehicle everyone deny"
      "trample everyone deny"
      "world.explosion everyone deny"
      "world.fire everyone deny"
      "world.mob everyone deny"
    ]
    behaviours = [
      "invincible = true"
      "spawn.deny = monster"
    ]
  }
  lobby {
    rules = [
      "break everyone deny"
      "place everyone deny"
      "use everyone deny"
      "use.door everyone allow"
      "use.button everyone allow"
      "use.pressure-plate everyone allow"
      "interact everyone deny"
      "damage everyone deny"
      "item.drop everyone deny"
      "item.pickup everyone deny"
      "item.use.ender-pearl everyone deny"
      "item.use.bucket everyone deny"
      "item.use.lighter everyone deny"
      "item.use.spawn-egg everyone deny"
      "hanging everyone deny"
      "vehicle everyone deny"
      "trample everyone deny"
      "world everyone deny"
    ]
    behaviours = [
      "invincible = true"
      "keep-inventory = true"
      "keep-exp = true"
      "feed = 20 10"
      "weather = clear"
      "spawn.deny = *"
      "void-teleport = -64 spawn"
    ]
  }
  arena {
    rules = [
      "break everyone deny"
      "place everyone deny"
      "use.container everyone deny"
      "use.workstation everyone deny"
      "use.bed everyone deny"
      "damage.player everyone allow"
      "item.use.ender-pearl everyone deny"
      "item.use.chorus-fruit everyone deny"
      "item.use.bucket everyone deny"
      "item.use.lighter everyone deny"
      "hanging everyone deny"
      "world.explosion everyone deny"
      "world.fire everyone deny"
    ]
    behaviours = [
      "fly = deny"
      "commands.deny = home, spawn, tpa, tpaccept, warp, back"
    ]
  }
  market {
    rules = [
      "break nonmember deny"
      "place nonmember deny"
      "use nonmember deny"
      "use.door everyone allow"
      "use.button everyone allow"
      "use.sign everyone allow"
      "interact nonmember deny"
      "damage everyone deny"
      "hanging nonmember deny"
      "item.use.lighter everyone deny"
      "world.explosion everyone deny"
      "world.fire everyone deny"
    ]
    behaviours = [
      "invincible = true"
    ]
  }
  parkour {
    rules = [
      "break everyone deny"
      "place everyone deny"
      "use everyone deny"
      "use.pressure-plate everyone allow"
      "use.button everyone allow"
      "interact everyone deny"
      "damage everyone deny"
      "item.drop everyone deny"
      "item.use.ender-pearl everyone deny"
      "item.use.firework everyone deny"
      "item.use.wind-charge everyone deny"
      "item.use.chorus-fruit everyone deny"
      "move.teleport-in everyone deny"
      "trample everyone deny"
    ]
    behaviours = [
      "fly = deny"
      "glide = deny"
      "invincible = true"
      "effects.block = speed, jump_boost, levitation, slow_falling"
    ]
  }
  build {
    rules = [
      "break nonmember deny"
      "place nonmember deny"
      "use nonmember deny"
      "interact nonmember deny"
      "hanging nonmember deny"
      "vehicle nonmember deny"
      "item.use.bucket nonmember deny"
      "item.use.lighter nonmember deny"
      "damage.animal nonmember deny"
      "damage.armor-stand nonmember deny"
      "damage.hanging nonmember deny"
      "world.explosion everyone deny"
      "world.fire.spread everyone deny"
    ]
    behaviours = []
  }
}

# Per-world defaults: an implicit region under every other region of the world. "default" applies to every world
# that has no entry of its own. These events cost nothing while no region in the world has a rule for them;
# high-frequency = false also skips liquid flow, fire spread, growth, decay, forming and melting where rules exist,
# for a world where those rules do not matter.
worlds {
  default {
    high-frequency = true
    rules = []
    behaviours = []
  }
}
