# Regions — a GUI to manage WorldGuard regions. /regions [world] (permission uxmessentials.regions.list) opens a
# paginated list of the regions in a world; the per-region flag and members/owners editors arrive in later updates.
#
# WorldGuard is a SOFT dependency. On a server without WorldGuard this module is fully inert: /regions replies
# "WorldGuard not installed" and opens nothing, and none of WorldGuard's classes are ever loaded.
#
# The module ships ENABLED. Turn the whole feature off with enabled = false.
enabled = true

# The region list GUI.
list {
  # How many regions fill one page of the /regions list before it paginates. 1..45 (one six-row chest page, with the
  # bottom row reserved for the previous/next buttons).
  page-size = 45
}

# The flag editor GUI (opened by clicking a region in the list, or with /regions flags <id>).
flags {
  # The WorldGuard state flags the editor lists, in display order. Each is cycled UNSET -> ALLOW -> DENY on click.
  # These must be state flags (ALLOW/DENY) — free-text flags such as greeting/farewell are not part of the cycle
  # editor. Names are the flag ids WorldGuard registers (lower kebab-case). Add or remove entries to taste.
  editable = [
    "pvp",
    "build",
    "mob-spawning",
    "mob-damage",
    "creeper-explosion",
    "tnt",
    "entry",
    "exit",
    "use",
    "chest-access",
    "ride",
    "interact"
  ]
}
