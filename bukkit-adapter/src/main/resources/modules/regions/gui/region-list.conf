# Layout of the /regions browser: the paginated list of the WorldGuard regions in the viewer's world. Clicking a
# region opens its flag editor. Titles and lore stay in the message catalog (messages_<lang>.conf); only the
# geometry and the icons live here.

# Menu height in rows (1..6).
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# Icon a region is drawn with, and the paginated-list fallback icon.
fallback-icon = "PAPER"

# Material of the previous/next page buttons.
nav-icon = "ARROW"

# Slots the previous- and next-page buttons sit in (bottom row of a six-row menu).
prev-slot = 48
next-slot = 50

# Slots the regions fill. Leave empty to use the first list.page-size slots from modules/regions/config.conf.
content-slots = []

# Material the unused cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"
