# Layout of the /regions flags editor: one icon per editable WorldGuard flag of the selected region, plus the
# button that opens that region's members and owners roster. Titles, flag labels and lore stay in the message
# catalog (messages_<lang>.conf); only the geometry and the icons live here.

# Menu height in rows (1..6).
rows = 6

# Icon a flag falls back to when its own kind has no specific material.
fallback-icon = "PAPER"

# Material of the previous/next page buttons.
nav-icon = "ARROW"

# Slots the previous- and next-page buttons sit in (bottom row of a six-row menu).
prev-slot = 48
next-slot = 50

# Slots the flag icons fill. Leave empty to use every slot except the bottom navigation row.
content-slots = []

# Material the unused cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"

# The members and owners button: its slot (bottom-right, clear of the nav arrows) and material. A -1 slot hides it.
action-slot = 53
action-icon = "PLAYER_HEAD"
