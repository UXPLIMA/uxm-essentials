# Layout of the /regions members roster: one head per member or owner of the selected region, opened from the flag
# editor's members button or from /regions members. Titles and lore stay in the message catalog
# (messages_<lang>.conf); only the geometry and the icons live here.

# Menu height in rows (1..6).
rows = 6

# Icon a roster entry is drawn with when its head cannot be resolved.
fallback-icon = "PLAYER_HEAD"

# Material of the previous/next page buttons.
nav-icon = "ARROW"

# Slots the previous- and next-page buttons sit in (bottom row of a six-row menu).
prev-slot = 48
next-slot = 50

# Slots the roster heads fill. Leave empty to use every slot except the bottom navigation row.
content-slots = []

# Material the unused cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"
