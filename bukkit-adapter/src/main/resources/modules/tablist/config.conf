# Tablist — the per-player tab-list header/footer, list-name formatting, and sort order, rendered from the content below.
#
# This used to live under the scoreboard module (scoreboard.tablist); it is now its own module so the sidebar and the
# tablist can be enabled, authored, and refreshed independently. The defaults here match the old combined config.
#
# Everything under `tablist`/`formats` is MiniMessage rendered as written — these are NOT plugin strings and are not
# translated through messages_<lang>.conf. The tablist is always-on for every player when the module is enabled —
# there is no per-player toggle.
#
# Two kinds of token work in any header, footer, or name-format line:
#   built-in {tokens}  — resolved by the plugin itself, so they work WITHOUT PlaceholderAPI. Available:
#                          {player}      the viewer's name
#                          {displayname} the viewer's display name (plain text)
#                          {online}      players currently online
#                          {max_players} the server slot count
#                          {world}       the viewer's world name
#                          {ping}        the viewer's ping in ms
#                          {tps}         the server's 1-minute tick rate
#                          {tps_colored} the same rate, coloured green/yellow/red by health
#                          {uptime}      how long the server has run (e.g. 1h30m)
#                          {ram_used}    used heap in MB
#                          {ram_max}     maximum heap in MB
#   PlaceholderAPI %papi%  — e.g. %server_online%, %player_name%; these need PlaceholderAPI installed, and without it
#                            they are left on the tab verbatim.
#
# The module ships ENABLED with the example header/footer below so a fresh install shows a working tab. Edit the lines
# and the play.example.net line to brand it for your server (or set enabled = false to turn it off).
enabled = true

# How often every viewer is re-rendered, in server ticks (20 ticks = one second). Must be positive. This is the GLOBAL
# cadence; when using the `formats { … }` block below it is read from here, otherwise from `tablist.refresh-ticks`.
refresh-ticks = 20

# --- Single-tablist shape (back-compat) ------------------------------------------------------------------------------
# The historical shape: one header/footer for everyone. Left here as the default. When a `formats { … }` block is
# present (see below) this block is ignored and the formats drive everything.
tablist {
  # The tablist header lines, joined top to bottom with newlines. This example uses the built-in {tokens} above, so it
  # shows real values with or without PlaceholderAPI — edit it to taste. (Leaving BOTH header and footer empty would
  # leave the player's tab untouched rather than blanking it; the header and footer are sent together.)
  header = [
    ""
    "<gradient:#5e9bff:#9b5eff><bold>uxmEssentials</bold></gradient>"
    "<gray>Online <white>{online}<gray>/</gray>{max_players}</white></gray>"
    ""
  ]
  # The tablist footer lines, joined top to bottom with newlines.
  footer = [
    ""
    "<gray>play.example.net</gray>"
    ""
  ]
  # How often every viewer is re-rendered, in server ticks (20 ticks = one second). Must be positive.
  refresh-ticks = 20
  # World names where the tablist is suppressed entirely.
  world-blacklist = []
}

# --- Multiple-format shape (recommended) -----------------------------------------------------------------------------
# Each named format carries a header/footer, an optional per-player list NAME (how the player appears to everyone in the
# tab list), and an optional sort ORDER (where the player sits in the tab list). Each viewer is shown the highest-
# priority format whose `condition` matches them; ties on priority are broken by the alphabetically-first format name.
# Uncomment and author to enable.
#
# `condition`   — see shared/display/ConditionParser for the grammar: "permission:<node>", "world:<name>",
#                 "gamemode:<mode>", "%papi% >= 10", "&&"/","/"||"/"!" combinators. Blank = always.
# `name-format` — MiniMessage rendered per viewer. The token {player} is replaced with the player's name; PlaceholderAPI
#                 placeholders (e.g. %player_name%) are expanded too. Omit to leave the player's vanilla list name.
# `sort-order`  — Player.setPlayerListOrder value (Paper 1.21.2+): a POSITIVE integer where a HIGHER value sorts the
#                 player HIGHER (nearer the top) in the tab list; players with equal order are sorted alphabetically by
#                 name by the client. Omit (or set <= 0) to leave the player's vanilla sort order untouched.
# `skin`        — OPTIONAL custom skin for the player's tab row. This is the one tab thing vanilla/Paper cannot do, so it
#                 is delivered through packets (nothing extra to install). Two sources:
#                   "player:<name>"      — copy a named player's skin. If that player is ONLINE their skin is read
#                                          instantly; if OFFLINE it is fetched from Mojang once, asynchronously (off the
#                                          server thread) and cached, so the first paint shows no skin and a later refresh
#                                          shows it. A fetch failure falls back to no skin (the player's real skin).
#                   "texture:<base64>"   — a Mojang texture value directly, optionally with a signature appended:
#                                          "texture:<base64>:<signature>". No lookup is done.
#                 Omit to leave the player's normal skin on their tab row (the default — nothing changes). When a skin is
#                 set the name/order above are delivered through the same packet; when it is not, the native path is used
#                 unchanged. The packet is only (re)sent when the format/skin changes, so it never flickers per refresh.
# `header`/`footer` — omit BOTH (a name-only / order-only format) to leave the tab header/footer untouched rather than
#                 blanking it. If a player switches FROM a format that authored a header/footer TO such a format, this
#                 plugin clears the header/footer it set (it would otherwise go stale) but never touches one it did not.
#
# formats {
#   staff {
#     condition = "permission:uxmessentials.staff"
#     priority = 10
#     name-format = "<red>[Staff] {player}"
#     sort-order = 100
#     # skin = "player:Notch"          # OPTIONAL custom tab-row skin; "player:<name>" or "texture:<base64>[:<sig>]"
#     header = [ "<red>Staff online" ]
#     footer = [ "<gray>play.example.net" ]
#     world-blacklist = []
#   }
#   default {
#     condition = ""
#     priority = 0
#     header = [ "<gold>Welcome" ]
#     footer = [ "<gray>play.example.net" ]
#   }
# }

# --- Fixed-slot filler grid (`layout`) -------------------------------------------------------------------------------
# A format may add a `layout { … }` block to fill the tab cells the REAL players do not with custom "filler" entries —
# free-text rows (custom MiniMessage text and an OPTIONAL custom skin) you fully control. The real players keep the
# early slots (they sort above every filler), and the fillers fill the remaining cells, positioned by `slot`. The whole
# grid is delivered per viewer through packets (nothing extra to install) and is only (re)sent when a cell's resolved
# text or skin changes, so a static filler never flickers and an animated one steps with the refresh. Real players are
# NOT hidden — the fillers sit alongside them in the cells after them.
#
# Place `layout { … }` inside a format (above) — or temporarily inside the back-compat `tablist` block if you only run
# one format. The default ships with NO layout, so the tab behaves exactly as it does without this block.
#
#   `direction`  — how a slot maps to a tab cell. The tab list is 4 columns of 20 cells.
#                    "COLUMNS" (the default) fills down each column: slot 1 is the top-left cell, slot 2 the cell below
#                              it, … slot 21 the top of the second column. Slot order is the visual top-to-bottom order.
#                    "ROWS"    fills across each row left to right: slot 1 top-left, slot 2 the top of the SECOND column,
#                              … slot 5 the first column of the second row.
#   `rows`       — cells per column; leave at 20 for the standard 80-slot tab list.
#   `fillers`    — the list of filler rows. Each entry:
#                    `slot` — the 1-based grid slot it occupies (a slot used twice keeps the first and logs the rest).
#                    `text` — the row's MiniMessage text. Built-in {tokens} (e.g. {online}, {max_players}) and %papi%
#                             placeholders work here exactly as in a header/footer line.
#                    `skin` — OPTIONAL, same grammar as a format's `skin`: "player:<name>" or "texture:<base64>[:<sig>]".
#                             Omit for the default (no skin) head.
#
# Example (uncomment and place inside a format, or adapt for the back-compat `tablist` block):
# layout {
#   direction = "COLUMNS"
#   rows = 20
#   fillers = [
#     { slot = 17, text = "<gray>──────────────" }
#     { slot = 18, text = "<aqua>Online: <white>{online}/{max_players}" }
#     { slot = 19, text = "<gold>Store: <white>store.example.net", skin = "player:Notch" }
#     { slot = 20, text = "<light_purple>Discord: <white>discord.gg/example" }
#   ]
# }

# --- Animated header/footer ------------------------------------------------------------------------------------------
# Declare named animations in the top-level `animations { … }` block below, then reference one anywhere in a header or
# footer line as the token %anim_<name>%. The token is expanded to the animation's current frame BEFORE PlaceholderAPI
# and MiniMessage run, so a frame may itself carry colour tags or placeholders. The whole tablist shares one global
# animation clock that ticks once per render cadence (refresh-ticks above), so every viewer sees the same frame and the
# animation steps at most once per refresh. A token naming an animation that does not exist is left verbatim, so you can
# spot a typo. This is the same animation catalog the scoreboard uses, so the three types match:
#   FRAMES   — cycle through `frames` one per `interval-ticks` (the only type that uses more than one frame).
#   SCROLL   — slide a `window`-wide marquee across the single source frame, wrapping through `separator`.
#   GRADIENT — sweep an animated multi-stop colour gradient across the single source frame over `steps` steps.
# An animation with an unknown `type`, no `frames`, or invalid params is skipped (logged once) — it never blanks the
# tablist. `interval-ticks` is the step cadence for every type (minimum 1).
#
# Example (uncomment and adapt; then use the tokens in a header/footer line, e.g. header = [ "<gray>%anim_marquee%" ]):
# animations {
#   blink {
#     type = "FRAMES"
#     frames = [ "<green>●</green> Online", "<dark_green>●</dark_green> Online" ]
#     interval-ticks = 10
#   }
#   marquee {
#     type = "SCROLL"
#     frames = [ "welcome to the server — have fun!" ]
#     interval-ticks = 2
#     window = 18          # visible width in characters
#     separator = "   "    # gap inserted between the end and the wrapped start
#   }
# }
#
# Then, in a format (or the back-compat tablist block above), reference the token in a line:
#   header = [ "<gray>%anim_blink%", "<aqua>%anim_marquee%" ]
