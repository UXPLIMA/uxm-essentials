# Player warps — /pwarp /setpwarp /pwarps (remove with /pwarp del).
enabled = true
default-limit = 3                   # player-warps per player without a uxmessentials.pwarp.limit.<n> node

# Entry-fee payout: how a priced warp's takings are split and settled.
payout {
  cut-percent = 10                  # server's share of each entry fee; the rest banks to the owner
  auto-payout = false               # settle the owner immediately (only for offline-writable currencies) vs. bank it for /pwarp withdraw
}

# Star ratings: how the "top rated" browse ranks warps.
ratings {
  confidence = 10                   # Bayesian smoothing constant C: how many global-mean votes of prior each warp starts with, so a lone 5-star vote cannot outrank a proven favourite. Higher = stronger pull toward the global mean.

  # Rating rewards — grant a reward when a warp is rated, deduped so it cannot be farmed. Off by default. The rater
  # is rewarded once per warp (re-rating the same warp grants nothing); the owner is rewarded once per unique rater.
  # A money reward needs an economy provider (it is a logged no-op without one); a command reward always works. Item
  # rewards are out of scope. A reward with money = 0 and command = "" grants nothing, so leave one side blank to
  # reward only the other. The command runs from the console with %player% replaced by the rewarded player's name.
  rewards {
    enabled = false                 # master switch for the whole rating-reward sub-group; off = no rating ever grants
    rater {
      money = 0                     # amount credited to the rater, in the currency below (0 = no money reward)
      currency = "default"          # currency the rater's money reward is credited in
      command = ""                  # console command run for the rater ("" = none); %player% = the rater's name
    }
    owner {
      money = 0                     # amount credited to the warp owner per unique rater (0 = no money reward)
      currency = "default"          # currency the owner's money reward is credited in
      command = ""                  # console command run for the owner ("" = none); %player% = the owner's name
    }
  }
}

# Rent — pay to keep a warp listed. Off by default; needs an economy provider (a warp with no rent term is exempt
# until this is enabled). The sweep charges each due warp from its own earnings bank first, then the owner's wallet;
# an unpaid warp is suspended for grace-days, then archived (recoverable via /pwarp admin restore — never deleted).
rent {
  enabled = false                   # master switch for the whole rent lifecycle; off = nothing is charged or suspended
  amount = 100                      # rent charged every period, in the currency below
  currency = "default"              # currency the rent is charged in
  period-days = 7                   # how long one paid term lasts
  grace-days = 3                    # how long a suspended warp waits before it is archived
  hard-delete-after-days = -1       # -1 = never hard-delete an archived warp (reserved for a later task; archives stay recoverable)
  check-interval-minutes = 60       # how often the off-tick sweep runs (charges, retries, reminders)
  reminder-hours = [24, 12, 6, 1]   # send the owner a mail this many hours before the term lapses (one per window)
  exempt {
    players = []                    # owner names or uuids never charged rent
    categories = []                 # category ids never charged rent
    worlds = []                     # world names never charged rent
  }
}

# Sponsorship — an owner pays for a time-limited pinned browse slot. Off by default; needs an economy provider (a paid
# slot cannot be sold for free, so with no provider the whole sub-group stays off). A purchase takes the lowest free
# slot; when it expires the sweep frees the slot and the warp waits out cooldown-days before it can be sponsored again.
# A sponsored warp cannot be transferred while its term is live.
sponsor {
  enabled = false                   # master switch for the whole sponsorship sub-group; off = no slot sold, swept or pinned
  slots = 5                         # how many sponsor slots exist (a purchase takes the lowest free one)
  duration-days = 7                 # the longest term one purchase may run; an omitted /pwarp sponsor term defaults to this
  price = 1000                      # the fee charged per purchase, in the currency below
  currency = "default"              # currency the fee is charged in
  max-concurrent-per-player = 1     # how many live sponsorships one owner may hold at once
  cooldown-days = 3                 # how long a warp waits after its sponsorship expires before it can be sponsored again
  check-interval-minutes = 60       # how often the off-tick expiry sweep runs (frees lapsed slots, stamps cooldowns)
}

# Cross-server teleport — reach a warp that lives on another backend of the network. Off by default; needs a proxy
# (BungeeCord/Velocity) in front and a shared database, plus a unique network.server-id per backend. When on, using a
# warp tagged for another server charges on this backend, records the intent in the shared player_warp_pending_teleports
# table, and connects the player across the proxy; the target backend teleports them on join and refunds if the warp has
# gone. With no proxy channel registered a remote warp is refused (and any charge refunded) rather than hopped locally.
cross-server {
  enabled = false                   # master switch for the whole cross-server sub-group; off = remote warps are refused, no join handling
  arrival-delay-ticks = 20          # how long after the target-server join to settle before completing the local hop (20 ticks = 1s)
  request-ttl-seconds = 30          # a pending teleport older than this is treated as abandoned: cleared and refunded instead of honoured
}
