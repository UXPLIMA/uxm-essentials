# Player warps — /pwarp /setpwarp /pwarps (remove with /pwarp del).
enabled = true
default-limit = 3                   # player-warps per player without a uxmessentials.pwarp.limit.<n> node

# Entry-fee payout: how a priced warp's takings are split and settled.
payout {
  cut-percent = 10                  # server's share of each entry fee; the rest banks to the owner
  auto-payout = false               # settle the owner immediately (only for offline-writable currencies) vs. bank it for /pwarp withdraw
}

# Star ratings: how the "top rated" browse ranks warps.
ratings {
  confidence = 10                   # Bayesian smoothing constant C: how many global-mean votes of prior each warp starts with, so a lone 5-star vote cannot outrank a proven favourite. Higher = stronger pull toward the global mean.
}
