# The warp members sub-menu (opened by the members button on pwarp-manage), rendered through the menu engine. One
# PLAYER_HEAD per co-owner and manager the warp carries, snapshotted off the tick thread as the menu subject, with a
# role line in the lore. A left click on a head removes that member through the same ManageMembers.removeMember the
# /pwarp members remove verb drives; the two add buttons prompt for a player name in chat and grant the co-owner or
# manager role directly (no nested role picker), through ManageMembers.addMember. The grid is the playerwarps:people
# list source; the pwarp_people_name and pwarp_member_role placeholders fill each head from its bound row. The button
# is only ever reached by a viewer whose role holds MANAGE_MEMBERS (owner-only), gated on the manage panel. Every label
# resolves from the player-warps catalog, so no user-facing text lives here.
title = "@pwarp.gui.members.title"
rows = 6

items {
  # The dark backdrop. Lowest priority, so the content grid and the control bar drawn below sit on top of it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The cyan frame that squares off the bottom control bar, filling the gaps between its buttons so the row reads as
  # one solid strip.
  frame {
    slots    = ["46", "49", "51", "53"]
    material = CYAN_STAINED_GLASS_PANE
    name     = ""
    priority = 1
  }

  # The members grid, paginated across the top five rows (the bottom row is reserved for the add/nav buttons). Each
  # cell is a PLAYER_HEAD with the member's name and role; a left click removes that member through
  # playerwarps:members-remove.
  members {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "playerwarps:people"
      template {
        material = PLAYER_HEAD
        name     = "@pwarp.gui.members.entry-name"
        lore     = ["@pwarp.gui.members.entry-lore"]
        click { left = ["playerwarps:members-remove"] }
      }
    }
  }

  # Back to the manage panel.
  back {
    slot     = 45
    material = ARROW
    name     = "@pwarp.gui.members.back"
    priority = 10
    click { left = ["playerwarps:people-back"] }
  }

  # Grant a co-owner: prompt for a name in chat, then add them with the CO_OWNER role. The typed name rides %input%
  # into the single-segment add action.
  add-coowner {
    slot     = 47
    material = LIME_DYE
    name     = "@pwarp.gui.members.add-coowner"
    priority = 10
    click {
      left = [
        { do = "input:pwarp.mem-addco", prompt = "@pwarp.gui.members.add-prompt" },
        "pwarp-mem-addco:%input%"
      ]
    }
  }

  # Grant a manager: prompt for a name in chat, then add them with the MANAGER role.
  add-manager {
    slot     = 48
    material = YELLOW_DYE
    name     = "@pwarp.gui.members.add-manager"
    priority = 10
    click {
      left = [
        { do = "input:pwarp.mem-addmgr", prompt = "@pwarp.gui.members.add-prompt" },
        "pwarp-mem-addmgr:%input%"
      ]
    }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 50
    type     = PREVIOUS
    material = ARROW
    name     = "@pwarp.gui.members.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 52
    type     = NEXT
    material = ARROW
    name     = "@pwarp.gui.members.next"
    priority = 10
  }
}
