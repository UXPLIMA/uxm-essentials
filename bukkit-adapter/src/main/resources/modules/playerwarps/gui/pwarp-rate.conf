# The five-star rating menu (opened by the rate button on the pwarp-view detail panel), rendered through the menu
# engine. A framed three-row panel carrying the same warp subject the detail panel handed it: five star buttons, one
# per star count, each awarding that rating through RatePlayerWarp and re-opening the detail panel so the new rating
# shows. Each button previews its score as filled and hollow stars. The owner never reaches this menu (the detail panel
# hides the rate button for them), and RatePlayerWarp rejects an owner rating defensively even so. Every label resolves
# from the player-warps catalog, so no user-facing text lives here.
title = "@pwarp.gui.rate.title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The dark backdrop. Lowest priority, so the frame and the star buttons drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The cyan frame: a top band, the side columns, and a bottom band around the back button.
  frame {
    slots    = ["0-3", "5-8", "9", "17", "18-21", "23-26"]
    material = CYAN_STAINED_GLASS_PANE
    name     = ""
    priority = 1
  }

  star-1 {
    slot     = 11
    material = NETHER_STAR
    name     = "@pwarp.gui.rate.star-1"
    lore     = ["@pwarp.gui.rate.star-1-lore"]
    priority = 10
    click { left = ["pwarp-rate:1"] }
  }

  star-2 {
    slot     = 12
    material = NETHER_STAR
    name     = "@pwarp.gui.rate.star-2"
    lore     = ["@pwarp.gui.rate.star-2-lore"]
    priority = 10
    click { left = ["pwarp-rate:2"] }
  }

  star-3 {
    slot     = 13
    material = NETHER_STAR
    name     = "@pwarp.gui.rate.star-3"
    lore     = ["@pwarp.gui.rate.star-3-lore"]
    priority = 10
    click { left = ["pwarp-rate:3"] }
  }

  star-4 {
    slot     = 14
    material = NETHER_STAR
    name     = "@pwarp.gui.rate.star-4"
    lore     = ["@pwarp.gui.rate.star-4-lore"]
    priority = 10
    click { left = ["pwarp-rate:4"] }
  }

  star-5 {
    slot     = 15
    material = NETHER_STAR
    name     = "@pwarp.gui.rate.star-5"
    lore     = ["@pwarp.gui.rate.star-5-lore"]
    priority = 10
    click { left = ["pwarp-rate:5"] }
  }

  # Back to the warp's detail panel.
  back {
    slot     = 22
    material = ARROW
    name     = "@pwarp.gui.rate.back"
    priority = 10
    click { left = ["playerwarps:rate-back"] }
  }
}
