# The five-star rating menu (opened by the rate button on the pwarp-view detail panel), rendered through the menu
# engine. A fixed three-row panel carrying the same warp subject the detail panel handed it: five star buttons, one per
# star count, each awarding that rating through RatePlayerWarp and re-opening the detail panel so the new rating shows.
# The owner never reaches this menu (the detail panel hides the rate button for them), and RatePlayerWarp rejects an
# owner rating defensively even so. Every label resolves from the player-warps catalog, so no user-facing text lives here.
title = "@pwarp.gui.rate.title"
rows = 3

items {
  # The grey-glass backdrop. Lowest priority, so the star buttons drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  star-1 {
    slot     = 11
    material = NETHER_STAR
    name     = "@pwarp.gui.rate.star-1"
    priority = 10
    click { left = ["pwarp-rate:1"] }
  }

  star-2 {
    slot     = 12
    material = NETHER_STAR
    name     = "@pwarp.gui.rate.star-2"
    priority = 10
    click { left = ["pwarp-rate:2"] }
  }

  star-3 {
    slot     = 13
    material = NETHER_STAR
    name     = "@pwarp.gui.rate.star-3"
    priority = 10
    click { left = ["pwarp-rate:3"] }
  }

  star-4 {
    slot     = 14
    material = NETHER_STAR
    name     = "@pwarp.gui.rate.star-4"
    priority = 10
    click { left = ["pwarp-rate:4"] }
  }

  star-5 {
    slot     = 15
    material = NETHER_STAR
    name     = "@pwarp.gui.rate.star-5"
    priority = 10
    click { left = ["pwarp-rate:5"] }
  }

  # Back to the warp's detail panel.
  back {
    slot     = 22
    material = ARROW
    name     = "@pwarp.gui.rate.back"
    priority = 10
    click { left = ["playerwarps:rate-back"] }
  }
}
