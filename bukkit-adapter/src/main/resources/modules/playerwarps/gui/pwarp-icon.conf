# The warp-icon picker opened from the manage panel's icon button, rendered through the menu engine; the player-warps
# twin of the home-icon picker. One cell per material in the configured palette, paged across the top five rows, with a
# reset button and the two nav arrows on the bottom row. The grid is the playerwarps:icon-palette list source: each
# cell's material is the palette entry itself and its name resolves from the player-warps catalog, filled with that
# material's name through the pwarp_icon_material placeholder. A left click sets the subject warp's browse icon to that
# material through playerwarps:icon-set and returns to the manage panel; the reset button clears the custom icon through
# playerwarps:icon-reset. Every label resolves from the catalog, so no user-facing text lives here.
title = "@pwarp.gui.icon.title"
rows = 6

items {
  # The palette grid, paginated across the top five rows. Each cell shows the palette material and its name; a left
  # click sets the warp's icon to it through playerwarps:icon-set.
  palette {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "playerwarps:icon-palette"
      template {
        material = "%pwarp_icon_material%"
        name     = "@pwarp.gui.icon.entry-name"
        click { left = ["playerwarps:icon-set"] }
      }
    }
  }

  # Clear the custom icon and return to the manage panel. Pinned to the bottom row.
  reset {
    slot     = 45
    material = BARRIER
    name     = "@pwarp.gui.icon.reset"
    lore     = ["@pwarp.gui.icon.reset-lore"]
    priority = 10
    click { left = ["playerwarps:icon-reset"] }
  }

  # Previous page.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@pwarp.gui.icon.prev"
    priority = 10
  }

  # Back to the manage panel without changing the icon.
  back {
    slot     = 49
    material = ARROW
    name     = "@pwarp.gui.icon.back"
    priority = 10
    click { left = ["playerwarps:icon-back"] }
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@pwarp.gui.icon.next"
    priority = 10
  }
}
