# The warp bans sub-menu (opened by the bans button on pwarp-manage), rendered through the menu engine. One PLAYER_HEAD
# per banned player, snapshotted off the tick thread as the menu subject, with the reason and expiry in the lore. A left
# click on a head lifts that ban through the same ManageBans.unban the /pwarp unban verb drives; the add button prompts
# for a player name in chat and imposes a permanent, reasonless ban through ManageBans.ban (a timed or reasoned ban is
# the /pwarp ban command's job, not the GUI's). The grid is the playerwarps:people list source; the pwarp_people_name,
# pwarp_ban_reason and pwarp_ban_until placeholders fill each head from its bound row. The button is reached by a viewer
# whose role holds MANAGE_BANS (owner / co-owner / manager), gated on the manage panel. Every label resolves from the
# player-warps catalog, so no user-facing text lives here.
title = "@pwarp.gui.bans.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey backdrop. Lowest priority, so the content grid and the control bar drawn below sit on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    decor    = { hide-tooltip = true }
    priority = 0
  }

  # The frame, grey like the backdrop, that squares off the bottom control bar, filling the gaps between its buttons so
  # the row reads as one solid strip.
  frame {
    slots    = [46, 47, 51, 52, 53]
    material = GRAY_STAINED_GLASS_PANE
    decor    = { hide-tooltip = true }
    priority = 1
  }

  # The bans grid, paginated across the top five rows. Each cell is a PLAYER_HEAD with the player's name, ban reason and
  # expiry; a left click lifts that ban through playerwarps:bans-remove.
  bans {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "playerwarps:people"
      template {
        material = PLAYER_HEAD
        name     = "@pwarp.gui.bans.entry-name"
        lore     = ["@pwarp.gui.bans.entry-lore"]
        click { left = ["playerwarps:bans-remove"] }
      }
    }
  }

  # Back, a feather in the centre of the bottom row.
  back {
    slot     = 49
    material = FEATHER
    name     = "@pwarp.gui.bans.back"
    priority = 10
    click { left = ["playerwarps:people-back"] }
  }

  # Ban a player: prompt for a name in chat, then impose a permanent, reasonless ban. The typed name rides %input% into
  # the single-segment add action.
  add {
    slot     = 45
    material = BARRIER
    name     = "@pwarp.gui.bans.add"
    priority = 10
    click {
      left = [
        { do = "input:pwarp.ban-add", prompt = "@pwarp.gui.bans.add-prompt" },
        "pwarp-ban-add:%input%"
      ]
    }
  }

  # Previous page, directly left of the centre of the bottom row.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@pwarp.gui.bans.prev"
    priority = 10
  }

  # Next page, directly right of the centre of the bottom row.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@pwarp.gui.bans.next"
    priority = 10
  }
}
