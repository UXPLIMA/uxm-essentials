# The warp whitelist sub-menu (opened by the whitelist button on pwarp-manage), rendered through the menu engine. One
# PLAYER_HEAD per whitelisted player, snapshotted off the tick thread as the menu subject. A left click on a head
# removes that player through the same ManageWhitelist.unwhitelist the /pwarp whitelist remove verb drives; the add
# button prompts for a player name in chat and whitelists them through ManageWhitelist.whitelist. The grid is the
# playerwarps:people list source; the pwarp_people_name placeholder fills each head from its bound row. The button is
# reached by a viewer whose role holds MANAGE_WHITELIST (owner / co-owner / manager), gated on the manage panel. Every
# label resolves from the player-warps catalog, so no user-facing text lives here.
title = "@pwarp.gui.whitelist.title"
rows = 6

items {
  # The dark backdrop. Lowest priority, so the content grid and the control bar drawn below sit on top of it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The cyan frame that squares off the bottom control bar, filling the gaps between its buttons so the row reads as
  # one solid strip.
  frame {
    slots    = ["46", "47", "49", "51", "53"]
    material = CYAN_STAINED_GLASS_PANE
    name     = ""
    priority = 1
  }

  # The whitelist grid, paginated across the top five rows. Each cell is a PLAYER_HEAD with the player's name; a left
  # click removes that player through playerwarps:whitelist-remove.
  whitelist {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "playerwarps:people"
      template {
        material = PLAYER_HEAD
        name     = "@pwarp.gui.whitelist.entry-name"
        lore     = ["@pwarp.gui.whitelist.entry-lore"]
        click { left = ["playerwarps:whitelist-remove"] }
      }
    }
  }

  # Back to the manage panel.
  back {
    slot     = 45
    material = ARROW
    name     = "@pwarp.gui.whitelist.back"
    priority = 10
    click { left = ["playerwarps:people-back"] }
  }

  # Whitelist a player: prompt for a name in chat, then add them. The typed name rides %input% into the single-segment
  # add action.
  add {
    slot     = 48
    material = LIME_DYE
    name     = "@pwarp.gui.whitelist.add"
    priority = 10
    click {
      left = [
        { do = "input:pwarp.wl-add", prompt = "@pwarp.gui.whitelist.add-prompt" },
        "pwarp-wl-add:%input%"
      ]
    }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 50
    type     = PREVIOUS
    material = ARROW
    name     = "@pwarp.gui.whitelist.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 52
    type     = NEXT
    material = ARROW
    name     = "@pwarp.gui.whitelist.next"
    priority = 10
  }
}
