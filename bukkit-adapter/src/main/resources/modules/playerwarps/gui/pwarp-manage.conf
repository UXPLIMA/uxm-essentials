# The capability-gated single-warp management panel (opened by the manage button on pwarp-view), rendered through the
# menu engine. A six-row panel for one warp carried as the menu's subject: a read-only info tile plus one button per
# management verb, each drawn only when the viewer's WarpRole grants the matching WarpCapability. The pwarp-viewer-can
# condition reads the role off the subject and answers role.can(<capability>), so a MANAGER sees only the metadata
# buttons, a CO_OWNER everything but transfer and delete, and the OWNER the full set. Every button routes through the
# same P4 use case the /pwarp verbs drive (EditPlayerWarp / WithdrawEarnings / TransferPlayerWarp / ArchivePlayerWarp);
# a value-carrying click id is single-segment (pwarp-rename, pwarp-price, ...) because the engine splits a value token
# on its first colon, while value-free ids stay namespaced. The password value rides the input: step into the set
# action and is never echoed. Every label resolves from the player-warps catalog, so no user-facing text lives here.
#
# Row 3 (slots 27-35) holds the members / whitelist / bans people-management buttons: each is drawn only when the
# viewer's role grants the matching capability (MANAGE_MEMBERS is owner-only, MANAGE_WHITELIST / MANAGE_BANS admit the
# owner, a co-owner and a manager) and opens the warp's people sub-menu.
title = "@pwarp.gui.manage.title"
rows = 6

items {
  # The dark backdrop. Lowest priority, so the frame, the info tile and the verb buttons drawn below sit on top of it,
  # and a slot a capability hides falls back to it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The cyan frame: a top band around the info crest, the two side columns down the panel, and a bottom band around the
  # back button. It is laid out to leave every capability-gated verb slot on the dark backdrop, so a hidden verb still
  # falls back to the backdrop rather than the frame.
  frame {
    slots    = ["0-3", "5-8", "9", "17", "18", "26", "27", "35", "36", "44", "45-48", "50-52"]
    material = CYAN_STAINED_GLASS_PANE
    name     = ""
    priority = 1
  }

  # Read-only warp info: name and the management detail lore (owner, access, price, bank balance, category).
  info {
    slot     = 4
    material = PAPER
    name     = "%pwarp_manage_name%"
    lore     = ["%pwarp_manage_lore%"]
    priority = 10
  }

  # Rename the warp's globally-unique name. Capability RENAME (owner + co-owner, never a manager).
  rename {
    slot     = 10
    material = NAME_TAG
    name     = "@pwarp.gui.manage.rename"
    priority = 10
    view     = ["pwarp-viewer-can:RENAME"]
    click {
      left = [
        { do = "input:pwarp.rename", prompt = "@pwarp.gui.manage.rename-prompt" },
        "pwarp-rename:%input%"
      ]
    }
  }

  # Set or clear the display name. Capability EDIT_METADATA (owner + co-owner + manager).
  display-name {
    slot     = 11
    material = WRITABLE_BOOK
    name     = "@pwarp.gui.manage.display-name"
    priority = 10
    view     = ["pwarp-viewer-can:EDIT_METADATA"]
    click {
      left = [
        { do = "input:pwarp.displayname", prompt = "@pwarp.gui.manage.display-name-prompt" },
        "pwarp-displayname:%input%"
      ]
    }
  }

  # Set or clear the description. Capability EDIT_METADATA.
  description {
    slot     = 12
    material = BOOK
    name     = "@pwarp.gui.manage.description"
    priority = 10
    view     = ["pwarp-viewer-can:EDIT_METADATA"]
    click {
      left = [
        { do = "input:pwarp.description", prompt = "@pwarp.gui.manage.description-prompt" },
        "pwarp-description:%input%"
      ]
    }
  }

  # Open the pwarp-icon palette selector for this warp; a picked material becomes the browse icon. Capability
  # EDIT_METADATA (owner + co-owner + manager), the same gate the picker's write re-checks.
  icon {
    slot     = 13
    material = ITEM_FRAME
    name     = "@pwarp.gui.manage.icon"
    priority = 10
    view     = ["pwarp-viewer-can:EDIT_METADATA"]
    click { left = ["playerwarps:manage-icon"] }
  }

  # File the warp under a browse category (or clear it). Capability EDIT_METADATA.
  category {
    slot     = 14
    material = BOOKSHELF
    name     = "@pwarp.gui.manage.category"
    priority = 10
    view     = ["pwarp-viewer-can:EDIT_METADATA"]
    click {
      left = [
        { do = "input:pwarp.category", prompt = "@pwarp.gui.manage.category-prompt" },
        "pwarp-category:%input%"
      ]
    }
  }

  # Cycle the access axis PUBLIC -> PASSWORD -> WHITELIST -> PRIVATE. Capability EDIT_ACCESS (owner + co-owner).
  access {
    slot     = 19
    material = IRON_DOOR
    name     = "@pwarp.gui.manage.access"
    priority = 10
    view     = ["pwarp-viewer-can:EDIT_ACCESS"]
    click { left = ["playerwarps:manage-access"] }
  }

  # Set the password (left, prompted) or clear it (right, confirm-gated). Capability EDIT_ACCESS. The typed password
  # rides %input% into the set action and is never echoed, logged, or tab-completed.
  password {
    slot     = 20
    material = TRIPWIRE_HOOK
    name     = "@pwarp.gui.manage.password"
    priority = 10
    view     = ["pwarp-viewer-can:EDIT_ACCESS"]
    click {
      left = [
        { do = "input:pwarp.password", prompt = "@pwarp.gui.manage.password-prompt" },
        "pwarp-password:%input%"
      ]
      right = { do = "confirm:pwarp.clearpw", title = "@pwarp.gui.manage.password-clear-confirm",
                yes = ["playerwarps:manage-clearpw"], no = [] }
    }
  }

  # Set the entry price (amount, optionally a currency). Capability EDIT_PRICE (owner + co-owner).
  price {
    slot     = 21
    material = GOLD_INGOT
    name     = "@pwarp.gui.manage.price"
    priority = 10
    view     = ["pwarp-viewer-can:EDIT_PRICE"]
    click {
      left = [
        { do = "input:pwarp.price", prompt = "@pwarp.gui.manage.price-prompt" },
        "pwarp-price:%input%"
      ]
    }
  }

  # Re-anchor the warp where the viewer stands. Capability MOVE (owner + co-owner).
  move {
    slot     = 22
    material = COMPASS
    name     = "@pwarp.gui.manage.move"
    priority = 10
    view     = ["pwarp-viewer-can:MOVE"]
    click { left = ["playerwarps:manage-move"] }
  }

  # Manage the co-owners and managers. Capability MANAGE_MEMBERS (owner only), so a delegate never sees it. Opens the
  # pwarp-members people sub-menu for the subject warp.
  members {
    slot     = 29
    material = PLAYER_HEAD
    name     = "@pwarp.gui.manage.members"
    priority = 10
    view     = ["pwarp-viewer-can:MANAGE_MEMBERS"]
    click { left = ["playerwarps:manage-members"] }
  }

  # Manage the guest list. Capability MANAGE_WHITELIST (owner + co-owner + manager). Opens the pwarp-whitelist sub-menu.
  whitelist {
    slot     = 31
    material = WRITABLE_BOOK
    name     = "@pwarp.gui.manage.whitelist"
    priority = 10
    view     = ["pwarp-viewer-can:MANAGE_WHITELIST"]
    click { left = ["playerwarps:manage-whitelist"] }
  }

  # Manage the banned players. Capability MANAGE_BANS (owner + co-owner + manager). Opens the pwarp-bans sub-menu.
  bans {
    slot     = 33
    material = IRON_AXE
    name     = "@pwarp.gui.manage.bans"
    priority = 10
    view     = ["pwarp-viewer-can:MANAGE_BANS"]
    click { left = ["playerwarps:manage-bans"] }
  }

  # Withdraw the accrued earnings bank to the owner's balance. Capability WITHDRAW (owner + co-owner).
  bank {
    slot     = 38
    material = GOLD_BLOCK
    name     = "@pwarp.gui.manage.bank"
    priority = 10
    view     = ["pwarp-viewer-can:WITHDRAW"]
    click { left = ["playerwarps:manage-withdraw"] }
  }

  # Hand the warp to a new owner (prompted for the name, then confirm-gated). Capability TRANSFER (owner only).
  transfer {
    slot     = 40
    material = PLAYER_HEAD
    name     = "@pwarp.gui.manage.transfer"
    priority = 10
    view     = ["pwarp-viewer-can:TRANSFER"]
    click {
      left = [
        { do = "input:pwarp.transfer", prompt = "@pwarp.gui.manage.transfer-prompt" },
        { do = "confirm:pwarp.transfer", title = "@pwarp.gui.manage.transfer-confirm",
          yes = ["pwarp-transfer:%input%"], no = [] }
      ]
    }
  }

  # Sponsor — buy a paid, time-limited pinned browse slot. Owner-only (capability SPONSOR) and shown only when the
  # sponsor sub-group is enabled, which the subject carries from config. The click prompts for a term in days, then
  # BuySponsorship runs the checks and the guarded charge; a blank line falls back to the configured default term.
  sponsor {
    slot     = 42
    material = DIAMOND
    name     = "@pwarp.gui.manage.sponsor"
    priority = 10
    view     = ["playerwarps:manage-sponsor", "pwarp-viewer-can:SPONSOR"]
    click {
      left = [
        { do = "input:pwarp.sponsor", prompt = "@pwarp.gui.manage.sponsor-prompt" },
        "pwarp-sponsor:%input%"
      ]
    }
  }

  # Delete the warp — archives it (recoverable), confirm-gated. Capability DELETE (owner only).
  delete {
    slot     = 53
    material = BARRIER
    name     = "@pwarp.gui.manage.delete"
    priority = 10
    view     = ["pwarp-viewer-can:DELETE"]
    click {
      left = { do = "confirm:pwarp.delete", title = "@pwarp.gui.manage.delete-confirm",
               yes = ["playerwarps:manage-delete"], no = [] }
    }
  }

  # Back to the pwarp-view detail panel.
  back {
    slot     = 49
    material = ARROW
    name     = "@pwarp.gui.manage.back"
    priority = 10
    click { left = ["playerwarps:manage-back"] }
  }
}
