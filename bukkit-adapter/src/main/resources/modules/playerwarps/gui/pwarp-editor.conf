# Layout of the per-warp editor (opened by clicking a warp in the /pwarp list). Titles, labels and value lore
# stay in the message catalog (messages_<lang>.conf); only the geometry and the materials live here, so editing
# this file never touches a translation.

# Menu height in rows (1..6). Six rows fit the full property grid with a navigation row at the bottom.
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The i-th property button is drawn in the i-th slot below, and a click on that slot resolves back to it. The
# property order, set in code, is: name, move-here, icon, visibility, departure-sound, arrival-sound,
# departure-particle, arrival-particle, warmup, cooldown.
property-slots = [
  10, 11, 12, 13, 14, 15,
  19, 20, 21, 22
]

# Slot the back button (returns to the list) sits in.
back-slot = 49

# Slot the delete button sits in (set to -1 to remove it). Deleting is confirm-gated.
delete-slot = 53

# Materials for the back and delete buttons, and the background filler.
back-icon = "ARROW"
delete-icon = "BARRIER"
filler = "BLACK_STAINED_GLASS_PANE"

# Geometry of the enum selector sub-menus (the visibility picker, and any other click-cycle that opens a list).
# The option slots are where each choice is drawn.
selector-rows = 3
selector-option-slots = [11, 12, 13, 14, 15]
selector-option-icon = "PAPER"
selector-filler = "BLACK_STAINED_GLASS_PANE"
