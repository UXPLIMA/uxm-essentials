# Layout of the /pwarp management list (opened by /pwarp with no arguments). Titles and lore stay in the
# message catalog (messages_<lang>.conf); only the geometry and the icons live here, so editing this file never
# touches a translation. A player sees their own warps; an operator holding uxmessentials.pwarp.gui sees every
# player's warps. Each warp contributes one clickable icon, paged when there are more than fit.

# Menu height in rows (1..6). Six rows give 45 content slots above the reserved navigation row.
rows = 6

# Icon a warp falls back to in the list. A warp with a custom icon material overrides this per entry; otherwise
# the list renderer supplies this material.
fallback-icon = "ENDER_PEARL"

# Material of the previous/next page buttons.
nav-icon = "ARROW"

# Slots the previous- and next-page buttons sit in (bottom row of a six-row menu).
prev-slot = 48
next-slot = 50

# Slots the warp entries fill. Leave empty to use every slot except the bottom navigation row.
content-slots = []

# Material the unused border cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"

# The create button: the slot it sits in (set to -1 to remove it) and its material. Clicking it opens an anvil
# to name a new warp, which is created at the operator's feet (private, like /setpwarp).
create-slot = 49
create-icon = "LIME_DYE"
