# The player-warps landing menu bare /pwarp opens, rendered through the menu engine. It is a hub, not a list of warps:
# the top row holds four quick entries that each open the paged pwarp-browse with a preset filter — browse all, the
# viewer's own warps, their favourites, and the top-rated view — while the middle rows hold one button per defined
# category, each drilling into the browse filtered to that category. The category buttons come from the playerwarps:
# categories list source, a bounded snapshot of the shared warp_categories set taken off the tick thread when the menu
# opens; an empty set simply draws no category buttons. The bottom row holds the sponsor slots (paid placement): the
# playerwarps:sponsors list source draws the currently-active sponsors, empty when the sub-group is off, and each cell
# opens the sponsored warp's pwarp-view. Every label resolves from the player-warps catalog, so no user-facing text lives here.
title = "@pwarp.gui.categories.title"
rows = 6

items {
  # The grey-glass backdrop. Lowest priority, so the buttons drawn below sit on top of it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # Browse every public warp — opens pwarp-browse with no preset filter.
  browse-all {
    slot     = 10
    material = BOOKSHELF
    name     = "@pwarp.gui.categories.browse-all"
    priority = 10
    click { left = ["playerwarps:browse-all"] }
  }

  # The viewer's own warps — opens pwarp-browse pre-filtered to the viewer as owner.
  my-warps {
    slot     = 12
    material = WRITABLE_BOOK
    name     = "@pwarp.gui.categories.mine"
    priority = 10
    click { left = ["playerwarps:browse-mine"] }
  }

  # The viewer's favourites — opens pwarp-browse pre-filtered to the warps the viewer has favourited.
  favourites {
    slot     = 14
    material = NETHER_STAR
    name     = "@pwarp.gui.categories.favourites"
    priority = 10
    click { left = ["playerwarps:browse-favourites"] }
  }

  # The highest-rated warps — opens pwarp-browse on its default rating sort.
  top-rated {
    slot     = 16
    material = DIAMOND
    name     = "@pwarp.gui.categories.top"
    priority = 10
    click { left = ["playerwarps:browse-top"] }
  }

  # The defined categories, one clickable button each, paginated across the two middle rows. The source is the bounded
  # warp_categories snapshot taken at open; each cell shows the category's icon and name and drills into the browse
  # filtered to that category. An empty set draws nothing here.
  categories {
    slots    = ["27-44"]
    priority = 5
    list {
      source = "playerwarps:categories"
      template {
        material = "%pwarp_category_icon%"
        name     = "@pwarp.gui.categories.entry-name"
        lore     = ["@pwarp.gui.categories.entry-lore"]
        click { left = ["playerwarps:category-open"] }
      }
    }
  }

  # Sponsor slots (paid placement). The playerwarps:sponsors list source is a bounded snapshot of the currently-active
  # sponsors, ordered by their slot, taken off the tick thread at open; each cell shows the sponsored warp's icon and
  # name and drills into its pwarp-view detail panel. When the sponsor sub-group is off the snapshot is empty, so the
  # slots draw nothing and the backdrop shows through.
  sponsors {
    slots    = ["45-47"]
    priority = 10
    list {
      source = "playerwarps:sponsors"
      template {
        material = "%pwarp_sponsor_icon%"
        name     = "@pwarp.gui.categories.sponsor-name"
        lore     = ["@pwarp.gui.categories.sponsor-lore"]
        click { left = ["playerwarps:sponsor-open"] }
      }
    }
  }

  # Previous page of categories.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@pwarp.gui.categories.prev"
    priority = 10
  }

  # Close the landing.
  close {
    slot     = 49
    material = BARRIER
    name     = "@pwarp.gui.categories.close"
    priority = 10
    click { left = ["close"] }
  }

  # Next page of categories.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@pwarp.gui.categories.next"
    priority = 10
  }
}
