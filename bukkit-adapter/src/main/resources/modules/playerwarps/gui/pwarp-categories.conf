# The player-warps landing hub, reached from the browse's Categories control (bare /pwarp opens the browse grid
# directly). Rendered through the menu engine as a dense, fully-framed panel: a cyan border wraps the whole window so
# there is never a bare grey field. A header crest sits in the top band, four quick entries (browse all, the viewer's
# own warps, their favourites, and the top-rated view) sit in a framed strip below it, and the two middle rows hold one
# button per category. The category buttons come from the playerwarps:categories list source, which ships a default set
# (Building, Shop, PvP, Farm, Redstone, Misc) out of the box and swaps in the operator's own warp_categories once any
# are defined; each button drills into the browse filtered to that category. The bottom band holds the sponsor showcase
# (paid placement, empty when the sub-group is off), the page arrows for when the category count overflows, and a tidy
# door to close. Every label resolves from the player-warps catalog, so no user-facing text lives here.
title = "@pwarp.gui.categories.title"
rows = 6

items {
  # The dark backdrop under the frame. Lowest priority; the frame, buttons and grid all sit on top of it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The dense cyan frame: the full border ring, the gaps between the quick entries, a divider band above the category
  # grid, and the gaps of the bottom bar. It turns the window into one coherent panel instead of scattered buttons. The
  # sponsor slots (45-47) are framed too: sponsors sit at a higher priority and draw on top when present, so the frame
  # only shows through when there are no active sponsors, keeping the bottom-left from rendering as bare grey.
  frame {
    slots    = ["0-3", "5-8", "9", "11", "13", "15", "17", "18-26", "27", "35", "36", "44", "45-47", "49", "51", "52"]
    material = CYAN_STAINED_GLASS_PANE
    name     = ""
    priority = 1
  }

  # The hub crest, centred in the top frame band.
  header {
    slot     = 4
    material = KNOWLEDGE_BOOK
    name     = "@pwarp.gui.categories.header"
    lore     = ["@pwarp.gui.categories.header-lore"]
    priority = 10
  }

  # Browse every public warp: opens pwarp-browse with no preset filter.
  browse-all {
    slot     = 10
    material = BOOKSHELF
    name     = "@pwarp.gui.categories.browse-all"
    lore     = ["@pwarp.gui.categories.browse-all-lore"]
    priority = 10
    click { left = ["playerwarps:browse-all"] }
  }

  # The viewer's own warps: opens pwarp-browse pre-filtered to the viewer as owner.
  my-warps {
    slot     = 12
    material = WRITABLE_BOOK
    name     = "@pwarp.gui.categories.mine"
    lore     = ["@pwarp.gui.categories.mine-lore"]
    priority = 10
    click { left = ["playerwarps:browse-mine"] }
  }

  # The viewer's favourites: opens pwarp-browse pre-filtered to the warps the viewer has favourited.
  favourites {
    slot     = 14
    material = NETHER_STAR
    name     = "@pwarp.gui.categories.favourites"
    lore     = ["@pwarp.gui.categories.favourites-lore"]
    priority = 10
    click { left = ["playerwarps:browse-favourites"] }
  }

  # The highest-rated warps: opens pwarp-browse on its default rating sort.
  top-rated {
    slot     = 16
    material = DIAMOND
    name     = "@pwarp.gui.categories.top"
    lore     = ["@pwarp.gui.categories.top-lore"]
    priority = 10
    click { left = ["playerwarps:browse-top"] }
  }

  # The categories, one clickable button each, across the two framed middle rows. The source ships a default set out of
  # the box and swaps in the operator's own warp_categories once any exist, so the grid is always populated; each cell
  # shows the category's icon and name and drills into the browse filtered to that category.
  categories {
    slots    = ["28-34", "37-43"]
    priority = 5
    list {
      source = "playerwarps:categories"
      template {
        material = "%pwarp_category_icon%"
        name     = "@pwarp.gui.categories.entry-name"
        lore     = ["@pwarp.gui.categories.entry-lore"]
        click { left = ["playerwarps:category-open"] }
      }
    }
  }

  # Sponsor slots (paid placement). The playerwarps:sponsors list source draws the currently-active sponsors, ordered by
  # slot; each drills into the sponsored warp's pwarp-view. When the sponsor sub-group is off the snapshot is empty.
  sponsors {
    slots    = ["45-47"]
    priority = 10
    list {
      source = "playerwarps:sponsors"
      template {
        material = "%pwarp_sponsor_icon%"
        name     = "@pwarp.gui.categories.sponsor-name"
        lore     = ["@pwarp.gui.categories.sponsor-lore"]
        click { left = ["playerwarps:sponsor-open"] }
      }
    }
  }

  # Previous page of categories, for when the operator defines more than one page of them.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@pwarp.gui.categories.prev"
    priority = 10
  }

  # Next page of categories.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@pwarp.gui.categories.next"
    priority = 10
  }

  # Close the hub, tucked into the bottom-right corner. A door rather than a barrier, so it reads as "leave", not error.
  close {
    slot     = 53
    material = OAK_DOOR
    name     = "@pwarp.gui.categories.close"
    lore     = ["@pwarp.gui.categories.close-lore"]
    priority = 10
    click { left = ["close"] }
  }
}
