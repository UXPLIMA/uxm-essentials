# The player-warps landing menu bare /pwarp opens, rendered through the menu engine. It is a hub, not a list of warps:
# a header crest sits in the top frame band, the four quick entries (browse all, the viewer's own warps, their
# favourites, and the top-rated view) sit in a framed control strip below it, and the middle rows hold one button per
# defined category, each drilling into the browse filtered to that category. The category buttons come from the
# playerwarps:categories list source, a bounded snapshot of the shared warp_categories set taken off the tick thread
# when the menu opens; an empty set simply draws no category buttons and the framed layout still reads as intentional.
# The bottom row holds the sponsor slots (paid placement): the playerwarps:sponsors list source draws the currently
# active sponsors, empty when the sub-group is off, and each cell opens the sponsored warp's pwarp-view. Every label
# resolves from the player-warps catalog, so no user-facing text lives here.
title = "@pwarp.gui.categories.title"
rows = 6

items {
  # The dark backdrop. Lowest priority, so the frame, the buttons and the category grid all sit on top of it, and any
  # slot a hidden or empty item leaves falls back to it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The cyan frame: a top band, the sides of the quick-entry strip, a divider band above the category grid, and the
  # bottom-right corner. It turns the flat backdrop into a structured panel instead of a field of scattered glass.
  frame {
    slots    = ["0-8", "9", "11", "13", "15", "17", "18-26", "51-53"]
    material = CYAN_STAINED_GLASS_PANE
    name     = ""
    priority = 1
  }

  # The hub crest, centred in the top frame band: names the panel and explains what it is.
  header {
    slot     = 4
    material = KNOWLEDGE_BOOK
    name     = "@pwarp.gui.categories.header"
    lore     = ["@pwarp.gui.categories.header-lore"]
    priority = 10
  }

  # Browse every public warp: opens pwarp-browse with no preset filter.
  browse-all {
    slot     = 10
    material = BOOKSHELF
    name     = "@pwarp.gui.categories.browse-all"
    lore     = ["@pwarp.gui.categories.browse-all-lore"]
    priority = 10
    click { left = ["playerwarps:browse-all"] }
  }

  # The viewer's own warps: opens pwarp-browse pre-filtered to the viewer as owner.
  my-warps {
    slot     = 12
    material = WRITABLE_BOOK
    name     = "@pwarp.gui.categories.mine"
    lore     = ["@pwarp.gui.categories.mine-lore"]
    priority = 10
    click { left = ["playerwarps:browse-mine"] }
  }

  # The viewer's favourites: opens pwarp-browse pre-filtered to the warps the viewer has favourited.
  favourites {
    slot     = 14
    material = NETHER_STAR
    name     = "@pwarp.gui.categories.favourites"
    lore     = ["@pwarp.gui.categories.favourites-lore"]
    priority = 10
    click { left = ["playerwarps:browse-favourites"] }
  }

  # The highest-rated warps: opens pwarp-browse on its default rating sort.
  top-rated {
    slot     = 16
    material = DIAMOND
    name     = "@pwarp.gui.categories.top"
    lore     = ["@pwarp.gui.categories.top-lore"]
    priority = 10
    click { left = ["playerwarps:browse-top"] }
  }

  # The defined categories, one clickable button each, paginated across the two middle rows around the reserved centre
  # slot. The source is the bounded warp_categories snapshot taken at open; each cell shows the category's icon and name
  # and drills into the browse filtered to that category. An empty set draws nothing here, and the centre slot then
  # shows the "no categories yet" hint below.
  categories {
    slots    = ["27-30", "32-44"]
    priority = 5
    list {
      source = "playerwarps:categories"
      template {
        material = "%pwarp_category_icon%"
        name     = "@pwarp.gui.categories.entry-name"
        lore     = ["@pwarp.gui.categories.entry-lore"]
        click { left = ["playerwarps:category-open"] }
      }
    }
  }

  # The empty-state hint, pinned to the reserved centre slot and shown only when no category is defined, so the middle
  # reads as a deliberate "no categories yet" panel instead of a bare gap. It sits outside the category grid slots, so
  # the list never clears it.
  no-categories {
    slot     = 31
    material = PAPER
    name     = "@pwarp.gui.categories.no-categories"
    lore     = ["@pwarp.gui.categories.no-categories-lore"]
    priority = 10
    view     = ["playerwarps:has-no-categories"]
  }

  # Sponsor slots (paid placement). The playerwarps:sponsors list source is a bounded snapshot of the currently-active
  # sponsors, ordered by their slot, taken off the tick thread at open; each cell shows the sponsored warp's icon and
  # name and drills into its pwarp-view detail panel. When the sponsor sub-group is off the snapshot is empty, so the
  # slots draw nothing and the backdrop shows through.
  sponsors {
    slots    = ["45-47"]
    priority = 10
    list {
      source = "playerwarps:sponsors"
      template {
        material = "%pwarp_sponsor_icon%"
        name     = "@pwarp.gui.categories.sponsor-name"
        lore     = ["@pwarp.gui.categories.sponsor-lore"]
        click { left = ["playerwarps:sponsor-open"] }
      }
    }
  }

  # Previous page of categories.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@pwarp.gui.categories.prev"
    priority = 10
  }

  # Close the landing. A door rather than a barrier, so it reads as "leave" rather than an error.
  close {
    slot     = 49
    material = OAK_DOOR
    name     = "@pwarp.gui.categories.close"
    lore     = ["@pwarp.gui.categories.close-lore"]
    priority = 10
    click { left = ["close"] }
  }

  # Next page of categories.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@pwarp.gui.categories.next"
    priority = 10
  }
}
