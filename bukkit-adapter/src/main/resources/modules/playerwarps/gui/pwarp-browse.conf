# The player-warps browse menu, opened from the landing and by /pwarp browse, rendered through the menu engine as the
# first consumer of the paged-list SPI. One card per public warp across the top five rows, but unlike the /pwarp
# management list the grid is a paged source (playerwarps:browse), not an in-memory snapshot: the engine holds the
# viewer's page, sort and filter state and asks the source for exactly one page per draw or flip, off the tick thread,
# so opening the browse costs one bounded page query however large the warp table is. Each card's icon, name and
# multi-line lore resolve from the player-warps catalog through the pwarp_browse_* placeholders, the lore as a single
# multi-line placeholder the engine expands into one line per catalog line. When no warp matches at all the source pins
# a centred "no warps yet" placeholder instead, so the empty grid reads as a deliberate panel. The bottom row is a full
# control bar: a sort-cycle button advances the offered sorts, a search button prompts for a name filter, the scope
# buttons switch between the public browse, the viewer's own warps and their favourites, the two arrows page the result,
# a categories button opens the hub, and a create button makes a new warp. A left click on a card opens its detail
# panel; a right click quick-teleports the viewer through the same UsePlayerWarp gate /pwarp <name> drives. Every label
# resolves from the catalog, so no user-facing text lives here.
title = "@pwarp.gui.browse.title"
rows = 6

items {
  # The dark backdrop. Lowest priority, so the content grid and the control bar drawn below sit on top of it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The paged warp grid across the top five rows (the bottom row is reserved for the control bar and page arrows). The
  # source is asked for one page at a time; sorts are the orderings the sort-cycle button walks, mapped to the read
  # model's WarpSort. A left click opens the pwarp-view detail panel; a right click is the quick-teleport shortcut.
  warps {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "playerwarps:browse"
      sorts  = ["rating", "newest", "visits", "favourites", "alphabetical", "distance"]
      template {
        material = "%pwarp_browse_icon%"
        name     = "%pwarp_browse_name%"
        lore     = ["%pwarp_browse_lore%"]
        click {
          left  = ["playerwarps:browse-click"]
          right = ["playerwarps:browse-teleport"]
        }
      }
    }
  }

  # Cycle the sort order the grid is drawn with, re-querying the first page each time.
  sort {
    slot     = 45
    material = COMPARATOR
    name     = "@pwarp.gui.browse.sort"
    lore     = ["@pwarp.gui.browse.sort-lore"]
    priority = 10
    click { left = ["list-sort:playerwarps:browse"] }
  }

  # Prompt for a name and filter the grid to matching warps; a blank entry clears the search.
  search {
    slot     = 46
    material = SPYGLASS
    name     = "@pwarp.gui.browse.search"
    lore     = ["@pwarp.gui.browse.search-lore"]
    priority = 10
    click { left = ["list-search:playerwarps:browse:search"] }
  }

  # Scope to the viewer's own public warps.
  mine {
    slot     = 47
    material = WRITABLE_BOOK
    name     = "@pwarp.gui.browse.mine"
    lore     = ["@pwarp.gui.browse.mine-lore"]
    priority = 10
    click { left = ["list-filter:playerwarps:browse:scope=mine"] }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@pwarp.gui.browse.prev"
    lore     = ["@pwarp.gui.browse.prev-lore"]
    priority = 10
  }

  # Clear the scope filter and return to the public browse.
  all {
    slot     = 49
    material = BOOKSHELF
    name     = "@pwarp.gui.browse.all"
    lore     = ["@pwarp.gui.browse.all-lore"]
    priority = 10
    click { left = ["list-filter:playerwarps:browse:scope="] }
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@pwarp.gui.browse.next"
    lore     = ["@pwarp.gui.browse.next-lore"]
    priority = 10
  }

  # Scope to the warps the viewer has favourited.
  favourites {
    slot     = 51
    material = NETHER_STAR
    name     = "@pwarp.gui.browse.favourites"
    lore     = ["@pwarp.gui.browse.favourites-lore"]
    priority = 10
    click { left = ["list-filter:playerwarps:browse:scope=favourites"] }
  }

  # Open the categories hub: category filters, quick scopes and the sponsor showcase. Bare /pwarp opens this browse
  # directly now, so this is how the hub stays reachable.
  categories {
    slot     = 52
    material = CHEST
    name     = "@pwarp.gui.browse.categories"
    lore     = ["@pwarp.gui.browse.categories-lore"]
    priority = 10
    click { left = ["playerwarps:open-categories"] }
  }

  # Create a new player warp: prompt for a name, then create a private warp at the viewer's feet, the same use case
  # /setpwarp drives.
  create {
    slot     = 53
    material = LIME_DYE
    name     = "@pwarp.gui.browse.create"
    lore     = ["@pwarp.gui.browse.create-lore"]
    priority = 10
    click { left = ["playerwarps:create"] }
  }
}
