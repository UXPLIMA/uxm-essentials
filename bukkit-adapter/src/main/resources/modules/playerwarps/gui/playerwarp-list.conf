# The /pwarp management list (opened by /pwarp with no arguments, or the player-warps entry on the /uxmess gui hub),
# rendered through the menu engine. One icon per player-warp the viewer may manage, in stored creation order as the
# repository returns them, paged when there are more than fit, with a create button and the two nav arrows on the
# bottom row. The scope is resolved per open against the viewer's permission; a plain player sees only their own
# warps, an operator holding uxmessentials.pwarp.gui sees every player's, and handed to the engine as the menu
# subject, because the permission check touches the Bukkit API and may not run in the off-thread list source. The
# grid is the playerwarps:list source; each entry's icon is the warp's configured material (or ENDER_PEARL when
# unset), and its name and lore resolve from the player-warps message catalog, filled with that warp's name, owner,
# world, rounded coordinates, and visibility through the pwarp_* placeholders. A left click opens that warp's bespoke
# property editor through playerwarps:edit; the create button prompts for a name and creates a private warp at the
# operator's feet through playerwarps:create, the same use case /setpwarp drives. Every label resolves from the
# catalog, so no user-facing text lives here. The geometry mirrors the original fixed six-row list: a grid across the
# top five rows and the create/nav buttons on the bottom row.
title = "@pwarp.gui.list.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the content grid and the buttons drawn below sit on top of it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The player-warp grid, paginated across the top five rows (the bottom row is reserved for the create and nav
  # buttons). Each cell shows the warp's configured icon with its name and detail lore; a left click opens that
  # warp's editor through playerwarps:edit.
  warps {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "playerwarps:list"
      template {
        material = "%pwarp_icon%"
        name     = "@pwarp.gui.list.entry-name"
        lore     = ["@pwarp.gui.list.entry-lore"]
        click { left = ["playerwarps:edit"] }
      }
    }
  }

  # Create a new player warp: prompt for a name, then create a private warp at the operator's feet, exactly as the
  # old create button did. Pinned to the bottom row, between the page arrows.
  create {
    slot     = 49
    material = LIME_DYE
    name     = "@pwarp.gui.list.create"
    priority = 10
    click { left = ["playerwarps:create"] }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@pwarp.gui.list.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@pwarp.gui.list.next"
    priority = 10
  }
}
