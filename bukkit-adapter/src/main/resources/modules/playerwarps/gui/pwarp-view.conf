# The per-warp detail panel (opened by clicking a card in the pwarp-browse grid), rendered through the menu engine. A
# fixed three-row panel for one warp, carried as the menu's subject: a framed layout with a read-only info tile crested
# in the top band and buttons to teleport, favourite / unfavourite, rate, manage, and go back to the browse along the
# middle. The info name and lore fill from that warp through the pwarp_view_* placeholders, so the panel names the warp
# it is about. Each button routes through the same use case the /pwarp command drives (UsePlayerWarp /
# FavouritePlayerWarp / RatePlayerWarp). Two pairs of items share a slot behind mutually-exclusive view conditions: the
# teleport cell is an open card (teleports straight) or a password card (prompts for the password first), and the
# favourite cell is add-star or remove-star depending on whether the viewer already starred it. The rate button is
# hidden for the warp's owner (owner-can't-rate). Every label resolves from the player-warps catalog, so no user-facing
# text lives here.
title = "@pwarp.gui.view.title"
rows = 3

items {
  # The dark backdrop. Lowest priority, so the frame and the buttons drawn below sit on top of it, and a hidden
  # button's slot falls back to it.
  filler {
    slots    = ["0-26"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The cyan frame: a top band around the info crest, the side columns, and a bottom band around the back button.
  frame {
    slots    = ["0-3", "5-8", "9", "17", "18-21", "23-26"]
    material = CYAN_STAINED_GLASS_PANE
    name     = ""
    priority = 1
  }

  # Read-only warp info: name and the full detail lore filled from the subject warp through the pwarp_view_* placeholders.
  info {
    slot     = 4
    material = PAPER
    name     = "%pwarp_view_name%"
    lore     = ["%pwarp_view_lore%"]
    priority = 10
  }

  # Teleport cell, the open card: shown when the viewer needs no password, teleports through the UsePlayerWarp gate.
  teleport-open {
    slot     = 11
    material = ENDER_PEARL
    name     = "@pwarp.gui.view.teleport"
    lore     = ["@pwarp.gui.view.teleport-lore"]
    priority = 10
    view     = ["playerwarps:no-password"]
    click { left = ["pwarp-teleport"] }
  }

  # Teleport cell, the password card: shown when the warp is PASSWORD-access and the viewer is neither owner nor member.
  # A left click prompts for the password through the P1 input: step, then teleports with the typed line as %input%.
  teleport-locked {
    slot     = 11
    material = ENDER_EYE
    name     = "@pwarp.gui.view.teleport-locked"
    lore     = ["@pwarp.gui.view.teleport-locked-lore"]
    priority = 10
    view     = ["playerwarps:password-required"]
    click {
      left = [
        { do = "input:pwarp.password", prompt = "@pwarp.gui.view.password-prompt" },
        "pwarp-teleport:%input%"
      ]
    }
  }

  # Favourite cell, add: shown when the warp is not yet one of the viewer's favourites.
  favourite {
    slot     = 13
    material = NETHER_STAR
    name     = "@pwarp.gui.view.favourite"
    lore     = ["@pwarp.gui.view.favourite-lore"]
    priority = 10
    view     = ["playerwarps:not-favourited"]
    click { left = ["playerwarps:view-favourite"] }
  }

  # Favourite cell, remove: shown when the viewer has already starred the warp.
  unfavourite {
    slot     = 13
    material = FIREWORK_STAR
    name     = "@pwarp.gui.view.unfavourite"
    lore     = ["@pwarp.gui.view.unfavourite-lore"]
    priority = 10
    view     = ["playerwarps:favourited"]
    click { left = ["playerwarps:view-unfavourite"] }
  }

  # Rate: opens the five-star pwarp-rate menu. Hidden for the warp's owner, who may not rate their own warp.
  rate {
    slot     = 15
    material = EXPERIENCE_BOTTLE
    name     = "@pwarp.gui.view.rate"
    lore     = ["@pwarp.gui.view.rate-lore"]
    priority = 10
    view     = ["playerwarps:not-owner"]
    click { left = ["playerwarps:view-rate"] }
  }

  # Manage: opens the capability-gated pwarp-manage panel. Shown only to a viewer who owns the warp or holds a
  # management role on it (owner / co-owner / manager), the same set the manage use cases admit.
  manage {
    slot     = 16
    material = COMPARATOR
    name     = "@pwarp.gui.view.manage"
    lore     = ["@pwarp.gui.view.manage-lore"]
    priority = 10
    view     = ["playerwarps:viewer-member"]
    click { left = ["playerwarps:view-manage"] }
  }

  # Back to the pwarp-browse grid.
  back {
    slot     = 22
    material = ARROW
    name     = "@pwarp.gui.view.back"
    lore     = ["@pwarp.gui.view.back-lore"]
    priority = 10
    click { left = ["playerwarps:view-back"] }
  }
}
