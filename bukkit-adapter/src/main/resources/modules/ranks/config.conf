# Ranks — rankup, prestige and autorank progression. The plugin tracks each player's current rank itself (a
# database-backed pointer that survives a world rollback), so rankup does not depend on a permission plugin: a
# rank's rankup actions can set a LuckPerms group, run any command, or do nothing at all — that is entirely up to
# you. The ladder itself — the ranks, their order, cost, requirements and actions — lives in the sibling ranks.conf.
#
# The module ships ENABLED but inert: nothing happens until you author a ladder in ranks.conf. Turn the whole
# feature off with enabled = false.
enabled = true

# Prestige lets a player at the very top rank reset back to the first rank in exchange for a permanent prestige
# level (and whatever reward you configure). It ships OFF — turn it on once your ladder has a meaningful top rank.
# The reward, cost, requirements, actions and level cap are configured in a later release; this switch is the gate.
prestige {
  enabled = false
}

# Autorank promotes online players automatically the moment they already meet their next rank's requirements,
# without them running /rankup. It ships OFF. When on, a scheduled scan checks online players on an interval.
autorank {
  enabled = false
}
