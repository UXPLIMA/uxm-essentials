# Ranks — rankup, prestige and autorank progression. The plugin tracks each player's current rank itself (a
# database-backed pointer that survives a world rollback), so rankup does not depend on a permission plugin: a
# rank's rankup actions can set a LuckPerms group, run any command, or do nothing at all — that is entirely up to
# you. The ladder itself — the ranks, their order, cost, requirements and actions — lives in the sibling ranks.conf.
#
# The module ships ENABLED but inert: nothing happens until you author a ladder in ranks.conf. Turn the whole
# feature off with enabled = false.
enabled = true

# Prestige lets a player at the very top rank reset back to the first rank in exchange for a permanent prestige
# level (and whatever reward you configure). It ships OFF — turn it on once your ladder has a meaningful top rank.
prestige {
  enabled = false

  # The highest prestige level a player can reach. 0 means no cap (prestige forever). At the cap, /prestige is
  # refused.
  max-level = 0

  # How much is charged through the economy when a player prestiges (0 for a free prestige).
  cost = 0

  # What the player must satisfy to prestige, on top of being at the top rank. Same grammar as a rank's
  # requirements (see ranks.conf): "money <amount>", "playtime <seconds>", "permission <node>", etc. An unmet
  # requirement blocks the prestige; an unknown type is simply not enforced.
  requirements = []

  # What runs when a player prestiges, in order. Same grammar as a rank's actions (see ranks.conf): "console ...",
  # "player ...", "message ...", "sound ...", and so on. Use {player} for the player's name.
  actions = []

  # The reward multiplier granted per prestige level, applied linearly: a value of 1.0 grants no bonus, 1.5 gives
  # a 1.5x multiplier at prestige 1, 2.0x at prestige 2, and so on. It is surfaced to the player on prestige (and
  # exposed as a placeholder) so your rewards can scale with prestige level.
  reward-multiplier = 1.0
}

# Autorank promotes online players automatically the moment they already meet their next rank's requirements,
# without them running /rankup. It ships OFF. When on, a scheduled scan checks online players on an interval and
# advances each eligible player one rank per scan (a player who qualifies for several ranks at once climbs one per
# interval — shorten the interval if you want faster climbing).
autorank {
  enabled = false

  # How often, in seconds, the scan runs. Clamped to a minimum of 1. Keep it comfortably large: every scan
  # re-checks every online player's next-rank requirements. 300 (five minutes) is a sensible default.
  interval-seconds = 300

  # Whether an automatic promotion charges the rank's cost, exactly as /rankup would. Leave it true so autorank
  # respects your ladder's prices; set it false to let eligible players climb for free (requirements still apply).
  charge-cost = true
}
