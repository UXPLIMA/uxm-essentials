# The rank ladder. Each top-level section is one rank; the section name is the rank's id (the value stored against
# the player and referenced by other ranks). Ranks are ordered by their `order` number, lowest first, so a player
# on `first` ranks up to `citizen`, then `vip`. Leave gaps in the numbers (10, 20, 30) so you can insert a rank
# between two later without renumbering the rest.
#
# Per rank:
#   order         — the ladder position, ascending. Lower ranks up to higher.
#   display-name   — how the rank is shown in messages and the GUI. MiniMessage / legacy colour codes are allowed.
#   cost           — how much is charged through the economy when the player ranks up (0 for a free rank).
#   requirements   — what the player must satisfy to rank up. Each entry is "<type> <value>", checked on /rankup:
#                      money <amount>        — the player can afford the amount (a balance check).
#                      playtime <seconds>    — tracked playtime is at least this many seconds.
#                      permission <node>     — the player holds the permission node.
#                      previous-rank <id>    — the player is currently on that rank (the previous rung).
#                      item <material> [n]   — the player's inventory holds n of the material (default 1).
#                      placeholder <a> <op> <b> — a %placeholder% comparison ( == != > < >= <= ), needs PlaceholderAPI.
#                    An unmet requirement blocks the rankup; an unknown type is simply not enforced.
#   actions        — what runs when the player ranks up, in order. Each entry is "<type> <value>"; the command
#                    actions give you full control. Types: console, player, player_op, message, actionbar, title,
#                    sound, connect. Use {player} for the player's name. For example, to set a LuckPerms group:
#                      "console lp user {player} parent set citizen"
#                    (left out of the examples below so a fresh server without LuckPerms stays quiet).
#
# The three ranks below are a starting example. Replace them with your own ladder.

first {
  order = 10
  display-name = "<gray>First</gray>"
  cost = 0
  requirements = []
  actions = []
}

citizen {
  order = 20
  display-name = "<green>Citizen</green>"
  cost = 1000
  requirements = [
    "money 1000"
  ]
  actions = [
    "message <green>Welcome to Citizen! Keep it up."
    "console say {player} climbed to Citizen!"
    "sound minecraft:entity.player.levelup"
  ]
}

vip {
  order = 30
  display-name = "<gold>VIP</gold>"
  cost = 5000
  requirements = [
    "money 5000"
    "playtime 3600"
  ]
  actions = [
    "message <gold>You are now VIP — thanks for playing!"
    "console say {player} is now VIP!"
    "sound minecraft:ui.toast.challenge_complete"
  ]
}
