# The /ranks ladder panel, rendered through the menu engine. A three-row window showing the player's current
# rank and prestige, the next rank on the ladder with its cost and requirements, and a button that runs the
# rankup pipeline (the same one /rankup uses). The standing is read off the tick thread when the panel opens and
# handed in as the menu subject, so the two display items fill their value lines from the ranks_* placeholders
# without the renderer touching a port. Every label resolves from the ranks catalog, so no user-facing text
# lives here. Set gui.enabled = false in modules/ranks/config.conf to drop the panel and its /ranks open.
title = "@ranks.gui-title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the items drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The player's current rank and prestige. A read-only display; its value lines read the subject through the
  # ranks_current / ranks_prestige placeholders.
  current {
    slot     = 11
    material = DIAMOND
    name     = "@ranks.gui-current-name"
    lore     = ["@ranks.gui-current-lore"]
    priority = 10
  }

  # The next rank on the ladder with its cost and requirements. A read-only display; its value lines read the
  # subject through the ranks_next / ranks_next_cost / ranks_next_requirements placeholders (and show the max
  # marker when the player is already at the top rank).
  next {
    slot     = 13
    material = EXPERIENCE_BOTTLE
    name     = "@ranks.gui-next-name"
    lore     = ["@ranks.gui-next-lore"]
    priority = 10
  }

  # Advance one rung up the ladder through the rankup pipeline, then redraw the panel with the new standing.
  rankup {
    slot     = 15
    material = EMERALD
    name     = "@ranks.gui-rankup-name"
    lore     = ["@ranks.gui-rankup-lore"]
    priority = 10
    click { left = ["ranks:rankup"] }
  }

  # Close the panel.
  close {
    slot     = 22
    material = BARRIER
    name     = "@ranks.gui-close"
    priority = 10
    click { left = ["close"] }
  }
}
