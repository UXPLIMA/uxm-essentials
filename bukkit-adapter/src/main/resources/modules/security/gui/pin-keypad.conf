# The join-verification / op-command re-auth keypad, rendered through the menu engine. A frozen player taps their PIN
# or authenticator code into this six-row phone pad: the masked entry sits centred on the top row, the digits 1-9 form
# a 3x3 block, 0 sits on the bottom row between clear and submit, and (for a player who holds an authenticator factor)
# a "type a code" button hands off to the text prompt. Every other slot is a divider pane so a stray tap lands on
# nothing. The engine cancels every click and drag on this window, so no item can ever move: the pad is input-only.
#
# The buttons run the security feature's own actions, which own the entered-PIN buffer and the verify decision: a digit
# appends and re-renders the masked display, clear empties it, submit reads and verifies it, and the code button opens
# the authenticator prompt. The masked display and the digit labels resolve through the security catalog, so no
# user-facing text lives here; operators may re-skin the materials, slots and frame freely.
title = "@security.verify.keypad-title"
rows = 6

items {
  # The grey-glass divider frame. Lowest priority, so the buttons below sit on top of it, and a hidden button's slot
  # (the code button, when the player holds no authenticator factor) falls back to it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The masked entry display: one asterisk per entered digit, never the digits themselves, re-rendered after each tap.
  entry {
    slot     = 4
    material = PAPER
    name     = "%security_keypad_entry%"
    priority = 10
  }

  # The 1-9 block, then 0 on the bottom row. Each button appends its digit to the entry buffer and re-renders.
  digit1 {
    slot     = 11
    material = LIGHT_GRAY_CONCRETE
    name     = "%security_keypad_digit_1%"
    priority = 10
    click { left = ["security:pin-1"] }
  }
  digit2 {
    slot     = 13
    material = LIGHT_GRAY_CONCRETE
    name     = "%security_keypad_digit_2%"
    priority = 10
    click { left = ["security:pin-2"] }
  }
  digit3 {
    slot     = 15
    material = LIGHT_GRAY_CONCRETE
    name     = "%security_keypad_digit_3%"
    priority = 10
    click { left = ["security:pin-3"] }
  }
  digit4 {
    slot     = 20
    material = LIGHT_GRAY_CONCRETE
    name     = "%security_keypad_digit_4%"
    priority = 10
    click { left = ["security:pin-4"] }
  }
  digit5 {
    slot     = 22
    material = LIGHT_GRAY_CONCRETE
    name     = "%security_keypad_digit_5%"
    priority = 10
    click { left = ["security:pin-5"] }
  }
  digit6 {
    slot     = 24
    material = LIGHT_GRAY_CONCRETE
    name     = "%security_keypad_digit_6%"
    priority = 10
    click { left = ["security:pin-6"] }
  }
  digit7 {
    slot     = 29
    material = LIGHT_GRAY_CONCRETE
    name     = "%security_keypad_digit_7%"
    priority = 10
    click { left = ["security:pin-7"] }
  }
  digit8 {
    slot     = 31
    material = LIGHT_GRAY_CONCRETE
    name     = "%security_keypad_digit_8%"
    priority = 10
    click { left = ["security:pin-8"] }
  }
  digit9 {
    slot     = 33
    material = LIGHT_GRAY_CONCRETE
    name     = "%security_keypad_digit_9%"
    priority = 10
    click { left = ["security:pin-9"] }
  }
  digit0 {
    slot     = 40
    material = LIGHT_GRAY_CONCRETE
    name     = "%security_keypad_digit_0%"
    priority = 10
    click { left = ["security:pin-0"] }
  }

  # Clear the entered digits.
  clear {
    slot     = 38
    material = RED_CONCRETE
    name     = "@security.verify.keypad-clear"
    priority = 10
    click { left = ["security:pin-clear"] }
  }

  # Submit the entered digits for verification.
  submit {
    slot     = 42
    material = LIME_CONCRETE
    name     = "@security.verify.keypad-submit"
    priority = 10
    click { left = ["security:pin-submit"] }
  }

  # The "type an authenticator code instead" button, shown only when the player holds a TOTP factor; otherwise the
  # divider frame shows through this slot.
  totp {
    slot     = 49
    material = WRITABLE_BOOK
    name     = "@security.verify.keypad-totp"
    priority = 10
    view     = ["security:totp-enabled"]
    click { left = ["security:pin-totp"] }
  }
}
