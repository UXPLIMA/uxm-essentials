# The join-verification / op-command re-auth keypad, rendered through the menu engine. A frozen player taps their PIN
# or authenticator code into this four-row pad: the masked entry sits centred on the top row, the digits run 0-4 then
# 5-9 across two rows of five, and clear / submit (plus, for a player who holds an authenticator factor, a "type a
# code" button) sit on the bottom row. Every other slot is a divider pane so a stray tap lands on nothing. The engine
# cancels every click and drag on this window, so no item can ever move: the pad is input-only.
#
# The digits are player heads carrying a numbered texture, so the pad reads as a keypad rather than a wall of
# identical blocks. Each `basehead:` value is a Mojang textures payload and needs no external plugin or lookup. To
# re-theme the pad (quartz, pumpkin, seasonal, whatever), swap the ten `material` values for another numbered head
# set; nothing else here has to change. A texture that fails to parse falls back to a plain head rather than breaking
# the render, so a bad paste degrades instead of locking a player out.
#
# The buttons run the security feature's own actions, which own the entered-PIN buffer and the verify decision: a digit
# appends and re-renders the masked display, clear empties it, submit reads and verifies it, and the code button opens
# the authenticator prompt. The masked display and the digit labels resolve through the security catalog, so no
# user-facing text lives here; operators may re-skin the materials, slots and frame freely.
title = "@security.verify.keypad-title"
rows = 4

items {
  # The grey-glass divider frame. Lowest priority, so the buttons below sit on top of it, and a hidden button's slot
  # (the code button, when the player holds no authenticator factor) falls back to it.
  filler {
    slots    = ["0-35"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The masked entry display: one asterisk per entered digit, never the digits themselves, re-rendered after each tap.
  entry {
    slot     = 4
    material = PAPER
    name     = "%security_keypad_entry%"
    priority = 10
  }

  # Row one: 0-4. Each button appends its digit to the entry buffer and re-renders the masked display.
  digit0 {
    slot     = 11
    material = "basehead:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMWYzZDE5NzJjZTJmMmI3OWIyZGYwN2FkNWM1NzRmOWNjZDBlY2ViMjA0MTQzZGY5NjZkMzAxYjE4ZTkyYjBiNiJ9fX0="
    name     = "%security_keypad_digit_0%"
    priority = 10
    click { left = ["security:pin-0"] }
  }
  digit1 {
    slot     = 12
    material = "basehead:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZTBhNGM5NGRkNjVhN2NhZGM0MTcyY2VkZjM5OTBhODU0Mjc3MmJiMTEzY2RmMWEwZjc4ZWY2NTJjNmFiZTZjYiJ9fX0="
    name     = "%security_keypad_digit_1%"
    priority = 10
    click { left = ["security:pin-1"] }
  }
  digit2 {
    slot     = 13
    material = "basehead:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYTQ3YzU1MDY0ZjFkMDc2MjVhZjA1Y2RiYzBmYzdjODQxNzNiMTA1NDEwMjRjODg1NWVkNzEzMmNhNzc2NzI0NiJ9fX0="
    name     = "%security_keypad_digit_2%"
    priority = 10
    click { left = ["security:pin-2"] }
  }
  digit3 {
    slot     = 14
    material = "basehead:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZDljYjk0ZDg3MjkxOTdhMThhNzY4ODJjMjQ5MThhOGMwNDQ5NGQzNDcyN2Y0ZGYwNjBmYjdhNDVhMWZmODUzNyJ9fX0="
    name     = "%security_keypad_digit_3%"
    priority = 10
    click { left = ["security:pin-3"] }
  }
  digit4 {
    slot     = 15
    material = "basehead:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMzZhZDc1NjVmYTY4OTQyZDJmZjVmMDRlZmRhODBkOWU5Zjg4ZDMzNDAxNjgwZjE4MmUwZjM3YWYzMmI4YzI5NCJ9fX0="
    name     = "%security_keypad_digit_4%"
    priority = 10
    click { left = ["security:pin-4"] }
  }

  # Row two: 5-9, directly below 0-4 so the pad reads left-to-right, top-to-bottom.
  digit5 {
    slot     = 20
    material = "basehead:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZDAyMDNiMTI0YWNlZmQwOGM0NDZhMDQ5MmE1YzlkODAwZWUwY2Q4YzI2MGMzYzEyMzc3NzMxNjU5MjUxYWQ0ZSJ9fX0="
    name     = "%security_keypad_digit_5%"
    priority = 10
    click { left = ["security:pin-5"] }
  }
  digit6 {
    slot     = 21
    material = "basehead:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZTQ5MTAxN2ZkNTI2N2ZjOWE2NDFjY2UwMjUwZDQ2ODM4MDRlM2IxMzk5YjJiNWI1OGYxMzBmNTc3NGRlMjgyMSJ9fX0="
    name     = "%security_keypad_digit_6%"
    priority = 10
    click { left = ["security:pin-6"] }
  }
  digit7 {
    slot     = 22
    material = "basehead:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvODQyNWFjYzQyY2FmOGIxZTk1Y2NiMTZkMzc5YWYwYjc2Zjk1ZWQyOWVmMmE0OTQwNzNkMGIwN2IxNWRjMjJmZCJ9fX0="
    name     = "%security_keypad_digit_7%"
    priority = 10
    click { left = ["security:pin-7"] }
  }
  digit8 {
    slot     = 23
    material = "basehead:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYjQ5MDRkNWRlZTM3ODJkNGQ2YzZmZWJlNzI3ODNkOTYxNDgyNzdlZmJlNzhjMTUxNGNjMjAwODhkOGZmMGQwOSJ9fX0="
    name     = "%security_keypad_digit_8%"
    priority = 10
    click { left = ["security:pin-8"] }
  }
  digit9 {
    slot     = 24
    material = "basehead:eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNmFkYzY1YzNiODk2YWI2NmRmMWVkN2JhNDI1MGQxNmJiODM1MmE2ZDI4NWE1NGMwMDIxOGVhNzJhNGJiNzE0OSJ9fX0="
    name     = "%security_keypad_digit_9%"
    priority = 10
    click { left = ["security:pin-9"] }
  }

  # Clear the entered digits. Sits under the left edge of the pad, a column clear of the code button.
  clear {
    slot     = 29
    material = RED_CONCRETE
    name     = "@security.verify.keypad-clear"
    priority = 10
    click { left = ["security:pin-clear"] }
  }

  # The "type an authenticator code instead" button, shown only when the player holds a TOTP factor; otherwise the
  # divider frame shows through this slot.
  totp {
    slot     = 31
    material = WRITABLE_BOOK
    name     = "@security.verify.keypad-totp"
    priority = 10
    view     = ["security:totp-enabled"]
    click { left = ["security:pin-totp"] }
  }

  # Submit the entered digits for verification. Sits under the right edge of the pad, mirroring clear.
  submit {
    slot     = 33
    material = LIME_CONCRETE
    name     = "@security.verify.keypad-submit"
    priority = 10
    click { left = ["security:pin-submit"] }
  }
}
