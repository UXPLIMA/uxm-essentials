# Security: account-security features. This is NOT a login/password system and does not replace one. It adds an
# optional second factor players enrol themselves (/2fa for an authenticator app, /pin for a numeric PIN), op-command
# protection, and same-IP alt detection.
#
# On an offline-mode (cracked) server, keep your login plugin: it is what proves the name belongs to the person
# typing it, and this module waits for it before asking for a second factor. See wait-for-login-plugin below.
#
# The module ships ENABLED but inert — nothing changes for a player until they enrol a factor. Turn the whole
# feature off with enabled = false.
enabled = true

# Two-factor enrolment. A player runs /2fa setup to add an authenticator app (Google Authenticator, Aegis, Authy,
# and any other RFC 6238 TOTP app) or /pin set <pin> to add a numeric PIN; either is a valid second factor.
two-factor {
  # The master switch for two-factor enrolment. With this off, /2fa and /pin refuse to enrol (existing factors can
  # still be removed with /2fa disable).
  enabled = true

  # Which factors a player may enrol. TOTP is an authenticator-app code; PIN is a short numeric code. Turn either
  # off to offer only the other.
  totp = true
  pin = true

  # The issuer label shown next to the account in the authenticator app (the "uxmEssentials (Steve)" heading). Set
  # it to your server's name so a player with several servers can tell the entries apart.
  issuer = "uxmEssentials"

  # How many 30-second time-steps of tolerance to allow when checking a submitted code, on either side of the
  # current step. 1 (±30s) absorbs modest clock drift between the server and the player's phone; 0 is strictest.
  # Capped at 5.
  code-window = 1

  # The allowed length range for a PIN, in digits. A PIN outside this range is refused at /pin set. A PIN is always
  # digits only, because the verification screen is a numeric keypad.
  pin-min-length = 4
  pin-max-length = 8

  # PINs refused outright, however well-formed they are. Length rules cannot catch these: 1234 is a perfectly valid
  # four-digit PIN and also the first thing anybody guessing would try. Add your own (your server's founding year,
  # its name spelled on a phone keypad) or set this to [] to refuse none.
  blocked-pins = [
    "0000", "1111", "2222", "3333", "4444", "5555", "6666", "7777", "8888", "9999",
    "1234", "4321", "12345", "123456", "654321", "1212", "2580", "0852", "1122",
    "2000", "1990", "2024", "2025"
  ]
}

# Join verification. When an enrolled player joins from a device they have not verified from recently, they are
# frozen — they cannot move, run commands, chat, interact, or edit blocks — and shown a numeric keypad to enter their
# PIN (or a button to type their authenticator code). A non-enrolled player is never frozen.
join-verification {
  # The master switch for the join freeze. With this off, enrolment still works (/2fa, /pin) but nobody is frozen on
  # join — useful if you want the second factor only for op-command protection in a later release.
  enabled = true

  # Whether a successful verification remembers the device so the next join from the same address skips the keypad
  # until the trust lapses. The address is stored only as a one-way hash, never in the clear. Turn this off to make
  # every join re-verify.
  trust-devices = true

  # How long a remembered device skips the keypad, in hours. After this, the player verifies again. 0 disables the
  # trust window entirely (equivalent to trust-devices = false).
  trust-duration-hours = 24

  # How many wrong PINs/codes a player may enter before they are kicked. At least 1.
  max-attempts = 3

  # How long, in seconds, a kicked-out player is locked out — a rejoin within this window is kicked immediately.
  lockout-seconds = 300

  # Whether that lockout is also a real tempban on the server's own ban list, rather than only an in-memory cooldown
  # a restart would clear. It goes through the moderation module's ban system, so it lands in the same ban table and
  # punishment history as every other ban, staff see it, and /unban lifts it: this module keeps no ban list of its
  # own. With the moderation module disabled there is nothing to write to and the lockout stays in memory.
  lockout-bans = true

  # The reason recorded against that ban, shown to the player and in the punishment history.
  lockout-ban-reason = "Too many failed verification attempts"

  # How long, in seconds, a frozen player has to prove their factor before they are kicked. Without a limit a player
  # who walks away mid-prompt sits at the keypad forever, holding a slot on a full server and leaving their account
  # logged in. 0 removes the limit.
  entry-timeout-seconds = 60

  # What to do with a player who has to verify while they are in spectator mode. A spectator cannot click any window
  # the server opens for them, so a spectator shown the keypad can see every button and press none of them: they are
  # stuck. This moves them into a mode that can click for the length of the freeze and puts their own mode back the
  # moment they verify. adventure (they cannot edit the world) | survival | none (leave them stuck; know what you are
  # choosing).
  spectator-mode = adventure

  # What happens to a joining player when the verification decision itself fails: the database is unreachable, the
  # key-file is unreadable, or the lookup throws. Someone has to decide, because the freeze goes on before the
  # decision runs. kick refuses the join with a "try again" message, so an outage keeps enrolled accounts shut rather
  # than open. allow lifts the freeze and lets them in unverified, so an outage keeps the server playable and accepts
  # that for its duration an enrolled account is protected by its password alone.
  safety-net = kick

  # What a frozen player is stopped from doing. All of these ship on; turn one off to allow it during verification.
  #
  # Four of them are protection rather than restraint: someone staring at a keypad cannot fight back, run away or
  # eat. damage-taken and mob-targeting stop the world killing an account holder while they prove they own the
  # account, hunger stops a slow verification starving them, and teleport stops anyone else moving them.
  restrictions {
    move          = true
    commands      = true
    chat          = true
    interact      = true
    drop          = true
    pickup        = true
    block-edit    = true
    damage-taken  = true
    damage-dealt  = true
    mob-targeting = true
    teleport      = true
    inventory     = true
    consume       = true
    hunger        = true
  }

  # Where a verifying player is held for the length of the freeze, as world,x,y,z or world,x,y,z,yaw,pitch. The
  # freeze already stops them acting, but they are still standing wherever they logged out, in view of whoever walks
  # past. Naming a spot here puts the unverified session somewhere deliberately empty and puts them back exactly
  # where they were the moment they verify. Blank (the default) leaves them where they are.
  holding-area = ""

  # A proxy backend to send the player to once they verify, by its name in the proxy config. This is for the network
  # layout where players land on a small verification server first and are moved to the real one afterwards. Blank
  # (the default) leaves them on this server. Needs a proxy in front; with none there is nothing to send them to and
  # the transfer is a logged no-op.
  transfer-to = ""

  # What happens to a player who is online at the moment staff clear their second factor with /security reset. That
  # command is the recovery door, for someone who lost their authenticator or forgot their PIN; it is also, from the
  # other side, exactly what an account theft would want, so what it does to the session it lands in is your call.
  #   reverify — send them back through verification at once. With a factor left they prove it again; with none left
  #              and a required PIN they are shown the create pad, so a reset ends with a factor rather than without.
  #   kick     — disconnect them, so nothing of the revoked session carries on and their next join decides afresh.
  #   nothing  — leave them playing. Right when a reset is routine help-desk work.
  on-access-revoked = reverify

  # Whether to let an installed login plugin (AuthMe and its forks) finish authenticating the player before this
  # module asks for a second factor. On an offline-mode server this ordering is the whole point: until the login
  # plugin says so, the name is only what the client typed, and asking that stranger for the account holder's PIN is
  # both wrong and useless. With no login plugin installed this changes nothing.
  wait-for-login-plugin = true
}

# How verification talks back to the player, beyond the chat lines. Chat is a poor channel at this moment: the player
# has a window open and their chat is scrolled away behind it, so the title says where they are already looking why
# the server is not responding to them, and a sound per tap makes the pad feel like a keypad.
feedback {
  # Whether the keypad title and the two outcome titles are shown at all.
  titles = true

  # The sound each step plays. Any vanilla or resource-pack sound key works; leave one blank ("") to play nothing.
  # An unusable key plays nothing and logs a line rather than breaking the verification it decorates.
  sounds {
    prompt  = "block.note_block.pling"
    key     = "ui.button.click"
    success = "entity.player.levelup"
    failure = "entity.villager.no"
  }
}

# Op-command protection. Dangerous commands (op, stop, gamemode, ...) are held behind a fresh second-factor proof:
# when a player runs one and has not verified within the re-auth window, the command is blocked and they are shown the
# same keypad to prove their PIN or authenticator code; on success the command is retried. Only players who have
# enrolled a factor are gated — a re-auth needs something to prove against — and a player with
# uxmessentials.security.bypass is exempt. The console is never gated.
op-protection {
  # The master switch for op-command protection. With this off, protected commands run without any re-auth check.
  enabled = true

  # How long, in seconds, a successful verification (a join proof or an earlier re-auth) counts as recent, so a burst
  # of protected commands only prompts once. 0 forces a fresh proof for every protected command.
  reauth-window-seconds = 60

  # The commands to protect, by root name. Matching ignores a leading slash, any arguments, and a namespace prefix, so
  # "op" also catches "/op Steve" and "minecraft:op". Add your server's own dangerous commands here.
  protected-commands = [
    "op",
    "deop",
    "stop",
    "restart",
    "reload",
    "gamemode",
    "ban",
    "ban-ip",
    "pardon",
    "kick",
    "whitelist"
  ]
}

# IP / alt guard. On join the player's address is recorded as a one-way token (the raw IP is NEVER stored — there is
# no GeoIP and nothing reversible) so staff can spot accounts that share an address (alts). /ipalts <player> lists the
# accounts that share an IP with a target.
ip-guard {
  # The master switch for the IP/alt guard. With this off, nothing is recorded and /ipalts has nothing to show.
  enabled = true

  # The greatest number of DISTINCT accounts allowed to connect from one address. A join that would push an address
  # past this is kicked. 0 (the default) means no cap — the guard only observes and notifies, never kicks. Set it to,
  # say, 3 to hold each household to three accounts.
  max-accounts-per-ip = 0

  # Whether to notify online staff (holders of uxmessentials.security.alts.notify) when a joining player shares an
  # address with other accounts. The notice carries the account names and a count — never the address itself.
  notify-staff = true
}

# ClientID. Read the client brand a joining player reports (the minecraft:brand channel — "vanilla", "fabric", a
# known cheat client, ...) and act on it. /clientinfo <player> shows the recorded brand.
client-id {
  # The master switch for the client-brand guard. With this off, no brand is read and /clientinfo has nothing to show.
  enabled = true

  # How the brand list below is applied:
  #   block-list  — deny the listed brands, allow everything else (keep known cheat clients out)
  #   allow-list  — allow ONLY the listed brands, deny everything else (admit a fixed set of approved clients)
  #   flag        — never deny; a listed brand is only flagged to staff and logged (observe before enforcing)
  # An unrecognised value falls back to flag, the safe mode that never kicks.
  mode = flag

  # The brands the mode above acts on, matched case-insensitively. Empty by default, so flag mode simply records
  # every brand for /clientinfo without flagging anything.
  brands = []
}
