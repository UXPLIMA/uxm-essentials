# Security — account-security features. This is NOT a login/password system (the server is premium-only); it adds
# an optional second factor players enrol themselves, plus (in later releases) op-command protection and same-IP alt
# detection. Phase 1 ships the two-factor enrolment: /2fa for a TOTP authenticator app and /pin for a numeric PIN.
#
# The module ships ENABLED but inert — nothing changes for a player until they enrol a factor. Turn the whole
# feature off with enabled = false.
enabled = true

# Two-factor enrolment. A player runs /2fa setup to add an authenticator app (Google Authenticator, Aegis, Authy,
# and any other RFC 6238 TOTP app) or /pin set <pin> to add a numeric PIN; either is a valid second factor.
two-factor {
  # The master switch for two-factor enrolment. With this off, /2fa and /pin refuse to enrol (existing factors can
  # still be removed with /2fa disable).
  enabled = true

  # Which factors a player may enrol. TOTP is an authenticator-app code; PIN is a short numeric code. Turn either
  # off to offer only the other.
  totp = true
  pin = true

  # The issuer label shown next to the account in the authenticator app (the "uxmEssentials (Steve)" heading). Set
  # it to your server's name so a player with several servers can tell the entries apart.
  issuer = "uxmEssentials"

  # How many 30-second time-steps of tolerance to allow when checking a submitted code, on either side of the
  # current step. 1 (±30s) absorbs modest clock drift between the server and the player's phone; 0 is strictest.
  # Capped at 5.
  code-window = 1

  # The allowed length range for a PIN, in digits. A PIN outside this range is refused at /pin set. A PIN is always
  # digits only, because the verification screen is a numeric keypad.
  pin-min-length = 4
  pin-max-length = 8
}

# Join verification. When an enrolled player joins from a device they have not verified from recently, they are
# frozen — they cannot move, run commands, chat, interact, or edit blocks — and shown a numeric keypad to enter their
# PIN (or a button to type their authenticator code). A non-enrolled player is never frozen.
join-verification {
  # The master switch for the join freeze. With this off, enrolment still works (/2fa, /pin) but nobody is frozen on
  # join — useful if you want the second factor only for op-command protection in a later release.
  enabled = true

  # Whether a successful verification remembers the device so the next join from the same address skips the keypad
  # until the trust lapses. The address is stored only as a one-way hash, never in the clear. Turn this off to make
  # every join re-verify.
  trust-devices = true

  # How long a remembered device skips the keypad, in hours. After this, the player verifies again. 0 disables the
  # trust window entirely (equivalent to trust-devices = false).
  trust-duration-hours = 24

  # How many wrong PINs/codes a player may enter before they are kicked. At least 1.
  max-attempts = 3

  # How long, in seconds, a kicked-out player is locked out — a rejoin within this window is kicked immediately. This
  # cooldown is kept in memory, so a server restart clears it.
  lockout-seconds = 300
}

# Op-command protection. Dangerous commands (op, stop, gamemode, ...) are held behind a fresh second-factor proof:
# when a player runs one and has not verified within the re-auth window, the command is blocked and they are shown the
# same keypad to prove their PIN or authenticator code; on success the command is retried. Only players who have
# enrolled a factor are gated — a re-auth needs something to prove against — and a player with
# uxmessentials.security.bypass is exempt. The console is never gated.
op-protection {
  # The master switch for op-command protection. With this off, protected commands run without any re-auth check.
  enabled = true

  # How long, in seconds, a successful verification (a join proof or an earlier re-auth) counts as recent, so a burst
  # of protected commands only prompts once. 0 forces a fresh proof for every protected command.
  reauth-window-seconds = 60

  # The commands to protect, by root name. Matching ignores a leading slash, any arguments, and a namespace prefix, so
  # "op" also catches "/op Steve" and "minecraft:op". Add your server's own dangerous commands here.
  protected-commands = [
    "op",
    "deop",
    "stop",
    "restart",
    "reload",
    "gamemode",
    "ban",
    "ban-ip",
    "pardon",
    "kick",
    "whitelist"
  ]
}
