# The COMPASS gadget's navigator, rendered through the menu engine. A paginated grid of player heads — every
# online player the staff member can see (a vanished player they may not see is omitted), excluding themselves —
# and clicking a head teleports the staff member onto that player as an admin teleport.
#
# The roster is read from the online players on the global region thread (iterating the online list off it is
# illegal on Folia), so the COMPASS gadget computes the visible-player list there and hands it in as the menu
# subject; the staff:players list source only reads that subject, touching no Bukkit API. The staff_player_name
# placeholder fills each head's label from the bound entry, and a left click teleports through staff:teleport-to.
# The title resolves from the staff message catalog, so no user-facing text lives here. The geometry mirrors the
# original fixed six-row picker exactly: the heads fill the top five rows in order and the bottom row is empty
# (the old picker placed no navigation buttons).
title = "@staff.navigator.title"
rows = 6

items {
  # The player-head grid, paginated across the top five rows. Each cell is a PLAYER_HEAD named with the player's
  # name; a left click teleports the staff member onto that player through staff:teleport-to.
  players {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "staff:players"
      template {
        material = PLAYER_HEAD
        name     = "%staff_player_name%"
        click { left = ["staff:teleport-to"] }
      }
    }
  }
}
