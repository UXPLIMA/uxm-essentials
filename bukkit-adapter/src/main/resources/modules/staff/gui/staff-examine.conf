# The EXAMINE gadget's online-player picker, rendered through the menu engine. A paginated grid of player heads,
# one per online player, and clicking a head opens that player's inventory through the soft-coupled inspector and
# sends the staff.examine.info line (ping/gamemode/health/world) regardless — so the gadget always tells the staff
# member something even when the inventory open degrades.
#
# The roster is read from the online players on the global region thread (iterating the online list off it is
# illegal on Folia), so the EXAMINE gadget computes the online list there and hands it in as the menu subject; this
# picker reuses the shared staff:players list source and staff_player_name head label the navigator/stafflist
# pickers register, so the source only reads that subject and touches no Bukkit API. The staff:examine click opens
# the clicked player's inventory and sends the info line. The title resolves from the staff message catalog, so no
# user-facing text lives here. The geometry mirrors the original fixed six-row picker: the heads fill the top five
# rows in order and the bottom row is empty (the old picker placed no navigation buttons).
title = "@staff.examine.title"
rows = 6

items {
  # The player-head grid, paginated across the top five rows. Each cell is a PLAYER_HEAD named with the player's
  # name; a left click examines that player through staff:examine.
  players {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "staff:players"
      template {
        material = PLAYER_HEAD
        name     = "%staff_player_name%"
        click { left = ["staff:examine"] }
      }
    }
  }
}
