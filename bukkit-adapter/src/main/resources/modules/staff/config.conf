# Staff mode: a working "staff mode" toggle with an item-loss-safe loadout swap and a configurable gadget hotbar.
#
# STAFF-MODE ONLY. This module never mutes, bans, kicks, or warns; it only flips a staff member into a working mode:
# their real loadout is saved to the database, swapped for the gadget hotbar below, and they are vanished; leaving
# restores the exact loadout. The gadgets orchestrate the other modules (VANISH uses the presence module, EXAMINE uses
# the playerstate /invsee machinery); with a source module disabled, that gadget simply does nothing rather than
# failing. Staff chat (/staffchat, /sc) fans out to everyone holding the staff-chat node.
#
# ITEM-LOSS-SAFE: the real loadout is committed to the database BEFORE the inventory is swapped, and restored before
# the stored copy is deleted, so a crash mid-mode never loses items; the database row is the safety net. Leaving,
# quitting in mode, or disabling the module all restore the real loadout.
#
# The module ships ENABLED with the sensible default gadget hotbar below. Every command and gadget is
# permission-gated, so a regular player sees nothing change; grant the staff nodes to use it. Re-skin the gadget
# materials/names/slots to taste, or set enabled = false to turn the module off entirely.
enabled = true

# Whether entering staff mode also vanishes the staff member. Honoured when the presence module is enabled; with
# presence off this does nothing (no second vanish state is kept).
vanish-on-enter = true

# Whether entering staff mode grants flight. The player's real pre-mode flight allowance is captured, so leaving
# reverts it exactly; a survival player loses the granted flight, a creative one keeps theirs. Staff need
# uxmessentials.playerstate.fly.allworlds to keep this flight in configured no-fly worlds.
flight-on-enter = true

# Whether entering staff mode grants night vision. It is cleared along with the rest of the in-mode effects when
# the player's real loadout is restored on exit.
night-vision-on-enter = true

# The gadget hotbar. Each gadget is placed at its slot (0..8, the hotbar) and tagged so a right-click fires it
# regardless of how you re-skin its material or name. A gadget with enabled = false is left out of the hotbar. The
# `name` is MiniMessage, rendered as written (it is operator content, not a translated message key).
gadgets {
  # VANISH: right-click to toggle your own vanish (presence module).
  vanish {
    enabled = true
    slot = 0
    material = "SLIME_BALL"
    name = "<accent>ᴠᴀɴɪꜱʜ</accent>"
  }
  # EXAMINE: right-click to pick an online player and open their inventory (playerstate module).
  examine {
    enabled = true
    slot = 1
    material = "BOOK"
    name = "<accent>ᴇxᴀᴍɪɴᴇ</accent>"
  }
  # FREEZE: right-click a player to freeze or unfreeze them (moderation module; honours the exempt node and
  # is audit-logged). Used on air it just tells you to look at a player.
  freeze {
    enabled = true
    slot = 2
    material = "PACKED_ICE"
    name = "<accent>ꜰʀᴇᴇᴢᴇ</accent>"
  }
  # COMPASS: right-click to open a navigator and pick an online player to teleport to, or right-click a player
  # directly to go straight to them (teleport module).
  compass {
    enabled = true
    slot = 3
    material = "COMPASS"
    name = "<accent>ɴᴀᴠɪɢᴀᴛᴏʀ</accent>"
  }
  # FOLLOW: right-click a player to start (or stop) continuously following them; following ends automatically
  # when either of you leaves or you exit staff mode (teleport module not required; it uses a direct teleport).
  follow {
    enabled = true
    slot = 4
    material = "LEAD"
    name = "<accent>ꜰᴏʟʟᴏᴡ</accent>"
  }
}

# The FOLLOW gadget re-teleports a following staff member onto their target on this interval (in ticks; 20 ticks
# is one second). Lower is smoother but heavier.
follow {
  interval-ticks = 10
}

# Staff chat (/staffchat, /sc).
staff-chat {
  # The permission node identifying the staff-chat audience: every online holder of this node receives staff chat.
  # Defaults to the same node that gates sending, so anyone who can send also receives.
  receive-node = "uxmessentials.staff.chat"
}
