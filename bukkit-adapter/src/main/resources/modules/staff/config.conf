# Staff mode — a working "staff mode" toggle with an item-loss-safe loadout swap and a configurable gadget hotbar.
#
# STAFF-MODE ONLY. This module never mutes, bans, kicks, or warns — it only flips a staff member into a working mode:
# their real loadout is saved to the database, swapped for the gadget hotbar below, and they are vanished; leaving
# restores the exact loadout. The gadgets orchestrate the other modules (VANISH uses the presence module, EXAMINE uses
# the playerstate /invsee machinery); with a source module disabled, that gadget simply does nothing rather than
# failing. Staff chat (/staffchat, /sc) fans out to everyone holding the staff-chat node.
#
# ITEM-LOSS-SAFE: the real loadout is committed to the database BEFORE the inventory is swapped, and restored before
# the stored copy is deleted, so a crash mid-mode never loses items — the database row is the safety net. Leaving,
# quitting in mode, or disabling the module all restore the real loadout.
#
# The module ships DISABLED. Author the gadget hotbar (materials, names, slots) first, then set enabled = true.
enabled = false

# Whether entering staff mode also vanishes the staff member. Honoured when the presence module is enabled; with
# presence off this does nothing (no second vanish state is kept).
vanish-on-enter = true

# The gadget hotbar. Each gadget is placed at its slot (0..8, the hotbar) and tagged so a right-click fires it
# regardless of how you re-skin its material or name. A gadget with enabled = false is left out of the hotbar. The
# `name` is MiniMessage, rendered as written (it is operator content, not a translated message key).
gadgets {
  # VANISH — right-click to toggle your own vanish (presence module).
  vanish {
    enabled = true
    slot = 0
    material = "SLIME_BALL"
    name = "<aqua>Vanish"
  }
  # EXAMINE — right-click to pick an online player and open their inventory (playerstate module).
  examine {
    enabled = true
    slot = 1
    material = "BOOK"
    name = "<gold>Examine"
  }
}

# Staff chat (/staffchat, /sc).
staff-chat {
  # The permission node identifying the staff-chat audience: every online holder of this node receives staff chat.
  # Defaults to the same node that gates sending, so anyone who can send also receives.
  receive-node = "uxmessentials.staff.chat"
}
