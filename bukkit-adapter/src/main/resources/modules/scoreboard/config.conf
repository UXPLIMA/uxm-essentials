# Scoreboard — a per-player sidebar plus a tablist header/footer, rendered from the content below.
#
# Everything under `scoreboard` and `tablist` is MiniMessage rendered as written — these are NOT plugin strings and
# are not translated through messages_<lang>.conf. Lines may embed PlaceholderAPI placeholders (e.g. %server_online%,
# %player_name%); without PlaceholderAPI installed those are left untouched. Players toggle their own display with
# /scoreboard (alias /sb).
#
# The module ships DISABLED, and the content below is the inert do-nothing default (no title, no lines, no tablist
# change), so enabling the module without authoring content changes nothing. Author the lines first, then set
# enabled = true.
enabled = false

scoreboard {
  # The sidebar heading. Leave blank for no heading.
  title = ""
  # The sidebar lines, top to bottom. At most 15; a blank entry renders as a spacer line.
  lines = []
  # How often every viewer is re-rendered, in server ticks (20 ticks = one second). Must be positive.
  refresh-ticks = 20
  # World names where the sidebar and tablist are suppressed entirely.
  world-blacklist = []
}

tablist {
  # The tablist header lines, joined top to bottom. Leave empty to leave the header untouched.
  header = []
  # The tablist footer lines, joined top to bottom. Leave empty to leave the footer untouched.
  footer = []
}
