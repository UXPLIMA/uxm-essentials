# Scoreboard — a per-player sidebar rendered from the content below.
#
# The tablist header/footer moved to its own module (modules/tablist/config.conf) — configure it there.
#
# Everything under `scoreboard` is MiniMessage rendered as written — these are NOT plugin strings and are not
# translated through messages_<lang>.conf. Lines may embed PlaceholderAPI placeholders (e.g. %server_online%,
# %player_name%); without PlaceholderAPI installed those are left untouched. Players toggle their own sidebar with
# /scoreboard (alias /sb).
#
# The module ships DISABLED, and the content below is the inert do-nothing default (no title, no lines), so enabling
# the module without authoring content changes nothing. Author the lines first, then set enabled = true.
enabled = false

scoreboard {
  # The sidebar heading. Leave blank for no heading.
  title = ""
  # The sidebar lines, top to bottom. At most 15; a blank entry renders as a spacer line.
  lines = []
  # Hide the red score numbers vanilla draws down the right edge of each line — the clean, modern look. Set to
  # false to show the numbers.
  hide-score-numbers = true
  # How often every viewer is re-rendered, in server ticks (20 ticks = one second). Must be positive.
  refresh-ticks = 20
  # World names where the sidebar is suppressed entirely.
  world-blacklist = []
}
