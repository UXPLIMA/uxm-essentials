# Scoreboard — a per-player sidebar rendered from the content below.
#
# The tablist header/footer moved to its own module (modules/tablist/config.conf) — configure it there.
#
# Everything authored here is MiniMessage rendered as written — these are NOT plugin strings and are not translated
# through messages_<lang>.conf. Players toggle their own sidebar with /scoreboard (alias /sb).
#
# Two kinds of token work in any title or line:
#   built-in {tokens}  — resolved by the plugin itself, so they work WITHOUT PlaceholderAPI. Available:
#                          {player}      the viewer's name
#                          {displayname} the viewer's display name (plain text)
#                          {online}      players currently online
#                          {max_players} the server slot count
#                          {world}       the viewer's world name
#                          {ping}        the viewer's ping in ms
#                          {tps}         the server's 1-minute tick rate
#                          {tps_colored} the same rate, coloured green/yellow/red by health
#                          {uptime}      how long the server has run (e.g. 1h30m)
#                          {ram_used}    used heap in MB
#                          {ram_max}     maximum heap in MB
#   PlaceholderAPI %papi%  — e.g. %server_online%, %player_name%; these need PlaceholderAPI installed, and without it
#                            they are left on the board verbatim.
#
# The module ships ENABLED with the example sidebar below so a fresh install shows a working board. Edit the title,
# lines, and the play.example.net line to brand it for your server (or set enabled = false to turn it off).
enabled = true

# How often every viewer is re-rendered, in server ticks (20 ticks = one second). Must be positive. This is the
# GLOBAL refresh cadence shared by every board; per-board refresh intervals are not yet honoured. With the
# back-compat single-board shape below, the cadence is read from scoreboard.refresh-ticks instead.
refresh-ticks = 20

# --- Single-board shape (back-compat default) -------------------------------------------------------------------
# When there is no `boards { … }` block, the top-level `scoreboard { … }` block below is shown to everyone (subject
# only to its world-blacklist). This is the historical shape and stays supported unchanged. To use multiple
# condition-selected boards instead, delete this block and author a `boards { … }` block (see the example below).
scoreboard {
  # The sidebar heading. Leave blank for no heading.
  title = "<h:'uxmEssentials'>"
  # The sidebar lines, top to bottom. At most 15; a blank entry renders as a spacer line. This example uses the
  # built-in {tokens} above, so it shows real values with or without PlaceholderAPI — edit it to taste.
  lines = [
    ""
    "<muted>Player</muted>"
    "<value>{player}</value>"
    ""
    "<muted>Online</muted>"
    "<level>{online}</level><muted>/</muted><level>{max_players}</level>"
    ""
    "<muted>World</muted>"
    "<value>{world}</value>"
    ""
    "<accent>play.example.net</accent>"
  ]
  # Hide the red score numbers vanilla draws down the right edge of each line — the clean, modern look. Set to
  # false to show the numbers.
  hide-score-numbers = true
  # The global refresh cadence for this single-board shape, in server ticks (20 = one second). Must be positive.
  refresh-ticks = 20
  # World names where the sidebar is suppressed entirely.
  world-blacklist = []
}

# --- Multiple-board shape (condition-selected) ------------------------------------------------------------------
# Author several named boards, each gated by a `condition` and ranked by `priority`. Per viewer, the
# highest-priority board whose condition matches is shown. HOCON does not preserve the order you write the boards
# in, so on a priority tie the alphabetically-first board name wins — give a board a higher `priority` to put it
# first explicitly. When no board matches, that viewer sees no sidebar. A board keeps its own `world-blacklist`,
# so a selected board still tears down when the viewer is in a world it blacklists.
#
# Condition grammar (see the shared display-condition parser): a blank condition always matches; otherwise one of
#   permission:<node>   world:<name>   gamemode:<mode>   %papi% >= 10   (operators: = != >= <= > < contains)
# prefix any atom with `!` to negate it, and combine atoms with `&&`/`,` (all) or `||` (any). An unparseable
# condition fails safe — that board never matches — so a typo hides a board rather than showing it everywhere.
#
# Example (uncomment and adapt; remove the `scoreboard { … }` block above when you use this):
# boards {
#   staff {
#     condition = "permission:uxmessentials.staff"
#     priority = 10
#     title = "<red>Staff"
#     lines = [ "<gray>Players: <white>%server_online%", "<gray>TPS: <white>%spark_tps%" ]
#     hide-score-numbers = true
#     world-blacklist = []
#   }
#   default {
#     condition = ""
#     priority = 0
#     title = "<gold>My Server"
#     lines = [ "<gray>Online: <white>%server_online%", "", "<yellow>play.example.net" ]
#     hide-score-numbers = true
#     world-blacklist = [ "world_the_end" ]
#   }
# }

# --- Per-line conditions ----------------------------------------------------------------------------------------
# Any single line (in either shape above) may be gated for the viewer by prefixing it with a condition and the
# literal separator " | " (space-pipe-space):  "<condition> | <text>". The condition uses the same grammar as a
# board condition; when it does not match, that line is dropped from the viewer's board entirely (the lines below
# it shift up — there is no blank gap). Lines without the separator always show. Only the FIRST " | " splits, so a
# line whose text itself contains " | " keeps everything after the first separator as the text. The title is never
# conditional. Example lines:
#   "permission:uxmessentials.vip | <gold>VIP perks active"
#   "%player_health% < 6 | <red>Low health!"

# --- Animated lines ---------------------------------------------------------------------------------------------
# Declare named animations in the `animations { … }` block below, then reference one anywhere in a title or line
# source as the token %anim_<name>%. The token is expanded to the animation's current frame BEFORE PlaceholderAPI
# and MiniMessage run, so a frame may itself carry colour tags or placeholders. The whole sidebar shares one global
# animation clock that ticks once per render cadence (refresh-ticks above), so every viewer sees the same frame and
# the animation steps at most once per refresh. A token naming an animation that does not exist is left on the board
# verbatim, so you can spot a typo. Three animation types:
#   FRAMES   — cycle through `frames` one per `interval-ticks` (the only type that uses more than one frame).
#   SCROLL   — slide a `window`-wide marquee across the single source frame, wrapping through `separator`.
#   GRADIENT — sweep an animated multi-stop colour gradient across the single source frame over `steps` steps.
# An animation with an unknown `type`, no `frames`, or invalid params is skipped (logged once) — it never blanks the
# board. `interval-ticks` is the steps cadence for every type (minimum 1).
#
# Example (uncomment and adapt; then use the tokens in a line, e.g. lines = [ "<gray>Status: %anim_blink%" ]):
# animations {
#   blink {
#     type = "FRAMES"
#     frames = [ "<green>●</green> Online", "<dark_green>●</dark_green> Online" ]
#     interval-ticks = 10
#   }
#   marquee {
#     type = "SCROLL"
#     frames = [ "welcome to the server — have fun!" ]
#     interval-ticks = 2
#     window = 18          # visible width in characters
#     separator = "   "    # gap inserted between the end and the wrapped start
#   }
#   glow {
#     type = "GRADIENT"
#     frames = [ "MY SERVER" ]
#     interval-ticks = 2
#     colors = [ "#ff6a00", "#ee0979" ]   # hex (#rrggbb) or named colours; at least two
#     steps = 20                          # advances for one full sweep
#   }
# }

# --- Right-aligned custom score text (TAB-style "||") — NOT SUPPORTED ------------------------------------------
# TAB lets a line read "text || rightText" to draw rightText right-aligned via the score's number format. uxmEss
# does NOT support this: the underlying uxmLib Sidebar keys each line by an opaque internal entry id and does not
# expose the per-line Score, so a line cannot be mapped to its number format without fragile reflection into
# library internals. Use `hide-score-numbers` to drop the numbers entirely (the modern look), or put the value
# inline in the line text. (If uxmLib later exposes per-line score number-format, this can be revisited.)
