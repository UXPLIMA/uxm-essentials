# Layout of the per-player scoreboard settings panel (opened by /scoreboard gui or /sb gui, or /uxmess gui).
# Titles, labels and value lore stay in the message catalog (messages_<lang>.conf); only the geometry and the
# materials live here, so editing this file never touches a translation.

# Menu height in rows (1..6). Three rows comfortably hold the toggle with a back button on the bottom row.
rows = 3

# The i-th toggle is drawn in the i-th slot below, and a click on that slot resolves back to it. The board
# selection a viewer sees is resolved automatically from each board's condition and priority, so there is no
# board-picker to expose; the only per-player preference is the show/hide toggle (the /scoreboard toggle).
property-slots = [13]

# Slot the back button (closes the panel) sits in.
back-slot = 22

# A settings panel never deletes; leave the delete slot off (-1) so no delete button is drawn.
delete-slot = -1

# Materials for the back button, the (unused) delete button, and the background filler.
back-icon = "ARROW"
delete-icon = "BARRIER"
filler = "BLACK_STAINED_GLASS_PANE"
