# The same-server trade window. The chrome lives here: the window's height, its backdrop, where the confirm, money
# and experience buttons sit and what they are made of, while the two blocks of item slots are handed to the trade
# code itself through the content {} regions below, because those slots hold real stacks and the rules that stop an
# item being duplicated belong with the feature, not in a config file.
#
# Every label resolves from the trade message catalog (messages_<lang>.conf), so no player-facing wording lives here.
#
# The default is the AxTrade reading: the top row carries the controls, viewer-left and partner-right, and the five
# rows below hold the items; the viewer's own offer in the left four columns, the other player's mirrored read-only
# into the right four, with a glass divider down the middle. Editable slot k and mirror slot k line up on the same
# row, so a stack placed at your k-th slot shows at their k-th mirror slot. Move any of it you like; the only rule is
# that the two regions keep the same number of slots.
title = "%trade_title%"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The two item regions. "trade:offer" is the viewer's own side: they may place into it and take back out of it, and
# whatever is still there when the window closes is returned to them. "trade:mirror" shows the other player's offer
# and is read-only; clicking it does nothing, which is what stops a trade from being scammed mid-swap.
content {
  "trade:offer" {
    slots    = ["9-12", "18-21", "27-30", "36-39", "45-48"]
    editable = true
  }

  "trade:mirror" {
    slots    = ["14-17", "23-26", "32-35", "41-44", "50-53"]
    editable = false
  }
}

items {
  # The backdrop. Everything the controls and the two item regions do not claim shows as this pane: the divider
  # column down the middle of the window and the gaps in the control row.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The viewer's confirm button, in its two states. The confirmed tile wins the slot while this side has confirmed;
  # any change to either offer clears both confirmations, and the button falls back to the unconfirmed tile.
  confirm {
    slot     = 0
    material = YELLOW_WOOL
    name     = "@trade.window.confirm"
    priority = 10
    view     = ["trade:awaiting"]
    click { any = ["trade:confirm"] }
  }

  confirmed {
    slot     = 0
    material = LIME_WOOL
    name     = "@trade.window.confirmed"
    priority = 20
    view     = ["trade:confirmed"]
    click { any = ["trade:confirm"] }
  }

  # The viewer's money button. Shown only when an economy provider is wired; without one a trade moves items and
  # experience, and this slot falls back to the backdrop. A left click asks for an amount, and because our economy is
  # multi-currency while this button is single, a right click cycles to the next allowed currency; each currency's
  # staked amount is kept across the cycle.
  money {
    slot     = 2
    material = GOLD_INGOT
    name     = "%trade_money_name%"
    lore     = ["%trade_money_lore%"]
    priority = 10
    view     = ["trade:money-enabled"]
    click {
      left  = ["trade:money"]
      right = ["trade:money-cycle"]
    }
  }

  # The viewer's experience button. Experience is a native server resource, so this one is shown on every install.
  experience {
    slot     = 3
    material = EXPERIENCE_BOTTLE
    name     = "@trade.window.experience"
    lore     = ["%trade_experience_lore%"]
    priority = 10
    click { left = ["trade:experience"] }
  }

  # What the other player has staked, read-only: their experience, their money, and whether they have confirmed.
  partner-experience {
    slot     = 5
    material = EXPERIENCE_BOTTLE
    name     = "@trade.window.partner-experience"
    lore     = ["%trade_partner_experience_lore%"]
    priority = 10
  }

  partner-money {
    slot     = 6
    material = SUNFLOWER
    name     = "@trade.window.partner-money"
    lore     = ["%trade_partner_money_lore%"]
    priority = 10
    view     = ["trade:money-enabled"]
  }

  partner-waiting {
    slot     = 8
    material = RED_STAINED_GLASS_PANE
    name     = "@trade.window.partner-waiting"
    priority = 10
    view     = ["trade:partner-awaiting"]
  }

  partner-confirmed {
    slot     = 8
    material = LIME_STAINED_GLASS_PANE
    name     = "@trade.window.partner-confirmed"
    priority = 20
    view     = ["trade:partner-confirmed"]
  }
}
