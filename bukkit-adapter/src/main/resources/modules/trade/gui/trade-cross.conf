# The cross-server trade window, opened when the two players are on different backend servers. It reads like the
# same-server window (modules/trade/gui/trade.conf) but each side stakes alone: the other player's items live on
# their own server and are handed over by the escrow once both sides have confirmed, so there is nothing to mirror
# here and the right half of the window stays backdrop. Items only in this version; no money and no experience are
# staked across servers, so those buttons are absent too.
#
# Confirming here is final: it hands your items to the escrow and closes the window. Closing without confirming
# returns them and aborts the other side.
#
# Every label resolves from the trade message catalog (messages_<lang>.conf), so no player-facing wording lives here.
title = "%trade_cross_title%"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The viewer's own side. Whatever is still in it when the window closes without a confirm is returned to them.
content {
  "trade:cross-offer" {
    slots    = ["9-12", "18-21", "27-30", "36-39", "45-48"]
    editable = true
  }
}

items {
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # Hand the staked items to the escrow and close. There is no confirmed state to show: the window is gone by then.
  confirm {
    slot     = 0
    material = YELLOW_WOOL
    name     = "@trade.window.confirm"
    priority = 10
    click { any = ["trade:cross-confirm"] }
  }

  # The other side is on another server, so all this window can say is that it is waiting for them.
  partner-waiting {
    slot     = 8
    material = RED_STAINED_GLASS_PANE
    name     = "@trade.window.partner-waiting"
    priority = 10
  }
}
