  #   id = "links"
  #   text = "%anim_links%"
  #   color = "%anim_links-colour%"
  #   style = "NOTCHED_20"
  # }

  # A bar for staff only, filled by a placeholder.
  # {
  #   id = "tps"
  #   text = "<muted>ᴛᴘꜱ</muted> <value>{tps}</value>"
  #   color = "BLUE"
  #   progress = "%server_tps_1%"
  #   condition = "permission:uxmessentials.staff"
  # }
]

# Animations a bar may name as %anim_<name>%, in the scoreboard's grammar: FRAMES, SCROLL or GRADIENT.
# A frame may be a catalogue line written as @key, read in each player's own language once the animation has picked
# it. interval-ticks counts refreshes: with refresh-ticks = 20, a value of 5 shows each frame for five seconds.
