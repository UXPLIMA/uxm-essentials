# Boss bars: bars at the top of the screen that stay up, come and go with an event, or are announced for a while.
#
# Every bar whose turn it is shows at once, stacked in the order written below. Players hide or show their own bars
# with /bossbars, and the choice is kept with the player.
#
# A bar's text is MiniMessage, or a line written as @key, which reads a message catalogue entry in each player's own
# language: add the key to messages/messages_<lang>.conf in each language you serve and write @custom.my-bar here.
# Arguments follow the key as name=value and fill the entry's {name} tokens.
#
# Tokens that work in a text, a colour, a style and a progress:
#   {remaining}    the time left of a timed or announced bar, in the reader's words (5d 8h 52m)
#   {player} {online} {max_players} {world} {ping} {tps} and the other built-in tokens the scoreboard lists
#   %papi%         PlaceholderAPI placeholders, when PlaceholderAPI is installed
#   %anim_<name>%  an animation from the animations block below
#
# The module ships DISABLED so enabling it is an explicit operator choice. The example bar below is ready to go, so
# enabled = true shows it straight away.
enabled = false

# How often every player's bars are drawn again, in server ticks (20 ticks = one second). A bar that counts down or
# reads a placeholder changes at this pace.
refresh-ticks = 20

# Whether a player who never ran /bossbars sees no bars until they turn them on.
hidden-by-default = false

# The time zone a start or an end below is read in. Empty is the server's own. Examples: "Europe/Istanbul", "UTC".
time-zone = ""

# How a bar is written. Each bar in the list below is a block of these keys:
#   id            the name /bossbars announce and send use: letters, digits, dashes and underscores
#   text          the words on the bar
#   color         PINK, BLUE, RED, GREEN, YELLOW, PURPLE or WHITE (default WHITE); a placeholder or an animation
#                 that gives one of these names works too
#   style         PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12 or NOTCHED_20 (default PROGRESS)
#   progress      how full the bar is, 0 to 100, or a placeholder that gives a number (default 100); "time" drains a
#                 timed or announced bar from full to empty over its time, and is the default for a timed bar
#   condition     who sees the bar; empty is everybody. The grammar is the scoreboard's:
#                   permission:<node>   world:<name>   gamemode:<mode>   %papi% >= 10
#                 prefix an atom with ! to negate it, combine with && or , (all) and || (any)
#   start, end    a timed bar is up from start until end and gone after it. Write "2026-11-01 18:00" in the time
#                 zone above, or "2026-11-01T18:00:00+03:00" with its own offset. An end alone is up from now.
#   announcement  true for a bar that is up only while /bossbars announce or /bossbars send puts it up

# The bars, top first. Every bar whose turn it is shows at once.
bars = [
  {
    id = "welcome"
    text = "<body>ᴡᴇʟᴄᴏᴍᴇ ᴛᴏ</body> <accent>ᴘʟᴀʏ.ᴇxᴀᴍᴘʟᴇ.ɴᴇᴛ</accent>"
    color = "PURPLE"
    style = "PROGRESS"
    progress = "100"
  }

  # An event that runs for a week and counts down. The bar drains as the week passes.
  # {
  #   id = "double-xp"
  #   text = "<body>ᴅᴏᴜʙʟᴇ xᴘ</body> <green>ᴀᴄᴛɪᴠᴇ</green> <muted>({remaining})</muted>"
  #   color = "GREEN"
  #   style = "NOTCHED_20"
  #   start = "2026-11-01 18:00"
  #   end = "2026-11-08 18:00"
  # }

  # A bar that shows only while announced: /bossbars announce drop 10m
  # {
  #   id = "drop"
  #   text = "<body>ᴀ ᴅʀᴏᴘ ᴘᴀʀᴛʏ ꜱᴛᴀʀᴛꜱ ɪɴ</body> <value>{remaining}</value>"
  #   color = "YELLOW"
  #   announcement = true
  # }

  # One bar that turns through several texts, each for five seconds, from the animations below. The text and the
  # colour turn together, because their animations have the same interval and the same number of frames.
