# Poses: built-in GSit-parity sitting and posing. /sit (on the spot or on a block you right-click), sitting on
# another player, /lay, /bellyflop, /spin, and /crawl, with no separate plugin. Each verb is a real client pose or an
# invisible seat entity the plugin spawns and cleans up; nothing here needs a resource pack.
#
# The module ships ENABLED with the common poses on. Turn the whole feature off with enabled = false, or leave it on
# and switch individual verbs under features {} below.
enabled = true

# Which pose verbs are available. Each is an independent switch on top of the per-verb permission, so you can offer
# exactly the poses you want. player-sit is the one verb that touches a second player (sitting on their shoulders), so
# it ships OFF and is opt-in; the rest ship on.
features {
  sit = true
  player-sit = false
  lay = true
  bellyflop = true
  spin = true
  crawl = true
}

# Whether right-clicking a sittable block seats the player there. With this off, /sit only sits the player in place.
sit-on-blocks = true

# The block materials a player may sit on when sit-on-blocks is true. A leading or trailing * is a wildcard, so
# "*_STAIRS" matches every stair type. Add or remove entries to suit your build palette.
sittable-materials = [ "*_STAIRS", "*_SLAB", "*_CARPET" ]

# The furthest a player may be, in blocks, from the seat block they right-click. Keeps a player from sitting on a block
# across the room. Must be greater than zero.
max-distance = 2.0

# Whether ending a pose returns the player to exactly where they stood when it began, rather than leaving them where
# the seat sat. Useful so sitting on a block edge does not nudge the player on stand-up.
return-to-start = true

# Whether the lying poses emit a soft snore (a subtitle and sound, no resource pack) so a sleeping pose reads as
# sleeping to nearby players. Set false for a silent lie-down.
snore = true

# Region gating. When a claim plugin is present, respect-claims requires the player to have build/interact permission
# where they pose; when WorldGuard is present, respect-worldguard honours the pose region flags. With no such plugin
# installed, posing is allowed everywhere regardless of these switches.
respect-claims = true
respect-worldguard = true
