# Layout for the personal /poses settings & status panel (opened by a bare /poses, /poses gui, and the poses entry
# on the /uxmess gui hub). Geometry and materials only; every title, button name, and value line lives in the
# message catalog (messages_<lang>.conf, keys under poses.gui.*), so translations stay in one place.
#
# Two buttons: the current-pose status (a read-only display) and the player-sit opt-out (click to allow/refuse
# other players sitting on you). The delete slot is unused; a settings panel never deletes.
rows = 3
property-slots = [11, 15]
back-slot = 22
delete-slot = -1
back-icon = "ARROW"
delete-icon = "BARRIER"
filler = "BLACK_STAINED_GLASS_PANE"
