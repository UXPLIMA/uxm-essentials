# Custom menus — the operator surface over the built-in menu engine, behind /menu.
#
# When this module is enabled, every menu file under plugins/uxmEssentials/menus/*.conf is loaded on start and
# becomes openable with `/menu open <name>` (the name is the file name without .conf). `/menu list` shows the loaded
# menus and `/menu reload` re-reads the folder. A menu file that fails to parse, or that references an action,
# condition, or placeholder the engine does not know, is skipped with a warning in the console — one bad menu never
# hides the rest. A starter menu ships as menus/example.conf; copy it to build your own.
#
# The module ships ENABLED but inert: nothing opens until a player runs `/menu open <name>`. Set enabled = false to
# turn the whole /menu surface off (no menus load, the command is not registered).
enabled = true

# Whether a custom menu may run a command from the CONSOLE (the `console` menu action). This is privileged — a console
# command runs with full server permissions regardless of who clicked — so it is OFF by default. Leave it false unless
# you trust every menu file in the menus/ folder, and prefer the `command` action (which runs as the clicking player)
# wherever possible. Our own built-in feature menus are unaffected by this flag; it governs only operator menu files.
#
# When false, a menu that references the `console` action still loads, but that action does nothing and logs a warning
# naming the ignored command — so a misconfigured menu is visible in the console rather than silently privileged.
allow-console = false

# A server-wide anti-spam floor (in milliseconds) for menu clicks. When a player clicks a menu item, any further
# click on that menu inside this window is ignored, so a rapid double-click cannot fire a button's actions twice —
# handy for buy/sell or reward buttons. Zero (the default) disables the floor entirely, so menus behave exactly as
# before unless you opt in. An individual menu may raise this with its own `click-cooldown` key in the menu file; a
# menu never opts below the floor set here. The block is silent — no "slow down" message is sent, since that would
# itself spam the chat.
click-cooldown-ms = 0

# The currency a money menu action or requirement uses when it names none of its own. The menu engine can target
# several economy back-ends by a short spec: `vault` (the server economy), `exp` (native experience points),
# `playerpoints`, `coinsengine` / `coinsengine:<name>`, and `zessentials` / `zessentials:<name>` (the colon picks a
# named sub-currency; the bare name uses that plugin's default). A back-end whose plugin is absent simply does
# nothing. This is the fallback only — an individual menu action may still override it. Defaults to vault, the
# out-of-the-box server economy.
default-currency = "vault"
