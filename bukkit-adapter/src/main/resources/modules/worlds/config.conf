# Worlds: world lifecycle management (sub-project A).
# Keys are relative to the modules.worlds scope; WorldsSettings reads them directly.
enabled = true

# On enable, take every already-loaded server world (the vanilla world/world_nether/world_the_end)
# under management so it appears in /worlds list and is fully manageable.
auto-adopt-loaded = true

# On enable, load every registered world flagged auto_load that is not yet loaded.
auto-load-registered = true

# Refuse to unload or delete the server's primary world.
protect-default-world = true

# How long /worlds confirm accepts a /worlds delete before the delete must be asked for again, written as
# 30s, 5m or 1h30m. A confirm that comes later is refused and nothing is deleted. A value that is not a
# length of time, or 0, falls back to 30s.
delete-confirm-timeout = "30s"

# What a world made with /worlds create or the create menu gets where nobody chose otherwise. A value the
# command names (/worlds create games nether) wins over these; the create menu starts on these and its
# selectors change them. Imported and adopted worlds keep what their files say.
#   environment: NORMAL, NETHER or THE_END.
#   world-type: NORMAL, FLAT, AMPLIFIED or LARGE_BIOMES.
#   generate-structures: false makes worlds without villages, temples and other structures.
# An unknown value falls back to NORMAL, NORMAL and true.
defaults {
  environment = "NORMAL"
  world-type = "NORMAL"
  generate-structures = true
}

# The per-world settings a world made with /worlds create or the create menu starts with. They are saved
# with the world when it is made, so changing them later leaves existing worlds alone; /worlds set changes
# one world. Imported and adopted worlds start from the same values as a world with nothing set.
#   difficulty: PEACEFUL, EASY, NORMAL or HARD.
#   force-gamemode: NONE, SURVIVAL, CREATIVE, ADVENTURE or SPECTATOR. Anything but NONE puts every
#     player who joins or enters the world into that game mode, unless they hold
#     uxmessentials.world.gamemode.bypass.
#   spawn-animals: Paper 26.2 has no per-world switch for animals any more, so false is held by the
#     plugin cancelling natural animal spawns in that world.
# An unknown value falls back to true, NORMAL and NONE.
settings {
  defaults {
    pvp = true
    difficulty = "NORMAL"
    force-gamemode = "NONE"
    spawn-animals = true
    spawn-monsters = true
  }
}

# Built-in generators. /worlds create <name> ... void|flat uses these (also via generator: uxmEssentials:void|flat).
generators {
  void { biome = "plains" }
  flat {
    biome = "plains"
    # Bottom -> top, each "<blockId> <height>". Default = Classic Flat (bedrock, 3x dirt, grass).
    layers = ["minecraft:bedrock 1", "minecraft:dirt 3", "minecraft:grass_block 1"]
  }
}

# World access control. Per-world entry rules (permission/limit/fee) are set with /worlds set; this is the
# one global toggle: when a player logs into a world they may no longer enter, send them to the default
# world's spawn instead of leaving them stuck.
access {
  redirect-on-restricted-join = true
}

# World pre-generation. /worlds pregen <world> <radius> generates chunks in a square radius (clamped to
# max-radius), rate-limited to max-concurrent-chunks in-flight async chunk generations, the loop running
# every tick-period-ticks ticks.
pregen {
  max-radius = 200
  max-concurrent-chunks = 10
  tick-period-ticks = 1
}

# World backups. /worlds backup <world> zips the world folder under <data-folder>/<directory>/<world>/;
# the newest retention-count archives are kept (older pruned after a backup). /worlds restore replaces a
# world with an archive (players evacuated first).
backup {
  directory = "backups/worlds"
  retention-count = 10
}

# Idle world auto-unload (opt-in). When enabled, a world left empty of players for idle-minutes is
# unloaded to reclaim memory; the sweep runs every sweep-interval-seconds. The server's default world is
# always protected; list any others under excluded-worlds.
auto-unload {
  enabled = false
  idle-minutes = 30
  sweep-interval-seconds = 60
  excluded-worlds = []
}
