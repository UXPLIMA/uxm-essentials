# Worlds — world lifecycle management (sub-project A).
# Keys are relative to the modules.worlds scope; WorldsSettings reads them directly.
enabled = true

# On enable, take every already-loaded server world (the vanilla world/world_nether/world_the_end)
# under management so it appears in /worlds list and is fully manageable.
auto-adopt-loaded = true

# On enable, load every registered world flagged auto_load that is not yet loaded.
auto-load-registered = true

# Refuse to unload or delete the server's primary world.
protect-default-world = true

# How long a staged /worlds delete confirmation stays valid before it must be re-requested.
delete-confirm-timeout = "30s"

# Defaults applied to a newly created world when the operator omits the option.
defaults {
  environment = "NORMAL"
  world-type = "NORMAL"
  generate-structures = true
}

# Default per-world settings. New worlds start with these; operators change them with /worlds set.
# (Reading these into CreateWorld is deferred — the catalog defaults already match these values.)
settings {
  defaults {
    pvp = true
    difficulty = "NORMAL"
    force-gamemode = "NONE"
    spawn-animals = true
    spawn-monsters = true
  }
}

# Built-in generators. /worlds create <name> ... void|flat uses these (also via generator: uxmEssentials:void|flat).
generators {
  void { biome = "plains" }
  flat {
    biome = "plains"
    # Bottom -> top, each "<blockId> <height>". Default = Classic Flat (bedrock, 3x dirt, grass).
    layers = ["minecraft:bedrock 1", "minecraft:dirt 3", "minecraft:grass_block 1"]
  }
}

# World access control. Per-world entry rules (permission/limit/fee) are set with /worlds set; this is the
# one global toggle: when a player logs into a world they may no longer enter, send them to the default
# world's spawn instead of leaving them stuck.
access {
  redirect-on-restricted-join = true
}
