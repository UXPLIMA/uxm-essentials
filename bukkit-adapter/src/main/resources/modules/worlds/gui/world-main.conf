# The per-world editor hub, rendered through the menu engine. A three-row panel for one managed world reached from
# the world picker (a left click on a world icon) and the /world gui <world> command: a read-only summary of the
# world, buttons drilling into its rules, generation and access sub-screens, a load/unload toggle whose label and
# dye follow the world's live loaded state, and a back button to the engine world picker. Drilling into a sub-screen
# opens that screen's spec with the same world as the subject; the toggle runs the load/unload use case on the global
# region thread, then re-opens this hub so the new loaded state shows.
#
# The edited world is handed in as the menu subject (its name plus a summary snapshot read off the viewer's entity
# thread at open), so the title and the summary line fill from the world_main_* placeholders without the renderer
# touching a port off-thread. Every label resolves from the worlds editor catalog, so no user-facing text lives here.
# The geometry mirrors the original fixed three-row hub slot for slot: summary 4, rules 11, generation 13, access 15,
# back 18, toggle 22.
title = "@world.editor.main-title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop the old window drew. Lowest priority, so the buttons below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The read-only world summary: environment, type, loaded state, player count, and alias, all from the subject.
  summary {
    slot     = 4
    material = MAP
    name     = "@world.editor.main.summary-name"
    lore     = ["@world.editor.main.summary-lore"]
    priority = 10
  }

  # Drill into the world's game-rules property grid.
  rules {
    slot     = 11
    material = DIAMOND_SWORD
    name     = "@world.editor.nav.rules"
    priority = 10
    click { left = ["worlds:editor-rules"] }
  }

  # Drill into the world's read-only generation summary.
  generation {
    slot     = 13
    material = GRASS_BLOCK
    name     = "@world.editor.nav.generation"
    priority = 10
    click { left = ["worlds:editor-generation"] }
  }

  # Drill into the world's access-control property grid.
  access {
    slot     = 15
    material = IRON_DOOR
    name     = "@world.editor.nav.access"
    priority = 10
    click { left = ["worlds:editor-access"] }
  }

  # Back to the engine world picker.
  back {
    slot     = 18
    material = ARROW
    name     = "@world.editor.nav.back"
    priority = 10
    click { left = ["worlds:editor-main-back"] }
  }

  # Toggle the world's loaded state: LIME_DYE + "Unload" when loaded, GRAY_DYE + "Load" when not. The use case runs
  # on the global region thread, then this hub re-opens with the new state.
  toggle {
    slot     = 22
    material = "%world_main_toggle_material%"
    name     = "@%world_main_toggle_key%"
    priority = 10
    click { left = ["worlds:editor-toggle-load"] }
  }
}
