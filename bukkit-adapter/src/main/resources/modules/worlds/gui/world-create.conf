# The new-world configuration screen, rendered through the menu engine. A three-row panel carrying one button per
# field of an in-flight create draft: the name and seed are captured through the shared input seam (a click opens the
# configured anvil/chat prompt), while the environment, world type and generator are selectors a click cycles in
# place. The create button builds the draft's world name and spec and runs the create use case on the global region
# thread, then re-opens the world list so the new world appears. A back button returns to the list.
#
# The in-flight draft is handed in as the menu subject, so every current-value line fills from the world_create_*
# placeholders without the renderer touching a port; each cycle or input submission re-opens this screen with a fresh
# draft, so the screen holds no per-viewer mutable state. The spec mapping mirrors /worlds create exactly (defaults
# NORMAL/NORMAL, empty seed and generator), so a GUI-built world is identical to a command-built one. Every label
# resolves from the worlds editor catalog, so no user-facing text lives here. The geometry mirrors the original fixed
# three-row screen slot for slot: name 4, environment 10, type 12, generator 14, seed 16, back 18, create 22.
title = "@world.editor.create-title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop the old window drew. Lowest priority, so the buttons below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The world name, captured through the shared input seam; the lore shows the current value (or "(not set)").
  name {
    slot     = 4
    material = NAME_TAG
    name     = "@world.editor.create.name"
    lore     = ["@world.editor.create.name-lore"]
    priority = 10
    click { left = ["worlds:create-name"] }
  }

  # Cycle the world environment (left next, right previous).
  environment {
    slot     = 10
    material = GRASS_BLOCK
    name     = "@world.editor.create.environment"
    lore     = ["@world.editor.create.cycle-hint"]
    priority = 10
    click {
      left  = ["worlds:create-environment-next"]
      right = ["worlds:create-environment-prev"]
    }
  }

  # Cycle the world generation type (left next, right previous).
  type {
    slot     = 12
    material = MAP
    name     = "@world.editor.create.type"
    lore     = ["@world.editor.create.cycle-hint"]
    priority = 10
    click {
      left  = ["worlds:create-type-next"]
      right = ["worlds:create-type-prev"]
    }
  }

  # Cycle the built-in generator: vanilla, void, flat (left next, right previous).
  generator {
    slot     = 14
    material = COMMAND_BLOCK
    name     = "@world.editor.create.generator"
    lore     = ["@world.editor.create.cycle-hint"]
    priority = 10
    click {
      left  = ["worlds:create-generator-next"]
      right = ["worlds:create-generator-prev"]
    }
  }

  # The world seed, captured through the shared input seam; the lore shows the current value (or "(random)").
  seed {
    slot     = 16
    material = WHEAT_SEEDS
    name     = "@world.editor.create.seed"
    lore     = ["@world.editor.create.seed-lore"]
    priority = 10
    click { left = ["worlds:create-seed"] }
  }

  # Back to the engine world picker.
  back {
    slot     = 18
    material = ARROW
    name     = "@world.editor.nav.back"
    priority = 10
    click { left = ["worlds:create-back"] }
  }

  # Build the world with these settings on the global region thread, then re-open the world list.
  create {
    slot     = 22
    material = NETHER_STAR
    name     = "@world.editor.create.confirm"
    lore     = ["@world.editor.create.confirm-lore"]
    priority = 10
    click { left = ["worlds:create-confirm"] }
  }
}
