# The shared property grid that drives both the rules and access screens, rendered through the menu engine. A
# six-row panel with one button per settable world property: each button shows the property's label, a value-lore
# reporting the world's current encoded setting, and a cycle hint. Which property set a window shows is the subject's
# choice — the hub opens it with the rules set for the rules screen and the access set for the access screen — so one
# spec serves both, exactly the way one confirm spec serves every sanction. A click cycles the clicked property's
# value (left next, right previous, shift clears) through the cycle use case, which persists off-tick, then re-renders
# the grid so the new value shows. A back button returns to the per-world hub.
#
# The (world, property set) pair is handed in as the menu subject, so the title resolves through the subject-chosen
# world_grid_title_key placeholder and the property rows come from the worlds:grid list source the subject feeds.
# Every label resolves from the worlds editor catalog, so no user-facing text lives here. The geometry mirrors the
# original fixed grid: the property buttons paginate across the top five rows (slots 0-44), with the back button on
# the bottom row at slot 49.
title = "@%world_grid_title_key%"
rows = 6

items {
  # The grey-glass backdrop the old window drew. Lowest priority, so the property grid and the back button sit on it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The property grid, paginated across the top five rows (the bottom row is reserved for the back button). Each cell
  # shows the property's labelled button with its current value; a left click cycles it forward, a right click
  # backward, and a shift click clears it to the property default — each running the cycle use case and re-rendering.
  properties {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "worlds:grid"
      template {
        material = "%world_grid_material%"
        name     = "@%world_grid_label_key%"
        lore = [
          "@world.editor.property.value-lore"
          "@world.editor.property.cycle-hint"
        ]
        click {
          left        = ["worlds:grid-cycle-next"]
          right       = ["worlds:grid-cycle-prev"]
          shift_left  = ["worlds:grid-cycle-clear"]
          shift_right = ["worlds:grid-cycle-clear"]
        }
      }
    }
  }

  # Back to the per-world hub.
  back {
    slot     = 49
    material = BARRIER
    name     = "@world.editor.nav.back"
    priority = 10
    click { left = ["worlds:grid-back"] }
  }
}
