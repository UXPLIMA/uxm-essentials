# The read-only generation summary for one world, rendered through the menu engine. A three-row panel reporting the
# world's immutable spec, its environment, generation type, seed, and external generator (or "vanilla" when none),
# over a single back button to the per-world hub. None of the four info slots mutate anything; the spec is fixed at
# creation, so this screen only shows it.
#
# The edited world is handed in as the menu subject (its name plus a spec snapshot read off the viewer's entity thread
# at open), so each info line fills from the world_gen_* placeholders without the renderer touching a port off-thread.
# Each info item's name is the gen.* catalog line with its value bound, which is why there is no separate lore. Every
# label resolves from the worlds editor catalog, so no user-facing text lives here. The geometry mirrors the original
# fixed three-row screen slot for slot: environment 10, type 12, seed 14, generator 16, back 22.
title = "@world.editor.generation-title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop the old window drew. Lowest priority, so the info items below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The world's environment.
  environment {
    slot     = 10
    material = GRASS_BLOCK
    name     = "@world.editor.gen.environment"
    priority = 10
  }

  # The world's generation type.
  type {
    slot     = 12
    material = MAP
    name     = "@world.editor.gen.type"
    priority = 10
  }

  # The world's seed (or "(random)" when none was set).
  seed {
    slot     = 14
    material = WHEAT_SEEDS
    name     = "@world.editor.gen.seed"
    priority = 10
  }

  # The world's external generator (or "vanilla" when none).
  generator {
    slot     = 16
    material = COMMAND_BLOCK
    name     = "@world.editor.gen.generator"
    priority = 10
  }

  # Back to the per-world hub.
  back {
    slot     = 22
    material = ARROW
    name     = "@world.editor.nav.back"
    priority = 10
    click { left = ["worlds:editor-generation-back"] }
  }
}
