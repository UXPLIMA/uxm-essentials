# The /worlds editor world picker (opened by /worlds editor or /world gui, or the worlds entry on the /uxmess gui
# hub), rendered through the menu engine. One icon per managed world in the order the repository returns them, paged
# when there are more than fit, with a create button and the two nav arrows on the bottom row. The grid is the
# worlds:list source — each entry's icon material follows the world's environment (a grass block for a normal world,
# netherrack for the nether, end stone for the end) through the world_icon placeholder, and its name and lore resolve
# from the worlds editor message catalog, filled with that world's name, environment, and loaded state through the
# world_* placeholders. A left click opens that world's bespoke main editor hub through worlds:edit; a right click
# teleports the viewer to that world through worlds:teleport, the same forced hand-off /worlds tp <self> drives. The
# create button opens the bespoke new-world configuration screen through worlds:create. Every label resolves from the
# catalog, so no user-facing text lives here. The geometry mirrors the original fixed six-row picker: a grid across
# the top five rows and the create/nav buttons on the bottom row.
title = "@world.editor.list-title"
rows = 6

items {
  # The grey-glass backdrop. Lowest priority, so the content grid and the buttons drawn below sit on top of it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The world grid, paginated across the top five rows (the bottom row is reserved for the create and nav buttons).
  # Each cell shows the world's environment-block icon with its name and detail lore; a left click opens that world's
  # main editor hub through worlds:edit, a right click teleports the viewer there through worlds:teleport.
  worlds {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "worlds:list"
      template {
        material = "%world_icon%"
        name     = "@world.editor.list.entry-name"
        lore     = ["@world.editor.list.entry-lore"]
        click {
          left  = ["worlds:edit"]
          right = ["worlds:teleport"]
        }
      }
    }
  }

  # Create a new world: open the bespoke new-world configuration screen, exactly as the old create button did. Pinned
  # to the bottom row, between the page arrows.
  create {
    slot     = 49
    material = NETHER_STAR
    name     = "@world.editor.create.button-name"
    lore     = ["@world.editor.create.button-lore"]
    priority = 10
    click { left = ["worlds:create"] }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@world.editor.nav.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@world.editor.nav.next"
    priority = 10
  }
}
