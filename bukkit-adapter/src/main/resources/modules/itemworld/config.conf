# Item world — item utils, workstations, cleanup, powertool, mob/entity, time/weather, admin-fun.
enabled = true
give-cap = 2304                     # max items handed out by /give or /item at once
more-cap = 2304                     # max stack fill for /more (defaults to give-cap)
max-enchant-level = 32767           # ceiling for /enchant
spawnmob-cap = 64                   # max mobs per /spawnmob
purge-max-radius = 256              # max radius for /butcher, /killall, /remove
give-audit-threshold = 64           # audit-log /give above this amount

# /itemedit — the held-item editor (name, lore, enchant, flags, attributes, durability, model). Its own toggle,
# separate from the item-utils group.
item-edit {
  enabled = true
  allow-over-max-enchants = false   # let /itemedit enchant exceed an enchantment's vanilla max level
}

groups {
  item-utils.enabled = true
  workstations.enabled = true
  cleanup.enabled = true
  powertool.enabled = true
  mob-entity.enabled = true
  time-weather.enabled = true
  admin-fun.enabled = true
}

audit {
  give = true
  spawnmob = true
  spawner = true
  kill = true
  butcher = true
  killall = true
  remove = true
  lightning = true
  fireball = true
  kittycannon = true
  break = true
  tree = true
}
