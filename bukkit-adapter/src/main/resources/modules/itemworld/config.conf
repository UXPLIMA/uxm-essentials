# Item world: item utils, workstations, cleanup, powertool, mob/entity, time/weather, admin-fun.
enabled = true
give-cap = 2304                     # max items handed out by /give or /item at once
more-cap = 2304                     # max stack fill for /more (defaults to give-cap)
max-enchant-level = 32767           # ceiling for /enchant
spawnmob-cap = 64                   # max mobs per /spawnmob
purge-max-radius = 256              # max radius for /butcher, /killall, /remove
give-audit-threshold = 64           # audit-log /give above this amount

# /itemedit; the held-item editor (name, lore, enchant, flags, attributes, durability, model). Its own toggle,
# separate from the item-utils group.
item-edit {
  enabled = true
  allow-over-max-enchants = false   # let /itemedit enchant exceed an enchantment's vanilla max level
}

# Shulkers: right-click a shulker box in the inventory to open its contents in place, written back on close.
shulkers {
  enabled = true
  require-sneak = true              # on: sneak-right-click opens (plain right-click still places the box); off: any right-click opens
}

# Each group switches a family of commands on or off. A command in a group that is off answers that it is disabled.
groups {
  # /give, /item, /more, /repair, /enchant, /hat and the other item commands.
  item-utils.enabled = true
  # /anvil, /workbench, /enderchest and the other workstations opened anywhere.
  workstations.enabled = true
  # /disposal, /condense and /enderclear.
  cleanup.enabled = true
  # /powertool and /powertooltoggle.
  powertool.enabled = true
  # /spawnmob, /spawner, /kill, /butcher, /killall, /remove and /unlimited.
  mob-entity.enabled = true
  # /time, /weather and their /day, /night, /sun, /rain and /thunder shortcuts.
  time-weather.enabled = true
  # /lightning, /fireball, /kittycannon, /beezooka, /break, /tree and /nuke.
  admin-fun.enabled = true
}

# Which of the abusable commands write a line to the audit log. Turn one off to quiet a busy command; the others keep
# logging.
audit {
  give = true
  spawnmob = true
  spawner = true
  kill = true
  butcher = true
  killall = true
  remove = true
  lightning = true
  fireball = true
  kittycannon = true
  break = true
  tree = true
}
