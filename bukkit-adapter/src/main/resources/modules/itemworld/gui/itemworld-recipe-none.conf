# The /recipe empty-state title, rendered through the menu engine. A one-row window shown for an item with no
# crafting recipe: just the no-recipe title over a glass backdrop, the visual twin of the /recipe no-recipe reply.
# Every label resolves from the itemworld message catalog, so no user-facing text lives here. The geometry mirrors
# the original fixed empty-state sub-menu: a single row of glass filler.
title = "@itemworld.recipe.gui.none-title"
rows = 1
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop filling the single row.
  filler {
    slots    = ["0-8"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }
}
