# The /entitycount browse menu, rendered through the menu engine. A paginated grid of the nearby-entity tally, one
# icon per entity type sorted by count descending; the visual twin of the /entitycount chat read-out. Each icon is
# that type's spawn egg where one exists (a generic fallback otherwise), named with the type and lored with its
# count and the scan radius.
#
# The tally is read from the live world on the actor's region thread, so the command runs the scan and hands the
# already-sorted, already-resolved entries in as the menu subject; the itemworld:entity-tally list source only reads
# that subject, touching no Bukkit API. The entity_icon / entity_type / entity_count / entity_radius placeholders
# fill each cell from the bound entry. A click does nothing; the read-out has no per-type action. Every label
# resolves from the itemworld message catalog, so no user-facing text lives here. The geometry mirrors the original
# fixed six-row list: a grid across the top five rows and the two nav arrows on the bottom row.
title = "@itemworld.entitycount.gui.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop on the bottom row only; the content grid above leaves empty cells empty, exactly as the
  # original paginated list did (it filled only the non-content slots).
  filler {
    slots    = ["45-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The tally grid, paginated across the top five rows. Each cell shows its type's spawn-egg icon with the type name
  # and the count/radius lore. Read-only: no click action.
  tally {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "itemworld:entity-tally"
      template {
        material = "%entity_icon%"
        name     = "@itemworld.entitycount.gui.entry-name"
        lore     = ["@itemworld.entitycount.gui.entry-lore"]
      }
    }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@itemworld.entitycount.gui.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@itemworld.entitycount.gui.next"
    priority = 10
  }
}
