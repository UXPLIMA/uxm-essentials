# Layout of the itemworld utilities hub (opened by /itemworld gui, or /uxmess gui for an admin). It is a launcher:
# each named element below is one button, drawn at its slot with its material, and run when clicked — but only when
# the viewer holds the permission of the command it stands in for. Titles, labels and lore stay in the message
# catalog (messages_<lang>.conf); only the geometry and the materials live here, so editing this file never touches
# a translation.

# Menu height in rows (1..6). Three rows hold the workstation row, the world-action row, and a back button.
rows = 3

# Material the empty background cells are filled with.
filler-material = "BLACK_STAINED_GLASS_PANE"

# Per-button slots. The workstation keys match the workstation command literals; the rest are the world actions.
slots {
  workbench = 0
  anvil = 1
  cartography = 2
  grindstone = 3
  loom = 4
  smithingtable = 5
  stonecutter = 6
  enderchest = 7
  time-day = 10
  time-night = 11
  weather-clear = 12
  weather-rain = 13
  clear-drops = 15
  clear-mobs = 16
  back = 22
}

# Per-button icon materials.
materials {
  workbench = "CRAFTING_TABLE"
  anvil = "ANVIL"
  cartography = "CARTOGRAPHY_TABLE"
  grindstone = "GRINDSTONE"
  loom = "LOOM"
  smithingtable = "SMITHING_TABLE"
  stonecutter = "STONECUTTER"
  enderchest = "ENDER_CHEST"
  time-day = "SUNFLOWER"
  time-night = "CLOCK"
  weather-clear = "YELLOW_STAINED_GLASS"
  weather-rain = "WATER_BUCKET"
  clear-drops = "HOPPER"
  clear-mobs = "IRON_SWORD"
  back = "ARROW"
}
