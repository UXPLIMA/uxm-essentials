# The itemworld utilities hub (/itemworld gui, and the itemworld entry on the /uxmess gui hub), rendered through
# the menu engine. A launcher panel: eight buttons open a virtual workstation, two set the world time, two set the
# weather, and two run a cleanup sweep; each running the same surface its command does. Every button is drawn only
# when the viewer holds that command's permission (the engine's perm view-condition), so a button the viewer may
# not use is simply not drawn and the glass backdrop shows through, exactly as the old launcher hid it.
#
# Each button's click fires the itemworld feature action that replicates the original handler (open a station and
# reply, set time/weather on the global region, sweep drops/mobs with the same Folia threading + audit + event).
# The workstation labels resolve through per-station placeholders so the shared hub catalog key carries each
# station's name; every other label resolves straight from the itemworld catalog, so no user-facing text lives
# here. The geometry mirrors the original fixed three-row launcher.
title = "@itemworld.gui.hub.title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the buttons drawn below sit on top of it, and a hidden button's
  # slot falls back to it.
  filler {
    slots    = ["0-26"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The eight virtual workstations. Each is shown only when the viewer holds its workstation permission, and its
  # click opens that station's view and replies, exactly as the command does.
  workbench {
    slot     = 0
    material = CRAFTING_TABLE
    name     = "%iw_station_workbench%"
    lore     = ["@itemworld.gui.hub.value-lore"]
    priority = 10
    view     = ["perm:uxmessentials.workstation.workbench"]
    click { left = ["itemworld:open-workbench"] }
  }
  anvil {
    slot     = 1
    material = ANVIL
    name     = "%iw_station_anvil%"
    lore     = ["@itemworld.gui.hub.value-lore"]
    priority = 10
    view     = ["perm:uxmessentials.workstation.anvil"]
    click { left = ["itemworld:open-anvil"] }
  }
  cartography {
    slot     = 2
    material = CARTOGRAPHY_TABLE
    name     = "%iw_station_cartography%"
    lore     = ["@itemworld.gui.hub.value-lore"]
    priority = 10
    view     = ["perm:uxmessentials.workstation.cartography"]
    click { left = ["itemworld:open-cartography"] }
  }
  grindstone {
    slot     = 3
    material = GRINDSTONE
    name     = "%iw_station_grindstone%"
    lore     = ["@itemworld.gui.hub.value-lore"]
    priority = 10
    view     = ["perm:uxmessentials.workstation.grindstone"]
    click { left = ["itemworld:open-grindstone"] }
  }
  loom {
    slot     = 4
    material = LOOM
    name     = "%iw_station_loom%"
    lore     = ["@itemworld.gui.hub.value-lore"]
    priority = 10
    view     = ["perm:uxmessentials.workstation.loom"]
    click { left = ["itemworld:open-loom"] }
  }
  smithingtable {
    slot     = 5
    material = SMITHING_TABLE
    name     = "%iw_station_smithingtable%"
    lore     = ["@itemworld.gui.hub.value-lore"]
    priority = 10
    view     = ["perm:uxmessentials.workstation.smithingtable"]
    click { left = ["itemworld:open-smithingtable"] }
  }
  stonecutter {
    slot     = 6
    material = STONECUTTER
    name     = "%iw_station_stonecutter%"
    lore     = ["@itemworld.gui.hub.value-lore"]
    priority = 10
    view     = ["perm:uxmessentials.workstation.stonecutter"]
    click { left = ["itemworld:open-stonecutter"] }
  }
  enderchest {
    slot     = 7
    material = ENDER_CHEST
    name     = "%iw_station_enderchest%"
    lore     = ["@itemworld.gui.hub.value-lore"]
    priority = 10
    view     = ["perm:uxmessentials.workstation.enderchest"]
    click { left = ["itemworld:open-enderchest"] }
  }

  # The world-time actions, gated by the /time permission.
  time-day {
    slot     = 10
    material = SUNFLOWER
    name     = "@itemworld.gui.hub.time-day"
    lore     = ["@itemworld.gui.hub.value-lore"]
    priority = 10
    view     = ["perm:uxmessentials.time.use"]
    click { left = ["itemworld:time-day"] }
  }
  time-night {
    slot     = 11
    material = CLOCK
    name     = "@itemworld.gui.hub.time-night"
    lore     = ["@itemworld.gui.hub.value-lore"]
    priority = 10
    view     = ["perm:uxmessentials.time.use"]
    click { left = ["itemworld:time-night"] }
  }

  # The weather actions, gated by the /weather permission.
  weather-clear {
    slot     = 12
    material = YELLOW_STAINED_GLASS
    name     = "@itemworld.gui.hub.weather-clear"
    lore     = ["@itemworld.gui.hub.value-lore"]
    priority = 10
    view     = ["perm:uxmessentials.weather.use"]
    click { left = ["itemworld:weather-clear"] }
  }
  weather-rain {
    slot     = 13
    material = WATER_BUCKET
    name     = "@itemworld.gui.hub.weather-rain"
    lore     = ["@itemworld.gui.hub.value-lore"]
    priority = 10
    view     = ["perm:uxmessentials.weather.use"]
    click { left = ["itemworld:weather-rain"] }
  }

  # The cleanup sweeps, each gated by its command's permission.
  clear-drops {
    slot     = 15
    material = HOPPER
    name     = "@itemworld.gui.hub.clear-drops"
    lore     = ["@itemworld.gui.hub.value-lore"]
    priority = 10
    view     = ["perm:uxmessentials.killall.use"]
    click { left = ["itemworld:clear-drops"] }
  }
  clear-mobs {
    slot     = 16
    material = IRON_SWORD
    name     = "@itemworld.gui.hub.clear-mobs"
    lore     = ["@itemworld.gui.hub.value-lore"]
    priority = 10
    view     = ["perm:uxmessentials.butcher.use"]
    click { left = ["itemworld:clear-mobs"] }
  }

  # Back: close the panel. Always shown.
  back {
    slot     = 22
    material = ARROW
    name     = "@itemworld.gui.hub.back"
    priority = 10
    click { left = ["close"] }
  }
}
