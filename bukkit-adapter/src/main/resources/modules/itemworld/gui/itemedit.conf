# The click-driven /itemedit editor, rendered through the menu engine. A bare /itemedit opens this five-row panel on
# the operator's held item: the top-centre slot previews the live item (its real icon through the b64: provider, its
# own name and lore), and the middle row carries one control per edit the /itemedit subcommands expose. Every button
# runs the same shared edit path the matching subcommand does, so the two never drift; the panel re-opens after each
# change so the preview reflects it. No user-facing text lives here: every label resolves from the itemworld catalog,
# and the live item name and lore come from the itemedit_preview_* placeholders the view registers.
title = "@itemworld.gui.itemedit.title"
rows = 5
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the buttons below sit on top of it.
  filler {
    slots    = ["0-44"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The live preview: the held item itself. The icon is the item serialized through the b64: provider, and its name
  # and lore are the item's own, so a rename / re-lore / enchant / flag edit shows here once the panel re-opens. It
  # carries no click, so it is display-only.
  preview {
    slot     = 4
    material = "%itemedit_preview%"
    name     = "%itemedit_preview_name%"
    lore     = ["%itemedit_preview_lore%"]
    priority = 10
  }

  # Rename (left, through the input seam) or reset the name (right).
  rename {
    slot     = 19
    material = NAME_TAG
    name     = "@itemworld.gui.itemedit.rename.name"
    lore     = ["@itemworld.gui.itemedit.rename.hint"]
    priority = 10
    click {
      left  = ["itemedit:rename"]
      right = ["itemedit:reset-name"]
    }
  }

  # Add a lore line (left), remove a line by number (right), or clear all lore (shift-click).
  lore {
    slot     = 20
    material = WRITABLE_BOOK
    name     = "@itemworld.gui.itemedit.lore.name"
    lore     = ["@itemworld.gui.itemedit.lore.hint"]
    priority = 10
    click {
      left        = ["itemedit:lore-add"]
      right       = ["itemedit:lore-remove"]
      shift_left  = ["itemedit:lore-clear"]
      shift_right = ["itemedit:lore-clear"]
    }
  }

  # Add an enchantment through the enum picker then a level (left), or remove one from a picker of the present set (right).
  enchant {
    slot     = 21
    material = ENCHANTED_BOOK
    name     = "@itemworld.gui.itemedit.enchant.name"
    lore     = ["@itemworld.gui.itemedit.enchant.hint"]
    priority = 10
    click {
      left  = ["itemedit:enchant-add"]
      right = ["itemedit:enchant-remove"]
    }
  }

  # Open the item-flag toggle picker (one entry per hide-flag).
  flags {
    slot     = 22
    material = ITEM_FRAME
    name     = "@itemworld.gui.itemedit.flags.name"
    lore     = ["@itemworld.gui.itemedit.flags.hint"]
    priority = 10
    click { left = ["itemedit:flags"] }
  }

  # Toggle the unbreakable flag.
  unbreakable {
    slot     = 23
    material = ANVIL
    name     = "@itemworld.gui.itemedit.unbreakable.name"
    lore     = ["@itemworld.gui.itemedit.unbreakable.hint"]
    priority = 10
    click { left = ["itemedit:unbreakable"] }
  }

  # Set the custom model data (left, a number through the input seam) or clear it (right).
  model {
    slot     = 24
    material = PAINTING
    name     = "@itemworld.gui.itemedit.model.name"
    lore     = ["@itemworld.gui.itemedit.model.hint"]
    priority = 10
    click {
      left  = ["itemedit:model-set"]
      right = ["itemedit:model-clear"]
    }
  }

  # Set the durability damage (left, a number through the input seam) or repair to full (right).
  durability {
    slot     = 25
    material = GRINDSTONE
    name     = "@itemworld.gui.itemedit.durability.name"
    lore     = ["@itemworld.gui.itemedit.durability.hint"]
    priority = 10
    click {
      left  = ["itemedit:durability"]
      right = ["itemedit:repair"]
    }
  }

  # Close the editor.
  close {
    slot     = 40
    material = BARRIER
    name     = "@itemworld.gui.itemedit.close"
    priority = 10
    click { left = ["close"] }
  }
}
