# Layout of the /disposal (/trash) throwaway window. It is a plain storage window with no icons or
# navigation, so its only adjustable dimension is the height. The window title stays in the message
# catalog (messages_<lang>.conf).

# Window height in rows (1..6). Six rows give a full double-chest of throwaway space.
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]
