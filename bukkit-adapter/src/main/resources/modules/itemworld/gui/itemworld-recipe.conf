# The /recipe crafting-grid display, rendered through the menu engine. A fixed three-row window that lays a recipe
# out the way a crafting table shows it: a 3x3 grid of ingredient items in the upper-left, the result item in its
# own slot to the right (slot 15, the classic crafting-table result position), the rest glass filler. It is the
# visual twin of the /recipe text read-out; the same first shaped/shapeless recipe, drawn rather than printed.
#
# The menu opens with a RecipeDisplay subject carrying the nine ingredient cells and the result material, so every
# slot's material, name, and lore come from a placeholder that reads that subject. Each grid cell branches on
# whether it is empty: an empty cell shows the glass filler with the empty-slot label, a filled cell its ingredient
# with the ingredient lore. There are no clicks; the window is read-only. Every label resolves from the itemworld
# message catalog, so no user-facing text lives here. The geometry mirrors the original fixed grid view.
title = "@itemworld.recipe.gui.title"
rows = 3

items {
  # The grey-glass backdrop. Lowest priority, so the grid cells and the result drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The 3x3 ingredient grid, top-left of the window. Each cell reads its own subject cell through the per-slot
  # placeholders, so an empty cell renders as the filler with the empty-slot label and a filled cell as its
  # ingredient with the ingredient lore.
  cell0 {
    slot     = 0
    material = "%recipe_slot0_material%"
    name     = "%recipe_slot0_name%"
    lore     = ["%recipe_slot0_lore%"]
    priority = 5
  }
  cell1 {
    slot     = 1
    material = "%recipe_slot1_material%"
    name     = "%recipe_slot1_name%"
    lore     = ["%recipe_slot1_lore%"]
    priority = 5
  }
  cell2 {
    slot     = 2
    material = "%recipe_slot2_material%"
    name     = "%recipe_slot2_name%"
    lore     = ["%recipe_slot2_lore%"]
    priority = 5
  }
  cell3 {
    slot     = 9
    material = "%recipe_slot3_material%"
    name     = "%recipe_slot3_name%"
    lore     = ["%recipe_slot3_lore%"]
    priority = 5
  }
  cell4 {
    slot     = 10
    material = "%recipe_slot4_material%"
    name     = "%recipe_slot4_name%"
    lore     = ["%recipe_slot4_lore%"]
    priority = 5
  }
  cell5 {
    slot     = 11
    material = "%recipe_slot5_material%"
    name     = "%recipe_slot5_name%"
    lore     = ["%recipe_slot5_lore%"]
    priority = 5
  }
  cell6 {
    slot     = 18
    material = "%recipe_slot6_material%"
    name     = "%recipe_slot6_name%"
    lore     = ["%recipe_slot6_lore%"]
    priority = 5
  }
  cell7 {
    slot     = 19
    material = "%recipe_slot7_material%"
    name     = "%recipe_slot7_name%"
    lore     = ["%recipe_slot7_lore%"]
    priority = 5
  }
  cell8 {
    slot     = 20
    material = "%recipe_slot8_material%"
    name     = "%recipe_slot8_name%"
    lore     = ["%recipe_slot8_lore%"]
    priority = 5
  }

  # The result item in its own slot to the right of the grid (the classic crafting-table result position).
  result {
    slot     = 15
    material = "%recipe_result_material%"
    name     = "%recipe_result_name%"
    lore     = ["%recipe_result_lore%"]
    priority = 10
  }
}
