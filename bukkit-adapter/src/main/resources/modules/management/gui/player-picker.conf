# The shared target picker: a grid of the online players' heads plus a button that opens an anvil so a staff member
# can type an offline name. Moderation (/ban, /mute, the jail hub) and the /eco admin GUI all open this one menu, so
# an edit here changes every target picker at once.
#
# The heads are the picker:players list source, filtered to what the viewer may see. The window title, the extra
# bottom-row buttons and what a pick does are decided by the screen that opened the picker, so the title and the two
# footer buttons render from placeholders and the footers only appear when the caller supplied them.
#
# The geometry mirrors the original picker: heads over slots 0..44, prev at 45, next at 53, the offline-name button
# at 49, and the caller's footer buttons at 47 and 51.
title = "@%picker_title_key%"
rows = 6

items {
  # The grey-glass backdrop. Lowest priority, so the heads and the buttons draw on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # One head per online player the viewer can see. A left click hands that player to the screen that opened us.
  players {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "picker:players"
      template {
        material = "%picker_head_icon%"
        name     = "%picker_head_name%"
        lore     = ["%picker_head_lore%"]
        click { left = ["picker:pick"] }
      }
    }
  }

  # Previous page of heads.
  previous {
    slot     = 45
    type     = PREVIOUS
    material = ARROW
    name     = "@gui.player-picker.prev"
    priority = 10
  }

  # Next page of heads.
  next {
    slot     = 53
    type     = NEXT
    material = ARROW
    name     = "@gui.player-picker.next"
    priority = 10
  }

  # Type a name the grid does not show, so an offline player can be targeted.
  offline {
    slot     = 49
    material = NAME_TAG
    name     = "@gui.player-picker.custom"
    lore     = ["@gui.player-picker.custom-lore"]
    priority = 10
    click { left = ["picker:offline"] }
  }

  # The first caller-supplied bottom-row button, drawn only when the screen that opened the picker offers one.
  footer-one {
    slot     = 47
    material = "%picker_footer_one_icon%"
    name     = "%picker_footer_one_name%"
    lore     = ["%picker_footer_one_lore%"]
    priority = 10
    view     = ["picker:has-footer-one"]
    click { left = ["picker:footer-one"] }
  }

  # The second caller-supplied bottom-row button.
  footer-two {
    slot     = 51
    material = "%picker_footer_two_icon%"
    name     = "%picker_footer_two_name%"
    lore     = ["%picker_footer_two_lore%"]
    priority = 10
    view     = ["picker:has-footer-two"]
    click { left = ["picker:footer-two"] }
  }
}
