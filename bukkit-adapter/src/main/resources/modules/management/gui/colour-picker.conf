# Layout of the shared colour-picker sub-menu, opened from any colour property in a management GUI (the
# hologram editor's background-colour and glow-colour buttons are the first consumers). Titles, button names,
# and the per-colour swatch names stay in the message catalog (messages_<lang>.conf); only the geometry and the
# materials live here, so editing this file never touches a translation.

# Menu height in rows (1..6). Six rows hold the 16-colour palette with a navigation row at the bottom.
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The 16 standard Minecraft named colours are drawn into these slots, positionally. The palette order is the
# canonical dye order: white, orange, magenta, light-blue, yellow, lime, pink, gray, light-gray, cyan, purple,
# blue, brown, green, red, black.
palette-slots = [
  10, 11, 12, 13, 14, 15, 16,
  19, 20, 21, 22, 23, 24, 25,
  28, 29
]

# The material each palette slot is drawn with, positional with palette-slots. A stained-glass pane per colour
# keeps the swatch readable; an unknown name falls back to that colour's default pane.
palette-icons = [
  "WHITE_STAINED_GLASS_PANE", "ORANGE_STAINED_GLASS_PANE", "MAGENTA_STAINED_GLASS_PANE",
  "LIGHT_BLUE_STAINED_GLASS_PANE", "YELLOW_STAINED_GLASS_PANE", "LIME_STAINED_GLASS_PANE",
  "PINK_STAINED_GLASS_PANE", "GRAY_STAINED_GLASS_PANE", "LIGHT_GRAY_STAINED_GLASS_PANE",
  "CYAN_STAINED_GLASS_PANE", "PURPLE_STAINED_GLASS_PANE", "BLUE_STAINED_GLASS_PANE",
  "BROWN_STAINED_GLASS_PANE", "GREEN_STAINED_GLASS_PANE", "RED_STAINED_GLASS_PANE",
  "BLACK_STAINED_GLASS_PANE"
]

# The custom-hex button (opens an anvil to type a #RRGGBB / #AARRGGBB colour), the clear button (resets the
# property to its "no override" default), and the back button (returns to the editor without changing anything).
custom-slot = 40
custom-icon = "ANVIL"
clear-slot = 42
clear-icon = "BARRIER"
back-slot = 49
back-icon = "ARROW"

# The background filler material behind every empty slot.
filler = "BLACK_STAINED_GLASS_PANE"
