# Layout of the /uxmess gui management hub. Titles and lore stay in the message catalog
# (messages_<lang>.conf); only the geometry and the icons live here, so editing this file never touches a
# translation. Each enabled module contributes one clickable entry, paged when there are more than fit.

# Menu height in rows (1..6). Six rows give 45 content slots above the reserved navigation row.
rows = 6

# Icon a module's entry falls back to when it registers no icon of its own. Most modules supply one.
fallback-icon = "NETHER_STAR"

# Material of the previous/next page buttons.
nav-icon = "ARROW"

# Slots the previous- and next-page buttons sit in (bottom row of a six-row menu).
prev-slot = 48
next-slot = 50

# Slots the module entries fill. Leave empty to use every slot except the bottom navigation row.
content-slots = []

# Material the unused border cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"
