# The /invsee window: a private, managed copy of another player's inventory that staff edit and that is reconciled
# back onto the target when the window closes. The same file drives an online and an offline target, since both
# mirror the same thing.
#
# The chrome lives here: the window's height and whatever pads the slots that map to nothing on a player, while
# the item slots themselves are handed to the playerstate code through the content {} region below, because those
# slots hold real stacks and the rules that stop an item being duplicated belong with the feature.
#
# The region's slot order is what maps a window slot to a place on the target, so it is NOT free-form: index 0..35
# are the target's main inventory (hotbar 0..8 then storage 9..35, as the game orders it), 36..39 are armour
# (boots, leggings, chestplate, helmet) and 40 is the offhand. Move the region around the window if you like, but
# keep its 41 slots in that order or a helmet will come back as a boot.
title = "%invsee_title%"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

content {
  "playerstate:invsee" {
    slots    = ["0-40"]
    editable = true
  }
}

items {
  # Pads the tail of the last row, which maps to nothing a player carries.
  filler {
    slots    = ["41-53"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }
}
