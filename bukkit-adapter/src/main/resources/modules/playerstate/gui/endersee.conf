# The /endersee window: a private, managed copy of another player's ender chest that staff edit and that is
# reconciled back onto the target when the window closes. The same file drives an online and an offline target.
#
# An ender chest is a single flat container, so the whole window is the item region and there is no chrome to speak
# of. Give it more rows and the extra slots would map to nothing on the target, so the region stays 27 slots; what
# is yours to change here is the wording, the height, and where in the window those 27 slots sit.
title = "%endersee_title%"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

content {
  "playerstate:endersee" {
    slots    = ["0-26"]
    editable = true
  }
}
