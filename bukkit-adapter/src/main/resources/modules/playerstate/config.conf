# Player state — /heal /feed /fly /god /gamemode /rest and the info/toggle verbs.
enabled = true
heal-remove-effects = false         # /heal also clears active potion effects
rest-enabled = true                 # /rest resets phantom-spawn pressure

# Per-world command blocker: commands a player may not run while standing in a
# given world. "*" applies in every world. Players with the bypass node
# uxmessentials.world.command-bypass are never blocked. Empty = feature off.
world-command-blocks {
  # creative = ["tpa", "warp"]
  # "*"      = ["nuke"]
}

# Worlds where plugin-granted flight is not allowed. /fly refuses to enable
# flight here, and a player flying in via /fly has it stripped on arrival.
# Creative/spectator (gamemode) flight is left alone. Players with the bypass
# node uxmessentials.playerstate.fly.allworlds are exempt. Empty = feature off.
no-fly-worlds = []                  # e.g. ["pvp", "arena"]
