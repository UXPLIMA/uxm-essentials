# Layout of the ignore-list manager (opened by /ignore with no arguments). Titles and lore stay in the message
# catalog (messages_<lang>.conf); only the geometry and the icons live here, so editing this file never touches
# a translation. Each player the viewer ignores contributes one clickable head, paged when there are more than
# fit; clicking a head un-ignores that player through the existing /unignore use case.

# Menu height in rows (1..6). Six rows give 45 content slots above the reserved navigation row.
rows = 6

# Icon an entry falls back to in the list. The list renderer supplies a per-entry player head, so this is only
# used if that lookup ever degrades.
fallback-icon = "PLAYER_HEAD"

# Material of the previous/next page buttons.
nav-icon = "ARROW"

# Slots the previous- and next-page buttons sit in (bottom row of a six-row menu).
prev-slot = 48
next-slot = 50

# Slots the ignored-player heads fill. Leave empty to use every slot except the bottom navigation row.
content-slots = []

# Material the unused border cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"

# The create button opens an anvil prompt to ignore a new player by name. Its slot sits on the navigation row,
# between the page arrows; a create-slot of -1 would hide it.
create-slot = 49
create-icon = "LIME_DYE"
