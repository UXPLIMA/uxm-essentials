# Layout of the mailbox (opened by /mail with no arguments, or /uxmess gui for an admin). Titles and lore stay
# in the message catalog (messages_<lang>.conf); only the geometry and the icons live here, so editing this file
# never touches a translation. Each piece of mail contributes one clickable page, paged when there are more than
# fit; clicking a page opens its read-only detail view. Opening the mailbox marks every item read, mirroring
# /mail read.

# Menu height in rows (1..6). Six rows give 45 content slots above the reserved navigation row.
rows = 6

# Icon a mail item falls back to in the list. The list renderer supplies a per-state material (read vs unread),
# so this is only used if that lookup ever degrades.
fallback-icon = "PAPER"

# Material of the previous/next page buttons.
nav-icon = "ARROW"

# Slots the previous- and next-page buttons sit in (bottom row of a six-row menu).
prev-slot = 48
next-slot = 50

# Slots the mail pages fill. Leave empty to use every slot except the bottom navigation row.
content-slots = []

# Material the unused border cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"

# The mailbox reuses the list's create button as the confirm-gated "clear all" button: clicking it opens a
# yes/no confirmation and only empties the box on confirm (through the existing /mail clear use case). Its slot
# sits on the navigation row, between the page arrows; a create-slot of -1 would hide it.
create-slot = 49
create-icon = "LAVA_BUCKET"
