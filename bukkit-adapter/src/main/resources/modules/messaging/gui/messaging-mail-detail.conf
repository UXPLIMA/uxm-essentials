# The per-mail detail (opened by clicking a mail in the mailbox), rendered through the menu engine. A small fixed
# three-row window: the mail's icon centred with the full sender / time / message in its lore, and a back button
# below that reopens the mailbox. The menu opens with the clicked MailItem as its subject, so the mail_icon /
# mail_sender / mail_time / mail_message placeholders read that subject to render the right material and text. Every
# label resolves from the messaging message catalog, so no user-facing text lives here. The geometry mirrors the
# original fixed detail sub-menu: a glass backdrop, the icon at slot 13, and the back button at slot 22.
title = "@messaging.gui.mail.detail-title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the icon and the back button drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The mail itself: its read/unread icon centred, with the full sender, time, and message body in the lore.
  icon {
    slot     = 13
    material = "%mail_icon%"
    name     = "@messaging.gui.mail.detail-name"
    lore     = ["@messaging.gui.mail.detail-lore"]
    priority = 10
  }

  # Back to the mailbox list.
  back {
    slot     = 22
    material = ARROW
    name     = "@messaging.gui.mail.detail-back"
    priority = 10
    click { left = ["messaging:mail-back"] }
  }
}
