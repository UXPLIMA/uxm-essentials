# The mailbox (opened by /mail with no arguments, or the mailbox entry on the /uxmess gui hub), rendered through
# the menu engine. One icon per piece of mail newest-first (a WRITTEN_BOOK for unread, a PAPER for read), paged
# when there are more than fit, with a confirm-gated clear-all button and the two nav arrows on the bottom row.
# The grid is the messaging:mail list source; the mail_icon placeholder picks the read/unread material and the
# mail_sender / mail_time / mail_snippet placeholders fill each entry's name and lore. A left click opens that
# mail's read-only detail; the clear button empties the box behind a yes/no confirm through the same ClearMail use
# case /mail clear drives. Every label resolves from the messaging message catalog, so no user-facing text lives
# here. Opening the box marks every item read (the engine resolves the list off-thread, marking it in the same hop),
# mirroring /mail read. The geometry mirrors the original fixed six-row mailbox: a grid across the top five rows and
# the clear/nav buttons on the bottom row.
title = "@messaging.gui.mail.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the content grid and the buttons drawn below sit on top of it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The mail grid, paginated across the top five rows (the bottom row is reserved for navigation). Each cell shows
  # its read/unread icon with the sender and a body snippet; a left click opens that mail's detail through
  # messaging:read-mail.
  mail {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "messaging:mail"
      template {
        material = "%mail_icon%"
        name     = "@messaging.gui.mail.entry-name"
        lore     = ["@messaging.gui.mail.entry-lore"]
        click { left = ["messaging:read-mail"] }
      }
    }
  }

  # Clear every piece of mail behind a yes/no confirm, exactly as the old create button did. Pinned to the bottom
  # row, between the page arrows.
  clear {
    slot     = 49
    material = LAVA_BUCKET
    name     = "@messaging.gui.mail.clear"
    priority = 10
    click { left = ["messaging:clear-mail"] }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@messaging.gui.mail.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@messaging.gui.mail.next"
    priority = 10
  }
}
