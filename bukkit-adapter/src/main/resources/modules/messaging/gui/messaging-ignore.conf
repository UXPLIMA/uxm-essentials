# The ignore-list manager (opened by /ignore with no arguments), rendered through the menu engine. One PLAYER_HEAD
# per player the viewer ignores, paged when there are more than fit, with an add button and the two nav arrows on
# the bottom row. The grid is the messaging:ignores list source; the ignore_target placeholder fills the entry
# name and lore from each bound ignore entry. A left click on a head un-ignores that player through the same
# Unignore use case /unignore drives; the add button prompts for a name in chat and ignores them. Every label
# resolves from the messaging message catalog, so no user-facing text lives here. The geometry mirrors the original
# fixed six-row manager: a grid across the top five rows and the add/nav buttons on the bottom row.
title = "@messaging.gui.ignore.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the content grid and the buttons drawn below sit on top of it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The ignored-player grid, paginated across the top five rows (the bottom row is reserved for navigation). Each
  # cell shows a PLAYER_HEAD with the ignored player's name; a left click un-ignores that player through
  # messaging:unignore.
  ignores {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "messaging:ignores"
      template {
        material = PLAYER_HEAD
        name     = "@messaging.gui.ignore.entry-name"
        lore     = ["@messaging.gui.ignore.entry-lore"]
        click { left = ["messaging:unignore"] }
      }
    }
  }

  # Ignore a new player by name: prompt for a name in chat (the shared text-input seam), exactly as the old
  # create button did. Pinned to the bottom row, between the page arrows.
  add {
    slot     = 49
    material = LIME_DYE
    name     = "@messaging.gui.ignore.add"
    priority = 10
    click { left = ["messaging:ignore-add"] }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@messaging.gui.ignore.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@messaging.gui.ignore.next"
    priority = 10
  }
}
