# Kits — /kit /kits. (Per-kit definitions live one file per kit under kits/.)
enabled = true
list-display = "gui"               # how bare /kits presents the list: "gui" opens the browse menu, "chat" prints the chat list
showkit-display = "gui"            # how /showkit previews a kit: "gui" opens a read-only preview, "chat" prints the contents
