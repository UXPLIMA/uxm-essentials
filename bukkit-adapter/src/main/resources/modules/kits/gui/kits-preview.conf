# Layout of the /showkit <kit> preview GUI.
# Titles and lore stay in the message catalog (messages_<lang>.conf);
# only the geometry and the icons live here.

# Menu height in rows (1..6). Capped at 6.
# The GUI will be at least this tall, expanding if a kit has more items than fit.
rows = 6

# Material of the background filler panes.
fallback-icon = "GRAY_STAINED_GLASS_PANE"
