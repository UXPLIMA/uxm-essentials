# The kit category manager, opened from the admin kit manager to author the category tree. It lists every configured
# category, a button that creates a new one after prompting for its id, and a back button to the kit manager.
#
# The grid is the kits:category-manager list source, and each category's icon, name and lore come from the category
# definition itself through the kit_manager_category_* placeholders. The lore placeholder expands to the category's
# own lore lines, then its id, slot and parent, then the edit hint. Fixed labels resolve from the kits message catalog.
#
# The geometry mirrors the original manager: the grid over slots 0..44, page arrows at 45/46, create at 49, back at 53.
title = "@kit.editor.category.manager-title"
rows = 6

items {
  # The grey-glass backdrop. Lowest priority, so the grid and the buttons draw on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # One icon per configured category. A left click opens that category's settings panel.
  categories {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "kits:category-manager"
      template {
        material = "%kit_manager_category_icon%"
        name     = "%kit_manager_category_name%"
        lore     = ["%kit_manager_category_lore%"]
        click { left = ["kits:category-manager-open"] }
      }
    }
  }

  # Previous page of categories.
  previous {
    slot     = 45
    type     = PREVIOUS
    material = ARROW
    name     = "@kit.menu.prev"
    priority = 10
  }

  # Next page of categories.
  next {
    slot     = 46
    type     = NEXT
    material = ARROW
    name     = "@kit.menu.next"
    priority = 10
  }

  # Create a category: prompts for an id, saves it empty, then opens its settings.
  create {
    slot     = 49
    material = EMERALD_BLOCK
    name     = "@kit.editor.category.create-button.name"
    lore     = ["@kit.editor.category.create-button.lore"]
    priority = 10
    click { left = ["kits:category-manager-create"] }
  }

  # Back to the admin kit manager.
  back {
    slot     = 53
    material = ARROW
    name     = "@kit.editor.settings.back-button"
    priority = 10
    click { left = ["kits:category-manager-back"] }
  }
}
