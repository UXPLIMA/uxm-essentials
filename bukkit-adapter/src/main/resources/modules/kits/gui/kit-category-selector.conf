# The kit to category selector, opened from a kit's settings to file that kit under one of the configured categories.
# It lists every category, plus a button that clears the kit's category and a back button to the kit's settings.
#
# The grid is the kits:category-selector list source, and each category's icon, name and lore come from the category
# definition itself through the kit_category_* placeholders. The lore placeholder expands to the category's own lore
# lines, then its id, then the click hint. Fixed labels resolve from the kits message catalog.
#
# The geometry mirrors the original selector: the grid over slots 0..44, page arrows at 45/46, clear at 49, back at 53.
title = "@kit.editor.category.selector.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the grid and the buttons draw on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # One icon per configured category. A left click files the kit under it and reopens the kit's settings.
  categories {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "kits:category-selector"
      template {
        material = "%kit_category_icon%"
        name     = "%kit_category_name%"
        lore     = ["%kit_category_lore%"]
        click { left = ["kits:category-assign"] }
      }
    }
  }

  # Previous page of categories.
  previous {
    slot     = 45
    type     = PREVIOUS
    material = ARROW
    name     = "@kit.menu.prev"
    priority = 10
  }

  # Next page of categories.
  next {
    slot     = 46
    type     = NEXT
    material = ARROW
    name     = "@kit.menu.next"
    priority = 10
  }

  # Clear the kit's category, so it shows up uncategorised.
  none {
    slot     = 49
    material = BARRIER
    name     = "@kit.editor.category.selector.none.name"
    lore     = ["@kit.editor.category.selector.none.lore"]
    priority = 10
    click { left = ["kits:category-clear"] }
  }

  # Back to the kit's settings, changing nothing.
  back {
    slot     = 53
    material = ARROW
    name     = "@kit.editor.settings.back-button"
    priority = 10
    click { left = ["kits:category-back"] }
  }
}
