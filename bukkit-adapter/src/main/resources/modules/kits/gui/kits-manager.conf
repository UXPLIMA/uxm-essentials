# Layout of the main /kiteditor GUI displaying all kits.
# Titles and lore stay in the message catalog (messages_<lang>.conf);
# only the geometry and the icons live here.

# Menu height in rows (1..6).
rows = 6

# Material of the background filler panes.
fallback-icon = "GRAY_STAINED_GLASS_PANE"

# Material of the buttons (unused here as custom types like EMERALD_BLOCK and BARRIER are used).
nav-icon = "ARROW"

# Slot the "Create New Kit" button sits in.
prev-slot = 49

# Slot the "Close" button sits in.
next-slot = 53

# Slots where kit icons are displayed. Leave empty to use slots 0 to 44.
content-slots = []
