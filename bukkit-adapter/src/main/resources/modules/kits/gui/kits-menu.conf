# Layout of the /kits browse menu. Titles and lore stay in the message catalog (messages_<lang>.conf);
# only the geometry and the icons live here, so editing this file never touches a translation.

# Menu height in rows (1..6). Six rows give 45 content slots above the reserved nav row.
rows = 6

# Icon for a kit with no items to show — every other kit uses its first item's material.
fallback-icon = "CHEST"

# Material of the previous/next page buttons.
nav-icon = "ARROW"

# Slots the previous- and next-page buttons sit in (bottom row of a six-row menu).
prev-slot = 48
next-slot = 50

# Slots the kit icons fill. Leave empty to use every slot except the bottom row.
content-slots = []
