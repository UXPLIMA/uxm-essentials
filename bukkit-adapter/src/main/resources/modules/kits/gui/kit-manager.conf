# The admin kit manager list (opened by /kit editor with no kit name, or the kits-admin entry point), rendered
# through the menu engine. One icon per stored kit as the repository returns them, paged when there are more than
# fit, with a create button, a manage-categories button, and the two nav arrows on the bottom row.
# The grid is the kits:manager list source; each kit's name, material, and the fixed eight-line settings summary
# (cooldown, cost, permission, one-time, first-join, auto-equip, a spacer, then the edit hint) resolve from the kits
# message catalog, filled with that kit's facts through the kit_manager_* placeholders. A left click opens that kit's
# bespoke settings editor through kits:manager-edit; the create button prompts for a name and opens the new kit's
# settings through kits:manager-create, the same flow the old manager's create button drove; the categories button
# opens the bespoke category manager through kits:manager-categories. Every label
# resolves from the catalog, so no user-facing text lives here. The geometry mirrors the original fixed six-row
# manager: a grid across the top five rows, then create, categories and the nav arrows on the bottom row.
title = "@kit.editor.manager-title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop the old manager drew, so an empty manager still reads as a deliberate window rather than
  # a void. Lowest priority, so the content grid and the bottom-row buttons sit on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    decor    = { hide-tooltip = true }
    priority = 0
  }

  # The kit grid, paginated across the top five rows (the bottom row is reserved for the buttons below). Each cell
  # shows the kit's icon material and its name with the fixed settings-summary lore; a left click opens that kit's
  # settings editor through kits:manager-edit.
  kits {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "kits:manager"
      template {
        material = "%kit_manager_icon%"
        name     = "%kit_manager_name%"
        lore = ["@kit.editor.kit-lore.lore"]
        click { left = ["kits:manager-edit"] }
      }
    }
  }

  # Create a new kit: prompt for a name, create an empty kit, then open its settings; exactly as the old create
  # button did. Pinned to the left corner of the bottom row.
  create {
    slot     = 45
    material = EMERALD_BLOCK
    name     = "@kit.editor.create-button.name"
    lore     = ["@kit.editor.create-button.lore"]
    priority = 10
    click { left = ["kits:manager-create"] }
  }

  # Manage categories: open the bespoke category manager, exactly as the old manager's slot-51 button did.
  categories {
    slot     = 51
    material = BOOK
    name     = "@kit.editor.category.manager-title"
    lore     = ["@kit.editor.manage-categories.lore"]
    priority = 10
    click { left = ["kits:manager-categories"] }
  }

  # Previous page, directly left of the centre of the bottom row.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@kit.menu.prev"
    priority = 10
  }

  # Next page, directly right of the centre of the bottom row.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@kit.menu.next"
    priority = 10
  }
}
