# The read-only /kit browse menu (opened by /kit list and the management hub's kits entry), rendered through the
# menu engine. One tile per kit the viewer may claim across the top five rows, paged with the previous/next arrows
# on the bottom row. When categories are defined the tiles mix drill-in category tiles with the kits at the current
# tree level; a left click on a category drills into it, a left click on a kit claims it through the same ClaimKit
# use case the /kit command drives, a right click previews the kit, and the back button steps up to the parent
# level. With no categories the legacy flat grid is the root level with no sub-categories, so one spec serves both
# modes. The grid is the kits:browse list source — each tile's icon material, its name, and its full lore resolve
# from the kits message catalog through the kit_browse_* placeholders, the lore as a single multi-line placeholder
# the engine expands into one line per catalog line. Every label resolves from the catalog, so no user-facing text
# lives here. The geometry mirrors the original KitMenuView: a grid across the top five rows, then the back button
# and the two page arrows on the bottom row, and the back button shows only below the root level. A configured
# category pins to its own content slot on every page (the kit_browse row carries its pinned slot), exactly as the
# old view fixed a category to cat.slot() when that slot fell inside the content grid.
title = "@kit.menu.title"
rows = 6

items {
  # The grid of kit and category tiles, paginated across the top five rows (the bottom row is reserved for the back
  # and nav buttons). Each cell shows its tile's icon material, name, and multi-line lore; a left click claims a kit
  # or drills a category through kits:browse-click, a right click previews the kit through the same action.
  browse {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "kits:browse"
      template {
        material = "%kit_browse_icon%"
        name     = "%kit_browse_name%"
        lore     = ["%kit_browse_lore%"]
        click {
          left  = ["kits:browse-click"]
          right = ["kits:browse-click"]
        }
      }
    }
  }

  # Step up to the parent level, exactly as the old view's back button did. Pinned to the bottom row between the page
  # arrows (slot 49), and shown only when a category is open, so the root level draws no back button.
  back {
    slot     = 49
    material = ARROW
    name     = "@kit.menu.back"
    priority = 10
    view     = ["kits:browse-has-parent"]
    click { left = ["kits:browse-back"] }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@kit.menu.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@kit.menu.next"
    priority = 10
  }
}
