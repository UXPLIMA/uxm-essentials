# Layout of the kit customization GUI (/kit editor <kit>).
# Titles and lore stay in the message catalog (messages_<lang>.conf);
# only the geometry and the icons live here.

# Menu height in rows (1..6).
rows = 3

# Material of the background filler panes.
fallback-icon = "GRAY_STAINED_GLASS_PANE"

# Slot the "Back" button sits in.
prev-slot = 26

# Slot the delete button (unused directly, slot 22 is defined in content-slots).
next-slot = 22

# Slots where the settings buttons are placed in order:
# 0: Edit Items (CHEST)
# 1: Toggle Permission (PAPER/BARRIER)
# 2: Toggle One-Time (CLOCK)
# 3: Edit Cooldown (COMPARATOR)
# 4: Edit Cost (GOLD_INGOT)
# 5: Set Display Name (NAME_TAG)
# 6: Set Display Material (GOLDEN_CHESTPLATE)
# 7: Edit Display Lore (BOOK)
# 8: Edit Commands (COMMAND_BLOCK)
# 9: Delete Kit (REDSTONE_BLOCK)
# 10: First Join Auto-Grant (FEATHER)
# 11: Auto-Equip (ARMOR_STAND)
# 12: Set Category (BOOKSHELF)
content-slots = [0, 2, 4, 6, 8, 10, 12, 14, 16, 22, 18, 20, 24]
