# The per-kit settings panel, rendered through the menu engine. A three-row property panel for one kit reached
# from the kit manager (a left click on a kit icon) or the /kit create flow: an edit-items button into the bespoke
# item grid, toggle buttons for the permission requirement, one-time claim, first-join grant and auto-equip flags,
# input-seam buttons for the cooldown, cost, display name, display lore and commands, a hand-copy display-material
# button, a category button into the engine category selector, a delete button, and a back button to the manager.
# The cooldown / cost / display-name / display-lore / commands buttons capture a value through the shared input
# seam; the display-material button copies the item in the operator's main hand; the category button opens the
# engine kit category selector. Each mutation saves the edited kit and re-opens this panel with the new subject,
# so the operator sees the result.
#
# The edited kit is handed in as the menu subject, so the title and every current-value line fill from the
# kit_set_* placeholders without the renderer touching a port. Every label resolves from the kits catalog, so no
# user-facing text lives here. The geometry mirrors the original fixed three-row screen exactly: edit-items 0,
# permission 2, one-time 4, cooldown 6, cost 8, display-name 10, display-material 12, display-lore 14, commands 16,
# first-join 18, auto-equip 20, delete 22, category 24, back 26.
title = "@kit.editor.settings.title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop the old window drew. Lowest priority, so the buttons below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # Open the bespoke item-editor grid for this kit's stacks.
  edit_items {
    slot     = 0
    material = CHEST
    name     = "@kit.editor.settings.edit-items.name"
    lore     = ["@kit.editor.settings.edit-items.lore"]
    priority = 10
    click { left = ["kits:settings-edit-items"] }
  }

  # Toggle whether the kit requires a permission node. The icon shows PAPER when required, BARRIER when not, exactly
  # as the old window drew it.
  permission {
    slot     = 2
    material = "%kit_set_perm_material%"
    name     = "@kit.editor.settings.permission.name"
    lore = ["@kit.editor.settings.permission.lore"]
    priority = 10
    click { left = ["kits:settings-permission"] }
  }

  # Toggle whether the kit may be claimed only once per player.
  onetime {
    slot     = 4
    material = CLOCK
    name     = "@kit.editor.settings.onetime.name"
    lore = ["@kit.editor.settings.onetime.lore"]
    priority = 10
    click { left = ["kits:settings-onetime"] }
  }

  # Edit the kit's cooldown in seconds: capture a number through the input seam, then save and re-open.
  cooldown {
    slot     = 6
    material = COMPARATOR
    name     = "@kit.editor.settings.cooldown.name"
    lore = ["@kit.editor.settings.cooldown.lore"]
    priority = 10
    click { left = ["kits:settings-cooldown"] }
  }

  # Edit the kit's claim cost: capture an amount (or 'free') through the input seam, then save and re-open.
  cost {
    slot     = 8
    material = GOLD_INGOT
    name     = "@kit.editor.settings.cost.name"
    lore = ["@kit.editor.settings.cost.lore"]
    priority = 10
    click { left = ["kits:settings-cost"] }
  }

  # Set the kit's menu display name: capture a line through the input seam, then save and re-open.
  display_name {
    slot     = 10
    material = NAME_TAG
    name     = "@kit.editor.settings.display-name.name"
    lore = ["@kit.editor.settings.display-name.lore"]
    priority = 10
    click { left = ["kits:settings-display-name"] }
  }

  # Set the kit's menu display material to the item in the operator's main hand. The button itself shows the kit's
  # live display icon so an operator sees what the browse menu shows.
  display_material {
    slot     = 12
    material = "%kit_set_display_material_icon%"
    name     = "@kit.editor.settings.display-material.name"
    lore = ["@kit.editor.settings.display-material.lore"]
    priority = 10
    click { left = ["kits:settings-display-material"] }
  }

  # Edit the kit's menu display lore: capture pipe-separated lines through the input seam, then save and re-open.
  display_lore {
    slot     = 14
    material = BOOK
    name     = "@kit.editor.settings.display-lore.name"
    lore = ["@kit.editor.settings.display-lore.lore"]
    priority = 10
    click { left = ["kits:settings-display-lore"] }
  }

  # Edit the kit's on-claim commands: capture pipe-separated commands through the input seam, then save and re-open.
  commands {
    slot     = 16
    material = COMMAND_BLOCK
    name     = "@kit.editor.settings.commands.name"
    lore = ["@kit.editor.settings.commands.lore"]
    priority = 10
    click { left = ["kits:settings-commands"] }
  }

  # Toggle whether the kit is auto-granted on a player's first join.
  firstjoin {
    slot     = 18
    material = FEATHER
    name     = "@kit.editor.settings.firstjoin.name"
    lore = ["@kit.editor.settings.firstjoin.lore"]
    priority = 10
    click { left = ["kits:settings-firstjoin"] }
  }

  # Toggle whether the kit auto-equips its armour and offhand on claim.
  autoequip {
    slot     = 20
    material = ARMOR_STAND
    name     = "@kit.editor.settings.autoequip.name"
    lore = ["@kit.editor.settings.autoequip.lore"]
    priority = 10
    click { left = ["kits:settings-autoequip"] }
  }

  # Delete the kit through the DelKit use case, then return to the manager.
  delete {
    slot     = 22
    material = REDSTONE_BLOCK
    name     = "@kit.editor.settings.delete.name"
    lore = ["@kit.editor.settings.delete.lore"]
    priority = 10
    click { left = ["kits:settings-delete"] }
  }

  # Set the kit's category: open the engine kit category selector, then save the pick and re-open this panel.
  category {
    slot     = 24
    material = BOOKSHELF
    name     = "@kit.editor.settings.category.name"
    lore = ["@kit.editor.settings.category.lore"]
    priority = 10
    click { left = ["kits:settings-category"] }
  }

  # Back to the kit manager.
  back {
    slot     = 26
    material = ARROW
    name     = "@kit.editor.settings.back-button"
    priority = 10
    click { left = ["kits:settings-back"] }
  }
}
