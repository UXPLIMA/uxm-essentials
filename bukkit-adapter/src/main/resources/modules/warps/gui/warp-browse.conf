# The read-only /warp browse menu (opened by bare /warp, /warp list, and the worlds/management hub's warps entry),
# rendered through the menu engine. One tile per warp the viewer may use across the top five rows, paged with the
# previous/next arrows on the bottom row. When categories are defined the tiles mix drill-in category tiles (sorted
# by their slot) with the warps at the current tree level; a left click on a category drills into it, a left click
# on a warp warps the viewer there through the same UseWarp use case the /warp command drives, and the back button
# steps up to the parent level. With no categories the legacy flat list is the root level with no sub-categories,
# so one spec serves both modes. The grid is the warps:browse list source; each tile's icon material, its name, and
# its full lore resolve from the warps message catalog through the warp_browse_* placeholders, the lore as a single
# multi-line placeholder the engine expands into one line per catalog line. Every label resolves from the catalog,
# so no user-facing text lives here. The geometry mirrors the original: a grid across the top five rows, then the
# back button and the two page arrows on the bottom row, and the back button shows only below the root level.
title = "@warp.menu.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grid of warp and category tiles, paginated across the top five rows (the bottom row is reserved for the back
  # and nav buttons). Each cell shows its tile's icon material, name, and multi-line lore; a left click drills a
  # category or warps to a warp through warps:browse-click.
  browse {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "warps:browse"
      template {
        material = "%warp_browse_icon%"
        name     = "%warp_browse_name%"
        lore     = ["%warp_browse_lore%"]
        click { left = ["warps:browse-click"] }
      }
    }
  }

  # Step up to the parent level, exactly as the old view's back button did. Pinned to the bottom row between the page
  # arrows (slot 49), and shown only when a category is open, so the root level draws no back button.
  back {
    slot     = 49
    material = ARROW
    name     = "@warp.menu.back"
    priority = 10
    view     = ["warps:browse-has-parent"]
    click { left = ["warps:browse-back"] }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@warp.menu.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@warp.menu.next"
    priority = 10
  }
}
