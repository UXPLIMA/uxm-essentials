# Layout of the /warp edit particle-selector menu. Titles, button labels, and lore stay in the message catalog
# (messages_<lang>.conf); only the geometry and the icons live here, so editing this file never touches a
# translation.

# Menu height in rows (1..6). Three rows give the option grid plus the custom/back/remove buttons.
rows = 3

# Background filler for any slot a button does not occupy.
filler-material = "GRAY_STAINED_GLASS_PANE"

# Slot of each element. option-limit caps how many particle options fill the top of the grid (slots 0..limit-1).
slots {
  option-limit = 18
  custom = 18
  back = 22
  remove = 26
}

# Icon material of each button.
materials {
  custom = "ANVIL"
  back = "BARRIER"
  remove = "LAVA_BUCKET"
}
