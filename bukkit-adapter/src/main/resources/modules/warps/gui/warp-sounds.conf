# The /warp editor sound selector, rendered through the menu engine. One spec serves both the departure and the
# arrival sound: the editor opens it with a WarpSoundEdit subject carrying the warp and which side is being set, and
# the warp:set-sound action reads that subject to decide where to write. The geometry mirrors the original fixed
# three-row selector: a grid of preset sounds, a custom-name button, a back button, and a remove button. Every
# label resolves from the warps message catalog, so no user-facing text lives here.
#
# The v1 engine resolves a window title once from this static key, so a subject-driven departure-vs-arrival title
# is not expressible here; the shared catalog title is used for both sides. Everything inside the window (the
# option grid, the buttons, and the set/remove/custom/back behaviour) is faithful to the original selector.
title = "@warp.editor.sound-selector.title.departure"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the list cells and the three buttons drawn below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The preset sounds, paginated across the top two rows. Each cell shows the option's own material and its display
  # name; the engine fills the {sound} catalog argument from the per-entry `sound` placeholder. A left click sets the
  # warp's sound to that option through warp:set-sound.
  options {
    slots    = ["0-17"]
    priority = 5
    list {
      source = "warp:sound-options"
      template {
        material = "%sound_material%"
        name     = "@warp.editor.sound-selector.entry.name"
        lore     = ["@warp.editor.sound-selector.entry.lore"]
        click { left = ["warp:set-sound"] }
      }
    }
  }

  # Type a custom sound name in chat (the shared text-input seam), exactly as the old custom button did.
  custom {
    slot     = 18
    material = ANVIL
    name     = "@warp.editor.sound-selector.custom.name"
    lore     = ["@warp.editor.sound-selector.custom.lore"]
    priority = 10
    click { left = ["warp:custom-sound"] }
  }

  # Back to the warp editor.
  back {
    slot     = 22
    material = ARROW
    name     = "@warp.editor.selector.back"
    priority = 10
    click { left = ["warp:edit-back"] }
  }

  # Clear the warp's sound on this side.
  remove {
    slot     = 26
    material = LAVA_BUCKET
    name     = "@warp.editor.sound-selector.remove.name"
    lore     = ["@warp.editor.sound-selector.remove.lore"]
    priority = 10
    click { left = ["warp:remove-sound"] }
  }
}
