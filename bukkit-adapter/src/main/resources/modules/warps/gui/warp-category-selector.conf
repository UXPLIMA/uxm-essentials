# The warp to category selector, opened from a warp's editor to file that warp under a category. One icon per
# configured category across the top five rows, a "no category" button that clears the warp's category, and a back
# button to the warp's editor. Every click returns the viewer to the editor it came from.
#
# The grid is the warps:category-selector list source: each category's icon material, its display name and its lore
# come from the category definition itself (modules/warps/categories.conf), which is why they arrive through the
# warp_category_* placeholders rather than being written here. The lore placeholder expands to the category's own
# lore lines, then the category id, then the click hint, each on its own line. Every fixed label resolves from the
# warps message catalog, so no user-facing text lives here.
#
# The geometry mirrors the original selector: the grid over slots 0..44, page arrows at 45/46, the clear button at
# 49 and back at 53. Move a slot and the button moves with it; the actions are what make a button do its job.
title = "@warp.editor.category.selector.title"
rows = 6

items {
  # The grey-glass backdrop. Lowest priority, so the grid and the buttons draw on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The category grid. A left click files the warp under that category and reopens the warp's editor.
  categories {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "warps:category-selector"
      template {
        material = "%warp_category_icon%"
        name     = "%warp_category_name%"
        lore     = ["%warp_category_lore%"]
        click { left = ["warps:category-assign"] }
      }
    }
  }

  # Previous page of categories.
  previous {
    slot     = 45
    type     = PREVIOUS
    material = ARROW
    name     = "@warp.menu.prev"
    priority = 10
  }

  # Next page of categories.
  next {
    slot     = 46
    type     = NEXT
    material = ARROW
    name     = "@warp.menu.next"
    priority = 10
  }

  # Clear the warp's category, so it shows up as uncategorised again.
  none {
    slot     = 49
    material = BARRIER
    name     = "@warp.editor.category.selector.none.name"
    lore     = ["@warp.editor.category.selector.none.lore"]
    priority = 10
    click { left = ["warps:category-clear"] }
  }

  # Back to the warp's editor, changing nothing.
  back {
    slot     = 53
    material = ARROW
    name     = "@warp.editor.selector.back"
    priority = 10
    click { left = ["warps:category-back"] }
  }
}
