# Layout of the /warp edit <name> configuration menu.
# Titles and lore stay in the message catalog (messages_<lang>.conf);
# only the geometry and materials live here, so editing this file never touches a translation.

# Menu height in rows (1..6). Three rows are standard for the editor.
rows = 3

# Slot assignments for the editor items (0..26)
icon-slot = 4
lock-slot = 10
password-slot = 11
welcome-slot = 12
sounds-slot = 13
particles-slot = 14
warmup-slot = 15
cooldown-slot = 16
close-slot = 22

# Materials/icons for the editor buttons
lock-material = "LEVER"
password-material = "PAPER"
welcome-material = "WRITABLE_BOOK"
sounds-material = "JUKEBOX"
particles-material = "BLAZE_POWDER"
warmup-material = "CLOCK"
cooldown-material = "COMPASS"
