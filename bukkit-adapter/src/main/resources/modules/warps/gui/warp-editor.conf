# The per-warp editor hub, rendered through the menu engine. A three-row property panel for one warp reached from
# the warp manager (a left click on a warp icon), the /warp editor <name> command, and the create flow: a teleport
# button that warps the viewer to the warp, an icon-material button (left-click copies the main-hand item, right
# clears), a category button (server warps only) into the engine category selector, a lock toggle, a password
# button (left sets through the input seam, right clears), a welcome-messages button into the engine welcome list,
# sounds and particles buttons into the engine selectors (shift-click clears both sides), and warmup / cooldown
# override buttons (left sets through the input seam, right clears). Each mutation saves the edited warp through the
# shared editable-warp loader and re-opens this panel with the new subject, so the operator sees the result.
#
# The edited warp is handed in as the menu subject (its name, owner, and a display snapshot), so the title and every
# current-value line fill from the warp_edit_* placeholders without the renderer touching a port. Categories, the
# lock toggle, the password, and the welcome messages are all server-warp concepts; a player warp carries none of
# them after the surrogate-id rebuild, so those four buttons are gated behind warps:editor-server-warp and draw
# only for a server warp (owner absent); a player warp leaves those slots empty. Every label resolves from the warps
# catalog, so no user-facing text lives here. The geometry mirrors the original fixed three-row screen slot for slot:
# teleport 0, icon 4, category 8, lock 10, password 11, welcome 12, sounds 13, particles 14, warmup 15,
# cooldown 16, close 22.
title = "@warp.editor.title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop the old window drew. Lowest priority, so the buttons below sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # Teleport to the warp through the same UseWarp path the /warp command drives; a navigation action, no confirm.
  teleport {
    slot     = 0
    material = ENDER_PEARL
    name     = "@warp.editor.teleport.name"
    lore = ["@warp.editor.teleport.lore"]
    priority = 10
    click { left = ["warps:editor-teleport"] }
  }

  # Set the warp's icon material to the item in the operator's main hand (left), or clear it (right). The button
  # itself shows the warp's live display item; the ENDER_PEARL fallback when none is set, exactly as the old window.
  icon {
    slot     = 4
    material = "%warp_edit_icon_material%"
    name     = "@warp.editor.icon.name"
    lore = ["@warp.editor.icon.lore"]
    priority = 10
    click {
      left  = ["warps:editor-icon-set"]
      right = ["warps:editor-icon-clear"]
    }
  }

  # Assign the warp to a category: open the engine category selector, then save the pick and re-open this panel.
  # Categories are a server-warp concept, so this button draws only for a server warp.
  category {
    slot     = 8
    material = BOOK
    name     = "@warp.editor.category.name"
    lore = ["@warp.editor.category.lore"]
    priority = 10
    view     = ["warps:editor-server-warp"]
    click { left = ["warps:editor-category"] }
  }

  # Toggle the warp's locked state, then save and re-open. A server-warp concept: player warps dropped the lock facet
  # in the surrogate-id rebuild, so this button is gated behind warps:editor-server-warp and draws only for a server
  # warp (owner absent), exactly as the category button is.
  lock {
    slot     = 10
    material = LEVER
    name     = "@warp.editor.lock.name"
    lore = ["@warp.editor.lock.lore"]
    priority = 10
    view     = ["warps:editor-server-warp"]
    click { left = ["warps:editor-lock"] }
  }

  # Set the warp's password through the input seam (left), or clear it (right). A server-warp concept: player warps
  # dropped the password facet in the surrogate-id rebuild (it returns as the P4 access gate), so this button is gated
  # behind warps:editor-server-warp and draws only for a server warp (owner absent).
  password {
    slot     = 11
    material = PAPER
    name     = "@warp.editor.password.name"
    lore = ["@warp.editor.password.lore"]
    priority = 10
    view     = ["warps:editor-server-warp"]
    click {
      left  = ["warps:editor-password-set"]
      right = ["warps:editor-password-clear"]
    }
  }

  # Open the engine welcome-messages list for this warp. A server-warp concept: player warps dropped the
  # welcome-message facet in the surrogate-id rebuild, so this button is gated behind warps:editor-server-warp and
  # draws only for a server warp (owner absent).
  welcome {
    slot     = 12
    material = WRITABLE_BOOK
    name     = "@warp.editor.welcome.name"
    lore = ["@warp.editor.welcome.lore"]
    priority = 10
    view     = ["warps:editor-server-warp"]
    click { left = ["warps:editor-welcome"] }
  }

  # Open the engine sound selector for the departure (left) or arrival (right) side; shift clears both sides.
  sounds {
    slot     = 13
    material = JUKEBOX
    name     = "@warp.editor.sounds.name"
    lore = ["@warp.editor.sounds.lore"]
    priority = 10
    click {
      left        = ["warps:editor-sounds-departure"]
      right       = ["warps:editor-sounds-arrival"]
      shift_left  = ["warps:editor-sounds-clear"]
      shift_right = ["warps:editor-sounds-clear"]
    }
  }

  # Open the engine particle selector for the departure (left) or arrival (right) side; shift clears both sides.
  particles {
    slot     = 14
    material = BLAZE_POWDER
    name     = "@warp.editor.particles.name"
    lore = ["@warp.editor.particles.lore"]
    priority = 10
    click {
      left        = ["warps:editor-particles-departure"]
      right       = ["warps:editor-particles-arrival"]
      shift_left  = ["warps:editor-particles-clear"]
      shift_right = ["warps:editor-particles-clear"]
    }
  }

  # Set the warp's warmup override in seconds through the input seam (left), or clear it (right).
  warmup {
    slot     = 15
    material = CLOCK
    name     = "@warp.editor.warmup.name"
    lore = ["@warp.editor.warmup.lore"]
    priority = 10
    click {
      left  = ["warps:editor-warmup-set"]
      right = ["warps:editor-warmup-clear"]
    }
  }

  # Set the warp's cooldown override in seconds through the input seam (left), or clear it (right).
  cooldown {
    slot     = 16
    material = COMPASS
    name     = "@warp.editor.cooldown.name"
    lore = ["@warp.editor.cooldown.lore"]
    priority = 10
    click {
      left  = ["warps:editor-cooldown-set"]
      right = ["warps:editor-cooldown-clear"]
    }
  }

  # Close the editor.
  close {
    slot     = 22
    material = BARRIER
    name     = "@warp.editor.close"
    priority = 10
    click { left = ["warps:editor-close"] }
  }
}
