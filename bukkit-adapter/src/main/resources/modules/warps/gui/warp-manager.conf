# The admin warp manager list (opened by /warp editor with no warp name, or the warp manager's categories back
# button), rendered through the menu engine. One icon per stored warp as the repository returns them, with a create
# button that makes a warp at the operator's current position, a manage-categories button, and a close button. The
# grid is the warps:manager list source; each warp's icon material and its name, plus the fixed four-line summary
# (category, location, a spacer, then the edit hint), resolve from the warps message catalog, filled with that warp's
# facts through the warp_manager_* placeholders. A left click opens that warp's bespoke editor through
# warps:manager-edit; the create button prompts for a name and creates the warp at the operator's position through
# warps:manager-create, the same /warp create path the old manager's create button drove; the categories button opens
# the bespoke category manager through warps:manager-categories; the close button shuts the window. Every label
# resolves from the catalog, so no user-facing text lives here. The geometry mirrors the original fixed six-row
# manager: a grid across the top five rows, then create/close/categories on the bottom row, and, as in the original,
# no page arrows, so the grid is a single page.
title = "@warp.manager.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop the old manager drew, so an empty manager still reads as a deliberate window rather than
  # a void. Lowest priority, so the content grid and the bottom-row buttons sit on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The warp grid, across the top five rows (the bottom row is reserved for the buttons below). Each cell shows the
  # warp's icon material and its name with the fixed four-line summary lore; a left click opens that warp's editor
  # through warps:manager-edit.
  warps {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "warps:manager"
      template {
        material = "%warp_manager_icon%"
        name     = "%warp_manager_name%"
        lore = [
          "@warp.manager.entry.lore.category"
          "@warp.manager.entry.lore.location"
          ""
          "@warp.manager.entry.lore.edit-hint"
        ]
        click { left = ["warps:manager-edit"] }
      }
    }
  }

  # Create a new warp at the operator's current position: prompt for a name, run the /warp create path, then open the
  # new warp's editor; exactly as the old create button did. Pinned to the old create slot (the manager's prev slot,
  # 48).
  create {
    slot     = 48
    material = EMERALD_BLOCK
    name     = "@warp.manager.create-button.name"
    lore     = ["@warp.manager.create-button.lore"]
    priority = 10
    click { left = ["warps:manager-create"] }
  }

  # Close the manager. The old manager's next slot (50) was the close button.
  close {
    slot     = 50
    material = BARRIER
    name     = "@warp.manager.close-button.name"
    priority = 10
    click { left = ["close"] }
  }

  # Manage categories: open the bespoke category manager, exactly as the old manager's slot-51 button did.
  categories {
    slot     = 51
    material = BOOK
    name     = "@warp.manager.manage-categories.name"
    lore     = ["@warp.manager.manage-categories.lore"]
    priority = 10
    click { left = ["warps:manager-categories"] }
  }
}
