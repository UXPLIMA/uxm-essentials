# Layout of the /warp edit welcome-messages menu. Titles, button labels, and lore stay in the message catalog
# (messages_<lang>.conf); only the geometry and the icons live here, so editing this file never touches a
# translation.

# Menu height in rows (1..6). Three rows give the message grid plus the add/back/clear buttons.
rows = 3

# Background filler for any slot a button does not occupy.
filler-material = "GRAY_STAINED_GLASS_PANE"

# Slot of each element. message-limit caps how many messages fill the top of the grid (slots 0..limit-1).
slots {
  message-limit = 18
  add = 18
  back = 22
  clear = 26
}

# Icon material of each button.
materials {
  add = "WRITABLE_BOOK"
  back = "BARRIER"
  clear = "LAVA_BUCKET"
}
