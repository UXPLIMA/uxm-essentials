# The parent-category selector, opened from a category's settings to nest that category under another one. It lists
# every category except the one being edited, since a category can never be its own parent, plus a button that clears
# the parent and a back button to the category's settings.
#
# The grid is the warps:category-parent-selector list source, and each candidate's icon, name and lore come from the
# category definition itself through the warp_parent_* placeholders. The lore placeholder expands to the candidate's
# own lore lines, then its id, then the click hint. Fixed labels resolve from the warps message catalog.
#
# The geometry mirrors the original selector: the grid over slots 0..44, page arrows at 45/46, clear at 49, back at 53.
title = "@warp.editor.category.parent-selector.title"
rows = 6

items {
  # The grey-glass backdrop. Lowest priority, so the grid and the buttons draw on top of it.
  filler {
    slots    = ["0-53"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The candidate grid. A left click nests the edited category under the clicked one and reopens its settings.
  candidates {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "warps:category-parent-selector"
      template {
        material = "%warp_parent_icon%"
        name     = "%warp_parent_name%"
        lore     = ["%warp_parent_lore%"]
        click { left = ["warps:category-parent-assign"] }
      }
    }
  }

  # Previous page of candidates.
  previous {
    slot     = 45
    type     = PREVIOUS
    material = ARROW
    name     = "@warp.menu.prev"
    priority = 10
  }

  # Next page of candidates.
  next {
    slot     = 46
    type     = NEXT
    material = ARROW
    name     = "@warp.menu.next"
    priority = 10
  }

  # Clear the parent, so the edited category sits at the top level again.
  none {
    slot     = 49
    material = BARRIER
    name     = "@warp.editor.category.selector.none.name"
    lore     = ["@warp.editor.category.selector.none.lore"]
    priority = 10
    click { left = ["warps:category-parent-clear"] }
  }

  # Back to the category's settings, changing nothing.
  back {
    slot     = 53
    material = ARROW
    name     = "@warp.editor.selector.back"
    priority = 10
    click { left = ["warps:category-parent-back"] }
  }
}
