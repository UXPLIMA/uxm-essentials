# The per-warp welcome-messages list editor, rendered through the menu engine. A three-row list panel for one warp
# reached from the editor's welcome button: one entry per stored welcome message across the top two rows, an add
# button, a back button to the editor, and a clear-all button on the bottom row. A left click on an entry edits its
# text through the input seam, a right click deletes it, and a shift click cycles its delivery type; the add button
# writes a new message through the input seam; the clear button drops every message; the back button reopens the
# warp editor. Each mutation saves the edited warp through the shared editable-warp loader and re-opens this list
# with the new subject, so the operator sees the result.
#
# The edited warp is handed in as the menu subject (its name and owner); the entry list is the warps:welcome list
# source, and each entry's icon material, name and lore resolve from the warps catalog through the warp_welcome_*
# placeholders against the bound entry. Every label resolves from the catalog, so no user-facing text lives here.
# The geometry mirrors the original fixed three-row screen slot for slot: the entry grid across the top two rows
# (slots 0-17), add 18, back 22, clear 26.
title = "@warp.editor.welcome-manager.title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop the old window drew. Lowest priority, so the entries and buttons sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The stored welcome messages, one per slot across the top two rows. A left click edits the entry's text, a right
  # click deletes it, and a shift click cycles its delivery type.
  entries {
    slots    = ["0-17"]
    priority = 5
    list {
      source = "warps:welcome"
      template {
        material = "%warp_welcome_material%"
        name     = "@warp.editor.welcome-manager.entry.name"
        lore = ["@warp.editor.welcome-manager.entry.lore"]
        click {
          left        = ["warps:welcome-edit"]
          right       = ["warps:welcome-remove"]
          shift_left  = ["warps:welcome-cycle"]
          shift_right = ["warps:welcome-cycle"]
        }
      }
    }
  }

  # Write a new welcome message through the input seam.
  add {
    slot     = 18
    material = WRITABLE_BOOK
    name     = "@warp.editor.welcome-manager.add.name"
    lore     = ["@warp.editor.welcome-manager.add.lore"]
    priority = 10
    click { left = ["warps:welcome-add"] }
  }

  # Back to the warp editor.
  back {
    slot     = 22
    material = ARROW
    name     = "@warp.editor.selector.back"
    priority = 10
    click { left = ["warps:welcome-back"] }
  }

  # Drop every welcome message.
  clear {
    slot     = 26
    material = LAVA_BUCKET
    name     = "@warp.editor.welcome-manager.clear.name"
    lore     = ["@warp.editor.welcome-manager.clear.lore"]
    priority = 10
    click { left = ["warps:welcome-clear"] }
  }
}
