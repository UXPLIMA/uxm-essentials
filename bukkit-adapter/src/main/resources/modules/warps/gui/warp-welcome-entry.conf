# One welcome message of a warp, rendered through the menu engine. A left click on a message in the welcome list opens
# it here. Every change the list makes with a right or shift click is a left click on this panel, so a player whose
# client cannot send those clicks (a Bedrock player in a chest menu) still reaches each one: rewrite the text, switch
# how it is shown, delete it, or go back to the list.
#
# The message is handed in as the menu subject; its icon material, text and delivery type resolve from the warps
# catalog through the warp_welcome_* placeholders. Every label resolves from the catalog, so no user-facing text lives
# here.
title = "@warp.editor.welcome-entry.title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the buttons sit on top of it.
  filler {
    slots    = ["0-26"]
    material = GRAY_STAINED_GLASS_PANE
    decor    = { hide-tooltip = true }
    priority = 0
  }

  # Write the message again through the input seam.
  text {
    slot     = 11
    material = WRITABLE_BOOK
    name     = "@warp.editor.welcome-entry.text.name"
    lore     = ["@warp.editor.welcome-entry.text.lore"]
    priority = 10
    click { left = ["warps:welcome-entry-text"] }
  }

  # Switch to the next delivery type: chat, action bar, title, subtitle, boss bar. The icon shows the current one.
  type {
    slot     = 13
    material = "%warp_welcome_material%"
    name     = "@warp.editor.welcome-entry.type.name"
    lore     = ["@warp.editor.welcome-entry.type.lore"]
    priority = 10
    click { left = ["warps:welcome-entry-cycle"] }
  }

  # Delete this message and go back to the list.
  remove {
    slot     = 15
    material = LAVA_BUCKET
    name     = "@warp.editor.welcome-entry.remove.name"
    lore     = ["@warp.editor.welcome-entry.remove.lore"]
    priority = 10
    click { left = ["warps:welcome-entry-remove"] }
  }

  # Back to the welcome list, a feather in the centre of the bottom row.
  back {
    slot     = 22
    material = FEATHER
    name     = "@warp.editor.welcome-entry.back"
    priority = 10
    click { left = ["warps:welcome-entry-back"] }
  }
}
