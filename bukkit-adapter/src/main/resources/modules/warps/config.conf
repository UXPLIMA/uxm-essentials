# Warps: /warp /setwarp /delwarp.
enabled = true
list-display = "gui"               # how bare /warps presents the list: "gui" opens the browse menu, "chat" prints the chat list

# Warp signs. A player with uxmessentials.warp.sign.create writes the header on a sign's first line and a warp name on
# the second; right-clicking it with uxmessentials.warp.sign.use teleports to that warp. The header is the text players
# type to make the sign, matched without case or colour, so it is a word here and not a line of the messages files:
# a sign is one block that every reader sees the same, and a header drawn per language could never match what was
# typed. Changing it stops every sign already placed under the old header from working until it is rewritten. An
# empty header turns every sign with a blank first line and a second line into a warp sign.
warp-sign-header = "[Warp]"
# What happens to a new warp sign that names a warp which does not exist: true breaks it and drops it as an item,
# false keeps the sign and throws away the text the player wrote.
destroy-warp-sign-on-error = true

# Warps on the other servers of a network. A warp remembers the server it was set or moved on, once the network block of
# config.conf is on and network.server-name is not the shipped "server-1" (a standalone server records no server, so
# its warps are not tied to a name it drops when it joins a network). With this on, /warp to a warp of another server
# sends the player there through the proxy: the jail, combat and cooldown checks run first, the cost is taken only once
# they pass, and it comes back if the player is not moved. It needs a proxy (BungeeCord or Velocity) in front, a shared
# database, network.server-name in config.conf set to the name the proxy gives this server, and the same setting on
# every server of the network. Off, every warp is used on this server as before, even one set on another. The timings
# are in the cross-server block of config.conf.
#
# A warp from before servers were recorded, or set or moved on a server that records none, is claimed, on start, by the
# server that has its world loaded once that server records one. Three cases need a hand, with
# /warp setserver <warp|all> [server] (uxmessentials.warp.setserver):
#   - Two servers running a copy of the same world folder share its uid.dat, so the one that starts first claims
#     every warp in it. Give each copy its own uid.dat, or set the right server afterwards.
#   - A world loaded after the server has finished starting (by a world manager, later on) is claimed only at the
#     next restart.
#   - Renaming network.server-name leaves its warps on the old name. Set them again warp by warp, or with all when
#     every warp of the network belongs to that server.
# Naming the server "unscoped" clears it: the server that has the warp's world loaded claims it again at its next
# start. With no server named, the command means this server, and a server that records none asks for a name. A name
# no running server answers to is set anyway, with a warning. The log lists every warp a server claims,
# under event=warp_server_claim.
cross-server {
  enabled = false
}

# The sound and particle a warp plays where the player leaves and where they arrive, when the warp's editor set none
# or set one the server does not know. Player warps use these too while this module is on. Sounds take the vanilla
# name in either form (ENTITY_ENDERMAN_TELEPORT or minecraft:entity.enderman.teleport). Particles take the vanilla
# name, with the data a particle needs after it: "dust #00ff00" for a coloured dust, "block oak_log" for a block.
# A name the server does not know, or a resource pack sound, plays nothing.
effects {
  # The sound a warp plays.
  sound {
    # Where the player leaves.
    departure.type = "ENTITY_ENDERMAN_TELEPORT"
    # Where the player lands.
    arrival.type   = "ENTITY_ENDERMAN_TELEPORT"
  }
  # The particle a warp shows.
  particle {
    # Where the player leaves.
    departure.type = "PORTAL"
    # Where the player lands.
    arrival.type   = "PORTAL"
  }
}

# The particles and sounds the warp editor's two pickers offer, in this order, up to eighteen of each. Each entry
# names the effect it sets, the item that shows it, and its name: a line of the messages files ("@content.warps...",
# drawn in each reader's language, which is how the shipped entries are written), a block with one name per language
# code (a reader whose language has none reads the English one), or one name everybody reads. Add, remove or reorder
# entries freely. An empty list, such as
# `sounds = []`, offers none and leaves the picker's custom button. A file without this section offers the list below.
