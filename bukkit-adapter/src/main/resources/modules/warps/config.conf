# Warps: /warp /setwarp /delwarp.
enabled = true
list-display = "gui"               # how bare /warps presents the list: "gui" opens the browse menu, "chat" prints the chat list

# The particles and sounds the warp editor's two pickers offer, in this order, up to eighteen of each. Each entry
# names the effect it sets, the item that shows it, and its name: a line of the messages files ("@content.warps...",
# drawn in each reader's language, which is how the shipped entries are written), a block with one name per language
# code (a reader whose language has none reads the English one), or one name everybody reads. Add, remove or reorder
# entries freely. An empty list, such as
# `sounds = []`, offers none and leaves the picker's custom button. A file without this section offers the list below.
selector-presets {
  particles = [
    {
      effect = "minecraft:portal"
      icon   = OBSIDIAN
      name = "@content.warps.particle.portal"
    }
    {
      effect = "minecraft:witch"
      icon   = BREWING_STAND
      name = "@content.warps.particle.witch"
    }
