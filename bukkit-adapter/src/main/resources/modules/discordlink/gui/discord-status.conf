# Layout of the per-player Discord link-status panel (opened by /discordlink gui, or /uxmess gui). Titles,
# labels and value lore stay in the message catalog (messages_<lang>.conf); only the geometry and the materials
# live here, so editing this file never touches a translation.

# Menu height in rows (1..6). Three rows hold the status button and the link/unlink action with a back button.
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The i-th button is drawn in the i-th slot below, and a click on that slot resolves back to it. The button
# order, set in code, is: link status (read-only label), link or unlink action (the second slot shows the
# generate-code action when the viewer is not linked, the confirm-gated unlink action when they are).
property-slots = [11, 15]

# Slot the back button (closes the panel) sits in.
back-slot = 22

# This panel never deletes; leave the delete slot off (-1) so no delete button is drawn.
delete-slot = -1

# Materials for the back button, the (unused) delete button, and the background filler.
back-icon = "ARROW"
delete-icon = "BARRIER"
filler = "BLACK_STAINED_GLASS_PANE"
