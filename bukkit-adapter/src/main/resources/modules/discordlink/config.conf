# Discord link — the in-game side of linking a player's Minecraft account to their Discord account. A player runs
# /discordlink to get a one-time code, types /link <code> to the Discord bot to confirm, opens /discordlink gui to
# see their binding, and /discordunlink to remove it. The Discord BOT itself — the bot token, the channels it posts
# to, its own enable switch and rate limits — is configured separately in the uxmessentials-discord jar's
# discord.conf; nothing here touches the bot connection.
#
# The module ships DISABLED: linking needs the separate uxmessentials-discord jar and a bot token, so without those
# the commands could only report that the bridge is not configured. Set enabled = true once the bot is running.
enabled = false

# How long, in seconds, a generated link code stays valid before it expires and the player must run /discordlink
# again for a fresh one. A shorter window narrows the chance of a leaked code being redeemed; a longer one is more
# forgiving if the player takes a moment to switch to Discord. Default 600 = 10 minutes; minimum 1.
code-ttl-seconds = 600
