# /rtp safe-search tuning. Mounted under modules.teleport.rtp.
min-radius = 100                  # inner ring candidates must clear
max-radius = 5000                 # outer search radius
claim-aware = true                # avoid landing on claimed land
queue-target-size = 10            # pre-validated locations kept ready per world
queue-low-water = 5               # refill fires when the queue drops below this
# Per-search budget — a single /rtp safe-search never exceeds any of these; whichever is hit first ends it.
max-attempts = 40                 # candidate columns one search probes before giving up
max-chunk-loads = 30              # chunk loads one search may trigger before giving up
max-wall-clock-ms = 2500          # wall-clock ceiling for one search in milliseconds
excluded-biomes = ["ocean", "deep_ocean", "river"]
avoid-blocks = ["lava", "magma_block", "fire", "cactus"]
# Persisted pool — the validated queue is mirrored to the database so it survives a restart and the first
# /rtp per world serves instantly instead of triggering a cold search storm.
persist-pool = true               # write validated locations to disk and pre-warm the queue from disk on enable
pool-max-per-world = 200          # most validated columns kept on disk per world; the oldest are evicted past this
pool-stale-after-hours = 72       # a validated column older than this is swept on enable rather than re-probed
pool-prewarm-requires-players = false  # when true, a world with nobody online is skipped by the startup pre-warm
# min-y = 0                       # uncomment to clamp the landing Y range (default: full world height)
# max-y = 256
# fallback-world.world_nether = "world"   # redirect /rtp out of a world that has no queue
