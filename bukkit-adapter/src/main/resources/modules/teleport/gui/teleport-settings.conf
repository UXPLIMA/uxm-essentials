# Layout of the per-player teleport settings panel (opened by /tpsettings, or /uxmess gui for an admin). Titles,
# labels and value lore stay in the message catalog (messages_<lang>.conf); only the geometry and the materials
# live here, so editing this file never touches a translation.

# Menu height in rows (1..6). Three rows comfortably hold the toggles with a back button on the bottom row.
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

# The i-th toggle is drawn in the i-th slot below, and a click on that slot resolves back to it. The toggle
# order, set in code, is: accept-requests (/tptoggle), auto-accept (/tpauto).
property-slots = [11, 15]

# Slot the back button (closes the panel) sits in.
back-slot = 22

# A settings panel never deletes; leave the delete slot off (-1) so no delete button is drawn.
delete-slot = -1

# Materials for the back button, the (unused) delete button, and the background filler.
back-icon = "ARROW"
delete-icon = "BARRIER"
filler = "BLACK_STAINED_GLASS_PANE"
