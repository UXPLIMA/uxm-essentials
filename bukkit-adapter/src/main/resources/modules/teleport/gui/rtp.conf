# The /rtp gui world picker (gated uxmessentials.rtp.gui), rendered through the menu engine. One tile per RTP-enabled
# loaded world across the top five rows, paged with the previous/next arrows on the bottom row. A left click on a
# world tile random-teleports the viewer within that world through the same ResolveRtp path /rtp <world> drives (the
# teleport:rtp-world action). A static hint tile in the middle of the bottom row points at /rtp biome <biome> for
# biome-targeted landings. Every label resolves from the teleport message catalog through @keys or the rtp_world_*
# placeholders, so no user-facing text lives here.
title = "@teleport.rtp.gui.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grid of world tiles, paginated across the top five rows (the bottom row is reserved for the hint and nav
  # buttons). Each cell shows its world's environment-flavoured icon and rendered name; a left click RTPs the viewer
  # within that world through teleport:rtp-world.
  worlds {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "teleport:rtp-worlds"
      template {
        material = "%rtp_world_icon%"
        name     = "%rtp_world_name%"
        lore     = ["@teleport.rtp.gui.world-lore"]
        click { left = ["teleport:rtp-world"] }
      }
    }
  }

  # The biome hint: a static tile pointing at /rtp biome <biome>. No binding: it only shows catalog text.
  biome-hint {
    slot     = 49
    material = COMPASS
    name     = "@teleport.rtp.gui.biome-hint"
    lore     = ["@teleport.rtp.gui.biome-hint-lore"]
    priority = 10
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@teleport.rtp.gui.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@teleport.rtp.gui.next"
    priority = 10
  }
}
