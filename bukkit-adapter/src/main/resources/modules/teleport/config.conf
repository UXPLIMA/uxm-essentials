# Teleport: cooldowns, warmups, /back, /tpa. The /rtp safe-search tuning lives in rtp.conf beside this file.
enabled = true
cooldown-start-phase = "teleport"   # when the cooldown clock starts: request | accept | teleport
request-ttl-seconds = 60            # how long a /tpa request stays pending
single-request-displace = true      # a new request replaces a pending one instead of queueing
default-warmup = 3                  # seconds, when the player holds no uxmessentials.teleport.warmup.<n>
default-cooldown = 5                # seconds, when the player holds no uxmessentials.teleport.cooldown.<n>
teleport-to-center = true           # snap the destination to the block centre
arrival-title = true                # master toggle: flash a short title/message on the screen when a teleport lands
arrival-effects = true              # master toggle: play a sound/particle when a teleport lands

# Per-verb arrival sound + particle. Sound/particle names are the vanilla identifiers
# (e.g. ENTITY_ENDERMAN_TELEPORT, END_ROD); an unknown or empty name simply plays nothing.
# Set a verb's `enabled = false` (or leave it out) to silence that verb.
effects {
  home {
    enabled = true
    sound = "ENTITY_ENDERMAN_TELEPORT"
    sound-volume = 1.0
    sound-pitch = 1.0
    particle = "END_ROD"
    particle-count = 30
    particle-spread = 0.3
  }
  spawn {
    enabled = true
    sound = "ENTITY_ENDERMAN_TELEPORT"
    sound-volume = 1.0
    sound-pitch = 1.0
    particle = "END_ROD"
    particle-count = 30
    particle-spread = 0.3
  }
  rtp {
    enabled = true
    sound = "ENTITY_ENDERMAN_TELEPORT"
    sound-volume = 1.0
    sound-pitch = 1.0
    particle = "END_ROD"
    particle-count = 30
    particle-spread = 0.3
  }
  back {
    enabled = true
    sound = "ENTITY_ENDERMAN_TELEPORT"
    sound-volume = 1.0
    sound-pitch = 1.0
    particle = "END_ROD"
    particle-count = 20
    particle-spread = 0.3
  }
  warp {
    enabled = false
    sound = "ENTITY_ENDERMAN_TELEPORT"
    sound-volume = 1.0
    sound-pitch = 1.0
    particle = "END_ROD"
    particle-count = 30
    particle-spread = 0.3
  }
}

# Per-command arrival message configurations.
# Supports multiple concurrent messages of any type.
# To disable arrival messages for a command category, set it to an empty list `[]`.
# 
# Supported types and formats:
# - "TITLE;message;[fadeInMs];[stayMs];[fadeOutMs]" (default: 150;700;300)
# - "SUBTITLE;message;[fadeInMs];[stayMs];[fadeOutMs]" (default: 150;700;300)
# - "BOSS_BAR;message;[durationSeconds]" (default: 3)
# - "CHAT;message"
# - "ACTION_BAR;message"
#
# Message can be a localized message catalog key (e.g. "teleport.arrived.title") or a custom MiniMessage string.
arrival-messages {
  home = [
    "TITLE;teleport.arrived.title;150;700;300"
  ]
  warp = [] # disabled by default since warps configure their own welcome messages in warp editor
  spawn = [
    "TITLE;teleport.arrived.title;150;700;300"
  ]
  rtp = [
    "TITLE;teleport.arrived.title;150;700;300"
  ]
  back = [
    "TITLE;teleport.arrived.title;150;700;300"
  ]
  request = [
    "TITLE;teleport.arrived.title;150;700;300"
  ]
  positional = [
    "TITLE;teleport.arrived.title;150;700;300"
  ]
}

# Per-verb cooldown overrides in seconds; -1 inherits default-cooldown. A non-negative value is that verb's
# fallback wait; a uxmessentials.tp.cooldown.<n> permission tier still refines it, and the verb then
# rate-limits on its own clock (so e.g. /back can have a cooldown distinct from /home).
cooldowns {
  back = -1
  home = -1
  warp = -1
  spawn = -1
  rtp = -1
}

warmup {
  cancel-on-move = true
  cancel-on-rotate = false
  cancel-on-damage = false
  cancel-on-interact = false
  move-threshold = 0.0              # blocks of movement tolerated before a warmup cancels
}

back {
  on-death = true                   # /back may return to a death location
  death-delay-seconds = 0           # seconds after dying before /back may return to the death point (0 = off)
  ignored-causes = ["ender_pearl", "chorus_fruit"]   # causes that never overwrite the /back point
}

# Automatic spawn policy. All spawn routes share mirror -> per-world setspawn -> main spawn -> vanilla spawn.
spawn {
  first-join = true                 # genuinely new players start at the resolved spawn
  every-join = false                # true = returning players also return to spawn on every login
  respawn = true                    # manage death respawns through the chain below
  respawn-chain = ["bed", "anchor", "spawn"]   # the ordered death chain; the first step that resolves wins
  exempt-permission = "uxmessentials.spawn.join.exempt"   # holders are left where they logged out
}

# Optional per-death-world override. First resolvable step wins.
# Steps: home, bed, anchor, spawn, warp:<name>, rtp. An explicit [] restores vanilla respawning for that world.
# The old key remains supported; e.g. respawn { chain { world = ["home", "bed", "spawn"] } }

# Reads the combat tag an installed combat plugin (CombatLogX, PvPManager) already keeps, and blocks the
# self-teleports that would escape a fight: /home, /warp, /spawn, /back, /rtp and /tpa. We own no combat
# timer, so with neither plugin installed this setting does nothing at all.
combat {
  block-teleport = true
}
