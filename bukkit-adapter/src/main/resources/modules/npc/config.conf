# NPC — server-wide fake-player NPCs (no real entity; rendered to each viewer with packets) behind the single
# /npc command. Create them with /npc create <name>, re-skin with /npc skin, move with /npc movehere, bind a
# click command with /npc command, and toggle player-tracking with /npc lookatplayer. NPCs survive a restart
# and a world rollback (the database is the source of truth, never the world save).
enabled = true

# Look-at-player. Whether an individual NPC turns to face nearby players is a PER-NPC flag, on by default for a
# freshly created NPC and toggled with /npc lookatplayer <name> <true|false>. The two knobs below apply to every
# looking NPC.
look-at-player {
  # How close a player must be (in blocks, same world) before a looking NPC turns to face them. Beyond this the
  # NPC keeps the fixed facing it was placed with.
  range = 12.0

  # How often the look loop re-aims every looking NPC at its nearby viewers, in ticks (20 ticks is one second).
  # Lower is smoother but sends more rotation packets; 3 ticks (150 ms) reads as a natural head-turn.
  tick-period = 3
}

# The per-player-per-NPC cooldown (milliseconds) that swallows a duplicate click so a single right-click runs
# the bound command once, not twice (the client reports the main and off hand separately, and a held button
# repeats). 0 disables the cooldown.
click-cooldown-millis = 500

# Skin sourcing. /npc skin <name> url:<image-url> generates a signed skin from an image through the MineSkin v2
# service. An API key is OPTIONAL: leave it blank to use the unauthenticated public tier, which is fine for
# occasional skinning; supplying a key (https://mineskin.org/account) raises the rate limit for heavier use. When
# set, it is sent as an Authorization: Bearer header on the generate/queue requests.
skin {
  mineskin-api-key = ""
}
