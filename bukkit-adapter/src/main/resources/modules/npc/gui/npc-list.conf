# The /npc management list (opened by /npc with no arguments, or the npc entry on the /uxmess gui hub), rendered
# through the menu engine. One icon per stored NPC in the order the repository returns them, paged when there are
# more than fit, with a create button and the two nav arrows on the bottom row. The grid is the npc:list source;
# each entry's icon is the NPC's type icon (a player head for a fake player, that mob's spawn egg otherwise) through
# the npc_icon placeholder, and its name and lore resolve from the npc message catalog, filled with that NPC's name,
# type, world, and rounded coordinates through the npc_* placeholders. A left click opens that NPC's bespoke property
# editor through npc:edit; the create button prompts for a name and creates a fresh fake-player NPC at the operator's
# feet with their own skin through npc:create, the same use case /npc create drives. Every label resolves from the
# catalog, so no user-facing text lives here. The geometry mirrors the original fixed six-row list: a grid across the
# top five rows and the create/nav buttons on the bottom row.
title = "@npc.gui.list.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the content grid and the buttons drawn below sit on top of it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The NPC grid, paginated across the top five rows (the bottom row is reserved for the create and nav buttons).
  # Each cell shows the NPC's type icon with its name and detail lore; a left click opens that NPC's editor through
  # npc:edit.
  npcs {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "npc:list"
      template {
        material = "%npc_icon%"
        name     = "@npc.gui.list.entry-name"
        lore     = ["@npc.gui.list.entry-lore"]
        click { left = ["npc:edit"] }
      }
    }
  }

  # Create a new NPC: prompt for a name, then create a fake-player NPC at the operator's feet with their own skin,
  # exactly as the old create button did. Pinned to the bottom row, between the page arrows.
  create {
    slot     = 49
    material = LIME_DYE
    name     = "@npc.gui.list.create"
    priority = 10
    click { left = ["npc:create"] }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@npc.gui.list.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@npc.gui.list.next"
    priority = 10
  }
}
