# Layout of the per-NPC editor (opened by clicking an NPC in the /npc list). Titles, labels and value lore stay
# in the message catalog (messages_<lang>.conf); only the geometry and the materials live here, so editing this
# file never touches a translation.

# Menu height in rows (1..6). Six rows fit the full property grid with a navigation row at the bottom.
rows = 6

# The i-th property button is drawn in the i-th slot below, and a click on that slot resolves back to it. The
# property order, set in code, is: name, skin, type, equipment, pose, look-at-player, collidable, glow,
# glow-colour, display-name, mirror-skin, scale, on-fire, invisible, silent, show-in-tab, actions, move-here,
# teleport-here.
property-slots = [
  10, 11, 12, 13, 14, 15, 16,
  19, 20, 21, 22, 23, 24, 25,
  28, 29, 30, 31, 32
]

# Slot the back button (returns to the list) sits in.
back-slot = 49

# Slot the delete button sits in (set to -1 to remove it). Deleting is confirm-gated.
delete-slot = 53

# Materials for the back and delete buttons, and the background filler.
back-icon = "ARROW"
delete-icon = "BARRIER"
filler = "BLACK_STAINED_GLASS_PANE"

# Geometry of the equipment sub-menu (opened from the "equipment" property button). Each of the six armour /
# hand slots is drawn at one of these slots; click a slot to set it from your held item (left) or clear it
# (shift-left). The slot order matches the code: head, chest, legs, feet, mainhand, offhand.
equipment-rows = 3
equipment-slots = [11, 12, 13, 14, 15]
equipment-offhand-slot = 16
equipment-back-slot = 22
equipment-back-icon = "ARROW"
equipment-empty-icon = "ITEM_FRAME"
equipment-filler = "BLACK_STAINED_GLASS_PANE"

# Geometry of the actions sub-menu (opened from the "actions" property button). The entry slots are where each
# action row is drawn; add and back sit in the bottom row.
actions-rows = 6
actions-entry-slots = [
  10, 11, 12, 13, 14, 15, 16,
  19, 20, 21, 22, 23, 24, 25,
  28, 29, 30, 31, 32, 33, 34
]
actions-add-slot = 48
actions-back-slot = 50
actions-entry-icon = "PAPER"
actions-add-icon = "LIME_DYE"
actions-back-icon = "ARROW"
actions-filler = "BLACK_STAINED_GLASS_PANE"

# Geometry of the enum selector sub-menus (type, pose, glow colour, equipment material picker). The option
# slots are where each choice is drawn.
selector-rows = 6
selector-option-slots = [
  10, 11, 12, 13, 14, 15, 16,
  19, 20, 21, 22, 23, 24, 25,
  28, 29, 30, 31, 32, 33, 34
]
selector-option-icon = "PAPER"
selector-filler = "BLACK_STAINED_GLASS_PANE"
