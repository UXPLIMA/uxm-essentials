# Custom commands: operator-declared commands, behind /customcmd.
#
# When this module is enabled, every file under plugins/uxmEssentials/commands/custom/*.conf is loaded on start and
# registers a real command (Brigadier, with tab completion, typed arguments and a usage line). A command file runs
# the same actions and requirements the menu engine already speaks, so anything a menu button can do a command can
# do too. `/customcmd list` shows what loaded, `/customcmd info <id>` explains one, `/customcmd reload` re-reads the
# folder and `/customcmd test <id>` reports which gate a command would stop at without running it. A file that fails
# to parse is skipped with a warning naming the file; one bad definition never hides the rest. A starter definition
# ships as commands/custom/example.conf; copy it to build your own.
#
# The module ships ENABLED but inert: nothing registers until you write a definition file. Set enabled = false to
# turn the whole surface off (no definitions load, no commands register, /customcmd is not registered either).
enabled = true

# Whether a definition may run a command from the CONSOLE (the `console:` action head). A console command runs with
# full server permissions no matter who typed the custom command, which is exactly what you want for a reward that
# calls `give`, and exactly what you do not want in a file you have not read. It is ON here because a custom command
# is written by an operator rather than clicked by a player, but turn it off if more than one person can drop files
# into the commands/custom/ folder.
#
# When false, a definition using `console:` still loads and its other steps still run; the console step is skipped
# and logged with the command it would have run, so the gap is visible instead of silent.
allow-console-actions = true

# Whether a definition may run a step with operator rights temporarily granted to the player (the `command-as-op:`
# action head). This is the sharpest tool in the file: it makes the PLAYER momentarily an operator for one command,
# so a mistake hands out real power rather than merely running something as the server. It is OFF by default and
# should stay off unless you have a command that cannot be expressed with `console:` instead.
allow-op-actions = false

# How deep custom commands may call each other. A custom command whose action runs another custom command is useful
# (a menu of shortcuts, a command that shares a reward step), and a command that calls itself is a server freeze. The
# depth counter stops the chain here and tells the player the command is misconfigured rather than hanging the tick.
max-chain-depth = 5

# The longest a single `delay:` step may wait before the rest of the chain continues. A definition asking for more is
# clamped to this value at load with a warning, so a typo of "10m" where "10s" was meant cannot park a reward an
# operator is waiting on for ten minutes.
max-delay = "60s"

# How many delayed steps one chain may schedule in total. Every delay costs a scheduled task, so this bounds what a
# single run can leave behind on the scheduler; steps past the limit are dropped at load with a warning.
max-delayed-steps = 20

# Whether a console or op step writes an audit line to the server log naming the command, who ran it, and what it
# executed. This is how a privileged step stays reviewable after the fact; leave it on unless the log volume is a
# genuine problem.
log-privileged-actions = true

# The currency a `cost` uses when a definition names none of its own. Same short specs the rest of the plugin takes:
# `vault` (the server economy), `exp` (native experience points), `playerpoints`, `coinsengine` /
# `coinsengine:<name>`, and `zessentials` / `zessentials:<name>`. A back-end whose plugin is absent charges nothing,
# so a priced command still runs rather than becoming unusable when the economy is down.
default-currency = "vault"
