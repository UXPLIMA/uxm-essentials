# Vote — Votifier-bridged vote rewards and a server-wide vote party.
#
# The module ships ENABLED but inert: the reward and vote-link lists below are empty by default, so an
# installed-but-unconfigured server runs every reward as a no-op and shows /vote no links. Author the lists,
# then reload — nothing here is a plugin-translated string. Votifier is a soft dependency: with it installed,
# an incoming vote runs the per-vote rewards and advances the party counter; without it, /vote and /voteparty
# still work and only the vote-triggered rewards are dormant.
enabled = true

# The vote-site links shown by /vote, one per line. Plain text or MiniMessage; rendered as written.
vote-links = []

# The console commands run for the voter on each received vote. {player} is replaced with the voter's name.
# Each command runs from the console, so reference the player explicitly, e.g. "eco give {player} 100".
# An online voter is rewarded at once; an offline voter's rewards are queued and paid out on their next join.
rewards = []

# Broadcast a thank-you to every online player when a vote is received. The text is the vote.thanks message
# key in the message catalogs, not config content.
broadcast = true

voteparty {
  # How many votes accumulate before a party fires. Must be at least one.
  threshold = 25
  # The console commands run for EVERY online player when the party fires. {player} is replaced per player.
  rewards = []
}
