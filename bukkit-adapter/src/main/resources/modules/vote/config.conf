# Vote — Votifier-bridged vote rewards and a server-wide vote party.
#
# The module ships ENABLED but inert: the reward sets and vote-link list below are empty by default, so an
# installed-but-unconfigured server runs every reward as a no-op and shows /vote no links. Author the sets,
# then reload. Votifier is a soft dependency: with it installed, an incoming vote runs the reward engine and
# advances the party counter; without it, /vote and /voteparty still work and only the vote-triggered rewards
# are dormant.
enabled = true

# The vote-site links shown by /vote, one per line. Plain text or MiniMessage; rendered as written.
# Kept for back-compat: if `sites` below is empty, vote-links also seeds the per-site cooldown catalog
# (one VoteSiteSpec per link, using the default cooldown). Remove this list once you configure `sites`.
vote-links = []

# Structured site definitions for per-site cooldown tracking (/vote next, /vote last, reminders).
# Each entry requires a `name` (the display label shown in /vote next, /vote last, and the GUI) and
# optionally:
#   service          - the Votifier vote-list/service string this site's cooldown is matched on
#                      (case-insensitive). MUST equal the service the vote actually arrives with, or
#                      the cooldown never registers. If omitted, it defaults to `name` — so a site whose
#                      display label already equals the Votifier service needs no `service`.
#   url              - the public vote URL shown in /vote and the GUI.
#   cooldown-minutes - per-site override (falls back to default-cooldown-minutes).
#
# Migration from vote-links: copy each URL here with a display name, the matching Votifier service, and
# a cooldown, then clear vote-links. Both keys can coexist during migration — sites takes precedence
# for cooldown tracking. (A legacy vote-links entry derives its service from the URL domain, which
# almost never matches the real Votifier service, so its cooldown stays dead until migrated here.)
#
# Example:
#   sites = [
#     { name = "PlanetMinecraft", service = "PMC", url = "https://www.planetminecraft.com/server/...", cooldown-minutes = 1440 }
#     { name = "minecraft-mp",    url = "https://minecraft-mp.com/server/...", cooldown-minutes = 1440 }
#   ]
sites = []

# The cooldown (in minutes) applied to any site that does not declare its own cooldown-minutes.
# Default 1440 = 24 hours. Must be at least 0; 0 means the site is always votable.
default-cooldown-minutes = 1440

# Controls the /vote sites GUI shown to players. When list-display is set to "gui" (the default),
# /vote with no arguments also opens this GUI for players (console always gets chat links).
# Disable entirely to fall back to the classic chat-links list for /vote.
gui {
  # The display mode for /vote (no-args) and /vote sites: gui | chat.
  # "chat" restores the pre-GUI chat-link list for all sources.
  list-display = "gui"

  # Chest rows for the site grid (1–6). Set to 1 when you have only a few sites.
  rows = 3

  # Material shown for a site the player can vote on right now.
  votable-material = "PAPER"

  # Material shown for a site still on cooldown.
  cooldown-material = "CLOCK"
}

# Login and interval reminders sent to players who have at least one site available to vote on.
reminders {
  # Master switch. When false, no reminder tasks or login nags are registered.
  enabled = false

  # Send a one-shot reminder shortly after a player logs in (requires enabled = true).
  login = true

  # Delay before the login reminder fires, in seconds. Allows the join sequence to settle first.
  login-delay-seconds = 5

  # Send a reminder on a recurring interval while the player is online.
  # Set to 0 to disable interval reminders (login nag only). Value is in minutes.
  interval-minutes = 0
}

# The structured reward engine. Each entry is a reward "spec" with these fields (all optional except where a
# spec would otherwise do nothing):
#   chance      = an int 0..100; the spec is rolled and only granted when a 1..100 draw lands at or below it.
#                 Defaults to 100 (always grants). 0 never grants.
#   permission  = a node the voter must hold for the spec to grant (omit for no gate).
#   commands    = console commands run for the voter; {player} is replaced with the voter's name.
#                 An online voter's commands run at once; an offline voter's are queued for their next join.
#   messages    = MiniMessage lines sent to the (online) voter; {player} is replaced. Config content, not a
#                 message-catalog key.
#   broadcast   = MiniMessage lines sent to every online player; {player} is replaced.
#   items       = items granted to the (online) voter, each { material, amount (default 1), name, lore }.
#                 material is a Bukkit material name (e.g. DIAMOND); an unknown name is skipped. Overflow that
#                 does not fit the inventory is dropped at the voter's feet. name/lore are MiniMessage.
#   worlds      = a list of world names the spec applies in; empty (the default) means any world. A world-
#                 filtered spec never pays an offline voter (they have no world).
# Messages, broadcasts, and items are delivered only to an online voter; offline voters keep their commands
# (queued) and lose the live-only effects.
#
# Migration note: the old flat `rewards = ["eco give {player} 100"]` is now
#   rewards { per-vote = [ { commands = ["eco give {player} 100"] } ] }
rewards {
  # Paid on EVERY received vote.
  per-vote = [
    # { chance = 100, commands = [ "eco give {player} 250" ], messages = [ "<green>Thanks for voting, {player}!" ], items = [ { material = "DIAMOND", amount = 1, name = "<aqua>Vote Diamond", lore = [ "<gray>A token of thanks" ] } ] }
    # { chance = 10, broadcast = [ "<gold>{player} hit the jackpot voting!" ], commands = [ "crate give {player} epic 1" ] }
  ]

  # Paid only when the vote came from a matching vote-list service. Keys are matched case-insensitively.
  per-site {
    # "PlanetMinecraft" = [ { commands = [ "give {player} diamond 2" ] } ]
    # "minecraft-mp.com" = [ { items = [ { material = "EMERALD", amount = 4 } ] } ]
  }

  # Paid only on a player's very first ever vote on this server.
  first-vote = [
    # { messages = [ "<green>Welcome, {player} — thanks for your first vote!" ], commands = [ "give {player} cake 1" ] }
  ]

  # Paid off the voter's all-time vote count. Each milestone has exactly ONE of:
  #   at    = pay once, the single time the count equals this value, or
  #   every = pay each time the count is a positive multiple of this value.
  milestones = [
    # { at = 100, broadcast = [ "<gold>{player} reached 100 votes!" ], commands = [ "lp user {player} parent add voter-100" ] }
    # { every = 25, commands = [ "crate give {player} vote 1" ] }
  ]
}

# Broadcast a thank-you to every online player when a vote is received. The text is the vote.thanks message
# key in the message catalogs, not config content.
broadcast = true

voteparty {
  # How many votes accumulate before a party fires. Must be at least one.
  threshold = 25

  # The reward given to every eligible online player when the party fires. Uses the same spec format as the
  # per-vote rewards above: chance, commands, messages, broadcast, items, worlds. {player} is substituted per
  # player. Example:
  #
  #   reward {
  #     commands  = [ "eco give {player} 500" ]
  #     messages  = [ "<gold>Vote party! You received 500 coins!" ]
  #     broadcast = [ "<gold>A vote party just fired!" ]
  #   }
  #
  # Migration note: the old flat `voteparty.rewards = ["eco give {player} 500"]` still works as a fallback
  # but is superseded by this block. Remove the flat list when you configure reward {}.
  rewards = []

  # When true, only players who voted during the current party window receive rewards. When false (default),
  # all online players are rewarded regardless of whether they voted.
  only-voters = false

  # Votes added to the threshold after each party fires (0 = no escalation).
  # The stored override is cleared (threshold reverts to base) in two ways:
  #   - An admin runs /voteparty set <n> — always clears the override regardless of n.
  #   - escalate-by is changed to 0 in config and a party fires — the next fire clears the override.
  escalate-by = 0

  # Auto-reset the counter on a calendar boundary: none | daily | weekly.
  reset = "none"

  # Intermediate vote counts at which to broadcast a milestone announcement (VOTEPARTY_ANNOUNCE key).
  # Empty list = no announcements. Example: [10, 20] announces when the counter reaches 10 and 20.
  announce-at = []

  # Sound played to every online player when a party fires. Accepts Bukkit UPPER_SNAKE names
  # (e.g. ENTITY_PLAYER_LEVELUP) or dot-notation keys (e.g. entity.player.levelup). Blank = no sound.
  sound = ""

  # Particle spawned around every online player when a party fires. Accepts UPPER_SNAKE or lowercase names
  # (e.g. FIREWORK or firework). Blank = no particle.
  particle = ""
}
