# The vote-site board /vote (and /vote sites) opens: one icon per configured site, showing whether the player may
# vote there right now or how long is left on that site's cooldown.
#
# The icons are the vote:sites list source. A site's name and its state lines come from the site definition and the
# player's own cooldown, so they reach this file through the vote_site_* placeholders; the icon material follows the
# site's state and is set in the module config (gui.votable-material / gui.cooldown-material) so a single pair of
# materials covers every site.
#
# Everything else here is yours: the window size, the backdrop, where the arrows sit, and how a site's tile reads.
title = "@vote.gui.title"
rows = 3
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The backdrop. Lowest priority, so the site icons and the arrows draw on top of it.
  filler {
    slots    = ["0-26"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # One icon per configured vote site. A left click on a votable site sends its clickable link in chat.
  sites {
    slots    = ["0-17"]
    priority = 5
    list {
      source = "vote:sites"
      template {
        material = "%vote_site_icon%"
        name     = "<value>%vote_site_name%</value>"
        lore     = ["%vote_site_lore%"]
        click { left = ["vote:site-open"] }
      }
    }
  }

  # Previous page of sites.
  previous {
    slot     = 18
    type     = PREVIOUS
    material = ARROW
    name     = "@vote.gui.prev"
    priority = 10
  }

  # Next page of sites.
  next {
    slot     = 26
    type     = NEXT
    material = ARROW
    name     = "@vote.gui.next"
    priority = 10
  }
}
