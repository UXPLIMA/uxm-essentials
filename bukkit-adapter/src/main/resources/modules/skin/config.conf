# Skin: one built-in skin system, so a cracked or Bedrock-facing server does not need a separate skin plugin.
# A player picks a skin with /skin <name>, /skin url <link> or /skin file <name>; a Bedrock player arrives wearing
# their Bedrock skin; anybody left over is dressed from the default pool below instead of appearing as Steve.
# A chosen skin is stored in the database, so a join needs no network call to put it back on.
#
# The module ships DISABLED: an online-mode server gains nothing from it, since every player already wears their
# own skin. Set enabled = true to turn it on.
enabled = false

# Which sources a player may take a skin from. Turning one off makes its command branch report that the source is
# disabled; it does not remove skins already stored from it.
sources {
  name = true      # /skin <name>: the skin worn by that account, resolved through Mojang
  url = true       # /skin url <link>: an image on the web, uploaded to MineSkin to be signed
  file = true      # /skin file <name>: an image the operator dropped into the folder named under mineskin below
  bedrock = true   # a Bedrock player's own skin, when Floodgate is installed
}

# What a player wears when they have chosen nothing of their own. The first of these that resolves is applied:
# their real premium skin, then their Bedrock skin, then an entry from the pool.
login {
  premium-skin = true   # dress a name that belongs to a paid account with the skin that account really wears
  default-pool = []     # names used when nothing else resolves; a player keeps the same one on every join
  timeout-seconds = 3   # how long a login lookup may take before the player is let in undressed
}

# Bedrock skins, read from Floodgate and the Geyser skin service.
bedrock {
  refresh-on-join = true   # look the skin up on every join, so a change made on the Bedrock side shows here
  retries = 2              # how many times a failed lookup is retried before the join falls through undressed
}

# What a player may wear, and how often they may change it.
limits {
  cooldown-seconds = 30   # between one change and the next; 0 turns the cooldown off
  blocked-skins = []      # names nobody may wear, matched without regard to case
  allowed-url-hosts = ["i.imgur.com", "textures.minecraft.net"]   # hosts /skin url accepts; empty allows any host
}

# The skin service that signs an uploaded image, and where /skin file reads from.
mineskin {
  api-key = ""      # optional; without a key MineSkin rate-limits harder
  folder = "skins"  # the folder under the plugin's data folder /skin file reads a <name>.png from
}
