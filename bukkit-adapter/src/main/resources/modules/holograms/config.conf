# Holograms — native Display-entity holograms behind /hologram.
enabled = true

# Floating damage / healing numbers that pop at an entity when it is hurt or healed and vanish after a
# short duration. Off by default — turn enabled on to show them. The formats are MiniMessage; {amount} is
# the rounded value (the leading - / + and the colour are part of the format).
damage-indicators {
  enabled = false
  show-for-players = true
  show-for-mobs = true
  show-heal = true
  duration-ticks = 20
  damage-format = "<red>-{amount}"
  crit-format = "<gold><bold>-{amount} ✦"
  heal-format = "<green>+{amount}"
}
