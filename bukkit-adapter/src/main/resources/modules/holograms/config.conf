# Holograms: native Display-entity holograms behind /hologram.
#
# A hologram line is MiniMessage written as it shows. A line written as @key reads a message catalogue entry instead,
# and every player reads it in their own language: add the key to messages/messages_<lang>.conf in each language you
# serve (English is the fallback), then /hologram addline <name> @custom.my-line. Arguments follow the key as
# name=value and fill the entry's {name} tokens, so one entry serves many holograms:
# @custom.online-players server=skyblock. A key no catalogue holds leaves the line exactly as written.
enabled = true

# Text macros applied to every hologram line before it renders: a literal token mapped to its replacement
# (the replacement may use MiniMessage). Handy for recurring symbols. Empty by default. Tokens must not
# contain a dot. Example:
#   symbols {
#     ":heart:" = "<red>❤"
#     ":star:" = "<gold>★"
#   }
symbols {}

# Floating damage / healing numbers that pop at an entity when it is hurt or healed and vanish after a
# short duration. Off by default; turn enabled on to show them. The formats are MiniMessage; {amount} is
# the rounded value (the leading - / + and the colour are part of the format).
damage-indicators {
  enabled = false
  show-for-players = true
  show-for-mobs = true
  show-heal = true
  duration-ticks = 20
  damage-format = "<red>-{amount}"
  crit-format = "<gold><bold>-{amount} ✦"
  heal-format = "<green>+{amount}"
}
