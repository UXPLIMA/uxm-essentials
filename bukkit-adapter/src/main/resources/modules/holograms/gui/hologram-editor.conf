# Layout of the per-hologram editor (opened by clicking a hologram in the /hologram list). Titles, labels and
# value lore stay in the message catalog (messages_<lang>.conf); only the geometry and the materials live here,
# so editing this file never touches a translation.

# Menu height in rows (1..6). Six rows fit the full property grid with a navigation row at the bottom.
rows = 6

# The i-th property button is drawn in the i-th slot below, and a click on that slot resolves back to it. The
# property order, set in code, is: name, move-here, lines, scale, billboard, alignment, visibility-mode,
# visibility-distance, view-range, line-width, brightness-block, brightness-sky, text-shadow, see-through,
# rotation-yaw, rotation-pitch, refresh-interval, grow-up, click-command, leaderboard-limit, npc-link, blacklist,
# background-colour, glow-colour, text-opacity, shadow-radius, shadow-strength, translation-x/y/z.
property-slots = [
  10, 11, 12, 13, 14, 15, 16,
  19, 20, 21, 22, 23, 24, 25,
  28, 29, 30, 31, 32, 33, 34,
  37, 38, 39, 40, 41, 42, 43,
  46, 47
]

# Slot the back button (returns to the list) sits in.
back-slot = 49

# Slot the delete button sits in (set to -1 to remove it). Deleting is confirm-gated.
delete-slot = 53

# Materials for the back and delete buttons, and the background filler.
back-icon = "ARROW"
delete-icon = "BARRIER"
filler = "BLACK_STAINED_GLASS_PANE"

# Geometry of the line-list sub-menu (opened from the "lines" and "blacklist" property buttons). The entry
# slots are where each list row is drawn; add and back sit in the bottom row.
lines-rows = 6
lines-entry-slots = [
  10, 11, 12, 13, 14, 15, 16,
  19, 20, 21, 22, 23, 24, 25,
  28, 29, 30, 31, 32, 33, 34
]
lines-add-slot = 48
lines-back-slot = 50
lines-entry-icon = "PAPER"
lines-add-icon = "LIME_DYE"
lines-back-icon = "ARROW"
lines-filler = "BLACK_STAINED_GLASS_PANE"

# Geometry of the enum selector sub-menus (billboard, alignment, visibility mode). The option slots are where
# each choice is drawn.
selector-rows = 3
selector-option-slots = [10, 11, 12, 13, 14, 15, 16]
selector-option-icon = "PAPER"
selector-filler = "BLACK_STAINED_GLASS_PANE"
