# Layout of the /hologram management list (opened by /hologram with no arguments). Titles and lore stay in
# the message catalog (messages_<lang>.conf); only the geometry and the icons live here, so editing this file
# never touches a translation. Each stored hologram contributes one clickable icon, paged when there are more
# than fit.

# Menu height in rows (1..6). Six rows give 45 content slots above the reserved navigation row.
rows = 6

# Icon a hologram falls back to in the list. The list renderer always supplies this material, since a hologram
# carries no item of its own.
fallback-icon = "ARMOR_STAND"

# Material of the previous/next page buttons.
nav-icon = "ARROW"

# Slots the previous- and next-page buttons sit in (bottom row of a six-row menu).
prev-slot = 48
next-slot = 50

# Slots the hologram entries fill. Leave empty to use every slot except the bottom navigation row.
content-slots = []

# Material the unused border cells are filled with.
filler = "BLACK_STAINED_GLASS_PANE"

# The create button: the slot it sits in (set to -1 to remove it) and its material. Clicking it opens an anvil
# to name a new hologram, which is created at the operator's feet.
create-slot = 49
create-icon = "LIME_DYE"
