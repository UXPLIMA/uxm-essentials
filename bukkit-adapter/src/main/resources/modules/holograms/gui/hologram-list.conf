# The /hologram management list (opened by /hologram with no arguments, or the holograms entry on the /uxmess gui
# hub), rendered through the menu engine. One ARMOR_STAND icon per stored hologram newest-stored-first as the
# repository returns them, paged when there are more than fit, with a create button and the two nav arrows on the
# bottom row. The grid is the holograms:list source; each entry's name and lore resolve from the holograms message
# catalog, filled with that hologram's name, line count, world, and rounded coordinates through the hologram_*
# placeholders. A left click opens that hologram's bespoke property editor through holograms:edit; the create button
# prompts for a name and creates a fresh text hologram at the operator's feet through holograms:create, the same use
# case /hologram create drives. Every label resolves from the catalog, so no user-facing text lives here. The
# geometry mirrors the original fixed six-row list: a grid across the top five rows and the create/nav buttons on the
# bottom row.
title = "@hologram.gui.list.title"
rows = 6
open-actions = ["sound:ITEM_BOOK_PAGE_TURN 0.7 1.2"]

items {
  # The grey-glass backdrop. Lowest priority, so the content grid and the buttons drawn below sit on top of it.
  filler {
    slots    = ["0-53"]
    material = BLACK_STAINED_GLASS_PANE
    name     = ""
    priority = 0
  }

  # The hologram grid, paginated across the top five rows (the bottom row is reserved for the create and nav
  # buttons). Each cell shows an ARMOR_STAND with the hologram's name and detail lore; a left click opens that
  # hologram's editor through holograms:edit.
  holograms {
    slots    = ["0-44"]
    priority = 5
    list {
      source = "holograms:list"
      template {
        material = ARMOR_STAND
        name     = "@hologram.gui.list.entry-name"
        lore     = ["@hologram.gui.list.entry-lore"]
        click { left = ["holograms:edit"] }
      }
    }
  }

  # Create a new hologram: prompt for a name, then create a text hologram at the operator's feet, exactly as the old
  # create button did. Pinned to the bottom row, between the page arrows.
  create {
    slot     = 49
    material = LIME_DYE
    name     = "@hologram.gui.list.create"
    priority = 10
    click { left = ["holograms:create"] }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 48
    type     = PREVIOUS
    material = ARROW
    name     = "@hologram.gui.list.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 50
    type     = NEXT
    material = ARROW
    name     = "@hologram.gui.list.next"
    priority = 10
  }
}
