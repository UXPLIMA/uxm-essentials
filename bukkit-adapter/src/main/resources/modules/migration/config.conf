# Data importer — a one-shot admin tool, off until you run /uxmess import <source>.
enabled = false

# LiteBans importer source (JDBC). Reads bans, ip-bans, mutes and warnings from a LiteBans database.
litebans {
  # JDBC URL of the LiteBans database. Leave empty to auto-detect a LiteBans H2 file under
  # plugins/LiteBans/ and open it read-only. Examples:
  #   jdbc:mariadb://localhost:3306/litebans
  #   jdbc:postgresql://localhost:5432/litebans
  #   jdbc:h2:file:/path/to/litebans;ACCESS_MODE_DATA=r
  jdbc-url = ""
  username = ""
  password = ""
  # LiteBans table prefix (its config.yml default). Sanitised to [a-z0-9_] before use.
  table-prefix = "litebans_"
}

# AxPlayerWarps importer source (JDBC). Reads player-owned warps with their ratings, whitelist,
# blacklist (imported as warp bans), favourites and visit tallies. Run /uxmess import axplayerwarps.
axplayerwarps {
  # JDBC URL of the AxPlayerWarps database. Leave empty to auto-detect an AxPlayerWarps H2 file under
  # plugins/AxPlayerWarps/ and open it read-only. Examples:
  #   jdbc:mariadb://localhost:3306/axplayerwarps
  #   jdbc:postgresql://localhost:5432/axplayerwarps
  #   jdbc:h2:file:/path/to/AxPlayerWarps/data;ACCESS_MODE_DATA=r
  jdbc-url = ""
  username = ""
  password = ""
}
