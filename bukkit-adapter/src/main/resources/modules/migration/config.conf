# Data importer: a one-shot admin tool, off until you run /uxmess import <source>.
enabled = false

# Where /uxmess import essentialsx reads from: a folder relative to plugins/. The default is the folder
# EssentialsX itself writes. A folder that does not exist, or holds no userdata/, warps/ or kits.yml, leaves the
# import with nothing to read. The other sources ignore this key and use their own block below.
source-path = "Essentials"

# What an import does with a record that already exists here: a home in the same slot, a warp, kit, hologram or
# world with the same name, or a ban, mute or jail on the same player. Player warps, warnings and mail are never
# replaced, and a balance follows balance-policy instead.
#   skip       keep the existing record. Safe to run again.
#   overwrite  replace the existing record with the imported one.
#   merge      accepted, and handled like overwrite.
# Any other value logs a warning naming this file and key, and the import uses skip.
on-conflict = "skip"

# Whether an imported balance replaces one a wallet already holds. An import sets the balance, it never adds to it.
#   skip-if-present  leave a wallet that already holds money untouched. Safe to run again.
#   overwrite        set every imported wallet to the source balance; use it only on an economy nobody has used yet.
# Any other value logs a warning naming this file and key, and the import uses skip-if-present.
balance-policy = "skip-if-present"

# LiteBans importer source (JDBC). Reads bans, ip-bans, mutes and warnings from a LiteBans database.
litebans {
  # JDBC URL of the LiteBans database. Leave empty to auto-detect a LiteBans H2 file under
  # plugins/LiteBans/ and open it read-only. Examples:
  #   jdbc:mariadb://localhost:3306/litebans
  #   jdbc:postgresql://localhost:5432/litebans
  #   jdbc:h2:file:/path/to/litebans;ACCESS_MODE_DATA=r
  jdbc-url = ""
  username = ""
  password = ""
  # LiteBans table prefix, as set in LiteBans' config.yml; empty means litebans_. Only lowercase letters, digits
  # and _ are accepted: any other value is not cleaned up, it stops the LiteBans import with an error in the log.
  table-prefix = "litebans_"
}

# AxPlayerWarps importer source (JDBC). Reads player-owned warps with their ratings, whitelist,
# blacklist (imported as warp bans), favourites and visit tallies. Run /uxmess import axplayerwarps.
axplayerwarps {
  # JDBC URL of the AxPlayerWarps database. Leave empty to auto-detect an AxPlayerWarps H2 file under
  # plugins/AxPlayerWarps/ and open it read-only. Examples:
  #   jdbc:mariadb://localhost:3306/axplayerwarps
  #   jdbc:postgresql://localhost:5432/axplayerwarps
  #   jdbc:h2:file:/path/to/AxPlayerWarps/data;ACCESS_MODE_DATA=r
  jdbc-url = ""
  username = ""
  password = ""
}

# Athelion PlayerWarps importer source (YAML). Reads player-owned warps from Athelion's serialised
# data.yml; access from the password/status gate, ratings, and blocked-players (imported as warp
# bans). Run /uxmess import athelionplayerwarps.
athelionplayerwarps {
  # Path to Athelion's data.yml, relative to the plugins/ directory. The default is where Athelion's
  # dev.revivalo PlayerWarps plugin writes it.
  data-file = "PlayerWarps/data.yml"
}

# Olzie PlayerWarps importer source (JDBC). The richest player-warp source: reads player-owned warps
# with their ratings, whitelist, managers (imported as warp members), bans (with reason) and
# favourites. Run /uxmess import olzieplayerwarps.
olzieplayerwarps {
  # JDBC URL of the Olzie PlayerWarps database. Leave empty to auto-detect Olzie's SQLite database
  # under plugins/PlayerWarps/data/ and open it read-only. A SQLite URL is always opened read-only.
  # Examples:
  #   jdbc:sqlite:file:/path/to/PlayerWarps/data/database.db?open_mode=1
  #   jdbc:mariadb://localhost:3306/playerwarps
  jdbc-url = ""
  username = ""
  password = ""
}
