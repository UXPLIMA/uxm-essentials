# Vaults — DB-persisted /vault storage.
enabled = true
default-amount = 1                  # vaults per player without a uxmessentials.vault.amount.<n> node
default-size = 6                    # rows per vault (1-6) without a uxmessentials.vault.size.<n> node

# Economy integration. When an economy provider is wired and enabled = true, players are charged the
# configured amount for vault actions. Set a cost to 0 (or keep enabled = false) for free actions. The
# uxmessentials.vault.free node bypasses every charge. /vault delete is direct (no confirmation prompt).
economy {
  enabled = false                  # charge players for vault actions (requires an economy provider)
  cost-to-create = 0               # charged once when a new vault index is first allocated
  cost-to-open = 0                 # charged each time a vault is opened (a per-open fee)
  refund-on-delete = 0             # paid back when the owner deletes their own vault
}
