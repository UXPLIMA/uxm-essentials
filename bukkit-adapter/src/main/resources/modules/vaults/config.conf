# Vaults — DB-persisted /vault storage.
enabled = true
default-amount = 1                  # vaults per player without a uxmessentials.vault.amount.<n> node
default-size = 6                    # rows per vault (1-6) without a uxmessentials.vault.size.<n> node

# A sound played to a player when they open a vault. A Bukkit sound key (e.g. "block.chest.open" or the
# UPPER_SNAKE "BLOCK_CHEST_OPEN" form). Leave empty for no sound; an unknown name is silently ignored.
open-sound = ""

# Inactive-vault cleanup. When enabled, a background sweep periodically deletes every vault not opened or
# saved within inactive-days, reclaiming storage held by players who long ago abandoned a vault. Off by
# default; turn it on deliberately. The purge is DB-backed and survives a restart — a deleted vault is gone.
cleanup {
  enabled = false                  # run the inactive-vault purge sweep (false = vaults are never auto-deleted)
  inactive-days = 30               # a vault untouched for this many days is purged (minimum 1; 0 is treated as 1)
  interval-hours = 24              # how often the sweep runs (at least 1 hour)
}

# Materials a vault refuses to store. A blacklisted item placed in a vault is returned to the player when
# they close it (dropped at their feet if their inventory is full) — it is never stored. Names are Bukkit
# material names, matched case-insensitively (e.g. "bedrock", "barrier"). The
# uxmessentials.vault.bypass-blacklist node lets staff store anything. Leave empty to allow every item.
blacklist-materials = []

# The /vault selector menu: with several vaults owned, /vault (no number) opens a paginated picker of the
# player's vaults instead of listing them in chat. An owned vault is a clickable chest icon; a locked index
# (within the player's amount quota but not yet unlocked) shows a greyed pane when show-locked is on.
selector {
  enabled = true                   # open the picker for a multi-vault owner (false = the old chat list)
  rows = 3                         # picker menu height (1-6); the bottom row holds the page buttons
  show-locked = true               # also show greyed icons for not-yet-unlocked indices up to the quota
  owned-icon = "CHEST"             # icon material for an owned vault (unknown name falls back to CHEST)
  locked-icon = "GRAY_STAINED_GLASS_PANE"  # icon material for a locked index
}

# Economy integration. When an economy provider is wired and enabled = true, players are charged the
# configured amount for vault actions. Set a cost to 0 (or keep enabled = false) for free actions. The
# uxmessentials.vault.free node bypasses every charge. /vault delete is direct (no confirmation prompt).
economy {
  enabled = false                  # charge players for vault actions (requires an economy provider)
  cost-to-create = 0               # charged once when a new vault index is first allocated
  cost-to-open = 0                 # charged each time a vault is opened (a per-open fee)
  refund-on-delete = 0             # paid back when the owner deletes their own vault
}
