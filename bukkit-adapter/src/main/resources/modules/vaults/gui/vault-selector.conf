# The /vault picker, rendered through the menu engine. One icon per vault index the player could hold, from 1 up to
# their resolved amount cap: an owned index shows a filled chest that opens that vault on click, while a locked
# index (within the cap but not yet allocated) shows a greyed pane that only nudges the player to open it with
# /vault <n>. The owned and locked cells collapse into one list template over the vault:slots source; the
# vault_icon / vault_name / vault_lore placeholders branch on whether the bound slot is owned. Every label resolves
# from the vaults message catalog, so no user-facing text lives here. The geometry mirrors the original fixed
# three-row picker: a grid of icons across the top two rows and the two nav arrows in the bottom row.
title = "@vaults.selector.title"
rows = 3

items {
  # The vault grid, paginated across the top two rows. Each cell shows its slot's icon material and label; an owned
  # cell's left click opens that vault through vault:open-slot, a locked cell's click sends the unlock nudge.
  slots {
    slots    = ["0-17"]
    priority = 5
    list {
      source = "vault:slots"
      template {
        material = "%vault_icon%"
        name     = "%vault_name%"
        lore     = ["%vault_lore%"]
        click { left = ["vault:open-slot"] }
      }
    }
  }

  # Previous page. Pinned to the bottom row, clear of the content grid above.
  previous {
    slot     = 21
    type     = PREVIOUS
    material = ARROW
    name     = "@vaults.selector.prev"
    priority = 10
  }

  # Next page.
  next {
    slot     = 23
    type     = NEXT
    material = ARROW
    name     = "@vaults.selector.next"
    priority = 10
  }
}
