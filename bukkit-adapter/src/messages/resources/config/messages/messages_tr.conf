# Turkish message catalog. Carries exactly the same key set as messages_en.conf (the authority);
# MessageKeyLocaleParityDriftTest fails the build if a key is missing or extra. Values are MiniMessage
# templates with literal {name} placeholders resolved before parsing. The <prefix> tag is injected by
# the sink — do not prepend it manually.

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<gray>[<aqua>uxm</aqua>]</gray> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<prefix><red>Buna yetkin yok."
"command.players-only" = "<prefix><red>Bu komut yalnızca oyuncular içindir."
"command.unknown-player" = "<prefix><red><yellow>{player}</yellow> adında bir oyuncu bulunamadı."

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<prefix><red>Tekrar kullanmadan önce <gold>{seconds}sn</gold> bekle."
"warmup.started" = "<prefix><gray>Kıpırdama — <gold>{seconds}sn</gold> içinde ışınlanıyorsun."
"warmup.cancelled" = "<prefix><red>Işınlanma iptal edildi — hareket ettin."

# Shared /lang personal locale override feedback.
"lang.status" = "<prefix><gray>Dilin <yellow>{locale}</yellow>. Mevcut: <white>{available}</white>."
"lang.set" = "<prefix><green>Dil <yellow>{locale}</yellow> olarak ayarlandı."
