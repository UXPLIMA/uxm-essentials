# English message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink —
# do not prepend it manually here.

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<gray>[<aqua>uxm</aqua>]</gray> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<prefix><red>You don't have permission."
"command.players-only" = "<prefix><red>This command is player-only."
"command.unknown-player" = "<prefix><red>No player named <yellow>{player}</yellow> was found."

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<prefix><red>Wait <gold>{seconds}s</gold> before using that again."
"warmup.started" = "<prefix><gray>Don't move — teleporting in <gold>{seconds}s</gold>."
"warmup.cancelled" = "<prefix><red>Teleport cancelled — you moved."

# Teleport context — tpa lifecycle.
"teleport.tpa.sent" = "<prefix><gray>Request sent to <yellow>{player}</yellow>."
"teleport.tpa.received" = "<prefix><yellow>{player}</yellow><gray> wants to teleport to you. <green>/tpaccept</green> or <red>/tpdeny</red>."
"teleport.tpa.here-received" = "<prefix><yellow>{player}</yellow><gray> wants you to teleport to them. <green>/tpaccept</green> or <red>/tpdeny</red>."
"teleport.tpa.accepted" = "<prefix><green>{player}</green><gray> accepted your request."
"teleport.tpa.denied" = "<prefix><red>{player}</red><gray>'s request was denied."
"teleport.tpa.cancelled" = "<prefix><gray>Your request to <yellow>{player}</yellow> was cancelled."
"teleport.tpa.expired" = "<prefix><gray>The teleport request with <yellow>{player}</yellow> expired."
"teleport.tpa.self" = "<prefix><red>You cannot request to teleport to yourself."
"teleport.tpa.target-offline" = "<prefix><red>That player is no longer online."
"teleport.tpa.toggled-off" = "<prefix><red>That player is not accepting teleport requests."
"teleport.tpa.blocked" = "<prefix><red>You cannot send that player a teleport request."
"teleport.tpa.none-pending" = "<prefix><red>You have no pending teleport request."
"teleport.tpa.toggle-on" = "<prefix><green>You are now accepting teleport requests."
"teleport.tpa.toggle-off" = "<prefix><gray>You are no longer accepting teleport requests."

# Teleport context — back.
"teleport.back.returned" = "<prefix><gray>Returned to your previous location."
"teleport.back.none" = "<prefix><red>You have no location to return to."
"teleport.back.death-denied" = "<prefix><red>You cannot return to your death location."

# Teleport context — random teleport.
"teleport.rtp.searching" = "<prefix><gray>Finding a safe spot…"
"teleport.rtp.disallowed" = "<prefix><red>Random teleport is not allowed from this world."
"teleport.rtp.no-location" = "<prefix><red>Could not find a safe location — try again shortly."

# Teleport context — spawn.
"teleport.spawn.teleported" = "<prefix><gray>Teleported to spawn."
"teleport.spawn.set" = "<prefix><green>Spawn set."
"teleport.spawn.unresolved" = "<prefix><red>No spawn is configured for this world."

# Teleport context — admin / positional.
"teleport.tp.done" = "<prefix><green>Teleported."
"teleport.tp.no-target-block" = "<prefix><red>No block in sight to teleport to."

# Teleport context — shared cooldown / warmup feedback for the teleport tiers.
"teleport.cooldown.active" = "<prefix><red>Wait <gold>{seconds}s</gold> before teleporting again."
"teleport.warmup.started" = "<prefix><gray>Don't move — teleporting in <gold>{seconds}s</gold>."
"teleport.warmup.cancelled" = "<prefix><red>Teleport cancelled — you moved."
