"itemworld.enchant.unknown" = "<prefix><red>No enchantment named <yellow>{enchant}</yellow>."
"itemworld.enchant.level-clamped" = "<prefix><yellow>Level capped at <gold>{level}</gold>."
# Itemworld context — /hat.
"itemworld.hat.worn" = "<prefix><green>You are now wearing the held item as a hat."
"itemworld.hat.no-item" = "<prefix><red>Hold an item to wear it as a hat."
# Itemworld context — /itemdb.
"itemworld.itemdb.report" = "<prefix><gray>Held item: <gold>{item}</gold> (max stack <white>{max}</white>)."

# Itemworld context — virtual workstations (one line, parameterised by station).
"itemworld.workstation.opened" = "<prefix><green>Opened a virtual <gold>{station}</gold>."

# Itemworld context — cleanup (/disposal, /condense).
"itemworld.disposal.opened" = "<prefix><green>Opened a disposal window — anything left inside is discarded."
"itemworld.condense.done" = "<prefix><green>Condensed <gold>{count}</gold> stack(s)."
"itemworld.condense.nothing" = "<prefix><gray>Nothing to condense."

# Itemworld context — powertool (/powertool, /powertooltoggle).
"itemworld.powertool.bound" = "<prefix><green>Bound <gold>{command}</gold> to the held item."
"itemworld.powertool.cleared" = "<prefix><green>Cleared the held item''s powertool binding."
"itemworld.powertool.no-item" = "<prefix><red>Hold an item to bind a command to it."
"itemworld.powertool.enabled" = "<prefix><green>Your powertool bindings are now <green>enabled</green>."
"itemworld.powertool.disabled" = "<prefix><gray>Your powertool bindings are now <red>disabled</red>."

# Itemworld context — mob & entity (/spawnmob, /spawner, /kill, /butcher, /killall, /remove, /unlimited).
"itemworld.spawnmob.spawned" = "<prefix><green>Spawned <gold>{amount}x {mob}</gold>."
"itemworld.spawnmob.unknown" = "<prefix><red>No mob type named <yellow>{mob}</yellow>."
"itemworld.spawner.set" = "<prefix><green>Set the spawner to <gold>{mob}</gold>."
"itemworld.spawner.not-a-spawner" = "<prefix><red>You are not looking at a spawner."
"itemworld.kill.done" = "<prefix><green>Killed <yellow>{target}</yellow>."
"itemworld.butcher.done" = "<prefix><green>Removed <gold>{count}</gold> mob(s) within <gold>{radius}</gold> blocks."
"itemworld.killall.done" = "<prefix><green>Removed <gold>{count}</gold> entity(ies) world-wide."
"itemworld.remove.done" = "<prefix><green>Removed <gold>{count}</gold> <gold>{type}</gold>."
"itemworld.unlimited.enabled" = "<prefix><green>Unlimited block placement is now <green>on</green>."
"itemworld.unlimited.disabled" = "<prefix><gray>Unlimited block placement is now <red>off</red>."

# Itemworld context — time & weather (/time, /day, /night, /weather, /sun, /rain, /thunder).
"itemworld.time.set" = "<prefix><green>Set the time in <gold>{world}</gold> to <gold>{ticks}</gold>."
"itemworld.weather.set" = "<prefix><green>Set the weather in <gold>{world}</gold> to <gold>{weather}</gold>."

# Itemworld context — admin-fun (/lightning, /fireball, /kittycannon).
"itemworld.lightning.struck" = "<prefix><green>Struck lightning at <yellow>{target}</yellow>."
"itemworld.fireball.launched" = "<prefix><green>Launched a fireball."
"itemworld.kittycannon.fired" = "<prefix><green>Fired the kitty cannon!"

# Itemworld context — shared validation failures (surfaced at the adapter boundary before a domain call).
"itemworld.unknown-item" = "<prefix><red>No item named <yellow>{item}</yellow>."
"itemworld.amount-out-of-range" = "<prefix><red>Amount must be between <gold>1</gold> and <gold>{cap}</gold>."
"itemworld.bad-time" = "<prefix><red>That is not a valid time (e.g. day, night, 6000)."
"itemworld.bad-weather" = "<prefix><red>That is not a valid weather (clear, rain, thunder)."
"itemworld.unknown-target" = "<prefix><red>No player named <yellow>{player}</yellow> was found."
"itemworld.no-item-in-hand" = "<prefix><red>You are not holding an item."
"itemworld.command-disabled" = "<prefix><red>That command is disabled."
