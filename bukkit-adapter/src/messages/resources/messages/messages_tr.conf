# Turkish message catalog. Carries exactly the same key set as messages_en.conf (the authority);
# MessageKeyLocaleParityDriftTest fails the build if a key is missing or extra. Values are MiniMessage
# templates with literal {name} placeholders resolved before parsing. The <prefix> tag is injected by
# the sink — do not prepend it manually.

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "「 <gradient:#fc7a00:#fcc600><b>uxmEssentials</b></gradient> 」 "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<etag:'ERROR'><bad>Buna yetkin yok.</bad> ✗"
"command.players-only" = "<etag:'ERROR'><bad>Bu komut yalnızca oyuncular içindir.</bad> ✗"
"command.unknown-player" = "<etag:'ERROR'><value>{player}</value> <body>adında bir oyuncu bulunamadı.</body> ✗"
# Kendi önekini taşır: bu satır doğrudan ayrıştırılır (sink yok), bu yüzden <prefix> etiketini kullanamaz.
"command.usage" = "<tag:'USAGE'> <value>/{command}</value> <body>{usage}</body> <muted>—</muted> <body>{description}</body>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<etag:'ERROR'><body>Tekrar kullanmadan önce</body> <level>{seconds}sn</level> <body>bekle.</body> ✗"
"warmup.started" = "<tag:'TELEPORT'> <body>Kıpırdama —</body> <level>{seconds}sn</level> <body>içinde ışınlanıyorsun.</body>"
"warmup.cancelled" = "<etag:'ERROR'><bad>Işınlanma iptal edildi — hareket ettin.</bad> ✗"

# Shared /lang personal locale override feedback.
"lang.status" = "<tag:'LANG'> <body>Dilin</body> <value>{locale}</value><body>. Mevcut:</body> <body>{available}</body>. ℹ"
"lang.set" = "<tag:'LANG'> <body>Dil</body> <value>{locale}</value> <body>olarak ayarlandı.</body> ✓"
"lang.reset" = "<tag:'LANG'> <body>Dil, istemci varsayılanına sıfırlandı.</body> ✓"
"lang.unknown" = "<etag:'ERROR'><body>Bilinmeyen dil</body> <value>{code}</value><body>. Mevcut:</body> <body>{available}</body>. ✗"
"lang.available" = "<tag:'LANG'> <body>Mevcut diller:</body> <body>{available}</body>. ℹ"

# Tüm modülleri ilgilendiren /help komut listesi — kullanıcının kullanabileceği komutların sayfalanmış bir sayfası.
"help.header" = "<h:'HELP'> <muted>(sayfa <level>{page}</level>/<level>{pages}</level>)</muted>"
"help.entry" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>/{command} yazmak için tıkla</muted>'><value>/{command}</value></hover></click> <muted>—</muted> <body>{description}</body>"
"help.entry-aliases" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>/{command} yazmak için tıkla</muted>'><value>/{command}</value></hover></click> <muted>(<body>{aliases}</body>)</muted>"
"help.empty" = "<tag:'HELP'> <body>Kullanabileceğin hiçbir komut yok.</body> ℹ"
"help.no-match" = "<tag:'HELP'> <value>{query}</value> <body>ile eşleşen komut yok.</body> ℹ"
"help.footer" = "<muted>{prev} sayfa <level>{page}</level>/<level>{pages}</level> {next}</muted>"
"help.footer-prev" = "<click:run_command:'/help {target}'><hover:show_text:'<muted>Önceki sayfa</muted>'><value>«</value></hover></click>"
"help.footer-next" = "<click:run_command:'/help {target}'><hover:show_text:'<muted>Sonraki sayfa</muted>'><value>»</value></hover></click>"

