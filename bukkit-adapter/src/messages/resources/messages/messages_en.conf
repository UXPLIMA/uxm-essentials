# English message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink —
# do not prepend it manually here.

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<gradient:#4aa3ff:#9b6bff>uxm</gradient> <dark_gray>»</dark_gray> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<prefix><#ff6b6b>You don't have permission."
"command.players-only" = "<prefix><#ff6b6b>This command is player-only."
"command.unknown-player" = "<prefix><#ff6b6b>No player named <#7cc7ff>{player}</#7cc7ff> was found."
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<gradient:#4aa3ff:#9b6bff>uxm</gradient> <dark_gray>»</dark_gray> <#7cc7ff>/{command}</#7cc7ff> <#aeb8c4>{usage}</#aeb8c4> <dark_gray>—</dark_gray> <#6b7480>{description}</#6b7480>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
