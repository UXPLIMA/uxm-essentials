# English message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink:
# do not prepend it manually here.

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<tag:'uxmEssentials'> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<etag:'ERROR'> <bad>ʏᴏᴜ ᴅᴏɴ'ᴛ ʜᴀᴠᴇ ᴘᴇʀᴍɪꜱꜱɪᴏɴ.</bad>"
"command.players-only" = "<etag:'ERROR'> <bad>ᴛʜɪꜱ ᴄᴏᴍᴍᴀɴᴅ ɪꜱ ᴘʟᴀʏᴇʀ-ᴏɴʟʏ.</bad>"
"command.unknown-player" = "<etag:'ERROR'> <body>ɴᴏ ᴘʟᴀʏᴇʀ ɴᴀᴍᴇᴅ</body> <value>{player}</value> <body>ᴡᴀꜱ ꜰᴏᴜɴᴅ.</body>"
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<tag:'USAGE'> <value>/{command}</value> <body>{usage}</body> <dim>•</dim> <body>{description}</body>"
# Shown when a command handler trips over an unexpected fault: a calm retry line, no technical detail leaks.
"command.error" = "<etag:'ERROR'> <bad>ꜱᴏᴍᴇᴛʜɪɴɢ ᴡᴇɴᴛ ᴡʀᴏɴɢ ʀᴜɴɴɪɴɢ ᴛʜᴀᴛ ᴄᴏᴍᴍᴀɴᴅ. ᴘʟᴇᴀꜱᴇ ᴛʀʏ ᴀɢᴀɪɴ ɪɴ ᴀ ᴍᴏᴍᴇɴᴛ.</bad>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<etag:'ERROR'> <body>ᴡᴀɪᴛ</body> <level>{seconds}ꜱ</level> <body>ʙᴇꜰᴏʀᴇ ᴜꜱɪɴɢ ᴛʜᴀᴛ ᴀɢᴀɪɴ.</body>"
"warmup.started" = "<tag:'TELEPORT'> <body>ᴅᴏɴ'ᴛ ᴍᴏᴠᴇ, ᴛᴇʟᴇᴘᴏʀᴛɪɴɢ ɪɴ</body> <level>{seconds}ꜱ</level><body>.</body>"
"warmup.cancelled" = "<etag:'ERROR'> <bad>ᴛᴇʟᴇᴘᴏʀᴛ ᴄᴀɴᴄᴇʟʟᴇᴅ, ʏᴏᴜ ᴍᴏᴠᴇᴅ.</bad>"

# Shared /lang personal locale override feedback.
"lang.status" = "<tag:'LANG'> <body>ʏᴏᴜʀ ʟᴀɴɢᴜᴀɢᴇ ɪꜱ</body> <value>{locale}</value><body>. ᴀᴠᴀɪʟᴀʙʟᴇ:</body> <body>{available}</body>."
"lang.set" = "<tag:'LANG'> <body>ʟᴀɴɢᴜᴀɢᴇ ꜱᴇᴛ ᴛᴏ</body> <value>{locale}</value><body>.</body>"
"lang.reset" = "<tag:'LANG'> <body>ʟᴀɴɢᴜᴀɢᴇ ʀᴇꜱᴇᴛ ᴛᴏ ʏᴏᴜʀ ᴄʟɪᴇɴᴛ ᴅᴇꜰᴀᴜʟᴛ.</body>"
"lang.unknown" = "<etag:'ERROR'> <body>ᴜɴᴋɴᴏᴡɴ ʟᴀɴɢᴜᴀɢᴇ</body> <value>{code}</value><body>. ᴀᴠᴀɪʟᴀʙʟᴇ:</body> <body>{available}</body>."
"lang.available" = "<tag:'LANG'> <body>ᴀᴠᴀɪʟᴀʙʟᴇ ʟᴀɴɢᴜᴀɢᴇꜱ:</body> <body>{available}</body>."

# Cross-cutting /help command listing: one paginated page of the commands the sender may use.
"help.header" = "<h:'HELP'> <muted>(ᴘᴀɢᴇ <level>{page}</level>/<level>{pages}</level>)</muted>"
"help.entry" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>ᴄʟɪᴄᴋ ᴛᴏ ᴛʏᴘᴇ /{command}</muted>'><value>/{command}</value></hover></click> <dim>•</dim> <body>{description}</body>"
"help.entry-aliases" = "<muted>-</muted> <click:suggest_command:'/{command}'><hover:show_text:'<muted>ᴄʟɪᴄᴋ ᴛᴏ ᴛʏᴘᴇ /{command}</muted>'><value>/{command}</value></hover></click> <muted>(<body>{aliases}</body>)</muted>"
"help.empty" = "<tag:'HELP'> <body>ʏᴏᴜ ʜᴀᴠᴇ ɴᴏ ᴄᴏᴍᴍᴀɴᴅꜱ ᴀᴠᴀɪʟᴀʙʟᴇ.</body>"
"help.no-match" = "<tag:'HELP'> <body>ɴᴏ ᴄᴏᴍᴍᴀɴᴅꜱ ᴍᴀᴛᴄʜ</body> <value>{query}</value><body>.</body>"
"help.footer" = "<muted>{prev} ᴘᴀɢᴇ <level>{page}</level>/<level>{pages}</level> {next}</muted>"
"help.footer-prev" = "<accent>← ᴘʀᴇᴠɪᴏᴜꜱ ᴘᴀɢᴇ</accent>"
"help.footer-next" = "<accent>→ ɴᴇxᴛ ᴘᴀɢᴇ</accent>"

# Another plugin refused the action through the developer API. It is not an error on our side, so the line stays
# short: whoever refused it is the one who can explain why.
"common.action-vetoed" = "<etag:'INFO'> ᴀɴᴏᴛʜᴇʀ ᴘʟᴜɢɪɴ ʙʟᴏᴄᴋᴇᴅ ᴛʜᴀᴛ ᴀᴄᴛɪᴏɴ."

