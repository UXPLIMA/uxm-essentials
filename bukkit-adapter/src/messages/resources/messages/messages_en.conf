"security.2fa.setup-uri" = "<body>ᴏʀ ᴜꜱᴇ ᴛʜɪꜱ ꜱᴇᴛᴜᴘ ʟɪɴᴋ:</body> <click:copy_to_clipboard:'{uri}'><hover:show_text:'<muted>ᴄʟɪᴄᴋ ᴛᴏ ᴄᴏᴘʏ</muted>'><value>{uri}</value></hover></click>"
