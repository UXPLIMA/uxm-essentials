# Sponsorship (/pwarp sponsor): buy a paid, time-limited pinned browse slot for a warp.
"pwarp.sponsored" = "<tag:'PWARP'> ᴘʟᴀʏᴇʀ ᴡᴀʀᴘ <value>{warp}</value> ɪꜱ ɴᴏᴡ ꜱᴘᴏɴꜱᴏʀᴇᴅ ꜰᴏʀ <value>{days}</value> ᴅᴀʏ(ꜱ)."
"pwarp.sponsored-locked" = "<etag:'PWARP'> ᴘʟᴀʏᴇʀ ᴡᴀʀᴘ <value>{warp}</value> ᴄᴀɴɴᴏᴛ ʙᴇ ᴛʀᴀɴꜱꜰᴇʀʀᴇᴅ ᴡʜɪʟᴇ ɪᴛ ɪꜱ ꜱᴘᴏɴꜱᴏʀᴇᴅ."
"pwarp.sponsor-cooldown" = "<etag:'PWARP'> ᴘʟᴀʏᴇʀ ᴡᴀʀᴘ <value>{warp}</value> ɪꜱ ꜱᴛɪʟʟ ᴏɴ ꜱᴘᴏɴꜱᴏʀ ᴄᴏᴏʟᴅᴏᴡɴ, ᴛʀʏ ᴀɢᴀɪɴ ʟᴀᴛᴇʀ."
"pwarp.sponsor-limit" = "<etag:'PWARP'> ʏᴏᴜ ᴀʟʀᴇᴀᴅʏ ʜᴀᴠᴇ ᴛʜᴇ ᴍᴀxɪᴍᴜᴍ ɴᴜᴍʙᴇʀ ᴏꜰ ꜱᴘᴏɴꜱᴏʀᴇᴅ ᴡᴀʀᴘꜱ."
