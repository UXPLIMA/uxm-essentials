# English message catalog. Keys are kebab-case, dot-separated, and map 1:1 to a MessageKey
# constant. Values are MiniMessage templates; placeholders are literal {name} substitutions
# resolved before MiniMessage parses the tags. The <prefix> tag is injected by the message sink —
# do not prepend it manually here.

# The shared chat prefix, parsed into the <prefix> tag by the sink.
"prefix" = "<gradient:#4aa3ff:#9b6bff>uxmEssentials</gradient> <dark_gray>»</dark_gray> "

# Cross-cutting command failures shared by every command-bearing context.
"command.no-permission" = "<prefix><#ff6b6b>You don't have permission."
"command.players-only" = "<prefix><#ff6b6b>This command is player-only."
"command.unknown-player" = "<prefix><#ff6b6b>No player named <#7cc7ff>{player}</#7cc7ff> was found."
# Self-contained prefix: this line is deserialized directly (no sink), so it cannot use the <prefix> tag.
"command.usage" = "<gradient:#4aa3ff:#9b6bff>uxmEssentials</gradient> <dark_gray>»</dark_gray> <#7cc7ff>/{command}</#7cc7ff> <#aeb8c4>{usage}</#aeb8c4> <dark_gray>—</dark_gray> <#6b7480>{description}</#6b7480>"

# Shared cooldown / warmup feedback rendered from the Cooldowns / Warmups ports.
"cooldown.active" = "<prefix><#ff6b6b>Wait <#ffd166>{seconds}s</#ffd166> before using that again."
"warmup.started" = "<prefix><#aeb8c4>Don't move — teleporting in <#ffd166>{seconds}s</#ffd166>."
"warmup.cancelled" = "<prefix><#ff6b6b>Teleport cancelled — you moved."

# Shared /lang personal locale override feedback.
"lang.status" = "<prefix><#aeb8c4>Your language is <#7cc7ff>{locale}</#7cc7ff>. Available: <white>{available}</white>."
"lang.set" = "<prefix><#57e389>Language set to <#7cc7ff>{locale}</#7cc7ff>."
"lang.reset" = "<prefix><#aeb8c4>Language reset to your client default."
"lang.unknown" = "<prefix><#ff6b6b>Unknown language <#7cc7ff>{code}</#7cc7ff>. Available: <white>{available}</white>."
"lang.available" = "<prefix><#aeb8c4>Available languages: <white>{available}</white>."

# Cross-cutting /help command listing — one paginated page of the commands the sender may use.
"help.header" = "<prefix><gradient:#4aa3ff:#9b6bff>Commands (page <#ffd166>{page}</#ffd166>/<#ffd166>{pages}</#ffd166>):"
"help.entry" = "<#aeb8c4>- <click:suggest_command:'/{command}'><hover:show_text:'<#aeb8c4>Click to type /{command}'><#7cc7ff>/{command}</#7cc7ff></hover></click> <dark_gray>—</dark_gray> <#6b7480>{description}</#6b7480>"
