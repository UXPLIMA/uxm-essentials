# Admin group (/pwarp admin restore|purge|setowner|reload): operator verbs that act on any warp by its id.
"pwarp.admin.restored" = "<tag:'PWARP'> ʀᴇꜱᴛᴏʀᴇᴅ ᴘʟᴀʏᴇʀ ᴡᴀʀᴘ <value>#{id}</value>."
"pwarp.admin.purge-confirm" = "<etag:'PWARP'> ᴛʜɪꜱ ᴘᴇʀᴍᴀɴᴇɴᴛʟʏ ᴅᴇʟᴇᴛᴇꜱ ᴘʟᴀʏᴇʀ ᴡᴀʀᴘ <value>#{id}</value>. <click:run_command:'/pwarp admin purge {id} confirm'><cta>ʀᴜɴ /pwarp ᴀᴅᴍɪɴ ᴘᴜʀɢᴇ {id} ᴄᴏɴꜰɪʀᴍ</cta></click> ᴛᴏ ᴘʀᴏᴄᴇᴇᴅ."
"pwarp.admin.purged" = "<tag:'PWARP'> ᴘᴇʀᴍᴀɴᴇɴᴛʟʏ ᴅᴇʟᴇᴛᴇᴅ ᴘʟᴀʏᴇʀ ᴡᴀʀᴘ <value>#{id}</value>."
"pwarp.admin.setowner" = "<tag:'PWARP'> ʀᴇᴀꜱꜱɪɢɴᴇᴅ ᴘʟᴀʏᴇʀ ᴡᴀʀᴘ <value>#{id}</value> ᴛᴏ <value>{player}</value>."
"pwarp.admin.not-found" = "<etag:'PWARP'> ᴛʜᴇʀᴇ ɪꜱ ɴᴏ ᴘʟᴀʏᴇʀ ᴡᴀʀᴘ ᴡɪᴛʜ ɪᴅ <value>#{id}</value>."
"pwarp.admin.reload-hint" = "<tag:'PWARP'> ᴜꜱᴇ <value>/uxmess ʀᴇʟᴏᴀᴅ ᴘʟᴀʏᴇʀᴡᴀʀᴘꜱ</value> ᴛᴏ ʀᴇʟᴏᴀᴅ ᴛʜᴇ ᴘʟᴀʏᴇʀ-ᴡᴀʀᴘꜱ ᴍᴏᴅᴜʟᴇ."

# Player-warps rent lifecycle: the offline "rent due soon" reminder mail and the system name it is left under.
# The body is delivered as mail, so it is plain sentence text (no tag prefix); one is sent per reminder window.
"pwarp.rent.reminder" = "ʏᴏᴜʀ ᴘʟᴀʏᴇʀ ᴡᴀʀᴘ {warp} ʜᴀꜱ ʀᴇɴᴛ ᴅᴜᴇ ɪɴ ᴀʙᴏᴜᴛ {hours} ʜᴏᴜʀ(ꜱ): {amount} {currency}. ʀᴇɴᴇᴡ ɪᴛ ʙᴇꜰᴏʀᴇ ᴛʜᴇɴ, ᴏʀ ɪᴛ ᴡɪʟʟ ʙᴇ ꜱᴜꜱᴘᴇɴᴅᴇᴅ ᴀɴᴅ ᴛʜᴇɴ ᴀʀᴄʜɪᴠᴇᴅ."
