# IP/alt guard (Phase 4). The address is only ever a one-way token, never shown; {alts} is a comma-joined name list,
# {count} the number of shared accounts. alts.kicked is a kick screen (no prefix), shown when an address is over the
# account cap.
"security.alts.header" = "<tag:'Guard'> <body>Accounts sharing an IP with</body> <value>{player}</value> <body>(</body><level>{count}</level><body>):</body>"
"security.alts.entry" = " <muted>-</muted> <value>{alt}</value>"
"security.alts.none" = "<tag:'Guard'> <body>No other account shares an IP with</body> <value>{player}</value><body>.</body>"
"security.alts.notify" = "<tag:'Guard'> <value>{player}</value> <body>shares an IP with</body> <level>{count}</level> <body>account(s):</body> <value>{alts}</value>"
"security.alts.kicked" = "<bad>Too many accounts are connecting from your address.</bad>"

