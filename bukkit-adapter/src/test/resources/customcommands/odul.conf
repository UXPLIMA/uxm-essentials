command {
  name = "odul"
  aliases = ["reward"]
  localized-aliases {
    tr = ["odul", "odulver"]
    de = ["belohnung"]
  }
  permission = "uxmessentials.customcommand.odul"
  deny-message = "<red>This command is not for you."
  console = true
  description = "Reward a player"
  usage = "/odul <player> <amount> [reason]"
  cooldown = "30s"
  warmup = "0s"
  cost = 0
}

arguments = [
  { name = "target", type = online-player }
  { name = "amount", type = int, min = 1, max = 64 }
  { name = "reason", type = rest, optional = true }
]

requirements = ["has-money:100"]
requirement-deny = ["message:<red>You need 100 coins."]

actions = [
  "take-money:100"
  "console:give %arg_target% diamond %arg_amount%"
  "message:<green>Gave %arg_amount% diamonds to %arg_target%."
  "delay:2s"
  "broadcast:<gold>%player% handed out a reward."
  "sound:entity.player.levelup"
]
