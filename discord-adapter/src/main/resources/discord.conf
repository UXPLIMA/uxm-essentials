# uxmEssentials Discord bridge — config/discord.conf
#
# Optional bridge that mirrors audit events and economy notifications to Discord,
# and (when the host's discordlink module is enabled) registers a /link slash
# command players use to confirm an account-link code from /discordlink in game.
# It is dormant on first extract: leave `enabled = false` (or an empty token) and
# the plugin does nothing, so the host plugin runs unaffected. Setup runbook:
# docs/09-deployment.md Path C.
#
# Account linking needs no extra setup here: /link is registered automatically once
# the bridge connects and the host exposes its link confirmation service. The slash
# command needs no privileged intent — only a connected bot.

# Master switch. With this false the bridge never connects.
enabled = false

# The Discord bot token (Developer Portal -> your application -> Bot -> Reset Token).
# The bridge only posts text, so the privileged MESSAGE CONTENT INTENT is NOT required.
# A blank token keeps the bridge dormant even when `enabled = true`.
token = ""

# Only mirror economy transactions at or above this amount, to avoid spamming routine
# low-value /pay notifications. 0 forwards every economy notification.
min-eco-notify = 0

# Flood cap. At most this many notifications are mirrored per rolling minute; once the
# minute's budget is spent, further events are dropped until it rolls over. This protects
# the channel (and JDA's REST budget) from a burst such as a mass /kickall, a bulk eco
# sweep, or a migration import emitting thousands of per-record audit lines.
max-per-minute = 60

# Map each notification category to a Discord channel id (right-click the channel
# with Developer Mode on -> Copy Channel ID). A category left blank is not forwarded.
channels {
  # Audit events: mute / jail / tempban, eco-admin, migration imports, reloads.
  audit = ""

  # High-value economy notifications (/pay and eco-admin above min-eco-notify).
  # Optional — leave blank to fold economy notices into the audit channel's category
  # instead, or to suppress them entirely.
  economy = ""
}
