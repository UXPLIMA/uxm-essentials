[versions]
# language / paper
java           = "21"
paper          = "1.21.11-R0.1-SNAPSHOT"
adventure      = "4.17.0"

# runtime libs
hikari         = "6.2.1"
postgresql     = "42.7.4"
flyway         = "10.19.0"
jooq           = "3.19.16"
caffeine       = "3.1.8"
configurate    = "4.1.2"
bstats         = "3.0.2"
jspecify       = "1.0.0"
slf4j          = "2.0.16"

# persistence drivers — Essentials default is embedded SQLite (file db);
# MySQL/MariaDB and PostgreSQL are network options (see docs/adr/0003).
sqlite-jdbc    = "3.49.1.0"     # org.xerial:sqlite-jdbc — Maven Central (verified 2026-05-30)
mariadb-jdbc   = "3.5.3"        # org.mariadb.jdbc:mariadb-java-client — Maven Central; also speaks the MySQL wire protocol (verified 2026-05-30)

# adapter integrations
velocity       = "3.4.0"
luckperms      = "5.5"
jda            = "5.6.1"

# economy provider integrations (see docs/11-economy-integration.md, docs/adr/0004)
treasury       = "1.2.0"        # me.lokka30:treasury-api — CodeMC repo, NOT Maven Central (verified 2026-05-30)
vault          = "1.7.1"        # com.github.MilkBowl:VaultAPI — JitPack, NOT Maven Central (verified 2026-05-30)

# tests
junit          = "5.12.1"
assertj        = "3.27.3"
mockito        = "5.20.0"
mockbukkit     = "4.108.0"
testcontainers = "1.20.4"
jqwik          = "1.9.3"
archunit       = "1.3.0"

# tooling
errorprone     = "2.37.0"
nullaway       = "0.12.3"
spotless       = "7.0.2"
palantir-fmt   = "2.52.0"
shadow         = "9.4.1"
paperweight    = "2.0.0-beta.21"
run-paper      = "3.0.2"
minotaur       = "2.9.0"
hangar-publish = "0.1.3"
jmh            = "1.37"         # org.openjdk.jmh:jmh-core + :jmh-generator-annprocess — Maven Central (verified 2026-05-30)

[libraries]
paper-api         = { module = "io.papermc.paper:paper-api",                     version.ref = "paper" }
adventure-api     = { module = "net.kyori:adventure-api",                        version.ref = "adventure" }
adventure-mini    = { module = "net.kyori:adventure-text-minimessage",           version.ref = "adventure" }
hikari            = { module = "com.zaxxer:HikariCP",                            version.ref = "hikari" }
postgresql        = { module = "org.postgresql:postgresql",                      version.ref = "postgresql" }
sqlite-jdbc       = { module = "org.xerial:sqlite-jdbc",                         version.ref = "sqlite-jdbc" }
mariadb-jdbc      = { module = "org.mariadb.jdbc:mariadb-java-client",           version.ref = "mariadb-jdbc" }
flyway-core       = { module = "org.flywaydb:flyway-core",                       version.ref = "flyway" }
flyway-pg         = { module = "org.flywaydb:flyway-database-postgresql",        version.ref = "flyway" }
flyway-mysql      = { module = "org.flywaydb:flyway-mysql",                      version.ref = "flyway" }
jooq              = { module = "org.jooq:jooq",                                  version.ref = "jooq" }
jooq-meta         = { module = "org.jooq:jooq-meta",                             version.ref = "jooq" }
jooq-codegen      = { module = "org.jooq:jooq-codegen",                          version.ref = "jooq" }
jooq-meta-ext     = { module = "org.jooq:jooq-meta-extensions",                  version.ref = "jooq" }
caffeine          = { module = "com.github.ben-manes.caffeine:caffeine",         version.ref = "caffeine" }
configurate-hocon = { module = "org.spongepowered:configurate-hocon",            version.ref = "configurate" }
bstats-bukkit     = { module = "org.bstats:bstats-bukkit",                       version.ref = "bstats" }
jspecify          = { module = "org.jspecify:jspecify",                          version.ref = "jspecify" }
slf4j-api         = { module = "org.slf4j:slf4j-api",                            version.ref = "slf4j" }

velocity-api      = { module = "com.velocitypowered:velocity-api",               version.ref = "velocity" }
luckperms-api     = { module = "net.luckperms:api",                              version.ref = "luckperms" }
jda               = { module = "net.dv8tion:JDA",                                version.ref = "jda" }

# economy provider APIs — compileOnly soft-depends (see §9 + §16)
treasury-api      = { module = "me.lokka30:treasury-api",                        version.ref = "treasury" }
vault-api         = { module = "com.github.MilkBowl:VaultAPI",                   version.ref = "vault" }

junit-bom         = { module = "org.junit:junit-bom",                            version.ref = "junit" }
junit-jupiter     = { module = "org.junit.jupiter:junit-jupiter" }
assertj           = { module = "org.assertj:assertj-core",                       version.ref = "assertj" }
mockito-core      = { module = "org.mockito:mockito-core",                       version.ref = "mockito" }
mockito-jupiter   = { module = "org.mockito:mockito-junit-jupiter",              version.ref = "mockito" }
mockbukkit        = { module = "org.mockbukkit.mockbukkit:mockbukkit-v1.21",     version.ref = "mockbukkit" }
testcontainers    = { module = "org.testcontainers:testcontainers",              version.ref = "testcontainers" }
tc-junit          = { module = "org.testcontainers:junit-jupiter",               version.ref = "testcontainers" }
tc-postgres       = { module = "org.testcontainers:postgresql",                  version.ref = "testcontainers" }
tc-mysql          = { module = "org.testcontainers:mysql",                       version.ref = "testcontainers" }
jqwik             = { module = "net.jqwik:jqwik",                                version.ref = "jqwik" }
archunit-junit    = { module = "com.tngtech.archunit:archunit-junit5",           version.ref = "archunit" }

jmh-core          = { module = "org.openjdk.jmh:jmh-core",                       version.ref = "jmh" }
jmh-ap            = { module = "org.openjdk.jmh:jmh-generator-annprocess",        version.ref = "jmh" }

errorprone-core   = { module = "com.google.errorprone:error_prone_core",         version.ref = "errorprone" }
nullaway          = { module = "com.uber.nullaway:nullaway",                     version.ref = "nullaway" }

[bundles]
testing    = ["junit-jupiter", "assertj", "mockito-core", "mockito-jupiter"]
adventure  = ["adventure-api", "adventure-mini"]
# The db bundle is backend-selectable: the SQLite driver is the default-on
# coordinate; MySQL/MariaDB and PostgreSQL drivers ship in the jar but are only
# activated when modules.conf selects that backend. jOOQ/Flyway/Hikari are
# backend-agnostic. SQLite is single-writer — the persistence adapter serialises
# writes and runs WAL mode with a size-1 write pool (see docs/02-concurrency.md).
db         = ["hikari", "sqlite-jdbc", "flyway-core", "jooq"]
db-mysql   = ["mariadb-jdbc", "flyway-mysql"]
db-pg      = ["postgresql", "flyway-pg"]
configs    = ["configurate-hocon"]
jmh        = ["jmh-core", "jmh-ap"]

[plugins]
shadow          = { id = "com.gradleup.shadow",                version.ref = "shadow" }
paperweight     = { id = "io.papermc.paperweight.userdev",     version.ref = "paperweight" }
run-paper       = { id = "xyz.jpenilla.run-paper",             version.ref = "run-paper" }
spotless        = { id = "com.diffplug.spotless",              version.ref = "spotless" }
errorprone      = { id = "net.ltgt.errorprone",                version = "4.4.0" }
nullaway-plugin = { id = "net.ltgt.nullaway",                  version = "3.0.0" }
jooq-codegen    = { id = "org.jooq.jooq-codegen-gradle",       version.ref = "jooq" }
minotaur        = { id = "com.modrinth.minotaur",              version.ref = "minotaur" }
hangar-publish  = { id = "io.papermc.hangar-publish-plugin",   version.ref = "hangar-publish" }
