# Only what the shared `uxm` catalog does not carry.

[versions]
adventure = "5.2.0"
hikari = "6.2.1"
postgresql = "42.7.4"
flyway = "10.19.0"
jooq = "3.19.16"
caffeine = "3.1.8"
configurate = "4.1.2"
gson = "2.11.0"
slf4j = "2.0.16"
sqlite-jdbc = "3.49.1.0"
mariadb-jdbc = "3.5.3"
h2 = "2.4.240"
velocity = "3.4.0"
luckperms = "5.5"
jda = "5.6.1"
lettuce = "7.6.0.RELEASE"
treasury = "1.2.0"
vault = "1.7.1"
lands = "6.26.18"
griefprevention = "16.18"
simpleclaimsystem = "1.13.1"
rclaim = "2.6.0"
miniplaceholders = "3.2.0"
squaremap = "1.3.13"
dynmap = "3.7-beta-6"
floodgate = "2.2.5-SNAPSHOT"
jakarta-xml-bind = "4.0.0"
paperweight = "2.0.0-beta.22"

[libraries]
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-mini = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
hikari = { module = "com.zaxxer:HikariCP", version.ref = "hikari" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }
mariadb-jdbc = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb-jdbc" }
h2 = { module = "com.h2database:h2", version.ref = "h2" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-pg = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }
jooq = { module = "org.jooq:jooq", version.ref = "jooq" }
jooq-meta-ext = { module = "org.jooq:jooq-meta-extensions", version.ref = "jooq" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
lettuce = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
treasury-api = { module = "me.lokka30:treasury-api", version.ref = "treasury" }
vault-api = { module = "com.github.MilkBowl:VaultAPI", version.ref = "vault" }
hook-lands = { module = "com.github.angeschossen:LandsAPI", version.ref = "lands" }
hook-griefprevention = { module = "com.github.TechFortress:GriefPrevention", version.ref = "griefprevention" }
hook-simpleclaimsystem = { module = "com.github.Xyness:SimpleClaimSystem", version.ref = "simpleclaimsystem" }
hook-rclaim = { module = "com.github.Weesli:RClaim", version.ref = "rclaim" }
miniplaceholders = { module = "io.github.miniplaceholders:miniplaceholders-api", version.ref = "miniplaceholders" }
squaremap-api = { module = "xyz.jpenilla:squaremap-api", version.ref = "squaremap" }
dynmap-api = { module = "us.dynmap:dynmap-api", version.ref = "dynmap" }
dynmap-core-api = { module = "us.dynmap:DynmapCoreAPI", version.ref = "dynmap" }
floodgate-api = { module = "org.geysermc.floodgate:api", version.ref = "floodgate" }
jakarta-xml-bind = { module = "jakarta.xml.bind:jakarta.xml.bind-api", version.ref = "jakarta-xml-bind" }

[bundles]
adventure = ["adventure-api", "adventure-mini"]
db = ["hikari", "sqlite-jdbc", "flyway-core", "jooq"]
db-mysql = ["mariadb-jdbc", "flyway-mysql"]
db-pg = ["postgresql", "flyway-pg"]

[plugins]
paperweight = { id = "io.papermc.paperweight.userdev", version.ref = "paperweight" }
jooq-codegen = { id = "org.jooq.jooq-codegen-gradle", version.ref = "jooq" }
